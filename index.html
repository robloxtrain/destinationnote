<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f5f7">
<title>Destination Note</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "Helvetica Neue",Arial,sans-serif;
  background:#f5f5f7;
  color:#111;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 20% 20%,#dfe9ff,transparent 35%),
    radial-gradient(circle at 80% 80%,#e8ddff,transparent 35%),
    #f5f5f7;
}

.login-card{
  width:min(430px,100%);
  padding:34px;
  border-radius:30px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  box-shadow:0 25px 80px rgba(0,0,0,.12);
}

.logo{
  font-size:42px;
  margin-bottom:8px;
}

.login-card h1{
  margin:0;
  font-size:32px;
}

.login-card p{
  color:#777;
}

.login-card input{
  width:100%;
  padding:15px 17px;
  margin:7px 0;
  border:1px solid rgba(0,0,0,.08);
  border-radius:15px;
  outline:none;
  background:rgba(255,255,255,.85);
}

.primary{
  width:100%;
  margin-top:12px;
  padding:15px;
  border-radius:16px;
  background:#111;
  color:white;
  font-weight:700;
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100%;
}

.screen{
  width:100%;
  height:100%;
  overflow:auto;
}

.topbar{
  height:72px;
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(245,245,247,.78);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(0,0,0,.06);
}

.topbar-title{
  font-size:21px;
  font-weight:800;
  flex:1;
}

.icon-btn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:rgba(0,0,0,.06);
  display:grid;
  place-items:center;
  font-size:20px;
}

.clock{
  padding:9px 13px;
  border-radius:13px;
  background:rgba(255,255,255,.8);
  font-variant-numeric:tabular-nums;
  font-size:13px;
  font-weight:700;
}

/* =========================
   HOME
========================= */

.home{
  padding:24px;
  max-width:1100px;
  margin:auto;
}

.hero{
  padding:28px;
  border-radius:30px;
  background:linear-gradient(135deg,#111,#343434);
  color:white;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.hero small{
  opacity:.65;
}

.hero h2{
  margin:5px 0 15px;
  font-size:32px;
}

.study-time{
  font-size:28px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

.rank{
  display:inline-block;
  margin-top:15px;
  padding:8px 13px;
  border-radius:999px;
  background:rgba(255,255,255,.15);
}

.section{
  margin-top:25px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.section-head h3{
  margin:0;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;
}

.card{
  padding:20px;
  border-radius:22px;
  background:white;
  box-shadow:0 8px 30px rgba(0,0,0,.07);
  cursor:pointer;
  transition:.18s transform;
}

.card:active{
  transform:scale(.97);
}

.folder-icon{
  font-size:35px;
}

.card-title{
  font-weight:750;
  margin-top:10px;
}

.card-sub{
  font-size:13px;
  color:#888;
  margin-top:5px;
}

/* =========================
   FOLDER
========================= */

.folder-page{
  padding:22px;
  max-width:1100px;
  margin:auto;
}

.breadcrumb{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
  color:#777;
  margin-bottom:18px;
}

.breadcrumb button{
  background:none;
  color:#555;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.action{
  padding:12px 15px;
  border-radius:14px;
  background:#111;
  color:#fff;
  font-weight:700;
}

.action.light{
  background:white;
  color:#111;
}

/* =========================
   NOTE EDITOR
========================= */

#noteScreen{
  background:#e9e9ed;
  overflow:hidden;
}

.note-topbar{
  height:64px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 10px;
  background:rgba(245,245,247,.9);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border-bottom:1px solid rgba(0,0,0,.08);
  position:relative;
  z-index:1000;
}

.note-title{
  min-width:100px;
  max-width:240px;
  flex:1;
  border:0;
  background:transparent;
  outline:none;
  font-weight:750;
  font-size:17px;
}

.tool-scroll{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:6px;
  scrollbar-width:none;
}

.tool-scroll::-webkit-scrollbar{
  display:none;
}

.tool{
  min-width:43px;
  height:43px;
  padding:0 11px;
  border-radius:13px;
  background:white;
  font-size:18px;
  white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.tool.active{
  background:#111;
  color:white;
}

.size-wrap{
  display:flex;
  align-items:center;
  gap:5px;
  padding:7px 10px;
  border-radius:13px;
  background:white;
  white-space:nowrap;
}

#sizeRange{
  width:90px;
}

#sizeValue{
  min-width:32px;
  text-align:center;
  font-size:12px;
  font-weight:700;
}

.color-wrap{
  position:relative;
  width:43px;
  height:43px;
  flex:none;
}

#colorPicker{
  width:43px;
  height:43px;
  border:0;
  padding:0;
  background:transparent;
}

/* =========================
   BOARD
========================= */

.board-viewport{
  position:absolute;
  top:64px;
  left:0;
  right:0;
  bottom:0;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  background:#dcdce1;
}

.board-world{
  position:absolute;
  left:0;
  top:0;
  width:10000px;
  height:7000px;
  transform-origin:0 0;
  will-change:transform;

  background-color:#fff;
  background-image:
    radial-gradient(circle,rgba(0,0,0,.09) 1px,transparent 1px);
  background-size:28px 28px;
}

#drawSvg{
  position:absolute;
  left:0;
  top:0;
  width:10000px;
  height:7000px;
  overflow:visible;
  pointer-events:none;
}

#objectLayer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.board-object{
  position:absolute;
  pointer-events:auto;
  user-select:none;
  touch-action:none;
  cursor:grab;
}

.board-object.selected{
  outline:2px solid #007aff;
  outline-offset:5px;
}

.text-object{
  min-width:80px;
  min-height:35px;
  padding:6px;
  white-space:pre-wrap;
  word-break:break-word;
  background:transparent;
}

.sticky-object{
  width:260px;
  height:180px;
  padding:18px;
  border-radius:5px;
  background:#fff29b;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
  white-space:pre-wrap;
  word-break:break-word;
}

.image-object{
  object-fit:contain;
  border-radius:8px;
  box-shadow:0 8px 30px rgba(0,0,0,.15);
}

.resize-handle{
  position:absolute;
  right:-9px;
  bottom:-9px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#007aff;
  border:3px solid white;
  cursor:nwse-resize;
}

.object-delete{
  position:absolute;
  top:-12px;
  right:-12px;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#ff3b30;
  color:#fff;
  font-size:13px;
  display:none;
}

.selected .object-delete{
  display:block;
}

/* =========================
   ZOOM
========================= */

.zoom-controls{
  position:absolute;
  right:14px;
  bottom:88px;
  z-index:900;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.zoom-controls button{
  width:45px;
  height:45px;
  border-radius:14px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(15px);
  box-shadow:0 5px 20px rgba(0,0,0,.12);
  font-size:20px;
}

.page-controls{
  position:absolute;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  z-index:900;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  border-radius:17px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(20px);
  box-shadow:0 7px 30px rgba(0,0,0,.13);
}

.page-controls button{
  width:38px;
  height:38px;
  border-radius:11px;
  background:#f0f0f2;
}

.page-number{
  min-width:70px;
  text-align:center;
  font-weight:700;
  font-size:13px;
}

/* =========================
   EMPTY / SETTINGS
========================= */

.center{
  display:grid;
  place-items:center;
  min-height:300px;
  color:#777;
}

.settings{
  max-width:800px;
  padding:25px;
  margin:auto;
}

.setting-card{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:14px;
}

.setting-card h3{
  margin-top:0;
}

.danger{
  background:#ff3b30!important;
  color:white!important;
}

/* =========================
   DARK
========================= */

body.dark{
  background:#111;
  color:#eee;
}

body.dark .topbar,
body.dark .note-topbar{
  background:rgba(25,25,28,.86);
  color:#eee;
}

body.dark .card,
body.dark .setting-card,
body.dark .tool,
body.dark .size-wrap{
  background:#222;
  color:#eee;
}

body.dark .board-viewport{
  background:#333;
}

body.dark .board-world{
  background-color:#181818;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1px);
}

body.dark .login-card{
  background:rgba(30,30,35,.85);
  color:#fff;
}

body.dark .login-card input{
  background:#222;
  color:#fff;
}

body.dark .primary{
  background:#fff;
  color:#111;
}

body.dark .clock{
  background:#222;
  color:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){
  .topbar{
    height:64px;
  }

  .clock{
    display:none;
  }

  .home,
  .folder-page{
    padding:15px;
  }

  .hero h2{
    font-size:27px;
  }

  .note-topbar{
    height:62px;
  }

  .board-viewport{
    top:62px;
  }

  .note-title{
    max-width:130px;
  }

  .tool{
    min-width:42px;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginScreen">
  <div class="login-card">
    <div class="logo">📚</div>
    <h1>Destination Note</h1>
    <p id="loginDescription">勉強を記録して、自分だけのノートを作ろう。</p>

    <input id="loginName" type="text" placeholder="名前">
    <input id="loginPassword" type="password" placeholder="パスワード">

    <button class="primary" id="loginButton">はじめる</button>

    <p style="font-size:12px;margin-top:15px;">
      ※データはこの端末のブラウザに保存されます。
    </p>
  </div>
</section>

<!-- ================= APP ================= -->

<div id="app" class="hidden">

  <!-- HOME -->
  <section id="homeScreen" class="screen hidden">

    <header class="topbar">
      <div class="topbar-title">Destination Note</div>
      <div class="clock" id="homeClock">00:00:00</div>

    </header>

    <main class="home">

      <div class="hero">

          00:00:00
        </div>

        <div>サイト滞在中の学習時間</div>

        <div class="rank" id="rankText">
          🥉 ブロンズ
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h3>📚 ノート</h3>

      </div>

      <div class="section">

          <h3>📁 フォルダ</h3>

  <!-- FOLDER -->
  <section id="folderScreen" class="screen hidden">

      <button class="icon-btn" id="folderHomeBtn">⌂</button>

    <main class="folder-page">

      <div class="breadcrumb" id="breadcrumb"></div>

      <div class="actions">
        <button class="action" id="newFolderBtn">＋ フォルダ</button>
        <button class="action" id="newNoteBtn">＋ ノート</button>

  <!-- NOTE -->
  <section id="noteScreen" class="screen hidden">

    <header class="note-topbar">

      <button class="icon-btn" id="noteBackBtn">‹</button>

      <input id="noteTitle" class="note-title" value="新しいノート">

      <div class="tool-scroll">

        <button class="tool active" data-tool="pencil">

        </button>

        <button class="tool" data-tool="highlighter">

        </button>

        <button class="tool" data-tool="pixel">
          🧽
        </button>

        <button class="tool" data-tool="objectEraser">
          🗑️
        </button>

        <button class="tool" data-tool="hand">
          ✋
        </button>

        <button class="tool" data-tool="text">
          T
        </button>

        <button class="tool" data-tool="sticky">
          📌
        </button>

        <button class="tool" id="imageBtn">
          🖼️

        <div class="color-wrap">

    <input

<script>
"use strict";

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "destinationNote_v1";

const WORLD_W = 10000;
const WORLD_H = 7000;

let data = {
  name:"",
  password:"",
  totalSeconds:0,
  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],
  notes:[],
  settings:{
    dark:false
  }
};

function uid(prefix="id"){
  if(window.crypto && crypto.randomUUID){
    return prefix + "_" + crypto.randomUUID();
  }

  return prefix + "_" +
    Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function saveData(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}

function loadData(){

  try{

    const raw =
      localStorage.getItem(STORAGE_KEY);

    if(!raw) return;

    const parsed =
      JSON.parse(raw);

    data = {
      ...data,
      ...parsed,
      settings:{
        ...data.settings,
        ...(parsed.settings || {})
      }
    };

    if(!Array.isArray(data.folders)){
      data.folders=[];
    }

    if(!data.folders.some(f=>f.id==="root")){
      data.folders.unshift({
        id:"root",
        name:"マイノート",
        icon:"📚",
        parent:null,
        created:Date.now()
      });
    }

    if(!Array.isArray(data.notes)){
      data.notes=[];
    }

    normalizeNotes();

  }catch(e){

    console.error(e);

  }

}

function normalizeNotes(){

  data.notes.forEach(note=>{

    if(!note.id){
      note.id=uid("note");
    }

    if(!note.folder){
      note.folder="root";
    }

    if(!Array.isArray(note.pages)){

      note.pages=[{
        strokes:Array.isArray(note.strokes)
          ? note.strokes
          : [],
        elements:Array.isArray(note.elements)
          ? note.elements
          : [],
        image:note.image || null
      }];

    }

    note.pages.forEach(page=>{

      if(!Array.isArray(page.strokes)){
        page.strokes=[];
      }

      if(!Array.isArray(page.elements)){
        page.elements=[];
      }

      page.strokes =
        page.strokes.map(s=>{

          if(!s.points){
            s.points=[];
          }

          return {
            id:s.id || uid("stroke"),
            tool:s.tool || "pencil",
            color:s.color || "#111111",
            size:Number(s.size)||5,
            opacity:
              s.opacity === undefined
                ? 1
                : Number(s.opacity),
            points:s.points
          };

        });

      page.elements =
        page.elements.map(el=>{

          return {
            ...el,
            id:el.id || uid("obj"),
            x:Number(el.x ?? el.left ?? 500),
            y:Number(el.y ?? el.top ?? 500),
            width:Number(el.width)||300,
            height:Number(el.height)||100,
            fontSize:Number(
              el.fontSize || el.size || 28
            ),
            color:el.color || "#111111"
          };

        });

      /* 古いページ画像を画像オブジェクトへ変換 */

      if(
        page.image &&
        !page.elements.some(
          e=>e.type==="image"
        )
      ){

        page.elements.push({
          id:uid("image"),
          type:"image",
          x:1000,
          y:500,
          width:1200,
          height:1600,
          src:page.image
        });

      }

    });

  });

}

/* =========================================================
   LOGIN
========================================================= */

let loggedIn=false;

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const loginName =
  document.getElementById("loginName");

const loginPassword =
  document.getElementById("loginPassword");

const loginButton =
  document.getElementById("loginButton");

function updateLoginUI(){

  if(data.name){

    document.getElementById(
      "loginDescription"
    ).textContent =

    loginButton.textContent="ログイン";

/* =========================================================
   STUDY TIMER
========================================================= */

let trackingStart=null;

function startStudyTracking(){

  if(!loggedIn) return;

  if(
    document.visibilityState==="visible" &&
    trackingStart===null
  ){

    trackingStart=Date.now();

  }

}

function flushStudyTime(){

  if(trackingStart===null) return;

  const now=Date.now();

  const seconds=Math.max(
    0,
    Math.floor(
      (now-trackingStart)/1000
    )
  );

  if(seconds>0){

    data.totalSeconds += seconds;
    saveData();

  }

  trackingStart =
    document.visibilityState==="visible"
      ? now
      : null;

}

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(!loggedIn) return;

    flushStudyTime();

  }
);

setInterval(
  ()=>{

    if(loggedIn){

      updateStudyDisplay();

    }

  },
  250
);

function getLiveStudySeconds(){

  let total=data.totalSeconds;

  if(
    loggedIn &&
    trackingStart!==null &&
    document.visibilityState==="visible"
  ){

    total += Math.max(
      0,
      Math.floor(
        (Date.now()-trackingStart)/1000
      )
    );

  }

  return total;
}

function formatTime(seconds){

  seconds=Math.max(
    0,
    Math.floor(seconds)
  );

  const h =
    Math.floor(seconds/3600);

  const m =
    Math.floor(
      (seconds%3600)/60
    );

  const s =
    seconds%60;

  return [
    String(h).padStart(2,"0"),
    String(m).padStart(2,"0"),
    String(s).padStart(2,"0")
  ].join(":");

}

function getRank(seconds){

  const h=seconds/3600;

  if(h<10)
    return ["🥉","ブロンズ"];

  if(h<30)
    return ["🥈","シルバー"];

  if(h<60)
    return ["🥇","ゴールド"];

  if(h<100)
    return ["💎","プラチナ"];

  if(h<200)
    return ["💼","ビジネス"];

  if(h<500)
    return ["🚄","ファースト"];

  return ["👑","グランクラス"];

}

function updateStudyDisplay(){

  const time=
    formatTime(
      getLiveStudySeconds()
    );

  [
    "studyTime",
    "homeClock",
    "folderClock"
  ].forEach(id=>{

    const el=
      document.getElementById(id);

    if(el) el.textContent=time;

  });

  const rank=
    getRank(
      getLiveStudySeconds()
    );

  const rankEl=
    document.getElementById("rankText");

  if(rankEl){

    rankEl.textContent=
      `${rank[0]} ${rank[1]}`;

  }

}

/* CAMERA */

let zoom=1;
let panX=0;
let panY=0;

function centerBoard(){

  const rect=
    viewport.getBoundingClientRect();

  zoom=1;

  panX=
    rect.width/2-
    WORLD_W/2;

  panY=
    rect.height/2-
    WORLD_H/2;

  applyCamera();

}

function applyCamera(){

  world.style.transform=
    `translate3d(${panX}px,${panY}px,0) scale(${zoom})`;

}

function clampZoom(z){

  return Math.min(
    4,
    Math.max(.2,z)
  );

}

function screenToWorld(clientX,clientY){

  const rect=
    viewport.getBoundingClientRect();

  return {
    x:
      (clientX-
       rect.left-
       panX)/zoom,

    y:
      (clientY-
       rect.top-
       panY)/zoom
  };

}

/*
  ズームの中心を維持
*/

function zoomAt(
  newZoom,
  clientX,
  clientY
){

  newZoom=
    clampZoom(newZoom);

  const rect=
    viewport.getBoundingClientRect();

  const sx=
    clientX-rect.left;

  const sy=
    clientY-rect.top;

  const wx=
    (sx-panX)/zoom;

  const wy=
    (sy-panY)/zoom;

  zoom=newZoom;

  panX=sx-wx*zoom;
  panY=sy-wy*zoom;

  applyCamera();

}

document.getElementById(
  "zoomIn"
).onclick=()=>{

  const r=
    viewport.getBoundingClientRect();

  zoomAt(
    zoom*1.2,
    r.left+r.width/2,
    r.top+r.height/2
  );

};

document.getElementById(
  "zoomOut"
).onclick=()=>{

  const r=
    viewport.getBoundingClientRect();

  zoomAt(
    zoom/1.2,
    r.left+r.width/2,
    r.top+r.height/2
  );

};

document.getElementById(
  "zoomReset"
).onclick=()=>{
  centerBoard();
};

viewport.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();

    if(e.ctrlKey || e.metaKey){

      const factor=
        e.deltaY<0 ? 1.08 : .92;

      zoomAt(
        zoom*factor,
        e.clientX,
        e.clientY
      );

    }else{

      panX-=e.deltaX;
      panY-=e.deltaY;

      applyCamera();

    }

  },
  {passive:false}
);

/* =========================================================
   SVG DRAWING
========================================================= */

let drawing=null;

let redrawQueued=false;

function queueRender(){

  if(redrawQueued) return;

  redrawQueued=true;

  requestAnimationFrame(
    ()=>{

      redrawQueued=false;

      renderStrokes();

    }
  );

}

function pointsToPath(points){

  if(!points || !points.length){
    return "";
  }

  let d=
    `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;

  for(let i=1;i<points.length;i++){

    /*
      少し滑らかにするための
      中間点
    */

    const p=points[i];

    d+=
      ` L ${p.x.toFixed(2)} ${p.y.toFixed(2)}`;

  }

  return d;

}

function renderStrokes(){

  if(!currentNote) return;

  const page=
    currentNote.pages[currentPage];

  /*
    一度だけ描き直す。
    CanvasではなくSVGなので
    巨大なボードでも比較的軽い。
  */

  svg.replaceChildren();

  const fragment=
    document.createDocumentFragment();

  page.strokes.forEach(
    stroke=>{

      if(
        !stroke.points ||
        stroke.points.length<2
      ){
        return;
      }

      const path=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );

      path.setAttribute(
        "d",
        pointsToPath(stroke.points)
      );

      path.setAttribute(
        "fill",
        "none"
      );

      path.setAttribute(
        "stroke",
        stroke.color || "#111"
      );

      let width=
        Number(stroke.size)||5;

      let opacity=
        stroke.opacity ?? 1;

      if(stroke.tool==="highlighter"){

        width*=3.5;
        opacity=.27;

      }

      path.setAttribute(
        "stroke-width",
        width
      );

      path.setAttribute(
        "stroke-opacity",
        opacity
      );

      path.setAttribute(
        "stroke-linecap",
        "round"
      );

      path.setAttribute(
        "stroke-linejoin",
        "round"
      );

      fragment.appendChild(path);

    }
  );

  svg.appendChild(fragment);

}

/* =========================================================
   SMOOTH POINTER DRAWING
========================================================= */

const pointers=new Map();

let panGesture=null;
let pinchGesture=null;

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}

function midpoint(a,b){

  return {
    x:(a.x+b.x)/2,
    y:(a.y+b.y)/2
  };

}

function getPointerList(){

  return [...pointers.values()];

}

viewport.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    pointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

    viewport.setPointerCapture?.(
      e.pointerId
    );

    /*
      2本指になったら
      何をしていてもピンチへ
    */

    if(pointers.size>=2){

      drawing=null;
      panGesture=null;

      const pts=
        getPointerList();

      const a=pts[0];
      const b=pts[1];

      const mid=
        midpoint(a,b);

      const rect=
        viewport.getBoundingClientRect();

      const mx=
        mid.x-rect.left;

      const my=
        mid.y-rect.top;

      pinchGesture={

        startDistance:
          distance(a,b),

        startZoom:zoom,

        worldX:
          (mx-panX)/zoom,

        worldY:
          (my-panY)/zoom

      };

      return;

    }

    /*
      オブジェクト上なら
      オブジェクト処理側へ
    */

    if(
      e.target.closest &&
      e.target.closest(".board-object")
    ){

      return;

    }

    const point=
      screenToWorld(
        e.clientX,
        e.clientY
      );

    /*
      TEXT
    */

    if(currentTool==="text"){

      createText(point);

      pointers.delete(e.pointerId);

      return;

    }

    /*
      STICKY
    */

    if(currentTool==="sticky"){

      createSticky(point);

      pointers.delete(e.pointerId);

      return;

    }

    /*
      PIXEL ERASER
    */

    if(currentTool==="pixel"){

      eraseAt(point);

      return;

    }

    /*
      OBJECT ERASER
    */

    if(currentTool==="objectEraser"){

      eraseObjectAt(point);

      pointers.delete(e.pointerId);

      return;

    }

    /*
      PEN / HIGHLIGHTER
    */

    if(
      currentTool==="pencil" ||
      currentTool==="highlighter"
    ){

      startDrawing(
        e.pointerId,
        point
      );

      return;

    }

    /*
      HAND
    */

    if(currentTool==="hand"){

      panGesture={
        pointerId:e.pointerId,
        startX:e.clientX,
        startY:e.clientY,
        startPanX:panX,
        startPanY:panY
      };

    }

  },
  {passive:false}
);

viewport.addEventListener(
  "pointermove",
  e=>{

    if(!pointers.has(e.pointerId)){
      return;
    }

    pointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

    /*
      PINCH
    */

    if(
      pinchGesture &&
      pointers.size>=2
    ){

      e.preventDefault();

      const pts=
        getPointerList();

      const a=pts[0];
      const b=pts[1];

      const mid=
        midpoint(a,b);

      const rect=
        viewport.getBoundingClientRect();

      const mx=
        mid.x-rect.left;

      const my=
        mid.y-rect.top;

      const newDistance=
        distance(a,b);

      let newZoom=
        pinchGesture.startZoom *
        (
          newDistance /
          pinchGesture.startDistance
        );

      newZoom=
        clampZoom(newZoom);

      zoom=newZoom;

      panX=
        mx-
        pinchGesture.worldX*
        zoom;

      panY=
        my-
        pinchGesture.worldY*
        zoom;

      applyCamera();

      return;

    }

    /*
      DRAW
    */

    if(
      drawing &&
      drawing.pointerId===e.pointerId
    ){

      e.preventDefault();

      const point=
        screenToWorld(
          e.clientX,
          e.clientY
        );

      const points=
        drawing.stroke.points;

      const last=
        points[points.length-1];

      /*
        細かすぎる点を間引く。
        これで動作が軽くなる。
      */

      const dx=
        point.x-last.x;

      const dy=
        point.y-last.y;

      const dist=
        Math.hypot(dx,dy);

      if(dist>=1.2){

        /*
          速度に応じて少し補間
        */

        if(dist>20){

          const steps=
            Math.ceil(dist/8);

          for(
            let i=1;
            i<steps;
            i++
          ){

            const t=i/steps;

            points.push({
              x:
                last.x+
                dx*t,

              y:
                last.y+
                dy*t
            });

          }

        }

        points.push(point);

        queueRender();

      }

      return;

    }

    /*
      PIXEL ERASER
    */

    if(
      currentTool==="pixel" &&
      pointers.size===1
    ){

      e.preventDefault();

      eraseAt(
        screenToWorld(
          e.clientX,
          e.clientY
        )
      );

      return;

    }

    /*
      PAN
    */

    if(
      panGesture &&
      panGesture.pointerId===e.pointerId
    ){

      e.preventDefault();

      panX=
        panGesture.startPanX+
        (
          e.clientX-
          panGesture.startX
        );

      panY=
        panGesture.startPanY+
        (
          e.clientY-
          panGesture.startY
        );

      applyCamera();

    }

  },
  {passive:false}
);

function endPointer(e){

  pointers.delete(e.pointerId);

  if(
    drawing &&
    drawing.pointerId===e.pointerId
  ){

    finishDrawing();

  }

  if(
    panGesture &&
    panGesture.pointerId===e.pointerId
  ){

    panGesture=null;

  }

  if(pointers.size<2){

    pinchGesture=null;

  }

}

viewport.addEventListener(
  "pointerup",
  endPointer
);

viewport.addEventListener(
  "pointercancel",
  endPointer
);

viewport.addEventListener(
  "pointerleave",
  e=>{

    /*
      pointer capture中なので
      実際にはpointerupまで続く
    */

  }
);

/* =========================================================
   DRAW
========================================================= */

function startDrawing(
  pointerId,
  point
){

  const page=
    currentNote.pages[currentPage];

  const stroke={

    id:uid("stroke"),

    tool:currentTool,

    color:currentColor,

    size:currentSize,

    opacity:
      currentTool==="highlighter"
        ? .27
        : 1,

    points:[point]

  };

  page.strokes.push(stroke);

  drawing={
    pointerId,
    stroke
  };

  queueRender();

}

function finishDrawing(){

  if(!drawing) return;

  const points=
    drawing.stroke.points;

  /*
    点が1個しかない場合でも
    小さな点として残す
  */

  if(points.length===1){

    points.push({
      x:points[0].x+.01,
      y:points[0].y+.01
    });

  }

  drawing=null;

  if(currentNote){

    currentNote.updated=Date.now();

    saveData();

  }

}

/* =========================================================
   PIXEL ERASER
========================================================= */

function pointDistance(
  a,b
){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}

function eraseAt(point){

  if(!currentNote) return;

  const page=
    currentNote.pages[currentPage];

  const radius=
    Math.max(
      8,
      currentSize*1.8
    );

  let changed=false;

  const newStrokes=[];

  page.strokes.forEach(
    stroke=>{

      const pts=
        stroke.points || [];

      if(pts.length<2){
        return;
      }

      let current=[];

      let hit=false;

      pts.forEach(p=>{

        if(
          pointDistance(
            p,
            point
          )<=radius
        ){

          hit=true;

          if(current.length>=2){

            newStrokes.push({

              ...stroke,

              id:uid("stroke"),

              points:[
                ...current
              ]

            });

          }

          current=[];

        }else{

          current.push(p);

        }

      });

      if(current.length>=2){

        newStrokes.push({

          ...stroke,

          id:
            hit
              ? uid("stroke")
              : stroke.id,

          points:[
            ...current
          ]

        });

      }

      if(hit){

        changed=true;

      }

    }
  );

  if(changed){

    page.strokes=
      newStrokes;

    queueRender();

    currentNote.updated=
      Date.now();

    scheduleSave();

  }

}

/* =========================================================
   OBJECT ERASER
========================================================= */

function eraseObjectAt(point){

  if(!currentNote) return;

  const page=
    currentNote.pages[currentPage];

  let target=null;

  for(
    let i=page.elements.length-1;
    i>=0;
    i--
  ){

    const o=
      page.elements[i];

    if(
      point.x>=o.x &&
      point.x<=o.x+o.width &&
      point.y>=o.y &&
      point.y<=o.y+o.height
    ){

      target=o;
      break;

    }

  }

  if(target){

    page.elements=
      page.elements.filter(
        o=>o.id!==target.id
      );

    selectedObjectId=null;

    renderObjects();
    saveData();

  }

}

/* =========================================================
   TEXT
========================================================= */

function createText(point){

}

/* =========================================================
   OBJECT RENDER
========================================================= */

function renderObjects(){

  if(!currentNote) return;

  const page=
    currentNote.pages[currentPage];

  objectLayer.innerHTML="";

  page.elements.forEach(
    obj=>{

      let el;

      if(obj.type==="image"){

        el=
          document.createElement("img");

        el.src=obj.src;

        el.className=
          "board-object image-object";

      }else{

        el=
          document.createElement("div");

        el.className=
          "board-object "+
          (
            obj.type==="sticky"
              ? "sticky-object"
              : "text-object"
          );

        el.textContent=
          obj.text || "";

      }

      el.style.left=
        obj.x+"px";

      el.style.top=
        obj.y+"px";

      el.style.width=
        obj.width+"px";

      el.style.height=
        obj.height+"px";

      if(
        obj.type==="text" ||
        obj.type==="sticky"
      ){

        el.style.fontSize=
          obj.fontSize+"px";

        el.style.color=
          obj.color || "#111";

      }

      if(
        selectedObjectId===obj.id
      ){

        el.classList.add(
          "selected"
        );

      }

      const deleteBtn=
        document.createElement(
          "button"
        );

      deleteBtn.className=
        "object-delete";

      deleteBtn.textContent="×";

      deleteBtn.addEventListener(
        "pointerdown",
        e=>{

          e.preventDefault();
          e.stopPropagation();

          page.elements=
            page.elements.filter(
              x=>x.id!==obj.id
            );

          selectedObjectId=null;

          renderObjects();
          saveData();

        }
      );

      el.appendChild(deleteBtn);

      const resize=
        document.createElement(
          "div"
        );

      resize.className=
        "resize-handle";

      resize.addEventListener(
        "pointerdown",
        e=>{

          e.preventDefault();
          e.stopPropagation();

          beginResize(
            e,
            obj
          );

        }
      );

      el.appendChild(resize);

      el.addEventListener(
        "pointerdown",
        e=>{

          if(
            e.target===resize ||
            e.target===deleteBtn
          ){

            return;

          }

          e.preventDefault();
          e.stopPropagation();

          selectedObjectId=obj.id;

          beginObjectDrag(
            e,
            obj
          );

        }
      );

      el.addEventListener(
        "dblclick",
        e=>{

          e.preventDefault();
          e.stopPropagation();

          if(
            obj.type==="text" ||
            obj.type==="sticky"
          ){

            const newText=
              prompt(
                "文字を編集",
                obj.text
              );

            if(
              newText!==null
            ){

              obj.text=newText;

              renderObjects();
              saveData();

            }

          }

        }
      );

      objectLayer.appendChild(el);

    }
  );

}

/* =========================================================
   OBJECT DRAG
========================================================= */

let objectDrag=null;
let objectResize=null;

function beginObjectDrag(
  e,
  obj
){

  const point=
    screenToWorld(
      e.clientX,
      e.clientY
    );

  selectedObjectId=obj.id;

  objectDrag={

    id:obj.id,

    dx:
      point.x-obj.x,

    dy:
      point.y-obj.y

  };

  const move=e2=>{

    if(!objectDrag) return;

    const p=
      screenToWorld(
        e2.clientX,
        e2.clientY
      );

    obj.x=
      p.x-objectDrag.dx;

    obj.y=
      p.y-objectDrag.dy;

    renderObjects();

  };

  const up=()=>{

    objectDrag=null;

    window.removeEventListener(
      "pointermove",
      move
    );

    window.removeEventListener(
      "pointerup",
      up
    );

    saveData();

  };

  window.addEventListener(
    "pointermove",
    move,
    {passive:false}
  );

  window.addEventListener(
    "pointerup",
    up,
    {once:true}
  );

}

/* =========================================================
   RESIZE
========================================================= */

function beginResize(
  e,
  obj
){

  const start=
    screenToWorld(
      e.clientX,
      e.clientY
    );

  const original={

    x:obj.x,
    y:obj.y,
    width:obj.width,
    height:obj.height

  };

  objectResize={
    id:obj.id
  };

  const move=e2=>{

    if(!objectResize) return;

    const p=
      screenToWorld(
        e2.clientX,
        e2.clientY
      );

    obj.width=
      Math.max(
        80,
        original.width+
        (p.x-start.x)
      );

    obj.height=
      Math.max(
        45,
        original.height+
        (p.y-start.y)
      );

    renderObjects();

  };

  const up=()=>{

    objectResize=null;

    window.removeEventListener(
      "pointermove",
      move
    );

    saveData();

  };

  window.addEventListener(
    "pointermove",
    move,
    {passive:false}
  );

  window.addEventListener(
    "pointerup",
    up,
    {once:true}
  );

}

document.getElementById(

);

/* =========================================================
   PAGES
========================================================= */

function renderPage(){

  if(!currentNote) return;

  if(
    !currentNote.pages[currentPage]
  ){

    currentNote.pages[currentPage]={
      strokes:[],
      elements:[]
    };

  }

  renderStrokes();
  renderObjects();

  document.getElementById(
    "pageNumber"
  ).textContent=
    `${currentPage+1} / ${currentNote.pages.length}`;

}

document.getElementById(
  "prevPage"
).onclick=()=>{

  if(currentPage<=0) return;

  currentPage--;

  selectedObjectId=null;

  renderPage();

};

document.getElementById(
  "nextPage"
).onclick=()=>{

  if(
    currentPage>=
    currentNote.pages.length-1
  ) return;

  currentPage++;

  selectedObjectId=null;

  renderPage();

};

document.getElementById(
  "addPage"
).onclick=()=>{

  currentNote.pages.push({
    strokes:[],
    elements:[]
  });

  currentPage=
    currentNote.pages.length-1;

  selectedObjectId=null;

  renderPage();

  saveData();

};

/* =========================================================
   NOTE TITLE
========================================================= */

document.getElementById(
  "noteTitle"
).addEventListener(
  "input",
  e=>{

    if(!currentNote) return;

    currentNote.title=
      e.target.value ||
      "新しいノート";

    currentNote.updated=
      Date.now();

    scheduleSave();

  }
);

/* =========================================================
   CLEAR PAGE
========================================================= */

document.getElementById(
  "clearBtn"
).onclick=()=>{

  if(!currentNote) return;

  if(
    !confirm(
      "このページを全部消しますか？"
    )
  ){

    return;

  }

  currentNote.pages[currentPage]={
    strokes:[],
    elements:[]
  };

  selectedObjectId=null;

  renderPage();

  saveData();

};

/* =========================================================
   AUTOSAVE
========================================================= */

let saveTimer=null;

function scheduleSave(){

  clearTimeout(saveTimer);

  saveTimer=
    setTimeout(
      ()=>{

        saveData();

      },
      300
    );

}

   SETTINGS
========================================================= */

document.getElementById(
  "settingsBack"
).onclick=()=>{

  updateHome();
  showScreen("homeScreen");

};

document.getElementById(
  "darkToggle"
).onclick=()=>{

  data.settings.dark=
    !data.settings.dark;

  applyDark();
  saveData();

};

function applyDark(){

  document.body.classList.toggle(
    "dark",
    !!data.settings.dark
  );

}

/* =========================================================
   EXPORT
========================================================= */

document.getElementById(
  "exportBtn"
).onclick=()=>{

  flushStudyTime();

  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "DestinationNote-backup.json";

  a.click();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(url);
    },
    1000
  );

};

/* =========================================================
   IMPORT
========================================================= */

document.getElementById(
  "importBtn"
).onclick=()=>{

  document.getElementById(
    "importInput"
  ).click();

};

document.getElementById(
  "importInput"
).addEventListener(
  "change",
  e=>{

    const file=
      e.target.files[0];

    if(!file) return;

    const reader=
      new FileReader();

    reader.onload=()=>{

      try{

        const imported=
          JSON.parse(
            reader.result
          );

        if(
          !imported ||
          !Array.isArray(
            imported.notes
          )
        ){

          throw new Error();

        }

        if(
          !confirm(
            "現在のデータをバックアップの内容で置き換えますか？"
          )
        ){

          return;

        }

        data=imported;

        normalizeNotes();
        saveData();

        alert(
          "読み込み完了！"
        );

        location.reload();

      }catch(err){

        alert(
          "バックアップファイルを読み込めませんでした。"
        );

      }

    };

    reader.readAsText(file);

    e.target.value="";

  }
);

   RESET
========================================================= */

document.getElementById(

).onclick=()=>{

    );

  if(!ok) return;

  localStorage.removeItem(

};

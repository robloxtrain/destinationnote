<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Destination Note</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
  color:#111;
  background:
    radial-gradient(circle at 10% 10%,rgba(130,190,255,.45),transparent 35%),
    radial-gradient(circle at 90% 10%,rgba(255,170,245,.40),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(170,220,255,.35),transparent 40%),
    #edf2f8;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

/* =========================
   LIQUID GLASS
========================= */

.glass{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.72),
      rgba(255,255,255,.42)
    );
  border:1px solid rgba(255,255,255,.78);
  box-shadow:
    0 20px 60px rgba(50,70,100,.14),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(255,255,255,.28);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
}

.app{
  width:100%;
  height:100%;
  display:flex;
  padding:
    calc(12px + env(safe-area-inset-top))
    12px
    calc(12px + env(safe-area-inset-bottom))
    12px;
  gap:12px;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:300px;
  min-width:300px;
  height:100%;
  border-radius:28px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  z-index:20;
}

.brand{
  padding:24px 20px 15px;
  display:flex;
  align-items:center;
  gap:13px;
}

.brandIcon{
  width:46px;
  height:46px;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
  background:rgba(255,255,255,.62);
  box-shadow:
    0 8px 20px rgba(0,0,0,.08),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.brandTitle{
  font-size:19px;
  font-weight:750;
}

.brandUser{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.tree{
  flex:1;
  overflow:auto;
  padding:5px 10px 100px;
  overscroll-behavior:contain;
}

.tree::-webkit-scrollbar{
  width:5px;
}

.tree::-webkit-scrollbar-thumb{
  background:rgba(0,0,0,.12);
  border-radius:20px;
}

.treeRow{
  width:100%;
  min-height:43px;
  border-radius:15px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  margin:2px 0;
  text-align:left;
  color:#111;
  background:transparent;
  transition:.18s;
}

.treeRow:hover{
  background:rgba(255,255,255,.45);
}

.treeRow.selected{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.80),
      rgba(255,255,255,.42)
    );
  box-shadow:
    0 8px 25px rgba(60,80,120,.12),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.treeArrow{
  width:22px;
  min-width:22px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  color:#777;
}

.treeIcon{
  width:27px;
  min-width:27px;
  text-align:center;
  font-size:19px;
}

.treeName{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
  font-weight:560;
}

.treeNote{
  color:#444;
}

.sidebarBottom{
  position:absolute;
  left:12px;
  right:12px;
  bottom:
    calc(12px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:1fr 1fr 48px;
  gap:8px;
}

.bottomButton{
  height:48px;
  border-radius:17px;
  color:#111;
  background:
    rgba(255,255,255,.66);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:
    0 10px 25px rgba(40,60,90,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.bottomButton:active{
  transform:scale(.96);
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-width:0;
  min-height:0;
  border-radius:30px;
  overflow:hidden;
  position:relative;
}

.page{
  width:100%;
  height:100%;
  overflow:auto;
  position:relative;
}

.page::-webkit-scrollbar{
  width:6px;
}

.page::-webkit-scrollbar-thumb{
  background:rgba(0,0,0,.10);
  border-radius:20px;
}

.pageInner{
  min-height:100%;
  padding:32px;
}

.header{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:28px;
}

.backButton{
  width:48px;
  height:48px;
  border-radius:17px;
  background:rgba(255,255,255,.68);
  box-shadow:
    0 10px 30px rgba(40,60,100,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
  font-size:23px;
}

.headerIcon{
  font-size:31px;
}

.headerTitle{
  font-size:31px;
  font-weight:780;
}

.headerSub{
  color:#888;
  font-size:13px;
  margin-top:2px;
}

.sectionTitle{
  font-size:20px;
  font-weight:750;
  margin:25px 0 14px;
}

.cardGrid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(230px,1fr));
  gap:16px;
}

.card{
  min-height:135px;
  border-radius:26px;
  padding:25px;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.82),
      rgba(255,255,255,.47)
    );
  border:1px solid rgba(255,255,255,.78);
  box-shadow:
    0 16px 38px rgba(45,65,100,.11),
    inset 0 1px 0 rgba(255,255,255,.95);
  backdrop-filter:blur(25px) saturate(170%);
  -webkit-backdrop-filter:blur(25px) saturate(170%);
  transition:.18s;
  text-align:left;
}

.card:active{
  transform:scale(.98);
}

.cardIcon{
  font-size:30px;
  margin-bottom:22px;
}

.cardTitle{
  font-weight:750;
  font-size:17px;
}

.cardSub{
  color:#888;
  font-size:12px;
  margin-top:7px;
}

/* =========================
   NOTE EDITOR
========================= */

.notePage{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.noteTopbar{
  height:72px;
  min-height:72px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  z-index:50;
}

.noteTitleBox{
  flex:1;
  min-width:0;
}

.noteTitle{
  font-size:18px;
  font-weight:760;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.notePageInfo{
  color:#888;
  font-size:11px;
  margin-top:2px;
}

.toolBar{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px;
  border-radius:20px;
  background:
    rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.78);
  box-shadow:
    0 8px 30px rgba(40,60,90,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.tool{
  width:40px;
  height:40px;
  border-radius:13px;
  background:rgba(255,255,255,.40);
  font-size:18px;
  transition:.15s;
}

.tool.active{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.95),
      rgba(210,225,255,.70)
    );
  box-shadow:
    0 5px 18px rgba(50,80,150,.18),
    inset 0 1px 0 white;
}

.tool:active{
  transform:scale(.91);
}

.colorInput{
  width:38px;
  height:38px;
  border:0;
  padding:0;
  border-radius:12px;
  overflow:hidden;
  background:none;
}

.sizeBox{
  display:flex;
  align-items:center;
  gap:5px;
  padding:0 6px;
}

.sizeBox input{
  width:70px;
}

.editor{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;

  /* iPad入力をブラウザに奪わせない */
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(255,255,255,.92),
      rgba(246,248,252,.92)
    );
}

/*
  キャンバスは画面全体。
  カメラ位置・ズームはJSで変える。
*/
#drawCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;

  touch-action:none;
  -ms-touch-action:none;

  cursor:crosshair;
}

.objectLayer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.noteObject{
  position:absolute;
  pointer-events:auto;
  transform-origin:top left;
  touch-action:none;
}

.textObject{
  min-width:80px;
  min-height:35px;
  padding:6px 9px;
  font-weight:600;
  white-space:pre-wrap;
  outline:none;
  background:transparent;
}

.stickyObject{
  min-width:160px;
  min-height:110px;
  padding:18px;
  border-radius:7px;
  background:#fff39a;
  box-shadow:
    0 10px 25px rgba(50,50,0,.18);
  white-space:pre-wrap;
  outline:none;
}

.imageObject{
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.imageObject img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.objectSelected{
  outline:2px solid #4b8cff;
}

.resizeHandle{
  position:absolute;
  width:18px;
  height:18px;
  right:-9px;
  bottom:-9px;
  border-radius:50%;
  background:#fff;
  border:2px solid #4b8cff;
}

/* ページ操作 */
.pageBar{
  position:absolute;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  z-index:60;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  border-radius:18px;
  background:rgba(255,255,255,.66);
  border:1px solid rgba(255,255,255,.82);
  box-shadow:
    0 10px 30px rgba(40,60,90,.13),
    inset 0 1px 0 rgba(255,255,255,.95);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.pageBtn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:rgba(255,255,255,.55);
}

.pageNumber{
  min-width:70px;
  text-align:center;
  font-size:12px;
  color:#666;
}

.zoomBox{
  position:absolute;
  right:16px;
  bottom:16px;
  z-index:60;
  display:flex;
  gap:5px;
  padding:6px;
  border-radius:16px;
  background:rgba(255,255,255,.65);
  border:1px solid rgba(255,255,255,.8);
  backdrop-filter:blur(20px);
}

.zoomBtn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:rgba(255,255,255,.55);
}

/* =========================
   LOGIN
========================= */

.login{
  position:fixed;
  inset:0;
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,#b9ddff,transparent 40%),
    radial-gradient(circle at 80% 20%,#f3c8ff,transparent 40%),
    radial-gradient(circle at 50% 100%,#d5eaff,transparent 45%),
    #edf2f8;
}

.loginCard{
  width:min(430px,100%);
  padding:35px;
  border-radius:32px;
  text-align:center;
}

.loginIcon{
  font-size:55px;
  margin-bottom:12px;
}

.loginTitle{
  font-size:30px;
  font-weight:800;
}

.loginSub{
  color:#888;
  font-size:13px;
  margin:8px 0 25px;
}

.loginInput{
  width:100%;
  height:50px;
  margin:6px 0;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.85);
  outline:none;
  padding:0 16px;
  background:rgba(255,255,255,.62);
}

.loginButton{
  width:100%;
  height:52px;
  margin-top:10px;
  border-radius:17px;
  color:white;
  font-weight:700;
  background:
    linear-gradient(
      135deg,
      #3d86ff,
      #7568ff
    );
  box-shadow:
    0 12px 30px rgba(70,100,230,.28);
}

/* =========================
   MOBILE
========================= */

.mobileMenu{
  display:none;
}

@media(max-width:800px){

  .app{
    padding:8px;
  }

  .sidebar{
    position:fixed;
    left:8px;
    top:8px;
    bottom:8px;
    height:auto;
    transform:translateX(-110%);
    transition:.25s;
    box-shadow:0 20px 70px rgba(20,40,70,.25);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .mobileMenu{
    display:flex;
    position:absolute;
    left:14px;
    top:14px;
    z-index:100;
    width:46px;
    height:46px;
    border-radius:15px;
    background:rgba(255,255,255,.72);
    box-shadow:0 8px 25px rgba(0,0,0,.10);
  }

  .pageInner{
    padding:25px 20px;
  }

  .noteTopbar{
    padding-left:62px;
  }

  .toolBar{
    max-width:55vw;
    overflow:auto;
  }

  .tool{
    min-width:40px;
  }

  .sizeBox{
    display:none;
  }

  .cardGrid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:520px){

  .cardGrid{
    grid-template-columns:1fr;
  }

  .headerTitle{
    font-size:24px;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen" class="login">
  <div class="loginCard glass">

    <div class="loginIcon">📚</div>

    <div class="loginTitle">
      Destination Note
    </div>

    <div class="loginSub">
      自分だけの勉強ノート
    </div>

    <input
      id="loginName"
      class="loginInput"
      placeholder="名前"
      autocomplete="username">

    <input
      id="loginPassword"
      class="loginInput"
      type="password"
      placeholder="パスワード"
      autocomplete="current-password">

    <button
      id="loginButton"
      class="loginButton">
      はじめる
    </button>

  </div>
</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="app" style="display:none">

  <!-- SIDEBAR -->

  <aside id="sidebar" class="sidebar glass">

    <div class="brand">
      <div class="brandIcon">📚</div>

      <div>
        <div class="brandTitle">
          Destination Note
        </div>

        <div
          id="brandUser"
          class="brandUser">
        </div>
      </div>
    </div>

    <div
      id="tree"
      class="tree">
    </div>

    <div class="sidebarBottom">

      <button
        id="addFolderButton"
        class="bottomButton">
        ＋ タブ
      </button>

      <button
        id="addNoteButton"
        class="bottomButton">
        ＋ ノート
      </button>

      <button
        id="settingsButton"
        class="bottomButton">
        ⚙️
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main
    id="main"
    class="main glass">
  </main>

</div>


<script>
"use strict";

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "destinationNote_v1";

let data = {
  name:"",
  password:"",
  totalSeconds:0,

  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],

  notes:[],

  settings:{
    dark:false
  }
};

let selectedFolderId = "root";
let currentFolderId = "root";
let selectedNoteId = null;

let expandedFolders =
  new Set(["root"]);

let currentPage = 0;

let currentTool = "pen";

let currentColor = "#111111";

let currentSize = 3;

let camera = {
  x:0,
  y:0,
  zoom:1
};

let pointers = new Map();

let drawing = false;
let moving = false;

let activePointerId = null;

let lastWorldPoint = null;

let panStart = null;

let pinchStart = null;

let selectedObjectId = null;

let animationFrame = null;

let studyStart = null;


/* =========================================================
   SAVE / LOAD
========================================================= */

function uid(prefix="id"){
  return prefix + "_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2,8);
}

function safeText(value,fallback=""){
  if(
    value === undefined ||
    value === null ||
    value === "undefined" ||
    value === "null"
  ){
    return fallback;
  }

  return String(value);
}

function normalizeData(){

  if(!data || typeof data !== "object"){
    data = {};
  }

  if(!Array.isArray(data.folders)){
    data.folders = [];
  }

  if(!Array.isArray(data.notes)){
    data.notes = [];
  }

  if(!data.settings){
    data.settings = {};
  }

  if(!data.totalSeconds){
    data.totalSeconds = 0;
  }

  /*
    フォルダを修正
  */

  data.folders =
    data.folders.map((folder,index)=>{

      return {
        id:safeText(
          folder.id,
          uid("folder")
        ),

        name:safeText(
          folder.name,
          index === 0
            ? "マイノート"
            : "新しいタブ"
        ),

        icon:safeText(
          folder.icon,
          "📁"
        ),

        parent:
          folder.parent === undefined
            ? (index === 0 ? null : "root")
            : folder.parent,

        created:
          folder.created || Date.now()
      };

    });

  /*
    rootがなければ作る
  */

  if(
    !data.folders.some(
      f=>f.id==="root"
    )
  ){

    data.folders.unshift({
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    });

  }

  /*
    ノートを修正
  */

  data.notes =
    data.notes.map((note,index)=>{

      let folderId =
        note.folderId ||
        note.parent ||
        "root";

      if(
        !data.folders.some(
          f=>f.id===folderId
        )
      ){
        folderId = "root";
      }

      let pages =
        Array.isArray(note.pages)
          ? note.pages
          : [];

      if(pages.length===0){

        pages = [{
          strokes:[],
          elements:[]
        }];

      }

      pages =
        pages.map(page=>({

          strokes:
            Array.isArray(page.strokes)
              ? page.strokes
              : [],

          elements:
            Array.isArray(page.elements)
              ? page.elements
              : []

        }));

      return {

        id:safeText(
          note.id,
          uid("note")
        ),

        name:safeText(
          note.name ||
          note.title,
          "新しいノート"
        ),

        folderId,

        created:
          note.created || Date.now(),

        pages

      };

    });

}

function save(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(error){

    console.error(
      "保存エラー",
      error
    );

    alert(
      "保存できませんでした。\n"+
      "写真を大量に入れている場合は容量不足の可能性があります。"
    );

  }

}

function load(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(raw){

      const parsed =
        JSON.parse(raw);

      if(parsed){

        data = parsed;

      }

    }

  }catch(error){

    console.error(
      "読み込みエラー",
      error
    );

  }

  normalizeData();

  save();

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  const name =
    document
      .getElementById("loginName")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  if(!name){

    alert("名前を入力してね");

    return;

  }

  /*
    初回
  */

  if(!data.name){

    data.name = name;
    data.password = password;

    save();

  }else{

    if(
      data.name !== name ||
      data.password !== password
    ){

      alert(
        "名前またはパスワードが違います"
      );

      return;

    }

  }

  document
    .getElementById("loginScreen")
    .style.display="none";

  document
    .getElementById("app")
    .style.display="flex";

  document
    .getElementById("brandUser")
    .textContent=data.name;

  startStudyTimer();

  renderTree();

  openFolder(
    selectedFolderId
  );

}

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    login
  );


/* =========================================================
   STUDY TIME
========================================================= */

function startStudyTimer(){

  studyStart = Date.now();

  document.addEventListener(
    "visibilitychange",
    ()=>{

      if(document.hidden){

        flushStudyTime();

      }else{

        studyStart = Date.now();

      }

    }
  );

  setInterval(
    updateStudyDisplay,
    1000
  );

}

function flushStudyTime(){

  if(!studyStart){
    return;
  }

  const elapsed =
    Math.floor(
      (Date.now()-studyStart)/1000
    );

  if(elapsed>0){

    data.totalSeconds += elapsed;

    studyStart = Date.now();

    save();

  }

}

function updateStudyDisplay(){

  if(
    document.hidden ||
    !studyStart
  ){
    return;
  }

  const live =
    Math.floor(
      (Date.now()-studyStart)/1000
    );

  const total =
    data.totalSeconds + live;

  const el =
    document.getElementById(
      "studyTime"
    );

  if(el){

    el.textContent =
      formatTime(total);

  }

}

function formatTime(seconds){

  const hours =
    Math.floor(seconds/3600);

  const minutes =
    Math.floor(
      (seconds%3600)/60
    );

  return hours+"時間 "+
         minutes+"分";

}

function getRank(seconds){

  const h =
    seconds/3600;

  if(h<10)
    return ["ブロンズ","🥉"];

  if(h<30)
    return ["シルバー","🥈"];

  if(h<60)
    return ["ゴールド","🥇"];

  if(h<100)
    return ["プラチナ","💎"];

  if(h<200)
    return ["ビジネス","💼"];

  if(h<500)
    return ["ファースト","🚄"];

  return ["グランクラス","🚅"];

}


/* =========================================================
   SIDEBAR TREE
========================================================= */

function getFolder(id){

  return data.folders.find(
    f=>f.id===id
  );

}

function getNote(id){

  return data.notes.find(
    n=>n.id===id
  );

}

function getChildren(parentId){

  return data.folders.filter(
    f=>
      (f.parent || null) === parentId
  );

}

function getFolderNotes(folderId){

  return data.notes.filter(
    n=>n.folderId===folderId
  );

}

function renderTree(){

  const tree =
    document.getElementById("tree");

  tree.innerHTML="";

  const root =
    getFolder("root");

  if(!root){
    return;
  }

  renderFolderTree(
    root,
    0,
    tree
  );

}

function renderFolderTree(
  folder,
  depth,
  parentEl
){

  const children =
    getChildren(folder.id);

  const notes =
    getFolderNotes(folder.id);

  const row =
    document.createElement("div");

  row.className="treeRow";

  if(
    selectedFolderId===folder.id
  ){

    row.classList.add(
      "selected"
    );

  }

  row.style.paddingLeft =
    (8 + depth*18)+"px";

  /*
    三角
  */

  const arrow =
    document.createElement("div");

  arrow.className="treeArrow";

  if(
    children.length ||
    notes.length
  ){

    arrow.textContent =
      expandedFolders.has(folder.id)
        ? "⌄"
        : "›";

  }

  /*
    アイコン
  */

  const icon =
    document.createElement("div");

  icon.className="treeIcon";

  icon.textContent =
    folder.icon || "📁";

  /*
    名前
  */

  const name =
    document.createElement("div");

  name.className="treeName";

  name.textContent =
    safeText(
      folder.name,
      "新しいタブ"
    );

  /*
    ★ここ重要
    行全体をクリック可能にする
  */

  row.append(
    arrow,
    icon,
    name
  );

  row.addEventListener(
    "click",
    event=>{

      event.stopPropagation();

      selectedFolderId =
        folder.id;

      currentFolderId =
        folder.id;

      selectedNoteId = null;

      /*
        文字・アイコン・三角
        どこを押しても開く
      */

      if(
        children.length ||
        notes.length
      ){

        if(
          expandedFolders.has(
            folder.id
          )
        ){

          expandedFolders.delete(
            folder.id
          );

        }else{

          expandedFolders.add(
            folder.id
          );

        }

      }

      renderTree();

      openFolder(
        folder.id
      );

    }
  );

  /*
    長押し / 右クリックで名前変更
  */

  row.addEventListener(
    "contextmenu",
    event=>{

      event.preventDefault();

      renameFolder(
        folder.id
      );

    }
  );

  parentEl.appendChild(row);

  /*
    子階層
  */

  if(
    expandedFolders.has(
      folder.id
    )
  ){

    children.forEach(
      child=>{

        renderFolderTree(
          child,
          depth+1,
          parentEl
        );

      }
    );

    notes.forEach(
      note=>{

        renderNoteTree(
          note,
          depth+1,
          parentEl
        );

      }
    );

  }

}

========================================================= */

function createFolder(){

  const parent =
    selectedFolderId ||
    currentFolderId ||
    "root";

  let name =
    prompt(
      "タブの名前を入力"
    );

  if(name===null){
    return;
  }

  name =
    name.trim();

  if(!name){
    name="新しいタブ";
  }

  const folder = {

    id:uid("folder"),

    name,

    icon:"📁",

    parent,

    created:Date.now()

  };

  data.folders.push(
    folder
  );

  expandedFolders.add(
    parent
  );

  expandedFolders.add(
    folder.id
  );

  selectedFolderId =
    folder.id;

  currentFolderId =
    folder.id;

  save();

  renderTree();

  openFolder(
    folder.id
  );

}

function createNote(){

  /*
    ★重要
    現在選択しているフォルダに作る。
    内側のフォルダでもOK。
  */

  const folderId =
    selectedFolderId ||
    currentFolderId ||
    "root";

  if(
    !data.folders.some(
      f=>f.id===folderId
    )
  ){

    selectedFolderId="root";

  }

  let name =
    prompt(
      "ノートの名前を入力"
    );

  if(name===null){
    return;
  }

  name =
    name.trim();

  if(!name){
    name="新しいノート";
  }

  const note = {

    id:uid("note"),

    name,

    folderId,

    created:Date.now(),

    pages:[
      {
        strokes:[],
        elements:[]
      }
    ]

  };

  data.notes.push(
    note
  );

  selectedNoteId =
    note.id;

  selectedFolderId =
    folderId;

  currentFolderId =
    folderId;

  expandedFolders.add(
    folderId
  );

  save();

  renderTree();

  openNote(
    note.id
  );

}

function openNote(id){

    getNote(id);

  if(!note){
    return;
  }

  selectedNoteId=id;
  selectedFolderId=
    note.folderId;

  currentFolderId=
    note.folderId;

  if(!Array.isArray(note.pages)){
    note.pages=[];
  }

  if(note.pages.length===0){

    note.pages.push({
      strokes:[],
      elements:[]
    });

  }

  currentPage =
    Math.min(
      currentPage,
      note.pages.length-1
    );

  save();

  renderTree();

  renderNoteEditor();

}

function getCurrentPage(){

  const note =
    getNote(selectedNoteId);

  if(!note){
    return null;
  }

  if(!note.pages[currentPage]){

    note.pages[currentPage]={
      strokes:[],
      elements:[]
    };

  }

  return note.pages[currentPage];

}

/* =========================================================
   TOOL
========================================================= */

function setTool(tool){

  currentTool=tool;

  selectedObjectId=null;

  document
    .querySelectorAll(
      ".tool"
    )
    .forEach(
      button=>{

        button.classList.toggle(
          "active",
          button.dataset.tool===tool
        );

      }
    );

  const canvas =
    document.getElementById(
      "drawCanvas"
    );

  if(canvas){

    if(tool==="pen" ||
       tool==="highlighter" ||
       tool==="pixel" ||
       tool==="object"){

      canvas.style.cursor=
        "crosshair";

    }else if(tool==="hand"){

      canvas.style.cursor=
        "grab";

    }else{

      canvas.style.cursor=
        "default";

    }

  }

}


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(){

  const canvas =
    document.getElementById(
      "drawCanvas"
    );

  const editor =
    document.getElementById(
      "editor"
    );

  if(!canvas || !editor){
    return;
  }

  const rect =
    editor.getBoundingClientRect();

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.floor(
      rect.width*dpr
    );

  canvas.height =
    Math.floor(
      rect.height*dpr
    );

  canvas.style.width =
    rect.width+"px";

  canvas.style.height =
    rect.height+"px";

  renderCanvas();

}

window.addEventListener(
  "resize",
  ()=>{
    if(
      document.getElementById(
        "drawCanvas"
      )
    ){
      resizeCanvas();
    }
  }
);


/* =========================================================
   WORLD / CAMERA
========================================================= */

function screenToWorld(x,y){

  return {

    x:
      (x-camera.x)/
      camera.zoom,

    y:
      (y-camera.y)/
      camera.zoom

  };

}

function worldToScreen(x,y){

  return {

    x:
      x*camera.zoom+
      camera.x,

    y:
      y*camera.zoom+
      camera.y

  };

}

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* =========================================================
   DRAW
========================================================= */

function drawBackground(ctx,w,h){

  ctx.fillStyle="#ffffff";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );

  /*
    薄いノートの方眼
  */

  const grid =
    40*camera.zoom;

  if(grid>10){

    ctx.save();

    ctx.strokeStyle=
      "rgba(100,130,170,.075)";

    ctx.lineWidth=1;

    const ox =
      camera.x %
      grid;

    const oy =
      camera.y %
      grid;

    for(
      let x=ox;
      x<w;
      x+=grid
    ){

      ctx.beginPath();

      ctx.moveTo(
        x,
        0
      );

      ctx.lineTo(
        x,
        h
      );

      ctx.stroke();

    }

    for(
      let y=oy;
      y<h;
      y+=grid
    ){

      ctx.beginPath();

      ctx.moveTo(
        0,
        y
      );

      ctx.lineTo(
        w,
        y
      );

      ctx.stroke();

    }

    ctx.restore();

  }

}

function drawStroke(
  ctx,
  stroke,
  current=false
){

  if(
    !stroke ||
    !Array.isArray(
      stroke.points
    ) ||
    stroke.points.length<1
  ){
    return;
  }

  const pts =
    stroke.points;

  ctx.save();

  ctx.lineCap="round";
  ctx.lineJoin="round";

  if(stroke.tool==="highlighter"){

    ctx.globalAlpha=.28;

    ctx.strokeStyle=
      stroke.color;

    ctx.lineWidth=
      stroke.size*4;

  }else{

    ctx.globalAlpha=1;

    ctx.strokeStyle=
      stroke.color;

    ctx.lineWidth=
      stroke.size;

  }

  ctx.beginPath();

  const first =
    worldToScreen(
      pts[0].x,
      pts[0].y
    );

  ctx.moveTo(
    first.x,
    first.y
  );

  if(pts.length===1){

    ctx.lineTo(
      first.x+.01,
      first.y+.01
    );

  }else{

    for(
      let i=1;
      i<pts.length;
      i++
    ){

      const p =
        worldToScreen(
          pts[i].x,
          pts[i].y
        );

      /*
        指に追従するように
        毎ポイント描画
      */

      ctx.lineTo(
        p.x,
        p.y
      );

    }

  }

  ctx.stroke();

  ctx.restore();

}

function renderCanvas(){

  const canvas =
    document.getElementById(
      "drawCanvas"
    );

  if(!canvas){
    return;
  }

  const ctx =
    canvas.getContext(
      "2d"
    );

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  const w =
    canvas.width/dpr;

  const h =
    canvas.height/dpr;

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  drawBackground(
    ctx,
    w,
    h
  );

  const page =
    getCurrentPage();

  if(!page){
    return;
  }

  page.strokes.forEach(
    stroke=>{
      drawStroke(
        ctx,
        stroke
      );
    }
  );

}


/* =========================================================
   iPAD POINTER EVENTS
========================================================= */

function setupCanvasEvents(){

  const canvas =
    document.getElementById(
      "drawCanvas"
    );

  const editor =
    document.getElementById(
      "editor"
    );

  if(!canvas || !editor){
    return;
  }

  /*
    念のためイベントを直接キャンバスに付ける
  */

  canvas.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
  );

  canvas.addEventListener(
    "pointerdown",
    pointerDown,
    {
      passive:false
    }
  );

  canvas.addEventListener(
    "pointermove",
    pointerMove,
    {
      passive:false
    }
  );

  canvas.addEventListener(
    "pointerup",
    pointerUp,
    {
      passive:false
    }
  );

  canvas.addEventListener(
    "pointercancel",
    pointerUp,
    {
      passive:false
    }
  );

  canvas.addEventListener(
    "pointerleave",
    e=>{
      /*
        描画中はleaveしても
        pointermoveを止めない
      */
    }
  );

}

function pointerDown(e){

  e.preventDefault();
  e.stopPropagation();

  const canvas=e.currentTarget;

  pointers.set(
    e.pointerId,
    {
      x:e.clientX,
      y:e.clientY
    }
  );

  /*
    2本指になったら
    ピンチ・パンモード
  */

  if(pointers.size===2){

    drawing=false;

    activePointerId=null;

    const arr=[
      ...pointers.values()
    ];

    const center={
      x:(arr[0].x+arr[1].x)/2,
      y:(arr[0].y+arr[1].y)/2
    };

    const dist=
      Math.hypot(
        arr[0].x-arr[1].x,
        arr[0].y-arr[1].y
      );

    pinchStart={
      center,
      distance:dist,
      zoom:camera.zoom,
      x:camera.x,
      y:camera.y
    };

    return;
  }

  /*
    2本指中
  */

  if(pointers.size>1){
    return;
  }

  /*
    テキスト・付箋・写真
  */

  if(
    currentTool==="text" ||
    currentTool==="sticky" ||
    currentTool==="image"
  ){

    const rect =
      canvas.getBoundingClientRect();

    const world =
      screenToWorld(
        e.clientX-rect.left,
        e.clientY-rect.top
      );

    if(
      currentTool==="text"
    ){

      createTextObject(
        world.x,
        world.y
      );

    }else if(
      currentTool==="sticky"
    ){

      createStickyObject(
        world.x,
        world.y
      );

    }else{

      chooseImage(
        world.x,
        world.y
      );

    }

    return;

  }

  /*
    手のひら
  */

  if(currentTool==="hand"){

    moving=true;

    activePointerId=
      e.pointerId;

    panStart={
      x:e.clientX,
      y:e.clientY,
      cameraX:camera.x,
      cameraY:camera.y
    };

    try{
      canvas.setPointerCapture(
        e.pointerId
      );
    }catch(_){}

    return;

  }

  /*
    描画
  */

  if(
    currentTool==="pen" ||
    currentTool==="highlighter"
  ){

    drawing=true;

    activePointerId=
      e.pointerId;

    const rect =
      canvas.getBoundingClientRect();

    const world =
      screenToWorld(
        e.clientX-rect.left,
        e.clientY-rect.top
      );

    lastWorldPoint=world;

    const page =
      getCurrentPage();

    page.strokes.push({

      id:uid("stroke"),

      tool:currentTool,

      color:currentColor,

      size:currentSize,

      points:[
        world
      ]

    });

    /*
      iPadで指を離さなくても
      このキャンバスが追跡する
    */

    try{
      canvas.setPointerCapture(
        e.pointerId
      );
    }catch(_){}

    renderCanvas();

    return;

  }

  /*
    ピクセル消しゴム
  */

  if(currentTool==="pixel"){

    activePointerId=
      e.pointerId;

    try{
      canvas.setPointerCapture(
        e.pointerId
      );
    }catch(_){}

    erasePixelAt(
      e
    );

    return;

  }

  /*
    オブジェクト消しゴム
  */

  if(currentTool==="object"){

    eraseObjectAt(
      e
    );

  }

}

function pointerMove(e){

  e.preventDefault();
  e.stopPropagation();

  if(
    pointers.has(
      e.pointerId
    )
  ){

    pointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

  }

  /*
    2本指
  */

  if(
    pointers.size===2 &&
    pinchStart
  ){

    const arr=[
      ...pointers.values()
    ];

    const center={
      x:(arr[0].x+arr[1].x)/2,
      y:(arr[0].y+arr[1].y)/2
    };

    const dist=
      Math.hypot(
        arr[0].x-arr[1].x,
        arr[0].y-arr[1].y
      );

    let newZoom=
      pinchStart.zoom *
      (
        dist/
        pinchStart.distance
      );

    newZoom=
      Math.max(
        .35,
        Math.min(
          4,
          newZoom
        )
      );

    /*
      指の中心を固定してズーム
    */

    const editor =
      document.getElementById(
        "editor"
      );

    const rect =
      editor.getBoundingClientRect();

    const cx =
      center.x-rect.left;

    const cy =
      center.y-rect.top;

    const worldBefore =
      screenToWorld(
        cx,
        cy
      );

    camera.zoom=newZoom;

    camera.x =
      cx -
      worldBefore.x*camera.zoom;

    camera.y =
      cy -
      worldBefore.y*camera.zoom;

    /*
      2本指移動
    */

    const dx =
      center.x -
      pinchStart.center.x;

    const dy =
      center.y -
      pinchStart.center.y;

    camera.x =
      pinchStart.x +
      dx;

    camera.y =
      pinchStart.y +
      dy;

    renderCanvas();

    renderObjects();

    return;

  }

  /*
    手のひら
  */

  if(
    moving &&
    activePointerId===
      e.pointerId
  ){

    camera.x =
      panStart.cameraX +
      (
        e.clientX-
        panStart.x
      );

    camera.y =
      panStart.cameraY +
      (
        e.clientY-
        panStart.y
      );

    renderCanvas();

    renderObjects();

    return;

  }

  /*
    ペン
  */

  if(
    drawing &&
    activePointerId===
      e.pointerId
  ){

    const canvas =
      e.currentTarget;

    const rect =
      canvas.getBoundingClientRect();

    const world =
      screenToWorld(
        e.clientX-rect.left,
        e.clientY-rect.top
      );

    const page =
      getCurrentPage();

    const stroke =
      page.strokes[
        page.strokes.length-1
      ];

    if(!stroke){
      return;
    }

    /*
      かなり細かい間隔で
      ポイントを追加
    */

    const last =
      stroke.points[
        stroke.points.length-1
      ];

    const d =
      distance(
        last,
        world
      );

    /*
      ズームしても
      指の軌跡が滑らかになる
    */

    if(
      d >=
      Math.max(
        .5,
        1.2/currentToolZoom()
      )
    ){

      stroke.points.push(
        world
      );

    }

    renderCanvas();

    return;

  }

  /*
    ピクセル消しゴム
  */

  if(
    currentTool==="pixel" &&
    activePointerId===
      e.pointerId
  ){

    erasePixelAt(
      e
    );

  }

}

function pointerUp(e){

  e.preventDefault();
  e.stopPropagation();

  pointers.delete(
    e.pointerId
  );

  if(
    pointers.size<2
  ){

    pinchStart=null;

  }

  if(
    activePointerId===
      e.pointerId
  ){

    drawing=false;

    moving=false;

    activePointerId=null;

    lastWorldPoint=null;

    save();

  }

}

function currentToolZoom(){

  return Math.max(
    .5,
    camera.zoom
  );

}


/* =========================================================
   PIXEL ERASER
========================================================= */

function erasePixelAt(e){

  const canvas =
    document.getElementById(
      "drawCanvas"
    );

  const rect =
    canvas.getBoundingClientRect();

  const world =
    screenToWorld(
      e.clientX-rect.left,
      e.clientY-rect.top
    );

  const page =
    getCurrentPage();

  const radius =
    Math.max(
      8,
      currentSize*3
    );

  const newStrokes=[];

  page.strokes.forEach(
    stroke=>{

      if(
        !stroke.points ||
        stroke.points.length===0
      ){
        return;
      }

      let segment=[];

      stroke.points.forEach(
        p=>{

          const hit =
            Math.hypot(
              p.x-world.x,
              p.y-world.y
            ) <= radius;

          if(hit){

            if(
              segment.length>1
            ){

              newStrokes.push({

                ...stroke,

                id:uid("stroke"),

                points:
                  segment

              });

            }

            segment=[];

          }else{

            segment.push(p);

          }

        }
      );

      if(
        segment.length>1
      ){

        newStrokes.push({

          ...stroke,

          id:uid("stroke"),

          points:
            segment

        });

      }

    }
  );

  page.strokes=
    newStrokes;

  renderCanvas();

}


/* =========================================================
   OBJECT ERASER
========================================================= */

function eraseObjectAt(e){

  const canvas =
    document.getElementById(
      "drawCanvas"
    );

  const rect =
    canvas.getBoundingClientRect();

  const world =
    screenToWorld(
      e.clientX-rect.left,
      e.clientY-rect.top
    );

  const page =
    getCurrentPage();

  let hitIndex=-1;

  for(
    let i=page.elements.length-1;
    i>=0;
    i--
  ){

    const obj =
      page.elements[i];

    if(
      world.x>=obj.x &&
      world.x<=obj.x+obj.width &&
      world.y>=obj.y &&
      world.y<=obj.y+obj.height
    ){

      hitIndex=i;

      break;

    }

  }

  if(hitIndex>=0){

    page.elements.splice(
      hitIndex,
      1
    );

    selectedObjectId=null;

    save();

    renderObjects();

  }

}


/* =========================================================
   ZOOM
========================================================= */

function zoomAt(
  screenX,
  screenY,
  factor
){

  const before =
    screenToWorld(
      screenX,
      screenY
    );

  camera.zoom *= factor;

  camera.zoom =
    Math.max(
      .35,
      Math.min(
        4,
        camera.zoom
      )
    );

  camera.x =
    screenX -
    before.x*camera.zoom;

  camera.y =
    screenY -
    before.y*camera.zoom;

  renderCanvas();

  renderObjects();

}


/* =========================================================
   OBJECTS
========================================================= */

function createTextObject(
  x,
  y
){

  const text =
    prompt(
      "入力するテキスト"
    );

  if(
    text===null ||
    !text.trim()
  ){
    return;
  }

  const page =
    getCurrentPage();

  const obj={

    id:uid("text"),

    type:"text",

    x,

    y,

    width:240,

    height:70,

    text:text.trim(),

    color:currentColor,

    fontSize:
      Math.max(
        14,
        currentSize*5
      )

  };

  page.elements.push(
    obj
  );

  save();

  renderObjects();

  selectedObjectId=
    obj.id;

}

function createStickyObject(
  x,
  y
){

  const text =
    prompt(
      "付箋の内容"
    );

  if(
    text===null
  ){
    return;
  }

  const page =
    getCurrentPage();

  const obj={

    id:uid("sticky"),

    type:"sticky",

    x,

    y,

    width:220,

    height:150,

    text:text,

    color:currentColor,

    fontSize:20

  };

  page.elements.push(
    obj
  );

  save();

  renderObjects();

  selectedObjectId=
    obj.id;

}

function chooseImage(
  x,
  y
){

  const input =
    document.createElement(
      "input"
    );

  input.type="file";

  input.accept=
    "image/*";

  input.onchange =
    event=>{

      const file =
        event.target.files[0];

      if(!file){
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        ()=>{
          const page =
            getCurrentPage();

          const obj={

            id:uid("image"),

            type:"image",

            x:x,

            y:y,

            width:420,

            height:300,

            src:reader.result

          };

          page.elements.push(
            obj
          );

          save();

          renderObjects();

        };

      reader.readAsDataURL(
        file
      );

    };

  input.click();

}


/* =========================================================
   OBJECT RENDER
========================================================= */

function renderObjects(){

  const layer =
    document.getElementById(
      "objectLayer"
    );

  if(!layer){
    return;
  }

  layer.innerHTML="";

  const page =
    getCurrentPage();

  if(!page){
    return;
  }

  page.elements.forEach(
    obj=>{

      const el =
        document.createElement(
          "div"
        );

      el.className=
        "noteObject";

      el.dataset.id=
        obj.id;

      el.style.left=
        (
          obj.x*camera.zoom+
          camera.x
        )+"px";

      el.style.top=
        (
          obj.y*camera.zoom+
          camera.y
        )+"px";

      el.style.width=
        (
          obj.width*camera.zoom
        )+"px";

      el.style.height=
        (
          obj.height*camera.zoom
        )+"px";


      if(
        selectedObjectId===
        obj.id
      ){

        el.classList.add(
          "objectSelected"
        );

      }


      if(
        obj.type==="text"
      ){

        el.classList.add(
          "textObject"
        );

        el.textContent =
          safeText(
            obj.text,
            ""
          );

        el.style.fontSize =
          (
            obj.fontSize*
            camera.zoom
          )+"px";

        el.style.color =
          obj.color ||
          "#111";

      }


      if(
        obj.type==="sticky"
      ){

        el.classList.add(
          "stickyObject"
        );

        el.textContent =
          safeText(
            obj.text,
            ""
          );

        el.style.fontSize =
          (
            obj.fontSize*
            camera.zoom
          )+"px";

      }


      if(
        obj.type==="image"
      ){

        el.classList.add(
          "imageObject"
        );

        const img =
          document.createElement(
            "img"
          );

        img.src=obj.src;

        el.appendChild(
          img
        );

      }


      /*
        オブジェクト選択
      */

      el.addEventListener(
        "pointerdown",
        event=>{

          event.stopPropagation();

          if(
            currentTool==="object"
          ){

            const page =
              getCurrentPage();

            const index =
              page.elements.findIndex(
                x=>x.id===obj.id
              );

            if(index>=0){

              page.elements.splice(
                index,
                1
              );

              selectedObjectId=null;

              save();

              renderObjects();

            }

            return;

          }

          if(
            currentTool==="hand" ||
            currentTool==="pen" ||
            currentTool==="highlighter"
          ){

            selectedObjectId=
              obj.id;

            renderObjects();

          }

        },
        {
          passive:false
        }
      );


      /*
        ダブルタップで編集
      */

      el.addEventListener(
        "dblclick",
        event=>{

          event.stopPropagation();

          if(
            obj.type==="text" ||
            obj.type==="sticky"
          ){

            const value =
              prompt(
                "テキストを編集",
                obj.text
              );

            if(value!==null){

              obj.text=value;

              save();

              renderObjects();

            }

          }

        }
      );


      /*
        リサイズ
      */

      if(
        obj.type!=="image" ||
        true
      ){

        const handle =
          document.createElement(
            "div"
          );

        handle.className=
          "resizeHandle";

        handle.addEventListener(
          "pointerdown",
          event=>{

            event.preventDefault();
            event.stopPropagation();

            const startX=
              event.clientX;

            const startY=
              event.clientY;

            const startW=
              obj.width;

            const startH=
              obj.height;

            function move(ev){

              obj.width =
                Math.max(
                  60,
                  startW+
                  (
                    ev.clientX-
                    startX
                  )/camera.zoom
                );

              obj.height =
                Math.max(
                  40,
                  startH+
                  (
                    ev.clientY-
                    startY
                  )/camera.zoom
                );

              renderObjects();

            }

            function up(){

              window.removeEventListener(
                "pointermove",
                move
              );

              window.removeEventListener(
                "pointerup",
                up
              );

              save();

            }

            window.addEventListener(
              "pointermove",
              move
            );

            window.addEventListener(
              "pointerup",
              up
            );

          },
          {
            passive:false
          }
        );

        el.appendChild(
          handle
        );

      }

      layer.appendChild(
        el
      );

    }
  );

}

  if(!note){

    strokes:[],

    elements:[]

  });

  currentPage=
    note.pages.length-1;

  save();

  renderNoteEditor();

}

function previousPage(){

  if(currentPage<=0){
    return;

  currentPage--;

  save();

  renderNoteEditor();

}

function nextPage(){

  const note =
    getNote(selectedNoteId);

  if(!note){
    return;
  }

  if(
    currentPage<
    note.pages.length-1
  ){

    currentPage++;

  }else{

    note.pages.push({

      strokes:[],

      elements:[]

    });

    currentPage=
      note.pages.length-1;

  }

  save();

  renderNoteEditor();

}

        class="card">

        <div class="cardIcon">
          🚪
        </div>

        <div class="cardTitle">
          ログアウト
        </div>

        <div class="cardSub">
          この端末のログイン画面へ
        </div>

      </button>

    </div>
    `;

  page.appendChild(
    inner
  );

  main.appendChild(
    page
  );


  document
    .getElementById(
      "exportButton"
    )
    .addEventListener(
      "click",
      exportData
    );


  document
    .getElementById(
      "importButton"
    )
    .addEventListener(
      "click",
      importData
    );


  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      ()=>{
        flushStudyTime();

        document
          .getElementById(
            "app"
          )
          .style.display="none";

        document
          .getElementById(
            "loginScreen"
          )
          .style.display="flex";
      }
    );

}


/* =========================================================
   EXPORT / IMPORT
========================================================= */

function exportData(){

  flushStudyTime();

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href=url;

  a.download=
    "destination-note-backup.json";

  a.click();

  URL.revokeObjectURL(url);

}

function importData(){

  const input =
    document.createElement(
      "input"
    );

  input.type="file";

  input.accept=
    ".json,application/json";

  input.onchange =
    event=>{

      const file =
        event.target.files[0];

      if(!file){
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        ()=>{
          try{

            const imported =
              JSON.parse(
                reader.result
              );

            if(
              !imported ||
              !Array.isArray(
                imported.folders
              ) ||
              !Array.isArray(
                imported.notes
              )
            ){

              throw new Error(
                "invalid"
              );

            }

            data=imported;

            normalizeData();

            save();

            selectedFolderId=
              "root";

            currentFolderId=
              "root";

            selectedNoteId=null;

            expandedFolders=
              new Set(["root"]);

            renderTree();

            openFolder(
              "root"
            );

            alert(
              "復元しました！"
            );

          }catch(error){

            alert(
              "バックアップを読み込めませんでした。"
            );

          }

        };

      reader.readAsText(
        file
      );

    };

  input.click();

}


/* =========================================================
   UTIL
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Destination Note</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;
  color:#111;
}

body{
  background:
    radial-gradient(
      circle at 15% 5%,
      rgba(255,255,255,.95),
      transparent 32%
    ),
    radial-gradient(
      circle at 100% 20%,
      rgba(205,225,255,.7),
      transparent 38%
    ),
    linear-gradient(
      135deg,
      #edf4fc,
      #e5ebf5
    );
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   GLASS
========================= */

.glass{
  background:rgba(255,255,255,.54);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:
    0 18px 50px rgba(30,55,90,.12),
    inset 0 1px 0 rgba(255,255,255,.85);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-card{
  width:min(430px,100%);
  padding:34px;
  border-radius:32px;
}

.login-logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:-2px;
}

.login-sub{
  color:#707986;
  margin-top:5px;
  margin-bottom:25px;
}

.login-input{
  width:100%;
  padding:15px 17px;
  margin:6px 0;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.8);
  background:rgba(255,255,255,.7);
  outline:none;
}

.login-input:focus{
  box-shadow:0 0 0 4px rgba(60,120,255,.12);
}

.login-button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:17px;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#111,#3b3b3b);
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100%;
  display:none;
}

#app.show{
  display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:290px;
  height:100%;
  padding:14px;
  flex:none;
  z-index:50;
}

.sidebar-inner{
  height:100%;
  border-radius:28px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.home-button{
  margin:12px;
  padding:14px;
  border-radius:23px;
  cursor:pointer;
  transition:.18s;
}

.home-button:hover{
  background:rgba(255,255,255,.4);
}

.home-button:active{
  transform:scale(.97);
}

.brand{
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand-user{
  color:#737d89;
  font-size:13px;
  margin-top:3px;
}

.side-actions{
  display:flex;
  gap:7px;
  padding:0 12px 10px;
}

.side-action{
  flex:1;
  border:0;
  padding:10px 5px;
  border-radius:14px;
  background:rgba(255,255,255,.55);
}

.tree{
  flex:1;
  overflow:auto;
  padding:5px 9px;
}

.tree-row{
  display:flex;
  align-items:center;
  min-height:40px;
  margin:2px 0;
  padding:5px 7px;
  border-radius:13px;
  cursor:pointer;
  user-select:none;
}

.tree-row:hover{
  background:rgba(255,255,255,.5);
}

.tree-row.selected{
  background:rgba(255,255,255,.78);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    0 5px 15px rgba(0,0,0,.04);
}

.tree-arrow{
  width:23px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777f89;
}

.tree-icon{
  width:27px;
  text-align:center;
}

.tree-name{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
}

.side-bottom{
  padding:12px;
}

.study-mini{
  padding:14px;
  border-radius:18px;
  background:rgba(255,255,255,.42);
}

.study-mini-label{
  font-size:11px;
  color:#747e89;
}

.study-mini-time{
  font-size:20px;
  font-weight:900;
  margin-top:3px;
}

/* =========================
   MAIN
========================= */

.main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:72px;
  padding:12px 15px;
}

.topbar-inner{
  width:100%;
  height:100%;
  border-radius:23px;
  display:flex;
  align-items:center;
  padding:7px 10px;
}

.menu-button{
  display:none;
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.65);
}

.page-title{
  flex:1;
  font-size:20px;
  font-weight:850;
  padding-left:8px;
}

.top-button{
  border:0;
  padding:10px 14px;
  border-radius:14px;
  background:rgba(255,255,255,.58);
}

/* =========================
   CONTENT
========================= */

.content{
  flex:1;
  overflow:auto;
  padding:0 16px 25px;
}

.content::-webkit-scrollbar{
  width:6px;
}

.content::-webkit-scrollbar-thumb{
  background:rgba(0,0,0,.12);
  border-radius:99px;
}

/* =========================
   HOME
========================= */

.home{
  max-width:1250px;
  margin:auto;
}

.home-header{
  padding:16px 5px;
}

.home-title{
  font-size:38px;
  font-weight:900;
  letter-spacing:-1.8px;
}

.home-date{
  color:#737d89;
  margin-top:4px;
}

.stats{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.stat{
  min-height:100px;
  padding:18px 20px;
  border-radius:25px;
  position:relative;
  overflow:hidden;
}

.stat-top{
  display:flex;
  align-items:center;
}

.stat-label{
  flex:1;
  color:#6d7682;
  font-size:13px;
}

.stat-value{
  font-size:22px;
  font-weight:900;
}

.progress{
  height:11px;
  margin-top:13px;
  border-radius:99px;
  overflow:hidden;
  background:rgba(0,0,0,.07);
}

.progress-bar{
  height:100%;
  width:0%;
  border-radius:99px;
  background:
    linear-gradient(
      90deg,
      #4e80ff,
      #75c7ff
    );
  transition:width .5s ease;
}

.stat-small{
  margin-top:6px;
  color:#7b8490;
  font-size:11px;
}

.rank-card{
  margin-top:15px;
  padding:20px;
  border-radius:25px;
  display:flex;
  align-items:center;
  gap:15px;
}

.rank-icon{
  width:56px;
  height:56px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.65);
  font-size:28px;
}

.rank-name{
  font-size:24px;
  font-weight:900;
}

.rank-sub{
  color:#747d89;
  font-size:12px;
  margin-top:3px;
}

/* =========================
   NEXT EVENT
========================= */

.next-event{
  margin-top:15px;
  padding:21px;
  border-radius:27px;
}

.next-label{
  color:#747d89;
  font-size:12px;
}

.next-name{
  font-size:26px;
  font-weight:900;
  margin-top:5px;
}

.next-days{
  font-size:45px;
  font-weight:950;
  letter-spacing:-2px;
  margin-top:2px;
}

.next-days span{
  font-size:17px;
  letter-spacing:0;
}

.next-date{
  color:#747d89;
  font-size:13px;
}

/* =========================
   CALENDAR
========================= */

.calendar-card{
  margin-top:15px;
  padding:20px;
  border-radius:27px;
}

.calendar-header{
  display:flex;
  align-items:center;
  margin-bottom:15px;
}

.calendar-title{
  flex:1;
  font-size:21px;
  font-weight:900;
}

.month-button{
  width:38px;
  height:38px;
  border:0;
  border-radius:13px;
  background:rgba(255,255,255,.6);
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.weekday{
  text-align:center;
  color:#7c8590;
  font-size:11px;
  padding:4px;
}

.day{
  min-height:72px;
  padding:7px;
  border-radius:14px;
  background:rgba(255,255,255,.25);
  cursor:pointer;
  overflow:hidden;
}

.day:hover{
  background:rgba(255,255,255,.58);
}

.day.other{
  opacity:.3;
}

.day.today{
  box-shadow:
    inset 0 0 0 2px
    rgba(65,120,255,.55);
}

.day-number{
  font-size:12px;
  font-weight:800;
}

.day-study{
  font-size:9px;
  color:#5375ac;
  margin-top:4px;
}

.event{
  margin-top:4px;
  padding:2px 5px;
  border-radius:6px;
  background:rgba(70,120,255,.14);
  color:#4168a9;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.add-event-button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:16px;
  background:rgba(255,255,255,.6);
  font-weight:800;
}

/* =========================
   FOLDER
========================= */

.folder-view{
  max-width:1200px;
  margin:auto;
}

.folder-header{
  display:flex;
  align-items:center;
  gap:13px;
  padding:16px 4px;
}

.folder-icon{
  width:57px;
  height:57px;
  border-radius:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(255,255,255,.6);
  font-size:28px;
}

.folder-title{
  font-size:29px;
  font-weight:900;
}

.folder-actions{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.action{
  border:0;
  padding:11px 14px;
  border-radius:14px;
  background:rgba(255,255,255,.6);
}

.delete-action{
  background:rgba(255,80,80,.12);
  color:#c33;
}

.item-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));
  gap:14px;
}

.item{
  min-height:135px;
  padding:18px;
  border-radius:23px;
  cursor:pointer;
  transition:.18s;
  position:relative;
}

.item:hover{
  transform:translateY(-2px);
}

.item-icon{
  font-size:32px;
}

.item-name{
  margin-top:12px;
  font-weight:800;
}

.item-delete{
  position:absolute;
  right:10px;
  top:10px;
  border:0;
  width:32px;
  height:32px;
  border-radius:10px;
  background:rgba(255,80,80,.12);
  color:#c33;
}

/* =========================
   NOTE EDITOR
========================= */

.note-screen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  background:#f4f6f9;
}

.note-toolbar{
  min-height:64px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px;
  overflow-x:auto;
  background:rgba(255,255,255,.78);
  border-bottom:1px solid rgba(0,0,0,.08);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  flex:none;
}

.note-tool{
  flex:none;
  min-width:42px;
  height:42px;
  padding:0 11px;
  border:0;
  border-radius:13px;
  background:#e9edf2;
  font-weight:700;
}

.note-tool:active{
  transform:scale(.94);
}

.note-tool.active{
  background:#111;
  color:white;
}

.history-button{
  font-size:22px;
  font-weight:500;
}

.history-button:disabled{
  opacity:.3;
  cursor:default;
}

.note-separator{
  width:1px;
  height:30px;
  background:rgba(0,0,0,.1);
  flex:none;
}

.color-input{
  width:42px;
  height:42px;
  border:0;
  padding:3px;
  border-radius:13px;
  background:#e9edf2;
  flex:none;
}

.size-input{
  width:110px;
  flex:none;
}

/* =========================
   NOTE BOARD
========================= */

.note-board-wrap{
  flex:1;
  position:relative;
  overflow:hidden;

  /*
    ブラウザ側のダブルタップズーム等を
    キャンバス内では使わず、
    Pointer Events側で操作する。
    
    連打そのものは禁止していない。
  */
  touch-action:none;

  -webkit-user-select:none;
  user-select:none;

  background:
    radial-gradient(
      circle,
      rgba(0,0,0,.07) 1px,
      transparent 1px
    );
  background-size:25px 25px;
}

.note-board{
  position:absolute;
  left:0;
  top:0;
  width:5000px;
  height:3500px;
  background:white;
  transform-origin:0 0;
  box-shadow:0 20px 60px rgba(0,0,0,.08);
}

#drawCanvas{
  position:absolute;
  left:0;
  top:0;
  width:5000px;
  height:3500px;

  /*
    ここもブラウザのジェスチャーではなく
    JS側で処理
  */
  touch-action:none;

  -webkit-user-select:none;
  user-select:none;
}

.note-object{
  position:absolute;
  user-select:none;
  touch-action:none;
}

.text-object{
  min-width:70px;
  min-height:35px;
  padding:6px;
  white-space:pre-wrap;
}

.sticky-object{
  min-width:150px;
  min-height:110px;
  padding:14px;
  background:#fff3a6;
  border-radius:8px;
  box-shadow:0 7px 18px rgba(0,0,0,.15);
  white-space:pre-wrap;
}

.note-object.selected{
  outline:2px solid #4d84ff;
}

.note-resize{
  position:absolute;
  right:-7px;
  bottom:-7px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#4d84ff;
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(20,25,35,.22);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal{
  width:min(470px,100%);
  max-height:90vh;
  overflow:auto;
  padding:24px;
  border-radius:27px;
}

.modal-title{
  font-size:24px;
  font-weight:900;
  margin-bottom:17px;
}

.modal-label{
  display:block;
  color:#6e7783;
  font-size:12px;
  margin:10px 0 5px;
}

.modal-input,
.modal-select{
  width:100%;
  padding:13px;
  border:1px solid rgba(0,0,0,.08);
  border-radius:14px;
  background:rgba(255,255,255,.72);
  outline:none;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.modal-button{
  flex:1;
  padding:13px;
  border:0;
  border-radius:15px;
  background:rgba(255,255,255,.7);
}

.modal-button.primary{
  background:#111;
  color:white;
}

.event-list{
  margin-top:20px;
}

.event-list-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border-radius:13px;
  background:rgba(255,255,255,.45);
  margin-top:6px;
}

.event-list-name{
  flex:1;
}

.delete-event{
  border:0;
  border-radius:10px;
  padding:6px 9px;
  background:rgba(255,80,80,.12);
  color:#c33;
}

/* =========================
   SETTINGS
========================= */

.settings{
  max-width:900px;
  margin:auto;
}

.settings-title{
  font-size:34px;
  font-weight:900;
  padding:20px 5px;
}

.settings-card{
  padding:20px;
  border-radius:25px;
  margin-bottom:14px;
}

.settings-card h3{
  margin:0 0 6px;
}

.settings-card p{
  color:#737d89;
  font-size:13px;
}

.settings-button{
  border:0;
  padding:12px 15px;
  border-radius:14px;
  background:rgba(255,255,255,.65);
  margin-right:6px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:-320px;
    top:0;
    bottom:0;
    transition:.25s ease;
  }

  .sidebar.open{
    left:0;
  }

  .menu-button{
    display:block;
  }

  .topbar{
    height:67px;
  }

  .content{
    padding-left:11px;
    padding-right:11px;
  }

  .home-title{
    font-size:30px;
  }

  .day{
    min-height:60px;
  }

  .calendar-card{
    padding:12px;
  }

  .folder-actions{
    display:none;
  }

  .note-toolbar{
    min-height:58px;
    padding:6px;
  }

  .note-tool{
    min-width:40px;
    height:40px;
  }

}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

  <div class="login-card glass">

    <div class="login-logo">
      📚 Destination Note
    </div>

    <div class="login-sub">
      自分だけの勉強ノート
    </div>

    <input
      id="loginName"
      class="login-input"
      placeholder="名前"
      autocomplete="username"
    >

    <input
      id="loginPassword"
      class="login-input"
      type="password"
      placeholder="パスワード"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      class="login-button"
    >
      ログイン / はじめる
    </button>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

  <aside class="sidebar">

    <div class="sidebar-inner glass">

      <div
        id="homeButton"
        class="home-button"
      >

        <div class="brand">
          📚 Destination Note
        </div>

        <div
          id="brandUser"
          class="brand-user"
        >
          大神
        </div>

      </div>


      <div class="side-actions">

        <button
          id="newFolderButton"
          class="side-action"
        >
          📁 フォルダ
        </button>

        <button
          id="newNoteButton"
          class="side-action"
        >
          📝 ノート
        </button>

      </div>


      <div
        id="tree"
        class="tree"
      ></div>


      <div class="side-bottom">

        <div class="study-mini">

          <div class="study-mini-label">
            今日の勉強時間
          </div>

          <div
            id="miniStudy"
            class="study-mini-time"
          >
            0時間 0分
          </div>

        </div>

      </div>

    </div>

  </aside>


  <main class="main">

    <div class="topbar">

      <div class="topbar-inner glass">

        <button
          id="menuButton"
          class="menu-button"
        >
          ☰
        </button>

        <div
          id="pageTitle"
          class="page-title"
        >
          ホーム
        </div>

        <button
          id="settingsButton"
          class="top-button"
        >
          ⚙️
        </button>

      </div>

    </div>


    <div
      id="content"
      class="content"
    ></div>

  </main>

</div>


<!-- =========================
     MODAL
========================= -->

<div
  id="modalBg"
  class="modal-bg hidden"
>
  <div
    id="modal"
    class="modal glass"
  ></div>
</div>


<!-- =========================
     NOTE SCREEN
========================= -->

<div
  id="noteScreen"
  class="note-screen hidden"
>

  <div class="note-toolbar">

    <button
      id="noteBack"
      class="note-tool"
      title="ホームへ戻る"
    >
      ←
    </button>


    <button
      id="undoButton"
      class="note-tool history-button"
      title="戻る"
    >
      ↶
    </button>


    <button
      id="redoButton"
      class="note-tool history-button"
      title="進む"
    >
      ↷
    </button>


    <div class="note-separator"></div>


    <button
      class="note-tool active"
      data-tool="pen"
    >
      ✏️
    </button>

    <button
      class="note-tool"
      data-tool="highlighter"
    >
      🖍️
    </button>

    <button
      class="note-tool"
      data-tool="eraser"
    >
      🧽
    </button>

<script>

/* =========================================================
   DATA
========================================================= */

const STORAGE_KEY = "destinationNote_v1";

const defaultData = {

  name:"",
  password:"",

  totalSeconds:0,

  studyLog:{},

  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],

  notes:[],

  events:[],

  settings:{
    dark:false
  }

};


let data = loadData();

let currentView = "home";

let selectedFolderId = "root";

let currentFolderId = "root";

let currentNoteId = null;

let currentCalendar = new Date();

let expandedFolders = new Set(["root"]);


/* =========================================================
   LOAD / SAVE
========================================================= */

function loadData(){

  try{

    const raw =
      localStorage.getItem(STORAGE_KEY);

    if(!raw){
      return structuredClone(defaultData);
    }

    const d = JSON.parse(raw);

    if(!d.folders){
      d.folders =
        structuredClone(defaultData.folders);
    }

    if(!d.notes){
      d.notes=[];
    }

    if(!d.events){
      d.events=[];
    }

    if(!d.studyLog){
      d.studyLog={};
    }

    if(typeof d.totalSeconds !== "number"){
      d.totalSeconds=0;
    }

    for(const note of d.notes){

      if(!note.id){
        note.id =
          "note_" +
          Date.now() +
          Math.random();
      }

      if(!note.folderId){
        note.folderId="root";
      }

      if(!note.title){
        note.title =
          note.name ||
          "無題のノート";
      }

      if(!Array.isArray(note.pages)){
        note.pages=[
          {
            strokes:[],
            elements:[]
          }
        ];
      }

      if(
        typeof note.pageIndex!=="number" ||
        note.pageIndex<0
      ){
        note.pageIndex=0;
      }

      for(const page of note.pages){

        if(!Array.isArray(page.strokes)){
          page.strokes=[];
        }

        if(!Array.isArray(page.elements)){
          page.elements=[];
        }

      }

      if(note.pageIndex>=note.pages.length){
        note.pageIndex=note.pages.length-1;
      }

    }

    return d;

  }catch(e){

    console.error(e);

    return structuredClone(defaultData);

  }

}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   HELPERS
========================================================= */

function uid(prefix="id"){

  return prefix +
    "_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);

}


function todayKey(){

  const d=new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}


function formatTime(sec){

  sec=Math.max(0,Math.floor(sec));

  const h=Math.floor(sec/3600);

  const m=Math.floor(
    (sec%3600)/60
  );

  return `${h}時間 ${m}分`;

}


function monthKey(date){

  return [
    date.getFullYear(),
    String(date.getMonth()+1)
      .padStart(2,"0")
  ].join("-");

}


function formatDateJP(date){

  return `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`;

}


/* =========================================================
   STUDY TIMER
========================================================= */

let trackingStart =
  document.hidden ? null : Date.now();


function flushStudyTime(){

  if(trackingStart===null){
    return;
  }

  const now=Date.now();

  const diff=Math.floor(
    (now-trackingStart)/1000
  );

  if(diff<=0){
    return;
  }

  data.totalSeconds += diff;

  const key=todayKey();

  data.studyLog[key] =
    (data.studyLog[key] || 0) +
    diff;

  trackingStart=now;

  saveData();

  updateMiniStudy();

}


document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      flushStudyTime();

      trackingStart=null;

    }else{

      trackingStart=Date.now();

    }

  }
);


setInterval(()=>{

  if(!document.hidden){

    flushStudyTime();

  }

},15000);


/* =========================================================
   RANK
========================================================= */

function getRank(seconds){

  const h=seconds/3600;

  if(h<10)
    return ["🥉","ブロンズ"];

  if(h<30)
    return ["🥈","シルバー"];

  if(h<60)
    return ["🥇","ゴールド"];

  if(h<100)
    return ["🏆","プラチナ"];

  if(h<200)
    return ["💼","ビジネス"];

  if(h<500)
    return ["⭐","ファースト"];

  return ["🚄","グランクラス"];

}

  setTimeout(()=>{

    const b=

/* =========================================================
   CALENDAR
========================================================= */

function renderCalendar(){

  const grid=
    document.getElementById("calendar");

  if(!grid)return;

  const title=
    document.getElementById("calendarTitle");

  const y=
    currentCalendar.getFullYear();

  const m=
    currentCalendar.getMonth();

  title.textContent=
    `${y}年${m+1}月`;

  grid.innerHTML="";


  const weekdays=[
    "日","月","火","水","木","金","土"
  ];

  for(const w of weekdays){

    const el=
      document.createElement("div");

    el.className="weekday";

    el.textContent=w;

    grid.appendChild(el);

  }


  const first=
    new Date(y,m,1);

  const last=
    new Date(y,m+1,0);

  const start=first.getDay();

  const total=last.getDate();

  const prevLast=
    new Date(y,m,0).getDate();


  const cells=
    Math.ceil(
      (start+total)/7
    )*7;


  for(let i=0;i<cells;i++){

    const cell=
      document.createElement("div");

    cell.className="day";


    let day;
    let date;


    if(i<start){

      day=
        prevLast-start+i+1;

      date=
        new Date(y,m-1,day);

      cell.classList.add("other");

    }else if(i>=start+total){

      day=
        i-start-total+1;

      date=
        new Date(y,m+1,day);

      cell.classList.add("other");

    }else{

      day=
        i-start+1;

      date=
        new Date(y,m,day);

    }


    const key=
      dateKey(date);


    if(key===todayKey()){

      cell.classList.add("today");

    }


    cell.innerHTML=`

      <div class="day-number">
        ${day}
      </div>

      <div class="day-study">
        ${
          data.studyLog[key]
          ?
          formatShortTime(
            data.studyLog[key]
          )
          :
          ""
        }
      </div>

    `;


    const events=
      data.events.filter(
        e=>e.date===key
      );


    for(const event of events.slice(0,2)){

      const ev=
        document.createElement("div");

      ev.className="event";

      ev.textContent=
        event.title;

      cell.appendChild(ev);

    }


    if(events.length>2){

      const more=
        document.createElement("div");

      more.className="event";

      more.textContent=
        `＋${events.length-2}件`;

      cell.appendChild(more);

    }


    cell.onclick=()=>{

      openDayModal(key);

    };


    grid.appendChild(cell);

  }

}


function dateKey(date){

  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");

}


function formatShortTime(seconds){

  const h=Math.floor(seconds/3600);

  const m=Math.floor(
    (seconds%3600)/60
  );

  if(h>0){

    return `${h}h ${m}m`;

  }

  return `${m}分`;

}


/* =========================================================

];

function openDayModal(key){

  const events=
    data.events.filter(
      e=>e.date===key
    );


  const modal=
    document.getElementById("modal");

  const bg=
    document.getElementById("modalBg");


  const date=
    new Date(key+"T00:00:00");


  modal.innerHTML=`

    <div class="modal-title">
      ${formatDateJP(date)}
    </div>

    ${
      events.length
      ?
      `
      <div class="event-list">

        ${events.map(e=>`

          <div class="event-list-item">

            <div class="event-list-name">

              <b>
                ${escapeHtml(e.title)}
              </b>

              <div style="
                font-size:11px;
                color:#747d89;
                margin-top:3px;
              ">
                ${escapeHtml(e.type)}
              </div>

            </div>

            <button
              class="delete-event"
              data-id="${e.id}"
            >
              削除
            </button>

          </div>

        `).join("")}

      </div>
      `
      :
      `
      <p style="color:#747d89">
        この日の予定はありません。
      </p>
      `
    }


    <div class="modal-buttons">

      <button
        id="dayAdd"
        class="modal-button"
      >
        ＋ 予定を追加
      </button>

      <button
        id="dayClose"
        class="modal-button primary"
      >
        閉じる
      </button>

    </div>

  `;


  bg.classList.remove("hidden");


  modal
    .querySelectorAll(".delete-event")
    .forEach(btn=>{

      btn.onclick=()=>{

        data.events=
          data.events.filter(
            e=>e.id!==btn.dataset.id
          );

        saveData();

        openDayModal(key);

      };

    });


  document
    .getElementById("dayClose")
    .onclick=closeModal;


  document
    .getElementById("dayAdd")
    .onclick=()=>{

      openEventModal(key);

    };

}


function getNearestEvent(){

  const today=
    new Date(
      todayKey()+"T00:00:00"
    );

  const future=
    data.events
      .map(e=>{

        const d=
          new Date(
            e.date+"T00:00:00"
          );

        return {

          ...e,

          dateObj:d,

          days:Math.ceil(
            (d-today)/86400000
          ),

          date:
            `${d.getFullYear()}年`+
            `${d.getMonth()+1}月`+
            `${d.getDate()}日`

        };

      })
      .filter(e=>e.days>=0)
      .sort(
        (a,b)=>
          a.dateObj-b.dateObj
      );


  return future[0] || null;

}


/* =========================================================
   SIDEBAR TREE
========================================================= */

function renderTree(){

  const tree=
    document.getElementById("tree");

  tree.innerHTML="";

  const root=
    data.folders.find(
      f=>f.id==="root"
    );

  if(root){

    renderFolderTree(
      root,
      0,
      tree
    );

  }

}


function renderFolderTree(
  folder,
  depth,
  parentEl
){

  const children=
    data.folders.filter(
      f=>f.parent===folder.id
    );

  const notes=
    data.notes.filter(
      n=>n.folderId===folder.id
    );

  const hasChildren=
    children.length>0 ||
    notes.length>0;

  const row=
    document.createElement("div");

  row.className=
    "tree-row" +
    (
      selectedFolderId===folder.id
      ?
      " selected"
      :
      ""
    );

  row.style.paddingLeft=
    (7+depth*17)+"px";

  row.innerHTML=`

    <div class="tree-arrow">
      ${
        hasChildren
        ?
        (
          expandedFolders.has(folder.id)
          ?
          "⌄"
          :
          "›"
        )
        :
        ""
      }
    </div>

    <div class="tree-icon">
      ${folder.icon || "📁"}
    </div>

    <div class="tree-name">
      ${escapeHtml(folder.name)}
    </div>

  `;

  row.onclick=(e)=>{

    e.stopPropagation();

    selectedFolderId=
      folder.id;

    currentFolderId=
      folder.id;

    if(hasChildren){

      if(
        expandedFolders.has(
          folder.id
        )
      ){

        expandedFolders.delete(
          folder.id
        );

      }else{

        expandedFolders.add(
          folder.id
        );

      }

    }

    renderTree();

    openFolder(folder.id);

  };

  row.oncontextmenu=(e)=>{

    e.preventDefault();

    renameFolder(folder.id);

  };

  parentEl.appendChild(row);

  if(
    expandedFolders.has(folder.id)
  ){

    for(const child of children){

      renderFolderTree(
        child,
        depth+1,
        parentEl
      );

    }

    for(const note of notes){

      renderNoteTree(
        note,
        depth+1,
        parentEl
      );

    }

  }

}


function renderNoteTree(
  note,
  depth,
  parentEl
){

  const row=
    document.createElement("div");

  row.className="tree-row";

  row.style.paddingLeft=
    (7+depth*17)+"px";

  row.innerHTML=`

    <div class="tree-arrow"></div>

    <div class="tree-icon">
      📝
    </div>

    <div class="tree-name">
      ${escapeHtml(
        note.title ||
        note.name ||
        "無題のノート"
      )}
    </div>

  `;

  row.onclick=(e)=>{

    e.stopPropagation();

    openNote(note.id);

  };

  row.oncontextmenu=(e)=>{

    e.preventDefault();

    renameNote(note.id);

  };

  parentEl.appendChild(row);

}


/* =========================================================
   FOLDERS
========================================================= */

function createFolder(){

  const name=
    prompt(
      "フォルダ名を入力してね",
      "新しいフォルダ"
    );

  if(!name)return;

  const trimmed=name.trim();

  if(!trimmed)return;

  const parent=
    currentFolderId ||
    selectedFolderId ||
    "root";

  const folder={

    id:uid("folder"),

    name:trimmed,

    icon:"📁",

    parent,

    created:Date.now()

  };

  data.folders.push(folder);

  expandedFolders.add(parent);

  expandedFolders.add(folder.id);

  saveData();

  renderTree();

  openFolder(folder.id);

}


function renameFolder(id){

  const folder=
    data.folders.find(
      f=>f.id===id
    );

  if(!folder)return;

  if(id==="root"){

/* =========================
   DELETE FOLDER
========================= */

function deleteFolder(id){

  if(id==="root"){

    alert("マイノートは削除できません");

    return;

  }

  const folder=
    data.folders.find(
      f=>f.id===id
    );

  if(!folder)return;

  const foldersToDelete=[];

  function collect(folderId){

    foldersToDelete.push(folderId);

    const children=
      data.folders.filter(
        f=>f.parent===folderId
      );

    for(const child of children){

      collect(child.id);

    }

  }

  collect(id);

  const notesToDelete=
    data.notes.filter(
      n=>foldersToDelete.includes(
        n.folderId
      )
    );

  const message=
    `「${folder.name}」を削除しますか？\n\n`+
    `中にあるフォルダ：${foldersToDelete.length-1}個\n`+
    `中にあるノート：${notesToDelete.length}個\n\n`+
    `この操作は元に戻せません。`;

  if(!confirm(message))return;

  data.folders=
    data.folders.filter(
      f=>!foldersToDelete.includes(f.id)
    );

  data.notes=
    data.notes.filter(
      n=>!foldersToDelete.includes(n.folderId)
    );

  selectedFolderId="root";

  currentFolderId="root";

  currentNoteId=null;

  saveData();

  renderTree();

  openFolder("root");

}

/* =========================================================
   NOTE
========================================================= */

const canvas=
  document.getElementById(
    "drawCanvas"
  );

const ctx=
  canvas.getContext("2d");

const board=
  document.getElementById(
    "noteBoard"
  );

const boardWrap=
  document.getElementById(
    "noteBoardWrap"
  );

const objectLayer=
  document.getElementById(
    "objectLayer"
  );


let noteTool="pen";

let noteColor="#111111";

let noteSize=5;

let zoom=1;

let cameraX=0;

let cameraY=0;

let drawing=false;

let currentStroke=null;

let activePointerId=null;

let lastPoint=null;

let panStart=null;


/* =========================================================
   2本指ピンチズーム
========================================================= */

/*
  ここではTouch Eventsではなく
  Pointer Eventsだけを使用。

  そのためiPadでも、

  ・1本指 → 普通の操作
  ・2本指 → ピンチズーム
  ・連打 → そのまま使用
  ・ダブルタップ → 特別な処理なし

  という動作になる。
*/

const activePointers=new Map();

let pinchStartDistance=0;

let pinchStartZoom=1;

let pinchCenterX=0;

let pinchCenterY=0;

let pinchWorldX=0;

let pinchWorldY=0;


function pointerDistance(a,b){

  return Math.hypot(
    a.clientX-b.clientX,
    a.clientY-b.clientY
  );

}


function pointerCenter(a,b){

  return {

    x:
      (a.clientX+b.clientX)/2,

    y:
      (a.clientY+b.clientY)/2

  };

}


function beginPinch(){

  if(activePointers.size!==2){

    return;

  }

  const points=
    [...activePointers.values()];

  const a=points[0];

  const b=points[1];

  pinchStartDistance=
    pointerDistance(a,b);

  if(pinchStartDistance<=0){

    return;

  }

  pinchStartZoom=zoom;

  const center=
    pointerCenter(a,b);

  pinchCenterX=center.x;

  pinchCenterY=center.y;

  const rect=
    boardWrap.getBoundingClientRect();

  /*
    最初に指2本を置いた位置が、
    ズーム中に同じノート位置になるようにする。
  */

  pinchWorldX=
    (
      center.x-
      rect.left-
      cameraX
    )/zoom;

  pinchWorldY=
    (
      center.y-
      rect.top-
      cameraY
    )/zoom;

  /*
    1本指で始めていた描画を
    2本目が来た瞬間にキャンセル。
  */

  drawing=false;

  currentStroke=null;

  activePointerId=null;

  panStart=null;

}


function updatePinch(){

  if(activePointers.size<2){

    return;

  }

  const points=
    [...activePointers.values()];

  const a=points[0];

  const b=points[1];

  const distance=
    pointerDistance(a,b);

  if(
    pinchStartDistance<=0 ||
    distance<=0
  ){

    return;

  }

  const ratio=
    distance/pinchStartDistance;

  zoom=Math.max(
    .25,
    Math.min(
      4,
      pinchStartZoom*ratio
    )
  );

  const rect=
    boardWrap.getBoundingClientRect();

  /*
    ピンチの中心を固定。
    Freeformっぽい感覚になる。
  */

  cameraX=
    pinchCenterX-
    rect.left-
    pinchWorldX*zoom;

  cameraY=
    pinchCenterY-
    rect.top-
    pinchWorldY*zoom;

  updateCamera();

}


function endPinch(){

  if(activePointers.size<2){

    pinchStartDistance=0;

  }

}


/* =========================================================
   UNDO / REDO SYSTEM
========================================================= */

const historyMap=new Map();

const MAX_HISTORY=60;


function getHistoryKey(){

  if(!currentNoteId){

    return null;

  }

  const note=
    data.notes.find(
      n=>n.id===currentNoteId
    );

  if(!note)return null;

  return (
    currentNoteId+
    "_page_"+
    (note.pageIndex || 0)
  );

}


function getHistory(){

  const key=
    getHistoryKey();

  if(!key)return null;

  if(!historyMap.has(key)){

    historyMap.set(
      key,
      {
        undo:[],
        redo:[]
      }
    );

  }

  return historyMap.get(key);

}


function clonePage(page){

  return JSON.parse(
    JSON.stringify(
      page || {
        strokes:[],
        elements:[]
      }
    )
  );

}


function pushHistory(){

  const history=
    getHistory();

  const page=
    getCurrentPage();

  if(!history || !page)return;

  history.undo.push(
    clonePage(page)
  );

  if(
    history.undo.length>
    MAX_HISTORY
  ){

    history.undo.shift();

  }

  history.redo=[];

  updateHistoryButtons();

}


function undo(){

  const history=
    getHistory();

  const page=
    getCurrentPage();

  if(
    !history ||
    !page ||
    history.undo.length===0
  ){

    return;

  }

  history.redo.push(
    clonePage(page)
  );

  const previous=
    history.undo.pop();

  page.strokes=
    previous.strokes || [];

  page.elements=
    previous.elements || [];

  saveData();

  drawNote();

  renderObjects();

  updateHistoryButtons();

}


function redo(){

  const history=
    getHistory();

  const page=
    getCurrentPage();

  if(
    !history ||
    !page ||
    history.redo.length===0
  ){

    return;

  }

  history.undo.push(
    clonePage(page)
  );

  const next=
    history.redo.pop();

  page.strokes=
    next.strokes || [];

  page.elements=
    next.elements || [];

  saveData();

  drawNote();

  renderObjects();

  updateHistoryButtons();

}


function updateHistoryButtons(){

  const history=
    getHistory();

  const undoButton=
    document.getElementById(
      "undoButton"
    );

  const redoButton=
    document.getElementById(
      "redoButton"
    );

  if(!history){

    if(undoButton)
      undoButton.disabled=true;

    if(redoButton)
      redoButton.disabled=true;

    return;

  }

  if(undoButton){

    undoButton.disabled=
      history.undo.length===0;

  }

  if(redoButton){

    redoButton.disabled=
      history.redo.length===0;

  }

}


/* =========================================================
   NOTE OPEN
========================================================= */

function openNote(id){

  const note=
    data.notes.find(
      n=>n.id===id
    );

  if(!note)return;

  currentNoteId=id;

  currentView="note";

  if(!Array.isArray(note.pages)){

    note.pages=[
      {
        strokes:[],
        elements:[]
      }
    ];

  }

  if(
    typeof note.pageIndex!=="number"
  ){

    note.pageIndex=0;

  }

  if(note.pageIndex>=note.pages.length){

    note.pageIndex=
      note.pages.length-1;

  }

  document
    .getElementById("pageTitle")
    .textContent=
      note.title ||
      "無題のノート";

  document
    .getElementById("noteScreen")
    .classList.remove("hidden");

  zoom=1;

  cameraX=0;

  cameraY=0;

  drawNote();

  renderObjects();

  updateCamera();

  updateHistoryButtons();

  closeSidebarMobile();

}


function getCurrentPage(){

  const note=
    data.notes.find(
      n=>n.id===currentNoteId
    );

  if(!note)return null;

  if(!Array.isArray(note.pages)){

    note.pages=[];

  }

  if(!note.pages.length){

    note.pages.push({
      strokes:[],
      elements:[]
    });

  }

  if(
    note.pageIndex<0 ||
    note.pageIndex>=note.pages.length
  ){

    note.pageIndex=0;

  }

  return note.pages[
    note.pageIndex
  ];

}


/* =========================================================
   罫線
========================================================= */

function drawRuledLines(){

  const step=50;

  ctx.save();

  ctx.strokeStyle=
    "rgba(70,120,190,.14)";

  ctx.lineWidth=1;

  /*
    横方向の罫線
  */

  for(
    let y=step;
    y<canvas.height;
    y+=step
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y+0.5
    );

    ctx.lineTo(
      canvas.width,
      y+0.5
    );

    ctx.stroke();

  }

  ctx.restore();

}


/* =========================================================
   DRAW NOTE
========================================================= */

function drawNote(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  /*
    白いノートの上に
    大学ノート風の罫線を描く。
  */

  drawRuledLines();


  const page=
    getCurrentPage();

  if(!page)return;


  for(const stroke of page.strokes){

    if(
      !stroke.points ||
      stroke.points.length<2
    ){

      continue;

    }

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
      stroke.points[0].x,
      stroke.points[0].y
    );


    for(
      let i=1;
      i<stroke.points.length;
      i++
    ){

      ctx.lineTo(
        stroke.points[i].x,
        stroke.points[i].y
      );

    }


    ctx.lineCap="round";

    ctx.lineJoin="round";

    ctx.strokeStyle=
      stroke.color ||
      "#111111";

    ctx.lineWidth=
      stroke.width ||
      5;

    ctx.globalAlpha=
      stroke.opacity ?? 1;

    ctx.stroke();

    ctx.restore();

  }

}


/* =========================================================
   OBJECTS
========================================================= */

function renderObjects(){

  objectLayer.innerHTML="";

  const page=
    getCurrentPage();

  if(!page)return;

  for(const obj of page.elements){

    const el=
      document.createElement("div");

    el.className=
      "note-object " +
      (
        obj.type==="sticky"
        ?
        "sticky-object"
        :
        "text-object"
      );

    el.dataset.id=obj.id;

    el.style.left=
      (obj.x || 100)+"px";

    el.style.top=
      (obj.y || 100)+"px";

    el.style.width=
      (obj.width || 220)+"px";

    el.style.height=
      (obj.height || (
        obj.type==="sticky"
        ? 120
        : 50
      ))+"px";


    if(obj.type==="sticky"){

      el.textContent=
        obj.text || "";

    }else{

      el.textContent=
        obj.text || "";

      el.style.color=
        obj.color || "#111";

      el.style.fontSize=
        (obj.fontSize || 24)+"px";

    }


    el.onpointerdown=
      e=>{

        e.stopPropagation();

        selectObject(el);

      };


    makeObjectDraggable(
      el,
      obj
    );


    objectLayer.appendChild(el);

  }

}


function selectObject(el){

  document
    .querySelectorAll(".note-object")
    .forEach(
      x=>x.classList.remove("selected")
    );

  el.classList.add("selected");

}


/* =========================================================
   OBJECT DRAG
========================================================= */

function makeObjectDraggable(
  el,
  obj
){

  let dragging=false;

  let startX=0;

  let startY=0;

  let originalX=0;

  let originalY=0;


  el.addEventListener(
    "pointerdown",
    e=>{

      /*
        2本指ピンチ中は
        オブジェクトを動かさない。
      */

      if(activePointers.size>=2){

        return;

      }

      if(noteTool!=="hand"){

        return;

      }

      e.stopPropagation();

      dragging=true;

      pushHistory();


      try{

        el.setPointerCapture(
          e.pointerId
        );

      }catch{}


      const p=
        screenToWorld(
          e.clientX,
          e.clientY
        );


      startX=p.x;

      startY=p.y;

      originalX=obj.x;

      originalY=obj.y;

    }
  );


  el.addEventListener(
    "pointermove",
    e=>{

      if(!dragging)return;

      if(activePointers.size>=2){

        dragging=false;

        return;

      }


      const p=
        screenToWorld(
          e.clientX,
          e.clientY
        );


      obj.x=
        originalX+
        p.x-startX;

      obj.y=
        originalY+
        p.y-startY;


      el.style.left=
        obj.x+"px";

      el.style.top=
        obj.y+"px";

    }
  );


  el.addEventListener(
    "pointerup",
    ()=>{

      if(!dragging)return;

      dragging=false;

      saveData();

    }
  );


  el.addEventListener(
    "pointercancel",
    ()=>{

      if(!dragging)return;

      dragging=false;

      saveData();

    }
  );

}


/* =========================================================
   DRAWING
========================================================= */

function screenToWorld(
  clientX,
  clientY
){

  const rect=
    boardWrap.getBoundingClientRect();

  return {

    x:
      (
        clientX-
        rect.left-
        cameraX
      )/zoom,

    y:
      (
        clientY-
        rect.top-
        cameraY
      )/zoom

  };

}


function startDrawing(e){

  /*
    2本指以上なら
    絶対に描画しない。
  */

  if(
    e.pointerType==="touch" &&
    activePointers.size>=2
  ){

    return;

  }


  if(noteTool==="hand"){

    panStart={
      x:e.clientX,
      y:e.clientY,
      cameraX,
      cameraY
    };

    return;

  }


  if(
    noteTool==="text" ||
    noteTool==="sticky"
  ){

    const p=
      screenToWorld(
        e.clientX,
        e.clientY
      );

    createObject(
      noteTool,
      p
    );

    return;

  }


  if(
    noteTool!=="pen" &&
    noteTool!=="highlighter" &&
    noteTool!=="eraser"
  ){

    return;

  }


  const p=
    screenToWorld(
      e.clientX,
      e.clientY
    );


  drawing=true;

  activePointerId=
    e.pointerId;

  lastPoint=p;


  if(noteTool==="eraser"){

    pushHistory();

    eraseAt(p);

    return;

  }


  const page=
    getCurrentPage();

  if(!page)return;


  pushHistory();


  currentStroke={

    id:uid("stroke"),

    color:noteColor,

    width:
      noteTool==="highlighter"
      ?
      noteSize*4
      :
      noteSize,

    opacity:
      noteTool==="highlighter"
      ?
      .27
      :
      1,

    points:[p]

  };


  page.strokes.push(
    currentStroke
  );


  drawNote();

}


function moveDrawing(e){

  /*
    2本指なら描画処理を完全停止。
  */

  if(
    e.pointerType==="touch" &&
    activePointers.size>=2
  ){

    return;

  }


  if(noteTool==="hand"){

    if(!panStart)return;

    cameraX=
      panStart.cameraX+
      e.clientX-
      panStart.x;

    cameraY=
      panStart.cameraY+
      e.clientY-
      panStart.y;

    updateCamera();

    return;

  }


  if(!drawing)return;


  if(
    activePointerId!==null &&
    e.pointerId!==activePointerId
  ){

    return;

  }


  const p=
    screenToWorld(
      e.clientX,
      e.clientY
    );


  if(noteTool==="eraser"){

    eraseAt(p);

    return;

  }


  if(!currentStroke)return;


  const distance=
    Math.hypot(
      p.x-lastPoint.x,
      p.y-lastPoint.y
    );


  if(distance<1.5)return;


  currentStroke.points.push(p);

  lastPoint=p;

  drawNote();

}


function endDrawing(){

  if(
    drawing &&
    currentStroke &&
    currentStroke.points.length===1
  ){

    currentStroke.points.push({
      x:currentStroke.points[0].x+0.1,
      y:currentStroke.points[0].y+0.1
    });

  }


  drawing=false;

  currentStroke=null;

  activePointerId=null;

  panStart=null;

  saveData();

  updateHistoryButtons();

}


/* =========================================================
   ERASER
========================================================= */

function eraseAt(point){

  const page=
    getCurrentPage();

  if(!page)return;


  const radius=
    Math.max(
      12,
      noteSize*2.5
    );


  page.strokes=
    page.strokes.filter(
      stroke=>{

        for(const p of stroke.points){

          if(
            Math.hypot(
              p.x-point.x,
              p.y-point.y
            )<=radius
          ){

            return false;

          }

        }

        return true;

      }
    );


  drawNote();

}


/* =========================================================
   OBJECT CREATION
========================================================= */

function createObject(
  type,
  point
){

  const page=
    getCurrentPage();

  if(!page)return;


  if(type==="text"){

    const text=
      prompt(
        "入力する文字",
        "テキスト"
      );


    if(!text)return;


    pushHistory();


    page.elements.push({

      id:uid("obj"),

      type:"text",

      x:point.x,

      y:point.y,

      width:250,

      height:60,

      text,

      color:noteColor,

      fontSize:Math.max(
        12,
        noteSize*4
      )

    });

  }


  if(type==="sticky"){

    const text=
      prompt(
        "付箋に書く内容",
        ""
      );


    if(text===null)return;


    pushHistory();


    page.elements.push({

      id:uid("obj"),

      type:"sticky",

      x:point.x,

      y:point.y,

      width:220,

      height:130,

      text

    });

  }


  saveData();

  renderObjects();

  updateHistoryButtons();

}

/* =========================================================
   NOTE POINTER EVENTS
========================================================= */

/*
  ここが今回の重要部分。

  1本指
  ↓
  普通の描画・操作

  2本指
  ↓
  どのツールでもピンチズーム

  3本以上
  ↓
  描画しない

  ダブルタップ
  ↓
  特別な処理なし
*/


boardWrap.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();


    /*
      タッチだけactivePointersで管理。
    */

    if(e.pointerType==="touch"){

      activePointers.set(
        e.pointerId,
        {
          clientX:e.clientX,
          clientY:e.clientY
        }
      );


      try{

        boardWrap.setPointerCapture(
          e.pointerId
        );

      }catch{}


      /*
        2本目が来た瞬間
        ピンチ開始。
      */

      if(activePointers.size===2){

        beginPinch();

        return;

      }


      /*
        3本以上なら操作しない。
      */

      if(activePointers.size>1){

        return;

      }

    }else{

      /*
        Apple Pencilやマウスなど。
      */

      try{

        boardWrap.setPointerCapture(
          e.pointerId
        );

      }catch{}

    }


    startDrawing(e);

  },
  {passive:false}
);


boardWrap.addEventListener(
  "pointermove",
  e=>{

    e.preventDefault();


    if(e.pointerType==="touch"){

      if(activePointers.has(e.pointerId)){

        activePointers.set(
          e.pointerId,
          {
            clientX:e.clientX,
            clientY:e.clientY
          }
        );

      }


      if(activePointers.size>=2){

        updatePinch();

        return;

      }

    }


    moveDrawing(e);

  },
  {passive:false}
);


boardWrap.addEventListener(
  "pointerup",
  e=>{

    e.preventDefault();


    if(e.pointerType==="touch"){

      activePointers.delete(
        e.pointerId
      );

      endPinch();

    }


    endDrawing();

  },
  {passive:false}
);


boardWrap.addEventListener(
  "pointercancel",
  e=>{

    if(e.pointerType==="touch"){

      activePointers.delete(
        e.pointerId
      );

      endPinch();

    }

    endDrawing();

  }
);

/* =========================================================

========================================================= */

function changeUserName(){

  const newName=
    prompt(
      "新しい名前を入力してね",
      data.name || ""
    );


  if(newName===null){

    return;

  }


  const trimmed=
    newName.trim();


  if(!trimmed){

    alert(
      "名前を空欄にはできません。"
    );

    return;

  }


  data.name=trimmed;

  saveData();


  document
    .getElementById("brandUser")
    .textContent=
      data.name;


  alert(
    "名前を変更しました！"
  );


  showSettings();

}


function exportData(){

  flushStudyTime();

  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "destination-note-backup.json";

  a.click();

  URL.revokeObjectURL(url);

}


function importData(e){

  const file=
    e.target.files[0];

  if(!file)return;


  const reader=
    new FileReader();


  reader.onload=()=>{

    try{

      const imported=
        JSON.parse(
          reader.result
        );


      if(
        !imported.folders ||
        !imported.notes
      ){

        throw new Error();

      }


      data=imported;

      if(!data.studyLog)
        data.studyLog={};

      if(!data.events)
        data.events=[];

      saveData();

      alert(
        "復元しました！"
      );

      showHome();

    }catch{

      alert(
        "バックアップファイルを読み込めませんでした。"
      );

    }

  };


  reader.readAsText(file);

}


function logout(){

  flushStudyTime();

  document
    .getElementById("app")
    .classList.remove("show");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

}


function resetData(){

  if(
    !confirm(
      "本当に全部のデータを消しますか？\n\nノート、フォルダ、予定、勉強時間、名前、パスワードがすべて消えます。"
    )
  ){

    return;

  }


  localStorage.removeItem(
    STORAGE_KEY
  );


  /*
    念のため現在の画面もリセット
  */

  currentNoteId=null;

  currentFolderId="root";

  selectedFolderId="root";

  location.reload();

}

/* =========================================================

========================================================= */

function login(){

  const name=
    document
      .getElementById("loginName")
      .value.trim();


  const password=
    document
      .getElementById("loginPassword")
      .value;


  if(!name || !password){

    alert(
      "名前とパスワードを入力してね"
    );

    return;

  }


  if(
    data.name &&
    (
      data.name!==name ||
      data.password!==password
    )
  ){

    alert(
      "名前またはパスワードが違います。"
    );

    return;

  }


  if(!data.name){

    data.name=name;

    data.password=password;

    saveData();

  }


  document
    .getElementById("loginScreen")
    .classList.add("hidden");


  document
    .getElementById("app")
    .classList.add("show");


  document
    .getElementById("brandUser")
    .textContent=
      data.name;


  showHome();

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

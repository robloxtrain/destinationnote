<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Destination Note</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;
  color:#111;
}

body{
  background:
    radial-gradient(circle at 10% 10%,rgba(150,210,255,.45),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(255,180,245,.45),transparent 35%),
    radial-gradient(circle at 40% 100%,rgba(170,220,255,.4),transparent 40%),
    linear-gradient(135deg,#eaf5ff,#fff,#f9edff);
}

/* =========================
   LIQUID GLASS
========================= */

.glass{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.72),
      rgba(255,255,255,.43)
    );
  border:1px solid rgba(255,255,255,.75);
  box-shadow:
    0 20px 50px rgba(50,70,100,.10),
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 0 rgba(255,255,255,.25);
  backdrop-filter:blur(35px) saturate(180%);
  -webkit-backdrop-filter:blur(35px) saturate(180%);
}

button,
input{
  font:inherit;
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100%;
  display:flex;
  padding:
    max(12px,env(safe-area-inset-top))
    max(12px,env(safe-area-inset-right))
    max(12px,env(safe-area-inset-bottom))
    max(12px,env(safe-area-inset-left));
  gap:14px;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:300px;
  min-width:300px;
  height:100%;
  border-radius:28px;
  padding:18px 14px 14px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 8px 18px;
}

.brandIcon{
  width:44px;
  height:44px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.95),
      rgba(240,245,255,.55)
    );
  box-shadow:
    0 8px 20px rgba(80,100,130,.12),
    inset 0 1px 0 white;
}

.brandTitle{
  font-size:19px;
  font-weight:750;
}

.brandSub{
  font-size:12px;
  opacity:.55;
  margin-top:3px;
}

.tree{
  flex:1;
  overflow:auto;
  padding:4px 2px 12px;
  scrollbar-width:none;
}

.tree::-webkit-scrollbar{
  display:none;
}

.treeRow{
  width:100%;
  min-height:42px;
  display:flex;
  align-items:center;
  border-radius:15px;
  margin:2px 0;
  padding-right:8px;
  cursor:pointer;
  user-select:none;
  transition:.18s ease;
}

.treeRow:hover{
  background:rgba(255,255,255,.38);
}

.treeRow.selected{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.72),
      rgba(235,244,255,.50)
    );
  box-shadow:
    0 7px 18px rgba(80,100,130,.09),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.treeArrow{
  width:25px;
  min-width:25px;
  text-align:center;
  opacity:.7;
  font-size:13px;
}

.treeIcon{
  width:28px;
  min-width:28px;
  text-align:center;
  font-size:20px;
}

.treeName{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:15px;
}

.treeNote{
  padding-left:4px;
}

.treeNote .treeIcon{
  font-size:18px;
}

.sidebarBottom{
  display:flex;
  gap:8px;
  padding-top:8px;
}

.sideButton{
  flex:1;
  height:46px;
  border:0;
  border-radius:17px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.82),
      rgba(255,255,255,.45)
    );
  box-shadow:
    0 8px 20px rgba(70,90,120,.08),
    inset 0 1px 0 white;
  cursor:pointer;
}

.sideButton:active{
  transform:scale(.97);
}

.settingsButton{
  width:52px;
  min-width:52px;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-width:0;
  height:100%;
  border-radius:30px;
  overflow:hidden;
  position:relative;
}

.screen{
  width:100%;
  height:100%;
  overflow:auto;
}

.content{
  padding:34px;
  min-height:100%;
}

.header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:28px;
}

.backButton{
  width:46px;
  height:46px;
  border:0;
  border-radius:16px;
  background:rgba(255,255,255,.72);
  box-shadow:
    0 8px 20px rgba(60,80,110,.08),
    inset 0 1px 0 white;
  font-size:22px;
  cursor:pointer;
}

.headerIcon{
  font-size:30px;
}

.headerTitle{
  font-size:32px;
  font-weight:780;
}

.headerSub{
  margin-top:3px;
  font-size:13px;
  opacity:.48;
}

.sectionTitle{
  font-size:21px;
  font-weight:750;
  margin:24px 0 14px;
}

/* =========================
   CARDS
========================= */

.cardGrid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}

.card{
  min-height:135px;
  padding:24px;
  border-radius:25px;
  cursor:pointer;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.82),
      rgba(255,255,255,.48)
    );
  border:1px solid rgba(255,255,255,.8);
  box-shadow:
    0 18px 35px rgba(60,80,110,.08),
    inset 0 1px 0 white;
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-2px);
}

.card:active{
  transform:scale(.98);
}

.cardIcon{
  font-size:34px;
  margin-bottom:18px;
}

.cardTitle{
  font-size:17px;
  font-weight:700;
}

.cardSub{
  font-size:12px;
  opacity:.5;
  margin-top:7px;
}

/* =========================
   NOTE EDITOR
========================= */

.noteScreen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.noteTop{
  height:72px;
  min-height:72px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,.65);
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.7),
      rgba(255,255,255,.38)
    );
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  z-index:50;
}

.toolButton{
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.55);
  box-shadow:
    0 5px 14px rgba(50,70,100,.08),
    inset 0 1px 0 white;
  cursor:pointer;
  font-size:19px;
  flex:none;
}

.toolButton.active{
  background:
    linear-gradient(
      135deg,
      rgba(110,170,255,.35),
      rgba(190,130,255,.25)
    );
  box-shadow:
    0 6px 18px rgba(80,130,220,.18),
    inset 0 1px 0 white;
}

.toolButton:active{
  transform:scale(.94);
}

.toolSeparator{
  width:1px;
  height:32px;
  background:rgba(0,0,0,.08);
  margin:0 3px;
}

.toolSlider{
  width:90px;
}

.pageInfo{
  font-size:13px;
  opacity:.55;
  margin-left:auto;
  white-space:nowrap;
}

.noteTitle{
  font-weight:700;
  max-width:180px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================
   CANVAS AREA
========================= */

.canvasViewport{
  position:relative;
  flex:1;
  overflow:hidden;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.9),transparent 35%),
    radial-gradient(circle at 80% 70%,rgba(230,220,255,.65),transparent 40%),
    #f9fbff;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.canvasViewport.grid{
  background-color:#fbfcff;
  background-image:
    linear-gradient(
      rgba(100,130,170,.08) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(100,130,170,.08) 1px,
      transparent 1px
    );
  background-size:40px 40px;
}

.world{
  position:absolute;
  left:0;
  top:0;
  width:10000px;
  height:7000px;
  transform-origin:0 0;
}

#drawCanvas{
  position:absolute;
  left:0;
  top:0;
  width:10000px;
  height:7000px;
  pointer-events:none;
}

#objectLayer{
  position:absolute;
  left:0;
  top:0;
  width:10000px;
  height:7000px;
  pointer-events:none;
}

/* =========================
   OBJECTS
========================= */

.noteObject{
  position:absolute;
  pointer-events:auto;
  user-select:none;
  -webkit-user-select:none;
  cursor:move;
}

.textObject{
  white-space:pre-wrap;
  min-width:80px;
  min-height:30px;
  padding:5px;
  font-weight:500;
}

.stickyObject{
  min-width:150px;
  min-height:110px;
  padding:15px;
  border-radius:7px;
  background:#fff49a;
  box-shadow:
    0 10px 25px rgba(80,70,30,.16);
  white-space:pre-wrap;
}

.objectSelected{
  outline:2px solid rgba(50,130,255,.6);
  outline-offset:4px;
}

.resizeHandle{
  position:absolute;
  right:-8px;
  bottom:-8px;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#fff;
  border:2px solid #4994ff;
  cursor:nwse-resize;
}

.editText{
  width:100%;
  height:100%;
  min-height:40px;
  border:0;
  outline:0;
  background:transparent;
  resize:none;
  font:inherit;
}

/* =========================
   BOTTOM ZOOM
========================= */

.zoomControl{
  position:absolute;
  right:18px;
  bottom:18px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px;
  border-radius:18px;
  background:
    rgba(255,255,255,.68);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:
    0 12px 30px rgba(60,80,110,.12),
    inset 0 1px 0 white;
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  z-index:30;
}

.zoomButton{
  width:38px;
  height:38px;
  border:0;
  border-radius:13px;
  background:rgba(255,255,255,.5);
  cursor:pointer;
  font-size:20px;
}

.zoomValue{
  min-width:52px;
  text-align:center;
  font-size:12px;
  opacity:.6;
}

/* =========================
   PAGE CONTROL
========================= */

.pageControl{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px;
  border-radius:18px;
  background:rgba(255,255,255,.68);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:
    0 12px 30px rgba(60,80,110,.12),
    inset 0 1px 0 white;
  backdrop-filter:blur(25px);
  z-index:30;
}

.pageButton{
  width:38px;
  height:38px;
  border:0;
  border-radius:13px;
  background:rgba(255,255,255,.5);
}

/* =========================
   MOBILE
========================= */

.mobileMenu{
  display:none;
  position:absolute;
  left:12px;
  top:12px;
  width:44px;
  height:44px;
  border:0;
  border-radius:15px;
  background:rgba(255,255,255,.72);
  z-index:100;
}

@media(max-width:800px){

  #app{
    padding:8px;
  }

  .sidebar{
    position:absolute;
    left:8px;
    top:8px;
    bottom:8px;
    height:auto;
    transform:translateX(-120%);
    transition:.25s ease;
    z-index:100;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    width:100%;
  }

  .mobileMenu{
    display:block;
  }

  .content{
    padding:25px 20px;
  }

  .headerTitle{
    font-size:26px;
  }

  .noteTop{
    padding-left:58px;
    overflow-x:auto;
  }

  .pageInfo{
    margin-left:4px;
  }
}

/* =========================
   SETTINGS
========================= */

.settingBox{
  padding:22px;
  border-radius:22px;
  background:rgba(255,255,255,.55);
  margin-bottom:15px;
}

.settingButton{
  padding:13px 18px;
  border:0;
  border-radius:15px;
  background:rgba(255,255,255,.7);
  margin:4px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="app">

  <!-- SIDEBAR -->
  <aside class="sidebar glass" id="sidebar">

    <div class="brand">
      <div class="brandIcon">📚</div>
      <div>
        <div class="brandTitle">Destination Note</div>
        <div class="brandSub" id="userName">大神</div>
      </div>
    </div>

    <div class="tree" id="tree"></div>

    <div class="sidebarBottom">
      <button class="sideButton" id="addFolderBtn">＋ タブ</button>
      <button class="sideButton" id="addNoteBtn">＋ ノート</button>
      <button class="sideButton settingsButton" id="settingsBtn">⚙️</button>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main glass" id="main"></main>

</div>

<button class="mobileMenu" id="mobileMenu">☰</button>

<script>
/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "destinationNote_v1";

let data = {
  name:"大神",
  password:"",
  totalSeconds:0,
  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],
  notes:[],
  settings:{
    dark:false
  }
};

function uid(prefix="id"){
  return prefix + "_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2,8);
}

function save(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}

function load(){

  try{

    const raw =
      localStorage.getItem(STORAGE_KEY);

    if(raw){

      const old =
        JSON.parse(raw);

      data = {
        ...data,
        ...old
      };

    }

  }catch(e){

    console.error(e);

  }

  if(!Array.isArray(data.folders)){
    data.folders=[];
  }

  if(!Array.isArray(data.notes)){
    data.notes=[];
  }

  if(!data.folders.find(x=>x.id==="root")){

    data.folders.unshift({
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    });

  }

  /* 古いノートをなるべく維持 */

  data.notes.forEach(note=>{

    if(!note.id){
      note.id=uid("note");
    }

    if(!note.folderId){
      note.folderId="root";
    }

    if(!note.pages){

      note.pages=[
        {
          strokes:[],
          elements:[]
        }
      ];

    }

    note.pages.forEach(page=>{

      if(!Array.isArray(page.strokes)){
        page.strokes=[];
      }

      if(!Array.isArray(page.elements)){
        page.elements=[];
      }

    });

  });

  save();
}

load();

/* =========================================================
   STATE
========================================================= */

let currentFolderId="root";
let selectedFolderId="root";
let currentNoteId=null;

let expandedFolders =
  new Set(["root"]);

let currentPage=0;

let tool="pencil";

let color="#111111";
let brushSize=4;

let zoom=1;

let cameraX=0;
let cameraY=0;

let drawing=false;
let currentStroke=null;

let pointers=new Map();

let pinchStartDistance=null;
let pinchStartZoom=1;
let pinchStartCenter=null;
let pinchStartCamera=null;

let autosaveTimer=null;

/* =========================================================
   ELEMENTS
========================================================= */

const sidebar =
  document.getElementById("sidebar");

const tree =
  document.getElementById("tree");

const main =
  document.getElementById("main");

document
  .getElementById("userName")
  .textContent =
  data.name || "ユーザー";

/* =========================================================
   TREE
========================================================= */

function getFolder(id){
  return data.folders.find(x=>x.id===id);
}

function getNote(id){
  return data.notes.find(x=>x.id===id);
}

function childrenOf(folderId){

  return data.folders.filter(
    x=>x.parent===folderId
  );

}

function notesOf(folderId){

  return data.notes.filter(
    x=>x.folderId===folderId
  );

}

function renderTree(){

  tree.innerHTML="";

  renderFolderTree(
    getFolder("root"),
    0,
    tree
  );

}

function renderFolderTree(
  folder,
  depth,
  parent
){

  if(!folder) return;

  const hasChildren =
    childrenOf(folder.id).length>0 ||
    notesOf(folder.id).length>0;

  const row =
    document.createElement("div");

  row.className="treeRow";

  if(selectedFolderId===folder.id){
    row.classList.add("selected");
  }

  row.style.paddingLeft =
    (depth*20)+"px";

  const arrow =
    document.createElement("div");

  arrow.className="treeArrow";

  arrow.textContent =
    hasChildren
      ? (
          expandedFolders.has(folder.id)
            ? "⌄"
            : "›"
        )
      : "";

  const icon =
    document.createElement("div");

  icon.className="treeIcon";

  icon.textContent =
    folder.icon || "📁";

  const name =
    document.createElement("div");

  name.className="treeName";

  name.textContent =
    folder.name;

  row.appendChild(arrow);
  row.appendChild(icon);
  row.appendChild(name);

  /*
    ★重要
    三角だけではなく
    アイコン・文字・行全体をクリック可能
  */

  row.addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      selectedFolderId =
        folder.id;

      currentFolderId =
        folder.id;

      if(hasChildren){

        if(
          expandedFolders.has(
            folder.id
          )
        ){

          expandedFolders.delete(
            folder.id
          );

        }else{

          expandedFolders.add(
            folder.id
          );

        }

      }

      renderTree();

      openFolder(
        folder.id
      );

    }
  );

  row.addEventListener(
    "dblclick",
    e=>{

      e.stopPropagation();

      const n =
        prompt(
          "タブ名を変更",
          folder.name
        );

      if(
        n &&
        n.trim()
      ){

        folder.name=n.trim();

        save();
        renderTree();

        if(
          currentFolderId===folder.id
        ){
          openFolder(folder.id);
        }

      }

    }
  );

  parent.appendChild(row);

  if(
    expandedFolders.has(folder.id)
  ){

    childrenOf(folder.id)
      .forEach(child=>{

        renderFolderTree(
          child,
          depth+1,
          parent
        );

      });

    notesOf(folder.id)
      .forEach(note=>{

        renderNoteTree(
          note,
          depth+1,
          parent
        );

      });

  }

}

function renderNoteTree(
  note,
  depth,
  parent
){

  const row =
    document.createElement("div");

  row.className=
    "treeRow treeNote";

  if(currentNoteId===note.id){
    row.classList.add("selected");
  }

  row.style.paddingLeft =
    (depth*20)+"px";

  const blank =
    document.createElement("div");

  blank.className="treeArrow";

  const icon =
    document.createElement("div");

  icon.className="treeIcon";

  icon.textContent="📝";

  const name =
    document.createElement("div");

  name.className="treeName";

  name.textContent =
    note.name || "新しいノート";

  row.appendChild(blank);
  row.appendChild(icon);
  row.appendChild(name);

  row.addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      currentNoteId =
        note.id;

      currentFolderId =
        note.folderId;

      renderTree();

      openNote(
        note.id
      );

    }
  );

  parent.appendChild(row);
}

/* =========================================================
   FOLDER SCREEN
========================================================= */

function openFolder(id){

  const folder =
    getFolder(id);

  if(!folder) return;

  currentFolderId=id;
  selectedFolderId=id;
  currentNoteId=null;

  renderTree();

  const folders =
    childrenOf(id);

  const notes =
    notesOf(id);

  main.innerHTML=`
    <div class="screen">
      <div class="content">

        <div class="header">

          ${
            id!=="root"
            ? `
              <button
                class="backButton"
                id="backFolder"
              >←</button>
            `
            : ""
          }

          <div class="headerIcon">
            ${folder.icon || "📁"}
          </div>

          <div>
            <div class="headerTitle">
              ${escapeHTML(folder.name)}
            </div>

            <div class="headerSub">
              ${folders.length} タブ / ${notes.length} ノート
            </div>
          </div>

        </div>

        ${
          folders.length
          ? `
            <div class="sectionTitle">
              タブ
            </div>

            <div
              class="cardGrid"
              id="folderCards"
            ></div>
          `
          : ""
        }

        ${
          notes.length
          ? `
            <div class="sectionTitle">
              ノート
            </div>

            <div
              class="cardGrid"
              id="noteCards"
            ></div>
          `
          : ""
        }

        ${
          !folders.length && !notes.length
          ? `
            <div
              style="
                opacity:.45;
                padding:30px 5px;
              "
            >
              ＋ タブ または ＋ ノート
              から作成できます
            </div>
          `
          : ""
        }

      </div>
    </div>
  `;

  if(id!=="root"){

    document
      .getElementById("backFolder")
      ?.addEventListener(
        "click",
        ()=>{

          const parent =
            folder.parent || "root";

          openFolder(parent);

        }
      );

  }

  const folderCards =
    document.getElementById(
      "folderCards"
    );

  if(folderCards){

    folders.forEach(child=>{

      const card =
        createFolderCard(child);

      folderCards.appendChild(card);

    });

  }

  const noteCards =
    document.getElementById(
      "noteCards"
    );

  if(noteCards){

    notes.forEach(note=>{

      const card =
        createNoteCard(note);

      noteCards.appendChild(card);

    });

  }

}

function createFolderCard(folder){

  const card =
    document.createElement("div");

  card.className="card";

  const childCount =
    childrenOf(folder.id).length;

  const noteCount =
    notesOf(folder.id).length;

  card.innerHTML=`
    <div class="cardIcon">
      ${folder.icon || "📁"}
    </div>

    <div class="cardTitle">
      ${escapeHTML(folder.name)}
    </div>

    <div class="cardSub">
      ${childCount} タブ / ${noteCount} ノート
    </div>
  `;

  card.addEventListener(
    "click",
    ()=>{
      openFolder(folder.id);
    }
  );

  return card;
}

function createNoteCard(note){

  const card =
    document.createElement("div");

  card.className="card";

  card.innerHTML=`
    <div class="cardIcon">📝</div>

    <div class="cardTitle">
      ${escapeHTML(note.name || "新しいノート")}
    </div>

    <div class="cardSub">
      ${(note.pages?.length || 1)} ページ
    </div>
  `;

  card.addEventListener(
    "click",
    ()=>{
      openNote(note.id);
    }
  );

  return card;
}

/* =========================================================
   CREATE FOLDER
========================================================= */

function createFolder(){

  const name =
    prompt(
      "タブ名を入力",
      "新しいタブ"
    );

  if(
    !name ||
    !name.trim()
  ){
    return;
  }

  const parent =
    currentFolderId || "root";

  const folder={
    id:uid("folder"),
    name:name.trim(),
    icon:"📁",
    parent:parent,
    created:Date.now()
  };

  data.folders.push(folder);

  expandedFolders.add(parent);
  expandedFolders.add(folder.id);

  selectedFolderId=folder.id;
  currentFolderId=folder.id;

  save();

  renderTree();
  openFolder(folder.id);

}

/* =========================================================
   CREATE NOTE
========================================================= */

function createNote(){

  /*
    ★現在開いているタブの中に作る
    内側のタブでも同じ
  */

  const folderId =
    currentFolderId || "root";

  const name =
    prompt(
      "ノート名を入力",
      "新しいノート"
    );

  if(
    !name ||
    !name.trim()
  ){
    return;
  }

  const note={
    id:uid("note"),
    name:name.trim(),
    folderId:folderId,
    pages:[
      {
        strokes:[],
        elements:[]
      }
    ],
    created:Date.now()
  };

  data.notes.push(note);

  expandedFolders.add(folderId);

  currentNoteId=note.id;

  save();

  renderTree();
  openNote(note.id);

}

/* =========================================================
   NOTE EDITOR
========================================================= */

function setupNoteEditor(note){

  const viewport =
    document.getElementById(
      "canvasViewport"
    );

  const world =
    document.getElementById("world");

  const canvas =
    document.getElementById("drawCanvas");

  const ctx =
    canvas.getContext("2d");

  const objectLayer =
    document.getElementById(
      "objectLayer"
    );

  const sizeSlider =
    document.getElementById(
      "sizeSlider"
    );

  const colorPicker =
    document.getElementById(
      "colorPicker"
    );

  /* Canvas実サイズ */

  function resizeCanvas(){

    const rect =
      viewport.getBoundingClientRect();

    const dpr =
      Math.max(
        1,
        window.devicePixelRatio || 1
      );

    canvas.width =
      Math.floor(
        10000*dpr
      );

    canvas.height =
      Math.floor(
        7000*dpr
      );

    canvas.style.width="10000px";
    canvas.style.height="7000px";

    ctx.setTransform(
      dpr,0,0,dpr,0,0
    );

    redraw();

  }

  /*
    画面に巨大canvasを置くと重くなるので
    実際の描画は必要範囲だけ再描画する
    方式ではなく、
    ここでは軽いストローク数を前提に
    シンプルに描く。
  */

  function screenToWorld(e){

    const rect =
      viewport.getBoundingClientRect();

    return {
      x:
        (e.clientX-rect.left-cameraX)
        /zoom,

      y:
        (e.clientY-rect.top-cameraY)
        /zoom
    };

  }

  function applyTransform(){

    world.style.transform=
      `translate(${cameraX}px,${cameraY}px) scale(${zoom})`;

    document
      .getElementById("zoomValue")
      .textContent=
      Math.round(zoom*100)+"%";

  }

  function redraw(){

    ctx.clearRect(
      0,
      0,
      10000,
      7000
    );

    const page =
      note.pages[currentPage];

    if(!page) return;

    page.strokes.forEach(
      stroke=>{

        if(
          !stroke.points ||
          stroke.points.length<2
        ){
          return;
        }

        ctx.save();

        ctx.lineCap="round";
        ctx.lineJoin="round";

        ctx.beginPath();

        stroke.points.forEach(
          (p,i)=>{

            if(i===0){

              ctx.moveTo(
                p.x,
                p.y
              );

            }else{

              ctx.lineTo(
                p.x,
                p.y
              );

            }

          }
        );

        if(
          stroke.tool==="highlighter"
        ){

          ctx.globalAlpha=.25;

          ctx.strokeStyle =
            stroke.color;

          ctx.lineWidth =
            stroke.size*4;

        }else{

          ctx.globalAlpha=1;

          ctx.strokeStyle =
            stroke.color;

          ctx.lineWidth =
            stroke.size;

        }

        ctx.stroke();

        ctx.restore();

      }
    );

    if(currentStroke){

      const s =
        currentStroke;

      ctx.save();

      ctx.beginPath();

      s.points.forEach(
        (p,i)=>{

          if(i===0){
            ctx.moveTo(p.x,p.y);
          }else{
            ctx.lineTo(p.x,p.y);
          }

        }
      );

      ctx.lineCap="round";
      ctx.lineJoin="round";

      if(s.tool==="highlighter"){

        ctx.globalAlpha=.25;
        ctx.strokeStyle=s.color;
        ctx.lineWidth=s.size*4;

      }else{

        ctx.strokeStyle=s.color;
        ctx.lineWidth=s.size;

      }

      ctx.stroke();
      ctx.restore();

    }

  }

  function renderObjects(){

    objectLayer.innerHTML="";

    const page =
      note.pages[currentPage];

    if(!page) return;

    page.elements.forEach(
      obj=>{

        const el =
          document.createElement("div");

        el.className=
          "noteObject "+
          (
            obj.type==="sticky"
              ? "stickyObject"
              : "textObject"
          );

        el.dataset.id=obj.id;

        el.style.left=
          obj.x+"px";

        el.style.top=
          obj.y+"px";

        el.style.width=
          (obj.width || 180)+"px";

        el.style.height=
          (obj.height || 60)+"px";

        el.style.fontSize=
          (obj.fontSize || 24)+"px";

        el.style.color=
          obj.color || "#111";

        if(obj.type==="sticky"){

          el.textContent =
            obj.text || "";

        }else{

          el.textContent =
            obj.text || "";

        }

        el.addEventListener(
          "pointerdown",
          e=>{

            e.stopPropagation();

            if(tool==="object"){

              page.elements =
                page.elements.filter(
                  x=>x.id!==obj.id
                );

              saveSoon();
              renderObjects();

              return;
            }

            if(tool==="hand"){

              startObjectMove(
                e,
                obj,
                el
              );

            }

          }
        );

        objectLayer.appendChild(el);

      }
    );

  }

  /* =========================
     DRAW
  ========================= */

  function startDrawing(e){

    if(
      tool!=="pencil" &&
      tool!=="highlighter"
    ){
      return;
    }

    const p =
      screenToWorld(e);

    drawing=true;

    currentStroke={
      id:uid("stroke"),
      tool:tool,
      color:color,
      size:brushSize,
      points:[
        p
      ]
    };

    try{
      viewport.setPointerCapture(
        e.pointerId
      );
    }catch(_){}

    redraw();

  }

  function moveDrawing(e){

    if(!drawing || !currentStroke){
      return;
    }

    const p =
      screenToWorld(e);

    const pts =
      currentStroke.points;

    const last =
      pts[pts.length-1];

    /*
      指の動きをそのまま拾う
      不要な間引きをしない
    */

    pts.push({
      x:p.x,
      y:p.y
    });

    redraw();

  }

  function endDrawing(e){

    if(
      !drawing ||
      !currentStroke
    ){
      return;
    }

    drawing=false;

    const page =
      note.pages[currentPage];

    if(
      currentStroke.points.length===1
    ){

      currentStroke.points.push({
        ...currentStroke.points[0]
      });

    }

    page.strokes.push(
      currentStroke
    );

    currentStroke=null;

    redraw();
    saveSoon();

  }

  /* =========================
     ERASE
  ========================= */

  function eraseAt(e){

    const p =
      screenToWorld(e);

    const page =
      note.pages[currentPage];

    const radius =
      brushSize*3;

    page.strokes =
      page.strokes.filter(
        stroke=>{

          if(!stroke.points){
            return true;
          }

          return !stroke.points.some(
            pt=>{

              const dx =
                pt.x-p.x;

              const dy =
                pt.y-p.y;

              return Math.sqrt(
                dx*dx+dy*dy
              )<radius;

            }
          );

        }
      );

    redraw();
    saveSoon();

  }

  /* =========================
     PAN
  ========================= */

  let panning=false;

  let panStartX=0;
  let panStartY=0;
  let panCameraX=0;
  let panCameraY=0;

  function startPan(e){

    panning=true;

    panStartX=e.clientX;
    panStartY=e.clientY;

    panCameraX=cameraX;
    panCameraY=cameraY;

  }

  function movePan(e){

    if(!panning) return;

    cameraX =
      panCameraX +
      (e.clientX-panStartX);

    cameraY =
      panCameraY +
      (e.clientY-panStartY);

    applyTransform();

  }

  function endPan(){

    panning=false;

  }

  /* =========================
     PINCH ZOOM
  ========================= */

  function distance(a,b){

    return Math.hypot(
      a.clientX-b.clientX,
      a.clientY-b.clientY
    );

  }

  function center(a,b){

    return {
      x:(a.clientX+b.clientX)/2,
      y:(a.clientY+b.clientY)/2
    };

  }

  function beginPinch(){

    if(pointers.size!==2){
      return;
    }

    const arr =
      [...pointers.values()];

    pinchStartDistance =
      distance(
        arr[0],
        arr[1]
      );

    pinchStartZoom=zoom;

    pinchStartCenter =
      center(
        arr[0],
        arr[1]
      );

    pinchStartCamera={
      x:cameraX,
      y:cameraY
    };

  }

  function updatePinch(){

    if(
      pointers.size!==2 ||
      pinchStartDistance===null
    ){
      return;
    }

    const arr =
      [...pointers.values()];

    const d =
      distance(
        arr[0],
        arr[1]
      );

    let newZoom =
      pinchStartZoom *
      (d/pinchStartDistance);

    newZoom =
      Math.max(
        .25,
        Math.min(4,newZoom)
      );

    const c =
      center(
        arr[0],
        arr[1]
      );

    const worldX =
      (
        pinchStartCenter.x-
        pinchStartCamera.x
      )/pinchStartZoom;

    const worldY =
      (
        pinchStartCenter.y-
        pinchStartCamera.y
      )/pinchStartZoom;

    zoom=newZoom;

    cameraX =
      c.x-worldX*zoom;

    cameraY =
      c.y-worldY*zoom;

    applyTransform();

  }

  /* =========================
     POINTER EVENTS
  ========================= */

  viewport.addEventListener(
    "pointerdown",
    e=>{

      pointers.set(
        e.pointerId,
        e
      );

      if(pointers.size===2){

        drawing=false;
        currentStroke=null;
        panning=false;

        beginPinch();

        return;

      }

      if(tool==="pencil" ||
         tool==="highlighter"){

        startDrawing(e);

      }else if(tool==="pixel"){

        eraseAt(e);

        try{
          viewport.setPointerCapture(
            e.pointerId
          );
        }catch(_){}

      }else if(tool==="hand"){

        startPan(e);

      }else if(tool==="text"){

        const p =
          screenToWorld(e);

        createText(p);

      }else if(tool==="sticky"){

        const p =
          screenToWorld(e);

        createSticky(p);

      }

    }
  );

  viewport.addEventListener(
    "pointermove",
    e=>{

      pointers.set(
        e.pointerId,
        e
      );

      if(pointers.size===2){

        updatePinch();

        return;

      }

      if(tool==="pencil" ||
         tool==="highlighter"){

        moveDrawing(e);

      }else if(tool==="pixel"){

        if(
          e.buttons
        ){

          eraseAt(e);

        }

      }else if(tool==="hand"){

        movePan(e);

      }

    }
  );

  function pointerEnd(e){

    pointers.delete(
      e.pointerId
    );

    if(
      pointers.size<2
    ){

      pinchStartDistance=null;

    }

    if(tool==="pencil" ||
       tool==="highlighter"){

      endDrawing(e);

    }

    if(tool==="hand"){

      endPan();

    }

  }

  viewport.addEventListener(
    "pointerup",
    pointerEnd
  );

  viewport.addEventListener(
    "pointercancel",
    pointerEnd
  );

  /* =========================
     OBJECT MOVE
  ========================= */

  function startObjectMove(
    e,
    obj,
    el
  ){

    const start =
      screenToWorld(e);

    const ox=obj.x;
    const oy=obj.y;

    function move(ev){

      const p =
        screenToWorld(ev);

      obj.x =
        ox+(p.x-start.x);

      obj.y =
        oy+(p.y-start.y);

      el.style.left=
        obj.x+"px";

      el.style.top=
        obj.y+"px";

    }

    function up(){

      document.removeEventListener(
        "pointermove",
        move
      );

      document.removeEventListener(
        "pointerup",
        up
      );

      saveSoon();

    }

    document.addEventListener(
      "pointermove",
      move
    );

    document.addEventListener(
      "pointerup",
      up
    );

  }

  /* =========================
     TEXT
  ========================= */

  function createText(p){

    const text =
      prompt(
        "テキストを入力"
      );

    if(
      text===null ||
      text===""
    ){
      return;
    }

    const page =
      note.pages[currentPage];

    page.elements.push({

      id:uid("obj"),

      type:"text",

      x:p.x,
      y:p.y,

      width:260,
      height:70,

      text:text,

      color:color,

      fontSize:
        Math.max(
          12,
          brushSize*5
        )

    });

    renderObjects();
    saveSoon();

  }

  /* =========================
     STICKY
  ========================= */

  function createSticky(p){

    const text =
      prompt(
        "付箋の内容"
      );

    if(
      text===null
    ){
      return;
    }

    const page =
      note.pages[currentPage];

    page.elements.push({

      id:uid("obj"),

      type:"sticky",

      x:p.x,
      y:p.y,

      width:220,
      height:150,

      text:text,

      color:"#222",

      fontSize:
        Math.max(
          14,
          brushSize*4
        )

    });

    renderObjects();
    saveSoon();

  }

  /* =========================
     TOOL BUTTONS
  ========================= */

  document
    .querySelectorAll(
      "[data-tool]"
    )
    .forEach(btn=>{

      btn.addEventListener(
        "click",
        ()=>{

          tool =
            btn.dataset.tool;

          document
            .querySelectorAll(
              "[data-tool]"
            )
            .forEach(
              b=>b.classList.remove(
                "active"
              )
            );

          btn.classList.add(
            "active"
          );

        }
      );

    });

  /* 最初はペン */

  document
    .querySelector(
      '[data-tool="pencil"]'
    )
    ?.classList.add("active");

  colorPicker.addEventListener(
    "input",
    ()=>{
      color=
        colorPicker.value;
    }
  );

  sizeSlider.addEventListener(
    "input",
    ()=>{
      brushSize=
        Number(sizeSlider.value);
    }
  );

  /* =========================
     CLEAR
  ========================= */

  document
    .getElementById("clearBtn")
    .addEventListener(
      "click",
      ()=>{

        if(
          !confirm(
            "このページを全部消しますか？"
          )
        ){
          return;
        }

        note.pages[currentPage]={
          strokes:[],
          elements:[]
        };

        redraw();
        renderObjects();
        save();

      }
    );

  /* =========================
     ZOOM BUTTONS
  ========================= */

  document
    .getElementById("zoomIn")
    .addEventListener(
      "click",
      ()=>{

        zoom=
          Math.min(
            4,
            zoom*1.2
          );

        applyTransform();

      }
    );

  document
    .getElementById("zoomOut")
    .addEventListener(
      "click",
      ()=>{

        zoom=
          Math.max(
            .25,
            zoom/1.2
          );

        applyTransform();

      }
    );

  document
    .getElementById("zoomReset")
    .addEventListener(
      "click",
      ()=>{

        zoom=1;
        cameraX=0;
        cameraY=0;

        applyTransform();

      }
    );

  /* =========================
     PAGES
  ========================= */

  function updatePage(){

    document
      .getElementById("pageLabel")
      .textContent=
      `${currentPage+1} / ${note.pages.length}`;

    document
      .querySelector(".pageInfo")
      .textContent=
      `${note.pages.length}ページ`;

    redraw();
    renderObjects();

  }

  document
    .getElementById("prevPage")
    .addEventListener(
      "click",
      ()=>{

        if(currentPage>0){

          currentPage--;

          updatePage();

        }

      }
    );

  document
    .getElementById("nextPage")
    .addEventListener(
      "click",
      ()=>{

        if(
          currentPage<
          note.pages.length-1
        ){

          currentPage++;

        }else{

          note.pages.push({
            strokes:[],
            elements:[]
          });

          currentPage =
            note.pages.length-1;

        }

        updatePage();
        save();

      }
    );

  document
    .getElementById("newPage")
    .addEventListener(
      "click",
      ()=>{

        note.pages.push({
          strokes:[],
          elements:[]
        });

        currentPage=
          note.pages.length-1;

        updatePage();
        save();

      }
    );

  /* =========================
     BACK
  ========================= */

  document
    .getElementById("noteBack")
    .addEventListener(
      "click",
      ()=>{

        openFolder(
          note.folderId
        );

      }
    );

  /* =========================
     INIT
  ========================= */

  resizeCanvas();
  applyTransform();
  renderObjects();

  window.addEventListener(
    "resize",
    resizeCanvas
  );

}

/* =========================================================
   SAVE DEBOUNCE
========================================================= */

function saveSoon(){

  clearTimeout(
    autosaveTimer
  );

  autosaveTimer =
    setTimeout(
      save,
      250
    );

}

/* =========================================================
   EXPORT
========================================================= */

function exportData(){

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;

  a.download=
    "destination-note-backup.json";

  a.click();

  URL.revokeObjectURL(url);

}

/* =========================================================
   IMPORT
========================================================= */

function importData(e){

  const file =
    e.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload=()=>{

    try{

      const imported =
        JSON.parse(
          reader.result
        );

      if(
        !imported.folders ||
        !imported.notes
      ){

        alert(
          "Destination Noteのデータではありません"
        );

        return;

      }

      data=imported;

      save();

      location.reload();

    }catch(err){

      alert(
        "読み込みに失敗しました"
      );

    }

  };

  reader.readAsText(file);

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(str){

  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

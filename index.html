<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no"
>

<title>Destination Note</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,

      rgba(165,220,255,.65),

      circle at 100% 0%,
      rgba(235,185,255,.65),
      transparent 32%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(190,220,255,.45),
      transparent 38%

      135deg,
      #eaf6ff,
      #faf9ff 50%,
      #f4edff

}

button,
input,
textarea{
  font-family:inherit;
}

button{
  border:0;
}

.hidden{
  display:none!important;
}

/* =========================================================
   LIQUID GLASS
========================================================= */

.glass{

    linear-gradient(

      rgba(255,255,255,.43)

  border:

  box-shadow:

  backdrop-filter:

    saturate(185%);

/* =========================================================
   LOGIN
========================================================= */

#loginScreen{

  padding:20px;

.loginBox{

  padding:32px;

.loginLogo{

/* =========================================================

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

/* =========================================================
   TREE
========================================================= */

.tree{
  flex:1;

  overflow-y:auto;

  padding:

    0
    100px;

}

.tree::-webkit-scrollbar{

}

.treeRow{

.pageControls{

.pageBtn{

  height:38px;

   CANVAS
========================================================= */

.canvasViewport{

}

}

}

}

.canvasWorld{

  left:0;
  top:0;

}

#drawSvg{
  position:absolute;

  left:0;
  top:0;

  width:10000px;
  height:7000px;

  overflow:visible;

.objectLayer{

  left:0;
  top:0;

/* =========================================================
   SVG OBJECTS
========================================================= */

.noteObject{

.stickyRect{

<body>

<!-- =======================================================
     LOGIN
======================================================= -->

<div id="loginScreen">

  <div class="loginBox glass">

    <div class="loginLogo">

    </div>

    </p>

      id="loginButton"
      class="primaryButton"

      はじめる
    </button>

  </div>

</div>


<!-- =======================================================
     APP
======================================================= -->

<div id="app">

  <button
    id="mobileMenu"
    class="menuButton"
  >
    ☰
  </button>


  <!-- SIDEBAR -->

  <aside class="sidebar glass" id="sidebar">

    <div class="brand">

      <div class="brandIcon">
        📚
      </div>

      <div>

        <div class="brandTitle">
          Destination Note
        </div>

        <div
          class="brandUser"
          id="brandUser"
        ></div>

      class="tree"
      id="tree"
    ></div>

      <button
        class="bottomButton"
        id="addFolderButton"

        ＋ タブ

     MODAL
======================================================= -->

  id="modal"
  class="modal hidden"
>

    <h2 id="modalTitle">
      名前
    </h2>

      id="modalInput"
      class="input"
      placeholder=""
    >

      <button
        id="modalCancel"

      </button>

        id="modalOK"
        class="modalButton primary"
      >
        OK
      </button>

    </div>

  </div>

<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
  "destinationNote_v1";

const WORLD_WIDTH =
  10000;

const WORLD_HEIGHT =
  7000;


/* =========================================================
   DEFAULT DATA
========================================================= */

const defaultData = {

  name:"",
  password:"",

  totalSeconds:0,

  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],

  notes:[],

  settings:{
    dark:false
  }
};


let data =
  loadData();


function uid(prefix="id"){

  return (
    prefix +
    "_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,9)
  );
}


/* =========================================================
   LOAD / SAVE
========================================================= */

function loadData(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw){

      return structuredClone(
        defaultData
      );

    }

    const parsed =
      JSON.parse(raw);

    const result = {
      ...structuredClone(defaultData),
      ...parsed
    };

    if(!Array.isArray(result.folders)){
      result.folders = [];
    }

    if(!Array.isArray(result.notes)){
      result.notes = [];
    }

    if(
      !result.folders.some(
        f=>f.id==="root"
      )
    ){

      result.folders.unshift({
        id:"root",
        name:"マイノート",
        icon:"📚",
        parent:null,
        created:Date.now()
      });

    }

    normalizeData(result);

    return result;

  }catch(e){

    console.error(e);

    return structuredClone(
      defaultData
    );

  }

}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   DATA NORMALIZATION
========================================================= */

function normalizeData(d){

  d.folders =
    d.folders.filter(Boolean)
      .map(folder=>({

        id:
          folder.id ||
          uid("folder"),

        name:
          String(
            folder.name ||
            "新しいタブ"
          ),

        icon:
          folder.icon ||
          "📁",

        parent:
          folder.id==="root"
            ? null
            : (
                folder.parent ||
                "root"
              ),

        created:
          folder.created ||
          Date.now()

      }));


  const folderIds =
    new Set(
      d.folders.map(
        f=>f.id
      )
    );


  d.folders.forEach(folder=>{

    if(
      folder.parent !== null &&
      !folderIds.has(folder.parent)
    ){

      folder.parent =
        "root";

    }

  });


  d.notes =
    d.notes
      .filter(Boolean)
      .map(note=>{

        let pages =
          Array.isArray(note.pages)
            ? note.pages
            : [];


        if(!pages.length){

          pages = [
            {
              id:uid("page"),
              strokes:[],
              elements:[]
            }
          ];

        }


        pages =
          pages.map(page=>({

            id:
              page.id ||
              uid("page"),

            strokes:
              Array.isArray(
                page.strokes
              )
                ? page.strokes
                : [],

            elements:
              Array.isArray(
                page.elements
              )
                ? page.elements
                : []

          }));


        return {

          id:
            note.id ||
            uid("note"),

          name:
            String(
              note.name ||
              "新しいノート"
            ),

          folderId:
            folderIds.has(
              note.folderId
            )
              ? note.folderId
              : "root",

          created:
            note.created ||
            Date.now(),

          pages

        };

      });

}


/* =========================================================
   STATE
========================================================= */

let currentFolderId =
  "root";

let selectedFolderId =
  "root";

let currentNoteId =
  null;

let currentPageIndex =
  0;

let expandedFolders =
  new Set(["root"]);

let currentTool =
  "pencil";

let currentColor =
  "#111111";

let currentSize =
  4;

let selectedObjectId =
  null;


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const loginName =
  document.getElementById(
    "loginName"
  );

const loginPassword =
  document.getElementById(
    "loginPassword"
  );

const loginButton =
  document.getElementById(
    "loginButton"

/* =========================================================
   TREE HELPERS
========================================================= */

function getFolder(id){

  return data.folders.find(
    f=>f.id===id
  );

}


function getNote(id){

  return data.notes.find(
    n=>n.id===id
  );

}


function childrenFolders(id){

  return data.folders.filter(
    f=>f.parent===id
  );

}


function folderNotes(id){

  return data.notes.filter(
    n=>n.folderId===id
  );

}


/* =========================================================
   TREE RENDER
========================================================= */

function renderTree(){

  tree.innerHTML = "";

  renderFolderTree(
    "root",
    0,
    tree
  );

}


function renderFolderTree(
  folderId,
  depth,
  parentElement
){

  const folder =
    getFolder(folderId);

  if(!folder){
    return;
  }


  const children =
    childrenFolders(
      folderId
    );

  const notes =
    folderNotes(
      folderId
    );


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "treeRow" +
    (
      selectedFolderId === folderId
        ? " selected"
        : ""
    );


  row.style.paddingLeft =
    (
      4 +
      depth * 18
    ) + "px";


  /* arrow */

  const arrow =
    document.createElement(
      "div"
    );

  arrow.className =
    "treeArrow";


  if(children.length){

    if(
      expandedFolders.has(
        folderId
      )
    ){

      arrow.classList.add(
        "open"
      );

    }

  }else{

    arrow.classList.add(
      "empty"
    );

  }


  arrow.textContent =
    "›";


  /* icon */

  const icon =
    document.createElement(
      "div"
    );

  icon.className =
    "treeIcon";

  icon.textContent =
    folder.icon ||
    "📁";


  /* name */

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "treeName";

  name.textContent =
    folder.name;


  row.append(
    arrow,
    icon,
    name
  );


  /* =====================================================
     IMPORTANT:
     ROW ENTIRELY CLICKABLE
  ===================================================== */

  row.addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      selectedFolderId =
        folderId;

      currentFolderId =
        folderId;


      if(children.length){

        if(
          expandedFolders.has(
            folderId
          )
        ){

          expandedFolders.delete(
            folderId
          );

        }else{

          expandedFolders.add(
            folderId
          );

        }

      }


      renderTree();

      openFolder(
        folderId
      );

    }
  );


  /* long/right click rename */

  row.addEventListener(
    "contextmenu",
    e=>{

      e.preventDefault();

      renameFolder(
        folderId
      );

    }
  );


  parentElement.appendChild(
    row
  );


  /* children */

  if(
    children.length &&
    expandedFolders.has(
      folderId
    )
  ){

    children.forEach(
      child=>{

        renderFolderTree(
          child.id,
          depth + 1,
          parentElement
        );

      }
    );


    notes.forEach(
      note=>{

        renderNoteTree(
          note,
          depth + 1,
          parentElement
        );

      }
    );

  }

}

/* =========================================================

========================================================= */

function setTool(tool){

  currentTool =
    tool;


  document
    .querySelectorAll(
      ".tool[data-tool]"
    )
    .forEach(
      button=>{

        button.classList.toggle(
          "active",
          button.dataset.tool===
          tool
        );

      }
    );


  const viewport =
    document.getElementById(
      "canvasViewport"
    );


  if(viewport){

    viewport.classList.toggle(
      "hand",
      tool==="hand"
    );

    viewport.classList.toggle(
      "drawing",
      tool!=="hand"
    );

  }

}


/* =========================================================
   PAGE
========================================================= */

function getCurrentPage(){

  const note =
    getNote(
      currentNoteId
    );

  if(!note){
    return null;
  }


  if(
    !note.pages[
      currentPageIndex
    ]
  ){

    note.pages[
      currentPageIndex
    ] = {

      id:
        uid("page"),

      strokes:[],
      elements:[]

    };

  }


  return note.pages[
    currentPageIndex
  ];

}


/* =========================================================
   CANVAS CAMERA
========================================================= */

let camera = {

  x:0,
  y:0,

  zoom:1

};


let pointers =
  new Map();

let drawing =
  false;

let drawingStroke =
  null;

let rafPending =
  false;

let panState =
  null;

let pinchState =
  null;


/* =========================================================
   INIT CANVAS
========================================================= */

function initCanvasEvents(){

  const viewport =
    document.getElementById(
      "canvasViewport"
    );

  if(!viewport){
    return;
  }


  viewport.addEventListener(
    "pointerdown",
    onPointerDown,
    {
      passive:false
    }
  );


  viewport.addEventListener(
    "pointermove",
    onPointerMove,
    {
      passive:false
    }
  );


  viewport.addEventListener(
    "pointerup",
    onPointerUp,
    {
      passive:false
    }
  );


  viewport.addEventListener(
    "pointercancel",
    onPointerUp,
    {
      passive:false
    }
  );


  viewport.addEventListener(
    "wheel",
    e=>{

      if(
        currentTool!=="hand"
      ){

        e.preventDefault();

      }

    },
    {
      passive:false
    }
  );


  updateCamera();

}


/* =========================================================
   POINTER DOWN
========================================================= */

function onPointerDown(e){

  e.preventDefault();

  const viewport =
    document.getElementById(
      "canvasViewport"
    );

  if(!viewport){
    return;
  }


  try{

    viewport.setPointerCapture(
      e.pointerId
    );

  }catch(_){}


  pointers.set(
    e.pointerId,
    {
      x:e.clientX,
      y:e.clientY
    }
  );


  /* two fingers */

  if(pointers.size===2){

    drawing =
      false;

    drawingStroke =
      null;

    pinchState =
      makePinchState();

    return;

  }


  if(
    pointers.size!==1
  ){
    return;
  }


  if(currentTool==="hand"){

    panState = {

      x:e.clientX,
      y:e.clientY,

      cameraX:camera.x,
      cameraY:camera.y

    };

    return;

  }


  const point =
    screenToWorld(
      e.clientX,
      e.clientY
    );


  if(
    currentTool==="text"
  ){

    createTextAt(
      point
    );

    return;

  }


  if(
    currentTool==="sticky"
  ){

    createStickyAt(
      point
    );

    return;

  }


  if(
    currentTool==="objectEraser"
  ){

    eraseObjectAt(
      point
    );

    return;

  }


  if(
    currentTool==="pixelEraser"
  ){

    drawing = true;

    eraseAt(
      point
    );

    return;

  }


  if(
    currentTool==="pencil" ||
    currentTool==="highlighter"
  ){

    drawing =
      true;


    drawingStroke = {

      id:
        uid("stroke"),

      color:
        currentColor,

      width:
        currentTool==="highlighter"
          ? currentSize * 3.5
          : currentSize,

      opacity:
        currentTool==="highlighter"
          ? .28
          : 1,

      tool:
        currentTool,

      points:[
        point
      ]

    };


    getCurrentPage()
      .strokes
      .push(
        drawingStroke
      );


    renderDrawingOnly();

  }

}


/* =========================================================
   POINTER MOVE
========================================================= */

function onPointerMove(e){

  e.preventDefault();


  if(
    pointers.has(
      e.pointerId
    )
  ){

    pointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

  }


  /* pinch */

  if(
    pointers.size===2
  ){

    handlePinch();

    return;

  }


  if(
    pointers.size!==1
  ){
    return;
  }


  /* hand */

  if(
    currentTool==="hand" &&
    panState
  ){

    const dx =
      e.clientX -
      panState.x;

    const dy =
      e.clientY -
      panState.y;


    camera.x =
      panState.cameraX -
      dx /
      camera.zoom;

    camera.y =
      panState.cameraY -
      dy /
      camera.zoom;


    clampCamera();

    updateCamera();

    return;

  }


  /* drawing */

  if(
    !drawing
  ){
    return;
  }


  const point =
    screenToWorld(
      e.clientX,
      e.clientY
    );


  if(
    currentTool==="pixelEraser"
  ){

    eraseAt(
      point
    );

    return;

  }


  if(
    !drawingStroke
  ){
    return;
  }


  /*
    iPad / Apple Pencil / 指の
    coalesced eventsを全部取得
  */

  const events =
    typeof e.getCoalescedEvents ===
    "function"
      ? e.getCoalescedEvents()
      : [e];


  for(
    const ev of events
  ){

    const p =
      screenToWorld(
        ev.clientX,
        ev.clientY
      );


    const last =
      drawingStroke.points[
        drawingStroke.points.length-1
      ];


    const distance =
      Math.hypot(
        p.x-last.x,
        p.y-last.y
      );


    /*
      細かく取りすぎないことで
      滑らかさと軽さを両立
    */

    if(
      distance >= .7
    ){

      drawingStroke.points.push(
        p
      );

    }

  }


  queueDrawingRender();

}


/* =========================================================
   POINTER UP
========================================================= */

function onPointerUp(e){

  e.preventDefault();


  pointers.delete(
    e.pointerId
  );


  if(
    pointers.size<2
  ){

    pinchState =
      null;

  }


  if(
    pointers.size===0
  ){

    drawing =
      false;

    drawingStroke =
      null;

    panState =
      null;


    saveData();

    renderCanvas();

  }

}


/* =========================================================
   SCREEN -> WORLD
========================================================= */

function screenToWorld(
  clientX,
  clientY
){

  const viewport =
    document.getElementById(
      "canvasViewport"
    );


  const rect =
    viewport.getBoundingClientRect();


  return {

    x:
      camera.x +
      (
        clientX -
        rect.left
      ) /
      camera.zoom,

    y:
      camera.y +
      (
        clientY -
        rect.top
      ) /
      camera.zoom

  };

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  const world =
    document.getElementById(
      "canvasWorld"
    );

  if(!world){
    return;
  }


  world.style.transform =
    `translate(${
      -camera.x * camera.zoom
    }px,${
      -camera.y * camera.zoom
    }px) scale(${
      camera.zoom
    })`;

}


function clampCamera(){

  const viewport =
    document.getElementById(
      "canvasViewport"
    );

  if(!viewport){
    return;
  }


  const width =
    viewport.clientWidth /
    camera.zoom;

  const height =
    viewport.clientHeight /
    camera.zoom;


  camera.x =
    Math.max(
      0,
      Math.min(
        WORLD_WIDTH-width,
        camera.x
      )
    );


  camera.y =
    Math.max(
      0,
      Math.min(
        WORLD_HEIGHT-height,
        camera.y
      )
    );

}


/* =========================================================
   PINCH
========================================================= */

function makePinchState(){

  const arr =
    [...pointers.values()];

  const a=arr[0];
  const b=arr[1];


  return {

    distance:
      Math.hypot(
        a.x-b.x,
        a.y-b.y
      ),

    zoom:
      camera.zoom,

    centerX:
      (a.x+b.x)/2,

    centerY:
      (a.y+b.y)/2

  };

}


function handlePinch(){

  if(!pinchState){
    pinchState =
      makePinchState();

    return;
  }


  const arr =
    [...pointers.values()];

  const a=arr[0];
  const b=arr[1];


  const distance =
    Math.hypot(
      a.x-b.x,
      a.y-b.y
    );


  if(
    pinchState.distance<=0
  ){
    return;
  }


  const factor =
    distance /
    pinchState.distance;


  const newZoom =
    Math.max(
      .25,
      Math.min(
        4,
        pinchState.zoom *
        factor
      )
    );


  const viewport =
    document.getElementById(
      "canvasViewport"
    );

  const rect =
    viewport.getBoundingClientRect();


  const centerX =
    (
      a.x+b.x
    )/2 -
    rect.left;


  const centerY =
    (
      a.y+b.y
    )/2 -
    rect.top;


  const worldX =
    camera.x +
    centerX /
    camera.zoom;


  const worldY =
    camera.y +
    centerY /
    camera.zoom;


  camera.zoom =
    newZoom;


  camera.x =
    worldX -
    centerX /
    camera.zoom;

  camera.y =
    worldY -
    centerY /
    camera.zoom;


  clampCamera();

  updateCamera();

}


/* =========================================================
   DRAWING RENDER
========================================================= */

function queueDrawingRender(){

  if(rafPending){
    return;
  }


  rafPending =
    true;


  requestAnimationFrame(
    ()=>{

      rafPending =
        false;

      renderDrawingOnly();

    }
  );

}


function renderDrawingOnly(){

  const svg =
    document.getElementById(
      "drawSvg"
    );

  if(!svg){
    return;
  }


  const page =
    getCurrentPage();

  if(!page){
    return;
  }


  svg.innerHTML =
    page.strokes
      .map(
        strokeToSvg
      )
      .join("");

}


/* =========================================================
   FULL CANVAS RENDER
========================================================= */

function renderCanvas(){

  const note =
    getNote(
      currentNoteId
    );

  if(!note){
    return;
  }


  const page =
    getCurrentPage();

  if(!page){
    return;
  }


  const pageNumber =
    document.getElementById(
      "pageNumber"
    );

  if(pageNumber){

    pageNumber.textContent =
      `${currentPageIndex+1} / ${note.pages.length}`;

  }


  const title =
    document.getElementById(
      "noteTitle"
    );

  if(title){

    title.value =
      note.name ||
      "新しいノート";

  }


  const svg =
    document.getElementById(
      "drawSvg"
    );


  const objectSvg =
    document.getElementById(
      "objectSvg"
    );


  if(!svg || !objectSvg){
    return;
  }


  svg.innerHTML =
    page.strokes
      .map(
        strokeToSvg
      )
      .join("");


  objectSvg.innerHTML =
    page.elements
      .map(
        elementToSvg
      )
      .join("");


  updateCamera();

}


/* =========================================================
   STROKE SVG
========================================================= */

function strokeToSvg(
  stroke
){

  if(
    !stroke.points ||
    stroke.points.length<1
  ){
    return "";
  }


  const d =
    pointsToPath(
      stroke.points
    );


  const color =
    stroke.color ||
    "#111";


  const width =
    Number(
      stroke.width ||
      4
    );


  const opacity =
    stroke.opacity ??
    1;


  if(
    stroke.points.length===1
  ){

    const p =
      stroke.points[0];


    return `
      <circle
        cx="${p.x}"
        cy="${p.y}"
        r="${Math.max(
          1,
          width/2
        )}"
        fill="${color}"
        opacity="${opacity}"
      />
    `;

  }


  return `
    <path
      d="${d}"
      fill="none"
      stroke="${color}"
      stroke-width="${width}"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="${opacity}"
    />
  `;

}


/* =========================================================
   SMOOTH PATH
========================================================= */

function pointsToPath(
  points
){

  if(points.length===1){

    return `
      M
      ${points[0].x}
      ${points[0].y}
    `;

  }


  let d =
    `M ${points[0].x} ${points[0].y}`;


  for(
    let i=1;
    i<points.length;
    i++
  ){

    const p0 =
      points[i-1];

    const p1 =
      points[i];


    const mx =
      (p0.x+p1.x)/2;

    const my =
      (p0.y+p1.y)/2;


    d +=
      ` Q ${
        p0.x
      } ${
        p0.y
      } ${
        mx
      } ${
        my
      }`;

  }


  return d;

}


/* =========================================================
   PIXEL ERASER
========================================================= */

function eraseAt(
  eraserPoint
){

  const page =
    getCurrentPage();

  if(!page){
    return;
  }


  const radius =
    Math.max(
      8,
      currentSize * 2.2
    );


  const newStrokes =
    [];


  for(
    const stroke of page.strokes
  ){

    if(
      !stroke.points ||
      !stroke.points.length
    ){
      continue;
    }


    let segment =
      [];


    let touched =
      false;


    for(
      const p of stroke.points
    ){

      const distance =
        Math.hypot(
          p.x -
          eraserPoint.x,
          p.y -
          eraserPoint.y
        );


      if(
        distance <= radius
      ){

        touched =
          true;


        if(
          segment.length>=2
        ){

          newStrokes.push({

            ...stroke,

            id:
              uid("stroke"),

            points:
              segment

          });

        }


        segment = [];

      }else{

        segment.push(
          p
        );

      }

    }


    if(
      segment.length>=2
    ){

      newStrokes.push({

        ...stroke,

        id:
          touched
            ? uid("stroke")
            : stroke.id,

        points:
          segment

      });

    }

  }


  page.strokes =
    newStrokes;


  renderDrawingOnly();

}


/* =========================================================
   OBJECT ERASER
========================================================= */

function eraseObjectAt(
  point
){

  const page =
    getCurrentPage();

  if(!page){
    return;
  }


  let removed =
    false;


  page.elements =
    page.elements.filter(
      object=>{

        const width =
          object.width ||
          250;

        const height =
          object.height ||
          120;


        const hit =
          point.x >= object.x &&
          point.x <=
            object.x+width &&
          point.y >= object.y &&
          point.y <=
            object.y+height;


        if(hit){

          removed =
            true;

          return false;

        }


        return true;

      }
    );


  if(removed){

    selectedObjectId =
      null;

    saveData();

    renderCanvas();

  }

}

  const reader =
    new FileReader();


  reader.onload =
    ()=>{
      
      const page =
        getCurrentPage();


      page.elements.push({

        id:

        type:
          "image",

        x:
          camera.x +

        src:

      renderCanvas();

    };


  reader.readAsDataURL(
    file
  );


  e.target.value =
    "";

}


/* =========================================================
   ELEMENT SVG
========================================================= */

function elementToSvg(
  object
){

  const selected =
    selectedObjectId ===
    object.id;


  const outline =
    selected
      ? `
        stroke="#596cff"
        stroke-width="8"
        stroke-dasharray="20 12"
      `
      : "";


  if(
    object.type==="text"
  ){

    return `
      <g
        class="noteObject"
        data-object-id="${object.id}"
        pointer-events="auto"
      >

        <rect
          x="${object.x}"
          y="${object.y - object.fontSize}"
          width="${object.width}"
          height="${object.height}"
          rx="20"
          fill="rgba(255,255,255,.01)"
          ${outline}
          fill-opacity=".01"
        />

        <text
          x="${object.x}"
          y="${object.y}"
          fill="${object.color || "#111"}"
          font-size="${object.fontSize || 28}"
          font-family="-apple-system,BlinkMacSystemFont,sans-serif"
          font-weight="500"
        >
          ${escapeHTML(
            object.text
          )}
        </text>

      </g>
    `;

  }


  if(
    object.type==="sticky"
  ){

    return `
      <g
        class="noteObject"
        data-object-id="${object.id}"
        pointer-events="auto"
      >

        <rect
          class="stickyRect"
          x="${object.x}"
          y="${object.y}"
          width="${object.width}"
          height="${object.height}"
          rx="22"
          fill="#fff6a8"
          ${outline}
        />

        <foreignObject
          x="${object.x+20}"
          y="${object.y+20}"
          width="${object.width-40}"
          height="${object.height-40}"
          pointer-events="none"
        >

          <div
            xmlns="http://www.w3.org/1999/xhtml"
            style="
              width:100%;
              height:100%;
              font-family:-apple-system,BlinkMacSystemFont,sans-serif;
              font-size:${object.fontSize || 28}px;
              color:${object.color || "#111"};
              white-space:pre-wrap;
              word-break:break-word;
            "
          >
            ${escapeHTML(
              object.text
            )}
          </div>

        </foreignObject>

      </g>
    `;

  }


  if(
    object.type==="image"
  ){

    return `
      <g
        class="noteObject"
        data-object-id="${object.id}"
        pointer-events="auto"
      >

        <image
          href="${object.src}"
          x="${object.x}"
          y="${object.y}"
          width="${object.width}"
          height="${object.height}"
          preserveAspectRatio="xMidYMid meet"
          ${outline}
        />

      </g>
    `;

  }


  return "";

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(
  value
){

  return escapeHTML(
    value
  );

}

/* =========================================================
   STUDY TIME
========================================================= */

let trackingStart =
  null;


let studyTimer =
  null;


function startStudyTimer(){

  trackingStart =
    Date.now();


  studyTimer =
    setInterval(
      ()=>{
        flushStudyTime();
      },
      1000
    );

}


function flushStudyTime(){

  if(
    document.hidden
  ){

    trackingStart =
      null;

    return;

  }


  if(
    trackingStart===null
  ){

    trackingStart =
      Date.now();

    return;

  }


  const now =
    Date.now();


  const seconds =
    Math.floor(
      (
        now -
        trackingStart
      ) / 1000
    );


  if(
    seconds>0
  ){

    data.totalSeconds +=
      seconds;

    trackingStart =
      now;

    saveData();

  }

}


document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.hidden
    ){

      flushStudyTime();

      trackingStart =
        null;

    }else{

      trackingStart =
        Date.now();

    }

  }
);


/* =========================================================
   RANK
========================================================= */

function getRank(){

  const hours =
    data.totalSeconds /
    3600;


  if(hours < 10){
    return "ブロンズ";
  }

  if(hours < 30){
    return "シルバー";
  }

  if(hours < 60){
    return "ゴールド";
  }

  if(hours < 100){
    return "プラチナ";
  }

  if(hours < 200){
    return "ビジネス";
  }

  if(hours < 500){
    return "ファースト";
  }

  return "グランクラス";

}

function importData(){

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "file";

  input.accept =
    ".json";


  input.onchange =
    e=>{

      const file =
        e.target.files[0];


      if(!file){
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        ()=>{
          
          try{

            const imported =
              JSON.parse(
                reader.result
              );


            data =
              imported;


            normalizeData(
              data
            );


            saveData();

            alert(
              "データを読み込みました"
            );


            location.reload();

          }catch(error){

            alert(
              "読み込みに失敗しました"
            );

          }

        };


      reader.readAsText(
        file
      );

    };


  input.click();

}

/* =========================================================
   AUTOSAVE
========================================================= */

let saveTimer =
  null;


function scheduleSave(){

  clearTimeout(
    saveTimer
  );


  saveTimer =
    setTimeout(
      saveData,
      400
    );

}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Destination Note</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#f5f5f7;
  --card:rgba(255,255,255,.75);
  --text:#171717;
  --sub:#777;
  --border:rgba(0,0,0,.09);
  --blue:#007aff;
  --red:#ff3b30;
  --shadow:0 15px 40px rgba(0,0,0,.09);
}

body.dark{
  --bg:#101114;
  --card:rgba(35,36,42,.82);
  --text:#fff;
  --sub:#aaa;
  --border:rgba(255,255,255,.1);
  --shadow:0 15px 40px rgba(0,0,0,.25);
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,
      rgba(0,122,255,.13),
      transparent 35%),
    radial-gradient(circle at 100% 20%,
      rgba(175,82,222,.10),
      transparent 35%),
    var(--bg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
LOGIN
========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:min(430px,100%);
  padding:35px 25px;
  text-align:center;

  background:var(--card);
  border:1px solid var(--border);
  border-radius:30px;

  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);

  box-shadow:var(--shadow);
}

.logo{
  width:78px;
  height:78px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:23px;

  background:
    linear-gradient(135deg,#007aff,#5856d6);

  color:white;
  font-size:37px;
}

.loginBox h1{
  margin:20px 0 5px;
}

.loginBox p{
  color:var(--sub);
}

.input{
  width:100%;
  padding:15px 17px;
  margin-bottom:12px;

  border:1px solid var(--border);
  border-radius:16px;
  outline:none;

  background:rgba(127,127,127,.08);
  color:var(--text);
}

.input:focus{
  border-color:var(--blue);
}

.primary{
  width:100%;
  padding:15px;

  border:none;
  border-radius:16px;

  background:var(--blue);
  color:white;

  font-weight:700;
}

/* =========================
HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  padding:
    max(12px,env(safe-area-inset-top))
    18px 12px;

  background:rgba(245,245,247,.72);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  border-bottom:1px solid var(--border);
}

body.dark header{
  background:rgba(16,17,20,.72);
}

.headerInner{
  max-width:1100px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:21px;
  font-weight:800;
}

.headerButtons{
  display:flex;
  gap:8px;
}

.iconBtn{
  width:42px;
  height:42px;

  border:1px solid var(--border);
  border-radius:14px;

  background:var(--card);
  color:var(--text);
}

/* =========================
MAIN
========================= */

main{
  max-width:1100px;
  margin:auto;
  padding:24px 18px 120px;
}

.hero{
  padding:25px;
  margin-bottom:18px;

  border-radius:28px;
  border:1px solid var(--border);

  background:
    linear-gradient(
      135deg,
      rgba(0,122,255,.15),
      rgba(88,86,214,.10)
    ),
    var(--card);

  box-shadow:var(--shadow);
}

.hero h2{
  margin:0 0 5px;
}

.hero p{
  margin:0;
  color:var(--sub);
}

.sectionTitle{
  margin:28px 3px 12px;
  font-size:20px;
  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(230px,1fr));
  gap:14px;
}

.card{
  padding:20px;

  border:1px solid var(--border);
  border-radius:23px;

  background:var(--card);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:var(--shadow);
}

.folderCard,
.noteCard{
  cursor:pointer;
  transition:.15s;
}

.folderCard:active,
.noteCard:active{
  transform:scale(.98);
}

.folderIcon{
  font-size:38px;
}

.folderName,
.noteTitle{
  margin-top:10px;
  font-size:18px;
  font-weight:750;
}

.cardSub,
.noteDate{
  margin-top:5px;
  color:var(--sub);
  font-size:13px;
}

.addArea{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.addBtn{
  padding:13px 17px;

  border:none;
  border-radius:16px;

  background:var(--blue);
  color:white;

  font-weight:700;
}

.addBtn.secondary{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
}

.danger{
  padding:13px 17px;

  border:none;
  border-radius:16px;

  background:var(--red);
  color:white;

  font-weight:700;
}

/* =========================
RANK
========================= */

.rankTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.rankName{
  font-size:22px;
  font-weight:800;
}

.rankHours{
  color:var(--sub);
}

.progress{
  height:10px;
  margin-top:12px;

  overflow:hidden;

  border-radius:20px;

  background:rgba(127,127,127,.15);
}

.progressBar{
  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #007aff,
      #5856d6
    );
}

/* =========================
BREADCRUMB
========================= */

.breadcrumb{
  display:flex;
  gap:6px;
  align-items:center;

  overflow-x:auto;
  white-space:nowrap;

  padding-bottom:8px;
}

.crumb{
  border:none;
  background:none;

  color:var(--blue);
  font-weight:700;
}

/* =========================
BOTTOM NAV
========================= */

.bottomNav{
  position:fixed;
  z-index:150;

  left:50%;
  bottom:max(12px,env(safe-area-inset-bottom));

  transform:translateX(-50%);

  width:min(520px,calc(100% - 24px));

  display:flex;
  justify-content:space-around;

  padding:8px;

  border:1px solid var(--border);
  border-radius:24px;

  background:var(--card);

  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);

  box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.navBtn{
  border:none;
  background:none;
  color:var(--sub);

  padding:8px 18px;
  border-radius:17px;

  font-size:11px;
}

.navBtn span{
  display:block;
  font-size:20px;
}

.navBtn.active{
  color:var(--blue);
}

/* =========================
MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:500;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:18px;

  background:rgba(0,0,0,.35);

  backdrop-filter:blur(8px);
}

.modalBox{
  width:min(540px,100%);
  max-height:90vh;

  overflow:auto;

  padding:24px;

  border-radius:27px;
  border:1px solid var(--border);

  background:var(--bg);

  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modalButtons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.modalButtons>*{
  flex:1;
}

/* =========================
TIMER
========================= */

.timer{
  text-align:center;
}

.timerCircle{
  width:220px;
  height:220px;

  margin:25px auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;
  border:12px solid rgba(0,122,255,.14);

  font-size:38px;
  font-weight:800;
}

/* =========================
NOTE EDITOR
========================= */

.notePage{
  width:100%;
}

.noteHeader{
  display:flex;
  align-items:center;
  gap:10px;

  margin-bottom:12px;
}

.backBtn{
  padding:10px 14px;

  border:1px solid var(--border);
  border-radius:14px;

  background:var(--card);
  color:var(--text);
}

.noteHeaderTitle{
  font-size:22px;
  font-weight:800;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================
NOTE TOOLBAR
========================= */

.noteToolbar{
  position:sticky;
  top:70px;

  z-index:80;

  display:flex;
  gap:7px;
  flex-wrap:wrap;

  padding:9px;

  margin-bottom:10px;

  border:1px solid var(--border);
  border-radius:20px;

  background:var(--card);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.toolBtn{
  min-height:42px;

  padding:9px 12px;

  border:1px solid var(--border);
  border-radius:13px;

  background:rgba(127,127,127,.08);
  color:var(--text);

  font-weight:700;
}

.toolBtn.active{
  background:var(--blue);
  color:white;
}

.colorInput{
  width:42px;
  height:42px;

  padding:3px;

  border:1px solid var(--border);
  border-radius:13px;

  background:var(--card);
}

.range{
  width:100px;
}

/* =========================
PAGE CONTROLS
========================= */

.pageControls{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  margin:10px 0;
}

.pageBtn{
  padding:9px 13px;

  border:1px solid var(--border);
  border-radius:13px;

  background:var(--card);
  color:var(--text);
}

.pageNumber{
  min-width:75px;
  text-align:center;
  font-weight:800;
}

/* =========================
VIEWPORT
========================= */

.noteViewport{
  position:relative;

  width:100%;
  height:70vh;
  min-height:500px;

  overflow:hidden;

  border:1px solid var(--border);
  border-radius:25px;

  background:
    radial-gradient(
      circle,
      rgba(127,127,127,.08) 1px,
      transparent 1px
    ),
    var(--bg);

  background-size:20px 20px;

  touch-action:none;

  box-shadow:var(--shadow);
}

/*
  実際の巨大なノートページ
*/

.notePageCanvas{
  position:absolute;

  width:1200px;
  height:1700px;

  left:50%;
  top:50%;

  transform-origin:0 0;

  background:white;

  box-shadow:
    0 20px 60px rgba(0,0,0,.2);

  overflow:hidden;
}

body.dark .notePageCanvas{
  background:#202124;
}

/* キャンバス */

.notePageCanvas canvas{
  position:absolute;

  inset:0;

  width:1200px;
  height:1700px;

  touch-action:none;
}

/* オブジェクト */

.noteElement{
  position:absolute;

  z-index:20;

  min-width:150px;

  user-select:none;

  touch-action:none;
}

.noteElement textarea{
  width:100%;
  min-width:150px;
  min-height:70px;

  padding:10px;

  resize:none;

  border:1px dashed transparent;
  outline:none;

  background:transparent;
  color:#111;

  font-size:22px;
  line-height:1.5;
}

.noteElement textarea:focus{
  border-color:#007aff;
}

.sticky{
  width:200px;
  min-height:140px;

  padding:15px;

  background:#fff59d;

  box-shadow:0 10px 25px rgba(0,0,0,.18);

  color:#333;

  border-radius:5px;
}

.sticky textarea{
  color:#333;
}

.objectDelete{
  position:absolute;

  right:-10px;
  top:-10px;

  width:28px;
  height:28px;

  border:none;
  border-radius:50%;

  background:#ff3b30;
  color:white;

  z-index:50;
}

/* =========================
ZOOM
========================= */

.zoomControls{
  display:flex;
  justify-content:center;
  gap:8px;

  margin:10px 0;
}

.zoomBtn{
  min-width:46px;
  height:42px;

  border:1px solid var(--border);
  border-radius:13px;

  background:var(--card);
  color:var(--text);

  font-weight:800;
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:600px){

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .noteToolbar{
    top:65px;
  }

  .noteViewport{
    height:72vh;
    min-height:520px;
  }

}

@media(max-width:390px){

  .grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>


<body>


<!-- =========================================
LOGIN
========================================= -->

<section id="loginScreen">

  <div class="loginBox">

    <div class="logo">
      📚
    </div>

    <h1>
      Destination Note
    </h1>

    <p>
      学びの目的地へ。
    </p>

    <input
      id="loginName"
      class="input"
      placeholder="名前">

    <input
      id="loginPassword"
      class="input"
      type="password"
      placeholder="パスワード">

    <button
      class="primary"
      onclick="login()">

      はじめる

    </button>

  </div>

</section>


<!-- =========================================
APP
========================================= -->

<section
  id="app"
  class="hidden">

<header>

  <div class="headerInner">

    <div class="brand">
      📚 Destination Note
    </div>

    <div class="headerButtons">

      <button
        class="iconBtn"
        onclick="toggleDark()">

        ◐

      </button>

      <button
        class="iconBtn"
        onclick="showSettings()">

        ⚙️

      </button>

    </div>

  </div>

</header>


<main id="main"></main>


<nav class="bottomNav">

  <button
    class="navBtn active"
    onclick="showHome()">

    <span>🏠</span>
    ホーム

  </button>

  <button
    class="navBtn"
    onclick="showFolders()">

    <span>📁</span>
    ノート

  </button>

  <button
    class="navBtn"
    onclick="showTimer()">

    <span>⏱️</span>
    勉強

  </button>

  <button
    class="navBtn"
    onclick="showSettings()">

    <span>⚙️</span>
    設定

  </button>

</nav>

</section>


<!-- =========================================
MODAL
========================================= -->

<div
  id="modal"
  class="modal hidden">

  <div
    id="modalContent"
    class="modalBox">
  </div>

</div>


<script>

/* =====================================================
DATA
===================================================== */

const STORAGE_KEY =
  "destinationNote_v1";

let data = {

  name:"",
  password:"",

  totalSeconds:0,

  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],

  notes:[],

  settings:{
    dark:false
  }

};

let currentFolder="root";

let currentNoteId=null;

let currentPage=0;

let currentTool="pencil";

let drawing=false;

let color="#111111";

let brushSize=4;

let zoom=0.65;

let panX=0;

let panY=0;

let timerInterval=null;

let timerSeconds=0;

let timerRunning=false;


/* =====================================================
SAVE
===================================================== */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =====================================================
LOAD
===================================================== */

function loadData(){

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(!saved) return;

  try{

    data=JSON.parse(saved);

    if(!data.folders){
      data.folders=[];
    }

    if(!data.notes){
      data.notes=[];
    }

    if(!data.settings){
      data.settings={};
    }

    /*
      古いノートを新ページ形式へ
    */

    data.notes.forEach(note=>{

      if(!note.pages){

        note.pages=[{

          image:null,

          elements:
            note.elements||[],

          strokes:
            note.strokes||[]

        }];

      }

    });

  }catch(e){

    console.error(e);

  }

}


/* =====================================================
LOGIN
===================================================== */

function login(){

  const name =
    document
      .getElementById("loginName")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  if(!name||!password){

    alert(
      "名前とパスワードを入力してね。"
    );

    return;

  }

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(saved){

    const old =
      JSON.parse(saved);

    if(
      old.name!==name ||
      old.password!==password
    ){

      alert(
        "名前またはパスワードが違います。"
      );

      return;

    }

    data=old;

  }else{

    data.name=name;

    data.password=password;

    saveData();

  }

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  if(data.settings?.dark){

    document.body.classList.add("dark");

  }

  showHome();

}


/* =====================================================
RANK
===================================================== */

const ranks=[

  ["🥉","BRONZE","ブロンズ",0,10],
  ["🥈","SILVER","シルバー",10,30],
  ["🥇","GOLD","ゴールド",30,60],
  ["💎","PLATINUM","プラチナ",60,100],
  ["💼","BUSINESS","ビジネス",100,200],
  ["✈️","FIRST","ファースト",200,500],
  ["👑","GRAN CLASS","グランクラス",500,Infinity]

];


function getRank(){

  const hours =
    data.totalSeconds/3600;

  return ranks.find(
    r=>hours>=r[3] &&
       hours<r[4]
  ) || ranks[ranks.length-1];

}


function formatTime(sec){

  const h=
    Math.floor(sec/3600);

  const m=
    Math.floor((sec%3600)/60);

  const s=
    sec%60;

  return h+
    "時間 "+
    m+
    "分 "+
    s+
    "秒";

}


/* =====================================================
HOME
===================================================== */

function showHome(){

  const rank=getRank();

  const folders=
    data.folders.filter(
      f=>f.parent==="root"
    );

  document.getElementById(
    "main"
  ).innerHTML=`

    <section class="hero">

      <h2>
        こんにちは、
        ${esc(data.name)}さん 👋
      </h2>

      <p>
        今日も学びの目的地へ。
      </p>

      <br>

      <div class="rankTop">

        <div class="rankName">

          ${rank[0]}
          ${rank[1]}

        </div>

        <div class="rankHours">

          ${formatTime(
            data.totalSeconds
          )}

        </div>

      </div>

      <div class="progress">

        <div
          class="progressBar"
          style="
          width:
          ${
            rank[4]===Infinity
            ? 100
            :
            (
              (
                data.totalSeconds/3600
                -rank[3]
              )/
              (
                rank[4]-rank[3]
              )
            )*100
          }%">
        </div>

      </div>

    </section>


    <div class="sectionTitle">
      📁 マイノート
    </div>

    <div class="addArea">

      <button
        class="addBtn"
        onclick="createFolder('root')">

        ＋ 新しいタブ

      </button>

      <button
        class="addBtn secondary"
        onclick="showTimer()">

        ⏱️ 勉強開始

      </button>

    </div>


    <div class="grid">

      ${
        folders.map(folder=>`

          <div
            class="card folderCard"
            onclick="
              openFolder('${folder.id}')
            ">

            <div class="folderIcon">
              ${folder.icon}
            </div>

            <div class="folderName">
              ${esc(folder.name)}
            </div>

          </div>

        `).join("")
        ||
        `<div class="card">
          まだタブがありません。
        </div>`
      }

    </div>

  `;

  activeNav(0);

}


/* =====================================================
FOLDERS
===================================================== */

function showFolders(){

  renderFolder(currentFolder);

}


function openFolder(id){

  currentFolder=id;

  renderFolder(id);

}


function renderFolder(id){

  const folder=
    data.folders.find(
      f=>f.id===id
    );

  if(!folder)return;

  const children=
    data.folders.filter(
      f=>f.parent===id
    );

  const notes=
    data.notes.filter(
      n=>n.folder===id
    );

  document.getElementById(
    "main"
  ).innerHTML=`

    <div class="breadcrumb">

      <button
        class="crumb"
        onclick="showHome()">

        🏠

      </button>

      ›

      ${esc(folder.name)}

    </div>


    <section class="hero">

      <h2>
        ${folder.icon}
        ${esc(folder.name)}
      </h2>

      <p>
        ここにタブやノートを追加できます。
      </p>

    </section>


    <div class="addArea">

      <button
        class="addBtn"
        onclick="
          createFolder('${id}')
        ">

        📁 新しいタブ

      </button>

      <button
        class="addBtn secondary"
        onclick="
          createNote('${id}')
        ">

        📄 新しいノート

      </button>

    </div>


    ${
      children.length
      ?
      `
      <div class="sectionTitle">
        📁 タブ
      </div>

      <div class="grid">

        ${children.map(f=>`

          <div
            class="card folderCard"
            onclick="

/* =====================================================
NOTE TITLE
===================================================== */

function changeNoteTitle(){

  const note=getCurrentNote();

  const value=
    document
      .getElementById("noteTitle")
      .value
      .trim();

  note.title=
    value||"無題のノート";

  saveData();

}


/* =====================================================
CURRENT NOTE
===================================================== */

function getCurrentNote(){

  return data.notes.find(
    n=>n.id===currentNoteId
  );

}


function getCurrentPage(){

  const note=getCurrentNote();

  if(!note)return null;

  if(!note.pages){

    note.pages=[{

      image:null,
      elements:[],
      strokes:[]

    }];

  }

  if(!note.pages[currentPage]){

    note.pages[currentPage]={

      image:null,
      elements:[],
      strokes:[]

    };

  }

  return note.pages[currentPage];

}


/* =====================================================
CANVAS
===================================================== */

let canvas;
let ctx;

function setupNoteCanvas(){

  canvas=
    document.getElementById(
      "drawingCanvas"
    );

  ctx=
    canvas.getContext("2d");

  ctx.lineCap="round";
  ctx.lineJoin="round";

  canvas.addEventListener(
    "pointerdown",
    pointerDown
  );

  canvas.addEventListener(
    "pointermove",
    pointerMove
  );

  canvas.addEventListener(
    "pointerup",
    pointerUp
  );

  canvas.addEventListener(
    "pointercancel",
    pointerUp
  );

  /*
    視点移動用
  */

  const viewport=
    document.getElementById(
      "noteViewport"
    );

  viewport.addEventListener(
    "pointerdown",
    startPan
  );

  viewport.addEventListener(
    "pointermove",
    movePan
  );

  viewport.addEventListener(
    "pointerup",
    endPan
  );

}


/* =====================================================
DRAW
===================================================== */

let lastX=0;
let lastY=0;

function canvasPosition(e){

  const rect=
    canvas.getBoundingClientRect();

  return {

    x:
      (e.clientX-rect.left)
      /zoom,

    y:
      (e.clientY-rect.top)
      /zoom

  };

}


function pointerDown(e){

  if(
    currentTool!=="pencil" &&
    currentTool!=="highlighter" &&
    currentTool!=="pixel"
  ){

    return;

  }

  e.preventDefault();

  drawing=true;

  canvas.setPointerCapture(
    e.pointerId
  );

  const p=
    canvasPosition(e);

  lastX=p.x;
  lastY=p.y;

  ctx.beginPath();

  ctx.moveTo(
    lastX,
    lastY
  );

  applyBrush();

}


function pointerMove(e){

  if(!drawing)return;

  e.preventDefault();

  const p=
    canvasPosition(e);

  ctx.lineTo(
    p.x,
    p.y
  );

  ctx.stroke();

  lastX=p.x;
  lastY=p.y;

}


function pointerUp(){

  if(!drawing)return;

  drawing=false;

  saveCanvasImage();

}


/* =====================================================
BRUSH
===================================================== */

function applyBrush(){

  ctx.lineWidth=
    brushSize;

  if(currentTool==="pencil"){

    ctx.globalCompositeOperation=
      "source-over";

    ctx.globalAlpha=1;

    ctx.strokeStyle=color;

  }

  else if(
    currentTool==="highlighter"
  ){

    ctx.globalCompositeOperation=
      "source-over";

    ctx.globalAlpha=.28;

    ctx.strokeStyle=color;

  }

  else if(currentTool==="pixel"){

    ctx.globalCompositeOperation=
      "destination-out";

    ctx.globalAlpha=1;

  }

}


/* =====================================================
SAVE CANVAS
===================================================== */

function saveCanvasImage(){

  const page=
    getCurrentPage();

  if(!page)return;

  page.image=
    canvas.toDataURL(
      "image/png"
    );

  const note=
    getCurrentNote();

  note.updated=Date.now();

  saveData();

}


/* =====================================================
RENDER PAGE
===================================================== */

function renderCurrentPage(){

  const page=
    getCurrentPage();

  if(!page)return;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.globalAlpha=1;

  ctx.globalCompositeOperation=
    "source-over";

  if(page.image){

    const img=
      new Image();

    img.onload=()=>{

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        img,
        0,
        0,
        1200,
        1700
      );

    };

    img.src=page.image;

  }

  renderElements();

  updatePageNumber();

  applyTransform();

}


/* =====================================================
PAGE
===================================================== */

function updatePageNumber(){

  const note=
    getCurrentNote();

  const el=
    document.getElementById(
      "pageNumber"
    );

  if(el&&note){

    el.textContent=
      `${currentPage+1} / ${note.pages.length}`;

  }

}


function addPage(){

  const note=
    getCurrentNote();

  note.pages.push({

    image:null,

    elements:[],

    strokes:[]

  });

  currentPage=
    note.pages.length-1;

  saveData();

  renderCurrentPage();

}


function nextPage(){

  const note=
    getCurrentNote();

  if(
    currentPage<
    note.pages.length-1
  ){

    currentPage++;

    renderCurrentPage();

  }else{

    addPage();

  }

}


function previousPage(){

  if(currentPage>0){

    currentPage--;

    renderCurrentPage();

  }

}


/* =====================================================
ZOOM
===================================================== */

function zoomIn(){

  zoom=
    Math.min(
      2.5,
      zoom+.1
    );

  applyTransform();

}


function zoomOut(){

  zoom=
    Math.max(
      .25,
      zoom-.1
    );

  applyTransform();

}


function resetZoom(){

  zoom=.65;

  centerPage();

}


function centerPage(){

  const viewport=
    document.getElementById(
      "noteViewport"
    );

  if(!viewport)return;

  panX=
    (
      viewport.clientWidth-
      1200*zoom
    )/2;

  panY=
    (
      viewport.clientHeight-
      1700*zoom
    )/2;

  applyTransform();

}


function applyTransform(){

  const page=
    document.getElementById(
      "notePageCanvas"
    );

  if(!page)return;

  page.style.transform=
    `translate(${panX}px,${panY}px) scale(${zoom})`;

}


/* =====================================================
PAN
===================================================== */

let panning=false;
let panStartX=0;
let panStartY=0;
let panOriginX=0;
let panOriginY=0;

function startPan(e){

  if(currentTool!=="pan")return;

  panning=true;

  panStartX=e.clientX;
  panStartY=e.clientY;

  panOriginX=panX;
  panOriginY=panY;

}


function movePan(e){

  if(!panning)return;

  panX=
    panOriginX+
    e.clientX-
    panStartX;

  panY=
    panOriginY+
    e.clientY-
    panStartY;

  applyTransform();

}


function endPan(){

  panning=false;

}


/* =====================================================
OBJECT ERASER
===================================================== */

function objectErase(){

  setTool("object");

}


/* =====================================================
TOOL
===================================================== */

function setTool(tool){

  currentTool=tool;

  document
    .querySelectorAll(".toolBtn")
    .forEach(
      b=>b.classList.remove("active")
    );

  const btn=
    document.getElementById(
      "tool-"+tool
    );

  if(btn){

    btn.classList.add("active");

  }

  if(tool==="object"){

    canvas.style.pointerEvents=
      "none";

  }else{

    canvas.style.pointerEvents=
      "auto";

  }

}


/* =====================================================
TEXT
===================================================== */

function addText(){

  const page=
    getCurrentPage();

  const text=
    prompt(
      "入力する文章"
    );

  if(text===null)return;

  page.elements.push({

    type:"text",

/* =====================================================
STICKY
===================================================== */

function addSticky(){

  const page=
    getCurrentPage();

  const text=
    prompt(
      "付箋の内容"
    );

  if(text===null)return;

  page.elements.push({

    id:
      "el_"+Date.now(),

    type:"sticky",

    x:150,

    y:250,

    text:text

  });

  saveData();

  renderElements();

/* =====================================================
RENDER ELEMENTS
===================================================== */

function renderElements(){

  const pageEl=
    document.getElementById(
      "notePageCanvas"
    );

  if(!pageEl)return;

  pageEl
    .querySelectorAll(
      ".noteElement"
    )
    .forEach(
      e=>e.remove()
    );

  const page=
    getCurrentPage();

  page.elements.forEach(
    element=>{

      const el=
        document.createElement(
          "div"
        );

      el.className=
        "noteElement";

      if(
        element.type==="sticky"
      ){

        el.classList.add(
          "sticky"
        );

      }

      el.style.left=
        element.x+"px";

      el.style.top=
        element.y+"px";

      el.innerHTML=`

        <button
          class="objectDelete"
          onclick="
            deleteElement(
              '${element.id}'
            )
          ">

          ×

        </button>

        <textarea>${esc(
          element.text
        )}</textarea>

      `;

      const textarea=
        el.querySelector(
          "textarea"
        );

      textarea.addEventListener(
        "input",
        ()=>{

          element.text=
            textarea.value;

          saveData();

        }
      );


      if(currentTool==="object"){

        el.addEventListener(
          "pointerdown",
          e=>{

            e.stopPropagation();

            deleteElement(
              element.id
            );

          }
        );

      }else{

        makeDraggable(
          el,
          element
        );

      }

      pageEl.appendChild(el);

    }
  );

}


/* =====================================================
DRAG
===================================================== */

function makeDraggable(
  el,
  element
){

  let active=false;

  let startX;
  let startY;

  let originalX;
  let originalY;

  el.addEventListener(
    "pointerdown",
    e=>{

      if(
        e.target.tagName==="TEXTAREA" ||
        e.target.classList.contains(
          "objectDelete"
        )
      ){

        return;

      }

      active=true;

      startX=e.clientX;
      startY=e.clientY;

      originalX=element.x;
      originalY=element.y;

      el.setPointerCapture(
        e.pointerId
      );

    }
  );


  el.addEventListener(
    "pointermove",
    e=>{

      if(!active)return;

      element.x=
        originalX+
        (e.clientX-startX)/zoom;

      element.y=
        originalY+
        (e.clientY-startY)/zoom;

      el.style.left=
        element.x+"px";

      el.style.top=
        element.y+"px";

    }
  );


  el.addEventListener(
    "pointerup",
    ()=>{

      active=false;

      saveData();

    }
  );

}


/* =====================================================
DELETE OBJECT
===================================================== */

function deleteElement(id){

  const page=
    getCurrentPage();

  page.elements=
    page.elements.filter(
      e=>e.id!==id
    );

  saveData();

  renderElements();

}


/* =====================================================
PIXEL ERASER
===================================================== */

/*
  ピクセル消しゴムは
  destination-out で実際の
  キャンバスのピクセルを消す。
*/

function pixelEraser(){

  setTool("pixel");

}


/* =====================================================
FULL ERASE
===================================================== */

function fullErase(){

  if(
    !confirm(
      "このページを全部消しますか？\n\n"+
      "手書き・付箋・テキストがすべて消えます。"
    )
  ){

    return;

  }

  const page=
    getCurrentPage();

  page.image=null;

  page.elements=[];

  page.strokes=[];

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  saveData();

  renderElements();

}


/* =====================================================
SAVE NOTE
===================================================== */

function saveCurrentNote(){

  const note=
    getCurrentNote();

  if(!note)return;

  saveCanvasImage();

  note.updated=Date.now();

  saveData();

  alert(
    "ノートを保存しました！📚"
  );

}


/* =====================================================
DELETE NOTE
===================================================== */

function deleteCurrentNote(){

  const note=
    getCurrentNote();

  if(!note)return;

  if(
    !confirm(
      "このノートを削除しますか？"
    )
  ){

    return;

  }

  const folder=
    note.folder;

  data.notes=
    data.notes.filter(
      n=>n.id!==note.id
    );

  saveData();

  currentNoteId=null;

  renderFolder(folder);

}


/* =====================================================
TIMER
===================================================== */

function showTimer(){

  document.getElementById(
    "main"
  ).innerHTML=`

    <section class="card timer">

      <h2>
        ⏱️ 勉強タイマー
      </h2>

      <p>
        勉強した時間が
        総勉強時間に追加されます。
      </p>

      <div
        id="timerDisplay"
        class="timerCircle">

        00:00:00

      </div>

      <div class="addArea"
           style="justify-content:center">

        <button
          class="addBtn"
          onclick="startTimer()">

          ▶ 開始

        </button>

        <button
          class="addBtn secondary"
          onclick="pauseTimer()">

          ⏸ 一時停止

        </button>

        <button
          class="danger"
          onclick="finishTimer()">

          ⏹ 終了

        </button>

      </div>

    </section>

  `;

  activeNav(2);

}


function startTimer(){

  if(timerRunning)return;

  timerRunning=true;

  timerInterval=
    setInterval(
      ()=>{

        timerSeconds++;

        updateTimer();

      },
      1000
    );

}


function pauseTimer(){

  timerRunning=false;

  clearInterval(
    timerInterval
  );

}


function finishTimer(){

  pauseTimer();

  if(timerSeconds<=0){

    return;

  }

  data.totalSeconds+=
    timerSeconds;

  timerSeconds=0;

  saveData();

  updateTimer();

  alert(
    "勉強時間を記録しました！"
  );

}


function updateTimer(){

  const el=
    document.getElementById(
      "timerDisplay"
    );

  if(!el)return;

  const h=
    Math.floor(
      timerSeconds/3600
    );

  const m=
    Math.floor(
      (timerSeconds%3600)/60
    );

  const s=
    timerSeconds%60;

  el.textContent=
    String(h).padStart(2,"0")+
    ":"+
    String(m).padStart(2,"0")+
    ":"+
    String(s).padStart(2,"0");

}

/* =====================================================
BACKUP
===================================================== */

function exportData(){

  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "destination-note-backup.json";

  a.click();

  URL.revokeObjectURL(url);

}

DARK

function toggleDark(){

LOGOUT

      "ログアウトしますか？\n\n"+
      "データはこの端末に残ります。"
    )
  ){

    return;

/* =====================================================
NAV
===================================================== */

function activeNav(index){

  document
    .querySelectorAll(".navBtn")
    .forEach(
      (b,i)=>{
        b.classList.toggle(
          "active",
          i===index
        );
      }
    );

}


/* =====================================================
ESCAPE
===================================================== */

function esc(str){

  return String(str||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function attr(str){

  return esc(str);

}

AUTO LOAD

loadData();

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Destination Note</title>

<style>
:root{
  --bg:#eef3fa;
  --glass:rgba(255,255,255,.58);
  --glass2:rgba(255,255,255,.72);
  --border:rgba(255,255,255,.78);
  --text:#111318;
  --sub:#777c85;
  --blue:#007aff;
  --shadow:
    0 20px 60px rgba(70,80,110,.13),
    inset 0 1px 0 rgba(255,255,255,.85);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 0%,#dff4ff 0%,transparent 35%),
    radial-gradient(circle at 100% 20%,#f8dcff 0%,transparent 38%),
    linear-gradient(135deg,#eef7ff,#f8f8ff);
}

button,
input{
  font:inherit;
}

button{
  border:0;
}

.hidden{
  display:none!important;
}

/* =========================================================
   LIQUID GLASS
========================================================= */

.glass{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.72),
      rgba(255,255,255,.38)
    );
  backdrop-filter:blur(35px) saturate(180%);
  -webkit-backdrop-filter:blur(35px) saturate(180%);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:var(--shadow);
}

/* =========================================================
   LOGIN
========================================================= */

#loginScreen{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.loginCard{
  width:min(430px,100%);
  padding:36px;
  border-radius:38px;
  text-align:center;
}

.loginIcon{
  width:76px;
  height:76px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:24px;
  font-size:38px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.9),
      rgba(230,240,255,.55)
    );
  box-shadow:
    0 15px 35px rgba(70,90,120,.14),
    inset 0 1px 1px white;
}

.loginCard h1{
  margin:18px 0 5px;
  font-size:28px;
}

.loginCard p{
  color:var(--sub);
  margin-bottom:25px;
}

.loginCard input{
  width:100%;
  height:52px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.8);
  background:rgba(255,255,255,.55);
  padding:0 17px;
  outline:none;
  margin-bottom:12px;
  box-shadow:inset 0 1px 4px rgba(0,0,0,.03);
}

.primary{
  width:100%;
  height:52px;
  border-radius:18px;
  background:rgba(0,122,255,.9);
  color:white;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,122,255,.2);
}

.loginHint{
  font-size:12px;
  color:#8a8e96;
  margin-top:16px;
}

/* =========================================================
   APP
========================================================= */

#app{
  width:100%;
  height:100%;
  display:flex;
  gap:12px;
  padding:12px;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:300px;
  min-width:300px;
  height:100%;
  border-radius:28px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  z-index:20;
}

.sidebarHeader{
  padding:22px 20px 12px;
}

.appTitle{
  display:flex;
  align-items:center;
  gap:12px;
}

.appLogo{
  width:46px;
  height:46px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.7);
  box-shadow:
    inset 0 1px 1px white,
    0 8px 20px rgba(70,80,100,.1);
  font-size:24px;
}

.appTitle strong{
  display:block;
  font-size:18px;
}

.appTitle small{
  color:var(--sub);
  font-size:12px;
}

.tree{
  flex:1;
  overflow:auto;
  padding:10px 12px 100px;
  scrollbar-width:none;
}

.tree::-webkit-scrollbar{
  display:none;
}

/* row */

.treeRow{
  height:44px;
  display:flex;
  align-items:center;
  width:100%;
  border-radius:14px;
  margin:2px 0;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  transition:
    background .15s ease,
    transform .1s ease;
}

.treeRow:active{
  transform:scale(.985);
}

.treeRow.selected{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.72),
      rgba(255,255,255,.45)
    );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    0 5px 18px rgba(70,80,100,.08);
}

.treeArrow{
  width:30px;
  min-width:30px;
  height:44px;
  display:grid;
  place-items:center;
  color:#70757d;
  font-size:12px;
}

.treeIcon{
  width:28px;
  min-width:28px;
  font-size:19px;
}

.treeName{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:14px;
  font-weight:500;
  padding-right:10px;
}

.treeNote .treeIcon{
  font-size:17px;
}

/* bottom */

.sidebarBottom{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  height:54px;
  border-radius:20px;
  display:flex;
  gap:8px;
  padding:6px;
  background:rgba(255,255,255,.52);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,.7);
}

.sideButton{
  flex:1;
  border-radius:15px;
  background:rgba(255,255,255,.5);
  color:#111;
  cursor:pointer;
  font-size:13px;
}

.sideButton:active{
  transform:scale(.96);
}

/* =========================================================
   MAIN
========================================================= */

.main{
  flex:1;
  min-width:0;
  height:100%;
  border-radius:30px;
  overflow:hidden;
  position:relative;
}

.screen{
  width:100%;
  height:100%;
  overflow:auto;
  padding:34px;
}

/* =========================================================
   HOME / FOLDER
========================================================= */

.pageHeader{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:28px;
}

.backButton{
  width:48px;
  height:48px;
  border-radius:17px;
  background:rgba(255,255,255,.7);
  box-shadow:
    inset 0 1px 0 white,
    0 8px 20px rgba(60,70,100,.08);
  cursor:pointer;
  font-size:20px;
}

.folderTitleIcon{
  font-size:34px;
}

.pageHeader h1{
  margin:0;
  font-size:31px;
  letter-spacing:-.7px;
}

.pageHeader small{
  color:#8a8e96;
}

.sectionTitle{
  font-size:20px;
  margin:18px 0 14px;
}

.cards{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}

.card{
  min-height:140px;
  padding:25px;
  border-radius:27px;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.76),
      rgba(255,255,255,.43)
    );
  border:1px solid rgba(255,255,255,.72);
  box-shadow:
    0 18px 35px rgba(70,80,110,.09),
    inset 0 1px 0 rgba(255,255,255,.9);
  cursor:pointer;
  transition:.16s;
}

.card:active{
  transform:scale(.97);
}

.cardIcon{
  font-size:30px;
  margin-bottom:20px;
}

.cardTitle{
  font-weight:700;
  font-size:16px;
}

.cardSub{
  margin-top:7px;
  color:#8a8e96;
  font-size:12px;
}

/* =========================================================
   NOTE EDITOR
========================================================= */

.noteScreen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.noteTop{
  height:72px;
  min-height:72px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  z-index:50;
  background:rgba(255,255,255,.34);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border-bottom:1px solid rgba(255,255,255,.55);
}

.toolButton{
  width:45px;
  height:45px;
  min-width:45px;
  border-radius:15px;
  background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.65);
  cursor:pointer;
  font-size:19px;
  box-shadow:
    inset 0 1px 0 white,
    0 6px 15px rgba(50,60,80,.07);
}

.toolButton.active{
  background:rgba(0,122,255,.9);
  color:white;
}

.noteTitle{
  flex:1;
  min-width:100px;
  font-weight:700;
  font-size:17px;
  padding-left:6px;
}

.noteTitle input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  font-weight:700;
  font-size:17px;
}

.colorInput{
  width:42px;
  height:42px;
  padding:0;
  border:0;
  background:transparent;
}

/* toolbar bottom on small screen */

.noteTools{
  display:flex;
  gap:7px;
  align-items:center;
  overflow:auto;
  scrollbar-width:none;
}

.noteTools::-webkit-scrollbar{
  display:none;
}

.sizeControl{
  width:90px;
}

/* =========================================================
   FREEBOARD
========================================================= */

.boardViewport{
  flex:1;
  position:relative;
  overflow:hidden;
  touch-action:none;
  background:
    radial-gradient(circle at 20% 20%,rgba(100,180,255,.08),transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(240,120,255,.08),transparent 30%),
    #f8f9fc;
}

/* subtle freeboard grid */

.boardGrid{
  position:absolute;
  inset:-100%;
  width:300%;
  height:300%;
  background-image:
    radial-gradient(
      rgba(80,90,110,.12) 1px,
      transparent 1px
    );
  background-size:28px 28px;
  pointer-events:none;
  transform-origin:0 0;
}

/*
  World is intentionally huge.
  It behaves like an infinite canvas.
*/

.world{
  position:absolute;
  left:0;
  top:0;
  width:10000px;
  height:7000px;
  transform-origin:0 0;
}

#drawSvg{
  position:absolute;
  left:0;
  top:0;
  width:10000px;
  height:7000px;
  overflow:visible;
}

.boardObject{
  position:absolute;
  user-select:none;
  -webkit-user-select:none;
}

.textObject{
  min-width:80px;
  min-height:35px;
  padding:6px 9px;
  white-space:pre-wrap;
  font-weight:500;
  outline:none;
}

.stickyObject{
  width:220px;
  min-height:170px;
  padding:20px;
  border-radius:8px;
  background:#fff4a8;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
  white-space:pre-wrap;
  font-size:18px;
}

.imageObject{
  max-width:500px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.12);
}

/* selection */

.objectSelected{
  outline:2px solid rgba(0,122,255,.8);
  outline-offset:4px;
}

.resizeHandle{
  position:absolute;
  right:-8px;
  bottom:-8px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#007aff;
  border:3px solid white;
  cursor:nwse-resize;
}

/* =========================================================
   PAGE CONTROLS
========================================================= */

.pageControls{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:80;
  height:52px;
  padding:6px;
  display:flex;
  align-items:center;
  gap:6px;
  border-radius:19px;
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(25px) saturate(180%);
  -webkit-backdrop-filter:blur(25px) saturate(180%);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:
    0 12px 30px rgba(60,70,100,.13),
    inset 0 1px 0 white;
}

.pageControls button{
  width:40px;
  height:40px;
  border-radius:13px;
  background:rgba(255,255,255,.45);
  cursor:pointer;
}

.pageInfo{
  padding:0 8px;
  font-size:13px;
  white-space:nowrap;
}

/* =========================================================
   ZOOM
========================================================= */

.zoomControls{
  position:absolute;
  right:18px;
  bottom:18px;
  z-index:80;
  display:flex;
  gap:6px;
  padding:6px;
  border-radius:18px;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,.75);
}

.zoomControls button{
  width:40px;
  height:40px;
  border-radius:13px;
  background:rgba(255,255,255,.5);
}

/* =========================================================
   MOBILE
========================================================= */

.mobileMenu{
  display:none;
}

@media(max-width:800px){

  #app{
    padding:7px;
  }

  .sidebar{
    position:absolute;
    left:7px;
    top:7px;
    bottom:7px;
    height:auto;
    z-index:200;
    transform:translateX(-110%);
    transition:transform .25s ease;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    width:100%;
  }

  .mobileMenu{
    display:grid;
    place-items:center;
    position:absolute;
    left:14px;
    top:14px;
    z-index:100;
    width:45px;
    height:45px;
    border-radius:15px;
    background:rgba(255,255,255,.7);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }

  .screen{
    padding:75px 18px 25px;
  }

  .noteTop{
    padding-left:62px;
    height:auto;
    min-height:64px;
  }

  .noteTools{
    max-width:55%;
  }

  .cards{
    grid-template-columns:1fr;
  }
}

/* =========================================================
   DARK
========================================================= */

body.dark{
  --text:#f4f4f7;
  --sub:#aaaeb8;
  background:#111217;
}

body.dark .boardViewport{
  background:#18191e;
}

body.dark .treeRow.selected,
body.dark .card,
body.dark .glass,
body.dark .toolButton,
body.dark .pageControls,
body.dark .zoomControls{
  background:rgba(45,47,55,.65);
  border-color:rgba(255,255,255,.12);
}

body.dark .boardGrid{
  background-image:
    radial-gradient(
      rgba(255,255,255,.09) 1px,
      transparent 1px
    );
}
</style>
</head>

<body>

<!-- =======================================================
     LOGIN
======================================================= -->

<div id="loginScreen">

  <div class="loginCard glass">

    <div class="loginIcon">📚</div>

    <h1>Destination Note</h1>

    <p>自分だけの勉強ノート</p>

    <input
      id="loginName"
      placeholder="名前"
      autocomplete="username">

    <input
      id="loginPassword"
      type="password"
      placeholder="パスワード"
      autocomplete="current-password">

    <button
      class="primary"
      id="loginButton">
      はじめる
    </button>

    <div class="loginHint">
      この端末のブラウザにデータを保存します
    </div>

  </div>

</div>


<!-- =======================================================
     APP
======================================================= -->

<div id="app" class="hidden">

  <aside class="sidebar glass" id="sidebar">

    <div class="sidebarHeader">

      <div class="appTitle">

        <div class="appLogo">📚</div>

        <div>
          <strong>Destination Note</strong>
          <small id="userNameLabel"></small>
        </div>

      </div>

    </div>

    <div class="tree" id="tree"></div>

    <div class="sidebarBottom">

      <button
        class="sideButton"
        id="addFolderButton">
        ＋ タブ
      </button>

      <button
        class="sideButton"
        id="addNoteButton">
        ＋ ノート
      </button>

      <button
        class="sideButton"
        id="settingsButton">
        ⚙️
      </button>

    </div>

  </aside>


  <main class="main glass">

    <button
      class="mobileMenu"
      id="mobileMenu">
      ☰
    </button>

    <div id="mainContent"></div>

  </main>

</div>


<script>
"use strict";

/* =========================================================
   CONSTANTS
========================================================= */

const STORAGE_KEY = "destinationNote_v1";

const WORLD_W = 10000;
const WORLD_H = 7000;

let data = null;

let selectedFolderId = "root";
let selectedNoteId = null;

let expandedFolders = new Set();

let currentScreen = "folder";

let currentPage = 0;

let currentTool = "pen";

let currentColor = "#111111";

let brushSize = 4;

let camera = {
  x: 0,
  y: 0,
  zoom: 1
};

let drawing = false;
let currentStroke = null;

let pointers = new Map();

let pinchStart = null;

let selectedObjectId = null;

let autosaveTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const tree =
  document.getElementById("tree");

const mainContent =
  document.getElementById("mainContent");

const userNameLabel =
  document.getElementById("userNameLabel");


/* =========================================================
   HELPERS
========================================================= */

function uid(prefix="id"){
  return prefix + "_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2,9);
}


function saveData(){
  clearTimeout(autosaveTimer);

  autosaveTimer = setTimeout(()=>{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );
  },150);
}


function immediateSave(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}


function esc(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}


/* =========================================================
   DATA MIGRATION
========================================================= */

function createDefaultData(){

  const root = {
    id:"root",
    name:"マイノート",
    icon:"📚",
    parent:null,
    created:Date.now()
  };

  return {
    name:"",
    password:"",
    totalSeconds:0,
    folders:[root],
    notes:[],
    settings:{
      dark:false
    }
  };
}


function normalizeData(raw){

  const d = raw || createDefaultData();

  if(!Array.isArray(d.folders)){
    d.folders = [];
  }

  if(!Array.isArray(d.notes)){
    d.notes = [];
  }

  if(!d.settings){
    d.settings = {
      dark:false
    };
  }

  if(!d.folders.some(f=>f.id==="root")){

    d.folders.unshift({
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    });

  }

  /* folders */

  d.folders.forEach(f=>{

    if(!f.id){
      f.id = uid("folder");
    }

    if(!f.name ||
       f.name === "undefined"){
      f.name = "名称未設定";
    }

    if(f.id !== "root" &&
       !d.folders.some(
         p=>p.id === f.parent
       )){
      f.parent = "root";
    }

    if(!f.icon){
      f.icon = "📁";
    }

  });


  /* notes */

  d.notes.forEach(n=>{

    if(!n.id){
      n.id = uid("note");
    }

    if(!n.name ||
       n.name === "undefined" ||
       n.name === "null"){
      n.name = "新しいノート";
    }

    if(!n.folderId){
      n.folderId = "root";
    }

    if(!d.folders.some(
      f=>f.id === n.folderId
    )){
      n.folderId = "root";
    }

    if(!Array.isArray(n.pages)){
      n.pages = [];
    }

    if(n.pages.length === 0){

      n.pages.push({
        id:uid("page"),
        strokes:[],
        elements:[]
      });

    }

    n.pages.forEach(page=>{

      if(!page.id){
        page.id = uid("page");
      }

      if(!Array.isArray(page.strokes)){
        page.strokes = [];
      }

      if(!Array.isArray(page.elements)){
        page.elements = [];
      }

      /* old format */

      if(page.image){

        page.elements.push({
          id:uid("image"),
          type:"image",
          x:500,
          y:400,
          width:500,
          height:350,
          src:page.image
        });

        delete page.image;
      }

    });

  });

  return d;
}


/* =========================================================
   LOGIN
========================================================= */

function loadSaved(){

  const raw =
    localStorage.getItem(STORAGE_KEY);

  if(!raw){
    return null;
  }

  try{
    return normalizeData(
      JSON.parse(raw)
    );
  }catch{
    return null;
  }

}


document
  .getElementById("loginButton")
  .addEventListener("click",login);


function login(){

  const name =
    document
      .getElementById("loginName")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  if(!name || !password){
    alert("名前とパスワードを入力してね");
    return;
  }

  const saved = loadSaved();

  if(saved){

    if(
      saved.name !== name ||
      saved.password !== password
    ){
      alert("名前またはパスワードが違います");
      return;
    }

    data = saved;

  }else{

    data = createDefaultData();

    data.name = name;
    data.password = password;

    immediateSave();

  }

  startApp();
}


function startApp(){

  loginScreen.classList.add("hidden");
  app.classList.remove("hidden");

  userNameLabel.textContent =
    data.name;

  if(data.settings.dark){
    document.body.classList.add("dark");
  }

  expandedFolders.add("root");

  renderTree();

  openFolder(
    selectedFolderId || "root"
  );
}


/* =========================================================
   FOLDER FUNCTIONS
========================================================= */

function getFolder(id){
  return data.folders.find(
    f=>f.id===id
  );
}


function getNote(id){
  return data.notes.find(
    n=>n.id===id
  );
}


function childrenOf(folderId){

  return data.folders.filter(
    f=>f.parent === folderId
  );
}


function notesOf(folderId){

  return data.notes.filter(
    n=>n.folderId === folderId
  );
}


/* =========================================================
   SIDEBAR TREE
========================================================= */

function renderTree(){

  tree.innerHTML = "";

  const root =
    getFolder("root");

  if(root){
    renderFolderTree(
      root,
      0,
      tree
    );
  }
}


function renderFolderTree(
  folder,
  depth,
  parentEl
){

  const children =
    childrenOf(folder.id);

  const notes =
    notesOf(folder.id);

  const hasChildren =
    children.length > 0 ||
    notes.length > 0;

  const row =
    document.createElement("div");

  row.className =
    "treeRow " +
    (selectedFolderId === folder.id &&
     currentScreen !== "note"
       ? "selected"
       : "");

  row.style.paddingLeft =
    (depth * 17) + "px";

  /* arrow */

  const arrow =
    document.createElement("div");

  arrow.className =
    "treeArrow";

  arrow.textContent =
    hasChildren
      ? (
          expandedFolders.has(folder.id)
            ? "⌄"
            : "›"
        )
      : "";

  /* icon */

  const icon =
    document.createElement("div");

  icon.className =
    "treeIcon";

  icon.textContent =
    folder.icon || "📁";

  /* name */

  const name =
    document.createElement("div");

  name.className =
    "treeName";

  name.textContent =
    folder.name || "名称未設定";

  row.append(
    arrow,
    icon,
    name
  );

  /*
    ★重要

    三角だけではなく
    行全体をタップ可能にする。
  */

  row.addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      selectedFolderId =
        folder.id;

      selectedNoteId =
        null;

      /* childrenがある場合は開閉 */

      if(hasChildren){

        if(
          expandedFolders.has(folder.id)
        ){
          expandedFolders.delete(
            folder.id
          );
        }else{
          expandedFolders.add(
            folder.id
          );
        }

      }

      renderTree();

      openFolder(folder.id);

    }
  );


  /* long press / right click */

  row.addEventListener(
    "contextmenu",
    e=>{

      e.preventDefault();

      renameFolder(folder.id);

    }
  );


  parentEl.appendChild(row);


  /*
    children

    展開されている時だけ描画
  */

  if(
    expandedFolders.has(folder.id)
  ){

    children.forEach(child=>{

      renderFolderTree(
        child,
        depth + 1,
        parentEl
      );

    });

    notes.forEach(note=>{

      renderNoteTree(
        note,
        depth + 1,
        parentEl
      );

    });

  }

}


function renderNoteTree(
  note,
  depth,
  parentEl
){

  const row =
    document.createElement("div");

  row.className =
    "treeRow treeNote " +
    (
      selectedNoteId === note.id
        ? "selected"
        : ""
    );

  row.style.paddingLeft =
    (depth * 17) + "px";

  const spacer =
    document.createElement("div");

  spacer.className =
    "treeArrow";

  spacer.textContent = "";

  const icon =
    document.createElement("div");

  icon.className =
    "treeIcon";

  icon.textContent = "📝";

  const name =
    document.createElement("div");

  name.className =
    "treeName";

  name.textContent =
    note.name || "新しいノート";

  row.append(
    spacer,
    icon,
    name
  );

  /* ★ノートは文字部分も全部反応 */

  row.addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      openNote(note.id);

    }
  );

  row.addEventListener(
    "contextmenu",
    e=>{

      e.preventDefault();

      renameNote(note.id);

    }
  );

  parentEl.appendChild(row);
}

/* =========================================================
   BOARD COORDINATES
========================================================= */

function screenToWorld(clientX,clientY){

  const viewport =
    document.getElementById(
      "boardViewport"
    );

  const rect =
    viewport.getBoundingClientRect();

  return {

    x:
      (
        clientX -
        rect.left -
        camera.x
      ) /
      camera.zoom,

    y:
      (
        clientY -
        rect.top -
        camera.y
      ) /
      camera.zoom

  };

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  const world =
    document.getElementById("world");

  const grid =
    document.getElementById("boardGrid");

  if(!world){
    return;
  }

  world.style.transform =
    `translate3d(${camera.x}px,${camera.y}px,0)
     scale(${camera.zoom})`;

  if(grid){

    grid.style.transform =
      `translate3d(${camera.x}px,${camera.y}px,0)
       scale(${camera.zoom})`;

  }

}


function setZoom(newZoom){

  newZoom =
    Math.max(
      .25,
      Math.min(
        4,
        newZoom
      )
    );

  camera.zoom =
    newZoom;

  updateCamera();
}


/* =========================================================
   BOARD INPUT
========================================================= */

function setupBoard(){

  const viewport =
    document.getElementById(
      "boardViewport"
    );

  if(!viewport){
    return;
  }

  /*
    ★ iPad対応

    pointer eventsを使用。
    指の位置をそのまま取得する。
  */

  viewport.addEventListener(
    "pointerdown",
    onPointerDown,
    {passive:false}
  );

  viewport.addEventListener(
    "pointermove",
    onPointerMove,
    {passive:false}
  );

  viewport.addEventListener(
    "pointerup",
    onPointerUp,
    {passive:false}
  );

  viewport.addEventListener(
    "pointercancel",
    onPointerUp,
    {passive:false}
  );

  viewport.addEventListener(
    "wheel",
    e=>{

      if(e.ctrlKey){

        e.preventDefault();

        const amount =
          e.deltaY < 0
            ? 1.08
            : .92;

        setZoom(
          camera.zoom * amount
        );

      }

    },
    {passive:false}
  );

}


function onPointerDown(e){

  e.preventDefault();

  const viewport =
    document.getElementById(
      "boardViewport"
    );

  viewport.setPointerCapture?.(
    e.pointerId
  );

  pointers.set(
    e.pointerId,
    {
      x:e.clientX,
      y:e.clientY
    }
  );


  /*
    2本指
  */

  if(pointers.size === 2){

    drawing = false;

    const pts =
      [...pointers.values()];

    pinchStart = {

      distance:
        distance(
          pts[0],
          pts[1]
        ),

      zoom:
        camera.zoom,

      center:{
        x:
          (pts[0].x + pts[1].x) / 2,

        y:
          (pts[0].y + pts[1].y) / 2
      }

    };

    return;
  }


  /*
    ペン
  */

  if(
    currentTool === "pen" ||
    currentTool === "highlighter"
  ){

    const p =
      screenToWorld(
        e.clientX,
        e.clientY
      );

    drawing = true;

    currentStroke = {

      id:uid("stroke"),

      tool:currentTool,

      color:currentColor,

      width:
        currentTool === "highlighter"
          ? brushSize * 4
          : brushSize,

      opacity:
        currentTool === "highlighter"
          ? .28
          : 1,

      points:[
        {
          x:p.x,
          y:p.y
        }
      ]

    };

    const page =
      getNote(
        selectedNoteId
      ).pages[currentPage];

    page.strokes.push(
      currentStroke
    );

    drawCurrentPage();

    return;
  }


  /*
    消しゴム
  */

  if(
    currentTool === "pixel"
  ){

    eraseAt(
      screenToWorld(
        e.clientX,
        e.clientY
      )
    );

    return;
  }


  /*
    オブジェクト削除
  */

  if(
    currentTool === "object"
  ){

    const p =
      screenToWorld(
        e.clientX,
        e.clientY
      );

    deleteObjectAt(p);

    return;
  }


  /*
    手のひら
  */

  if(
    currentTool === "hand"
  ){

    drawing = true;

    currentStroke = {

      panX:
        e.clientX,

      panY:
        e.clientY,

      cameraX:
        camera.x,

      cameraY:
        camera.y

    };

    return;
  }


  /*
    テキスト
  */

  if(
    currentTool === "text"
  ){

    const p =
      screenToWorld(
        e.clientX,
        e.clientY
      );

    createText(
      p.x,
      p.y
    );

    return;
  }


  /*
    付箋
  */

  if(
    currentTool === "sticky"
  ){

    const p =
      screenToWorld(
        e.clientX,
        e.clientY
      );

    createSticky(
      p.x,
      p.y
    );

    return;
  }

}


function onPointerMove(e){

  e.preventDefault();

  if(
    pointers.has(e.pointerId)
  ){

    pointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

  }


  /*
    2本指操作
  */

  if(
    pointers.size === 2 &&
    pinchStart
  ){

    const pts =
      [...pointers.values()];

    const newDistance =
      distance(
        pts[0],
        pts[1]
      );

    const ratio =
      newDistance /
      pinchStart.distance;

    camera.zoom =
      Math.max(
        .25,
        Math.min(
          4,
          pinchStart.zoom *
          ratio
        )
      );

    /*
      2本指の中心移動
    */

    const newCenter = {

      x:
        (pts[0].x + pts[1].x) / 2,

      y:
        (pts[0].y + pts[1].y) / 2

    };

    camera.x +=
      newCenter.x -
      pinchStart.center.x;

    camera.y +=
      newCenter.y -
      pinchStart.center.y;

    pinchStart.center =
      newCenter;

    pinchStart.distance =
      newDistance;

    updateCamera();

    return;
  }


  if(!drawing){
    return;
  }


  /*
    ★ペン

    pointermoveの座標を
    そのまま記録。

    これで指に追従する。
  */

  if(
    currentTool === "pen" ||
    currentTool === "highlighter"
  ){

    const p =
      screenToWorld(
        e.clientX,
        e.clientY
      );

    if(currentStroke){

      const pts =
        currentStroke.points;

      const last =
        pts[pts.length - 1];

      /*
        小さすぎる移動は無視
        ただし指についてこないほど
        大きくはしない
      */

      const dx =
        p.x - last.x;

      const dy =
        p.y - last.y;

      if(
        Math.abs(dx) +
        Math.abs(dy) >
        .15
      ){

        pts.push({
          x:p.x,
          y:p.y
        });

        drawCurrentPage();

      }

    }

    return;
  }


  /*
    手のひら
  */

  if(
    currentTool === "hand"
  ){

    camera.x =
      currentStroke.cameraX +
      (
        e.clientX -
        currentStroke.panX
      );

    camera.y =
      currentStroke.cameraY +
      (
        e.clientY -
        currentStroke.panY
      );

    updateCamera();

  }

}


function onPointerUp(e){

  e.preventDefault();

  pointers.delete(
    e.pointerId
  );

  if(
    pointers.size < 2
  ){
    pinchStart = null;
  }

  drawing = false;

  currentStroke = null;

  saveData();

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

  const dx =
    a.x - b.x;

  const dy =
    a.y - b.y;

  return Math.sqrt(
    dx*dx + dy*dy
  );

}


/* =========================================================
   DRAW
========================================================= */

function pointsToPath(points){

  if(!points.length){
    return "";
  }

  if(points.length === 1){

    const p =
      points[0];

    return `
      M ${p.x} ${p.y}
      L ${p.x+.1} ${p.y+.1}
    `;

  }

  let d =
    `M ${points[0].x} ${points[0].y}`;

  for(
    let i=1;
    i<points.length;
    i++
  ){

    const p =
      points[i];

    d +=
      ` L ${p.x} ${p.y}`;

  }

  return d;
}


function drawCurrentPage(){

  const note =
    getNote(selectedNoteId);

  if(!note){
    return;
  }

  const page =
    note.pages[currentPage];

  const svg =
    document.getElementById(
      "drawSvg"
    );

  const layer =
    document.getElementById(
      "objectLayer"
    );

  if(!svg || !layer){
    return;
  }

  svg.innerHTML = "";

  layer.innerHTML = "";

  /*
    strokes
  */

  page.strokes.forEach(
    stroke=>{

      const path =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );

      path.setAttribute(
        "d",
        pointsToPath(
          stroke.points
        )
      );

      path.setAttribute(
        "fill",
        "none"
      );

      path.setAttribute(
        "stroke",
        stroke.color
      );

      path.setAttribute(
        "stroke-width",
        stroke.width
      );

      path.setAttribute(
        "stroke-linecap",
        "round"
      );

      path.setAttribute(
        "stroke-linejoin",
        "round"
      );

      path.setAttribute(
        "opacity",
        stroke.opacity ?? 1
      );

      /*
        highlighterを背面っぽくする
      */

      if(
        stroke.tool ===
        "highlighter"
      ){
        path.style.mixBlendMode =
          "multiply";
      }

      svg.appendChild(path);

    }
  );


  /*
    objects
  */

  page.elements.forEach(
    element=>{
      renderObject(
        element,
        layer
      );
    }
  );


  const pageInfo =
    document.getElementById(
      "pageInfo"
    );

  if(pageInfo){

    pageInfo.textContent =
      `${currentPage + 1} / ${note.pages.length}`;

  }

  updateCamera();

}


/* =========================================================
   ERASER
========================================================= */

function eraseAt(point){

  const note =
    getNote(selectedNoteId);

  if(!note){
    return;
  }

  const page =
    note.pages[currentPage];

  const radius =
    brushSize * 5;


  const newStrokes = [];


  page.strokes.forEach(
    stroke=>{

      let segment = [];

      let touched = false;


      stroke.points.forEach(
        p=>{

          const dx =
            p.x - point.x;

          const dy =
            p.y - point.y;

          const hit =
            Math.sqrt(
              dx*dx + dy*dy
            ) <= radius;


          if(hit){

            touched = true;

            if(
              segment.length >= 2
            ){

              newStrokes.push({

                ...stroke,

                id:uid("stroke"),

                points:[
                  ...segment
                ]

              });

            }

            segment = [];

          }else{

            segment.push(p);

          }

        }
      );


      if(
        segment.length >= 2
      ){

        newStrokes.push({

          ...stroke,

          id:uid("stroke"),

          points:[
            ...segment
          ]

        });

      }

      /*
        完全に触ってない場合

        そのまま保持
      */

      if(!touched){

        newStrokes.push(
          stroke
        );

      }

    }
  );


  page.strokes =
    newStrokes;

  drawCurrentPage();

  saveData();

}


/* =========================================================
   OBJECT DELETE
========================================================= */

function deleteObjectAt(point){

  const note =
    getNote(selectedNoteId);

  const page =
    note.pages[currentPage];

  const before =
    page.elements.length;

  page.elements =
    page.elements.filter(
      element=>{

        const w =
          element.width ||
          200;

        const h =
          element.height ||
          100;

        return !(
          point.x >= element.x &&
          point.x <= element.x+w &&
          point.y >= element.y &&
          point.y <= element.y+h
        );

      }
    );

  if(
    before !== page.elements.length
  ){

    saveData();
    drawCurrentPage();

  }

}

/* =========================================================
   OBJECT RENDER
========================================================= */

function renderObject(
  element,
  layer
){

  const el =
    document.createElement("div");

  el.className =
    "boardObject";

  el.dataset.id =
    element.id;

  el.style.left =
    element.x + "px";

  el.style.top =
    element.y + "px";

  el.style.width =
    (element.width || 200) + "px";

  el.style.height =
    (element.height || 100) + "px";


  if(
    selectedObjectId ===
    element.id
  ){

    el.classList.add(
      "objectSelected"
    );

  }


  /*
    text
  */

  if(
    element.type === "text"
  ){

    el.classList.add(
      "textObject"
    );

    el.textContent =
      element.text;

    el.style.color =
      element.color ||
      "#111";

    el.style.fontSize =
      (element.fontSize || 20)
      + "px";

  }


  /*
    sticky
  */

  if(
    element.type === "sticky"
  ){

    el.classList.add(
      "stickyObject"
    );

    el.textContent =
      element.text;

    el.style.fontSize =
      (element.fontSize || 18)
      + "px";

    el.style.background =
      element.color ||
      "#fff4a8";

  }


  /*
    image
  */

  if(
    element.type === "image"
  ){

    const img =
      document.createElement("img");

    img.className =
      "imageObject";

    img.src =
      element.src;

    img.style.width =
      "100%";

    img.style.height =
      "100%";

    img.style.objectFit =
      "contain";

    el.appendChild(img);

  }


  /*
    object interaction
  */

  el.addEventListener(
    "pointerdown",
    e=>{

      e.stopPropagation();

      selectedObjectId =
        element.id;

      if(
        currentTool === "object"
      ){
        return;
      }

      if(
        currentTool === "hand"
      ){
        return;
      }

      startObjectDrag(
        e,
        element,
        el
      );

    }
  );


  /*
    resize handle
  */

  if(
    selectedObjectId ===
    element.id
  ){

    const handle =
      document.createElement("div");

    handle.className =
      "resizeHandle";

    handle.addEventListener(
      "pointerdown",
      e=>{

        e.stopPropagation();

        startResize(
          e,
          element,
          el
        );

      }
    );

    el.appendChild(handle);

  }


  layer.appendChild(el);

}


/* =========================================================
   OBJECT DRAG
========================================================= */

function startObjectDrag(
  e,
  element,
  dom
){

  if(
    currentTool !== "text" &&
    currentTool !== "sticky"
  ){
    /*
      テキスト・付箋を
      選択した時だけ移動。
      普通のペン操作を邪魔しない。
    */
  }

  const startX =
    e.clientX;

  const startY =
    e.clientY;

  const originalX =
    element.x;

  const originalY =
    element.y;


  const move = ev=>{

    const dx =
      (ev.clientX-startX) /
      camera.zoom;

    const dy =
      (ev.clientY-startY) /
      camera.zoom;

    element.x =
      originalX + dx;

    element.y =
      originalY + dy;

    dom.style.left =
      element.x + "px";

    dom.style.top =
      element.y + "px";

  };


  const up = ()=>{

    window.removeEventListener(
      "pointermove",
      move
    );

    window.removeEventListener(
      "pointerup",
      up
    );

    saveData();

  };


  window.addEventListener(
    "pointermove",
    move
  );

  window.addEventListener(
    "pointerup",
    up
  );

}


/* =========================================================
   RESIZE
========================================================= */

function startResize(
  e,
  element,
  dom
){

  const startX =
    e.clientX;

  const startY =
    e.clientY;

  const originalW =
    element.width;

  const originalH =
    element.height;


  const move = ev=>{

    element.width =
      Math.max(
        60,
        originalW +
        (
          ev.clientX-startX
        ) / camera.zoom
      );

    element.height =
      Math.max(
        40,
        originalH +
        (
          ev.clientY-startY
        ) / camera.zoom
      );

    dom.style.width =
      element.width + "px";

    dom.style.height =
      element.height + "px";

  };


  const up = ()=>{

    window.removeEventListener(
      "pointermove",
      move
    );

    window.removeEventListener(
      "pointerup",
      up
    );

    saveData();

  };


  window.addEventListener(
    "pointermove",
    move
  );

  window.addEventListener(
    "pointerup",
    up
  );

}

  const name =

    );

  if(
    name === null

    return;

    name.trim() ||

  saveData();

  renderTree();

  if(
    currentScreen === "folder"

    openFolder(id);
  }

}

}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Destination Note</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;
  color:#111;
}

body{
  background:
    radial-gradient(
      circle at 15% 5%,
      rgba(255,255,255,.95),
      transparent 32%
    ),
    radial-gradient(
      circle at 100% 20%,
      rgba(205,225,255,.7),
      transparent 38%
    ),
    linear-gradient(
      135deg,
      #edf4fc,
      #e5ebf5
    );
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   GLASS
========================= */

.glass{
  background:rgba(255,255,255,.54);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:
    0 18px 50px rgba(30,55,90,.12),
    inset 0 1px 0 rgba(255,255,255,.85);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-card{
  width:min(430px,100%);
  padding:34px;
  border-radius:32px;
}

.login-logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:-2px;
}

.login-sub{
  color:#707986;
  margin-top:5px;
  margin-bottom:25px;
}

.login-input{
  width:100%;
  padding:15px 17px;
  margin:6px 0;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.8);
  background:rgba(255,255,255,.7);
  outline:none;
}

.login-input:focus{
  box-shadow:0 0 0 4px rgba(60,120,255,.12);
}

.login-button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:17px;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#111,#3b3b3b);
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100%;
  display:none;
}

#app.show{
  display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:290px;
  height:100%;
  padding:14px;
  flex:none;
  z-index:50;
}

.sidebar-inner{
  height:100%;
  border-radius:28px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.home-button{
  margin:12px;
  padding:14px;
  border-radius:23px;
  cursor:pointer;
  transition:.18s;
}

.home-button:hover{
  background:rgba(255,255,255,.4);
}

.home-button:active{
  transform:scale(.97);
}

.brand{
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand-user{
  color:#737d89;
  font-size:13px;
  margin-top:3px;
}

.side-actions{
  display:flex;
  gap:7px;
  padding:0 12px 10px;
}

.side-action{
  flex:1;
  border:0;
  padding:10px 5px;
  border-radius:14px;
  background:rgba(255,255,255,.55);
}

.tree{
  flex:1;
  overflow:auto;
  padding:5px 9px;
}

.tree-row{
  display:flex;
  align-items:center;
  min-height:40px;
  margin:2px 0;
  padding:5px 7px;
  border-radius:13px;
  cursor:pointer;
  user-select:none;
}

.tree-row:hover{
  background:rgba(255,255,255,.5);
}

.tree-row.selected{
  background:rgba(255,255,255,.78);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    0 5px 15px rgba(0,0,0,.04);
}

.tree-arrow{
  width:23px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777f89;
}

.tree-icon{
  width:27px;
  text-align:center;
}

.tree-name{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
}

.side-bottom{
  padding:12px;
}

.study-mini{
  padding:14px;
  border-radius:18px;
  background:rgba(255,255,255,.42);
}

.study-mini-label{
  font-size:11px;
  color:#747e89;
}

.study-mini-time{
  font-size:20px;
  font-weight:900;
  margin-top:3px;
}

/* =========================
   MAIN
========================= */

.main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:72px;
  padding:12px 15px;
}

.topbar-inner{
  width:100%;
  height:100%;
  border-radius:23px;
  display:flex;
  align-items:center;
  padding:7px 10px;
}

.menu-button{
  display:none;
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.65);
}

.page-title{
  flex:1;
  font-size:20px;
  font-weight:850;
  padding-left:8px;
}

.top-button{
  border:0;
  padding:10px 14px;
  border-radius:14px;
  background:rgba(255,255,255,.58);
}

/* =========================
   CONTENT
========================= */

.content{
  flex:1;
  overflow:auto;
  padding:0 16px 25px;
}

.content::-webkit-scrollbar{
  width:6px;
}

.content::-webkit-scrollbar-thumb{
  background:rgba(0,0,0,.12);
  border-radius:99px;
}

/* =========================
   HOME
========================= */

.home{
  max-width:1250px;
  margin:auto;
}

.home-header{
  padding:16px 5px;
}

.home-title{
  font-size:38px;
  font-weight:900;
  letter-spacing:-1.8px;
}

.home-date{
  color:#737d89;
  margin-top:4px;
}

.stats{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.stat{
  min-height:100px;
  padding:18px 20px;
  border-radius:25px;
  position:relative;
  overflow:hidden;
}

.stat-top{
  display:flex;
  align-items:center;
}

.stat-label{
  flex:1;
  color:#6d7682;
  font-size:13px;
}

.stat-value{
  font-size:22px;
  font-weight:900;
}

.progress{
  height:11px;
  margin-top:13px;
  border-radius:99px;
  overflow:hidden;
  background:rgba(0,0,0,.07);
}

.progress-bar{
  height:100%;
  width:0%;
  border-radius:99px;
  background:
    linear-gradient(
      90deg,
      #4e80ff,
      #75c7ff
    );
  transition:width .5s ease;
}

.stat-small{
  margin-top:6px;
  color:#7b8490;
  font-size:11px;
}

.rank-card{
  margin-top:15px;
  padding:20px;
  border-radius:25px;
  display:flex;
  align-items:center;
  gap:15px;
}

.rank-icon{
  width:56px;
  height:56px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.65);
  font-size:28px;
}

.rank-name{
  font-size:24px;
  font-weight:900;
}

.rank-sub{
  color:#747d89;
  font-size:12px;
  margin-top:3px;
}

/* =========================
   NEXT EVENT
========================= */

.next-event{
  margin-top:15px;
  padding:21px;
  border-radius:27px;
}

.next-label{
  color:#747d89;
  font-size:12px;
}

.next-name{
  font-size:26px;
  font-weight:900;
  margin-top:5px;
}

.next-days{
  font-size:45px;
  font-weight:950;
  letter-spacing:-2px;
  margin-top:2px;
}

.next-days span{
  font-size:17px;
  letter-spacing:0;
}

.next-date{
  color:#747d89;
  font-size:13px;
}

/* =========================
   CALENDAR
========================= */

.calendar-card{
  margin-top:15px;
  padding:20px;
  border-radius:27px;
}

.calendar-header{
  display:flex;
  align-items:center;
  margin-bottom:15px;
}

.calendar-title{
  flex:1;
  font-size:21px;
  font-weight:900;
}

.month-button{
  width:38px;
  height:38px;
  border:0;
  border-radius:13px;
  background:rgba(255,255,255,.6);
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.weekday{
  text-align:center;
  color:#7c8590;
  font-size:11px;
  padding:4px;
}

.day{
  min-height:72px;
  padding:7px;
  border-radius:14px;
  background:rgba(255,255,255,.25);
  cursor:pointer;
  overflow:hidden;
}

.day:hover{
  background:rgba(255,255,255,.58);
}

.day.other{
  opacity:.3;
}

.day.today{
  box-shadow:
    inset 0 0 0 2px
    rgba(65,120,255,.55);
}

.day-number{
  font-size:12px;
  font-weight:800;
}

.day-study{
  font-size:9px;
  color:#5375ac;
  margin-top:4px;
}

.event{
  margin-top:4px;
  padding:2px 5px;
  border-radius:6px;
  background:rgba(70,120,255,.14);
  color:#4168a9;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.add-event-button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:16px;
  background:rgba(255,255,255,.6);
  font-weight:800;
}

/* =========================
   FOLDER
========================= */

.folder-view{
  max-width:1200px;
  margin:auto;
}

.folder-header{
  display:flex;
  align-items:center;
  gap:13px;
  padding:16px 4px;
}

.folder-icon{
  width:57px;
  height:57px;
  border-radius:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(255,255,255,.6);
  font-size:28px;
}

.folder-title{
  font-size:29px;
  font-weight:900;
}

.folder-actions{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.action{
  border:0;
  padding:11px 14px;
  border-radius:14px;
  background:rgba(255,255,255,.6);
}

.delete-action{
  background:rgba(255,80,80,.12);
  color:#c33;
}

.item-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));
  gap:14px;
}

.item{
  min-height:135px;
  padding:18px;
  border-radius:23px;
  cursor:pointer;
  transition:.18s;
  position:relative;
}

.item:hover{
  transform:translateY(-2px);
}

.item-icon{
  font-size:32px;
}

.item-name{
  margin-top:12px;
  font-weight:800;
}

.item-delete{
  position:absolute;
  right:10px;
  top:10px;
  border:0;
  width:32px;
  height:32px;
  border-radius:10px;
  background:rgba(255,80,80,.12);
  color:#c33;
}

/* =========================
   NOTE EDITOR
========================= */

.note-screen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  background:#f4f6f9;
}

.note-toolbar{
  min-height:64px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px;
  overflow-x:auto;
  background:rgba(255,255,255,.78);
  border-bottom:1px solid rgba(0,0,0,.08);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  flex:none;
}

.note-tool{
  flex:none;
  min-width:42px;
  height:42px;
  padding:0 11px;
  border:0;
  border-radius:13px;
  background:#e9edf2;
  font-weight:700;
}

.note-tool:active{
  transform:scale(.94);
}

.note-tool.active{
  background:#111;
  color:white;
}

.history-button{
  font-size:22px;
  font-weight:500;
}

.history-button:disabled{
  opacity:.3;
  cursor:default;
}

.note-separator{
  width:1px;
  height:30px;
  background:rgba(0,0,0,.1);
  flex:none;
}

.color-input{
  width:42px;
  height:42px;
  border:0;
  padding:3px;
  border-radius:13px;
  background:#e9edf2;
  flex:none;
}

.size-input{
  width:110px;
  flex:none;
}

/* テキスト設定 */

.text-settings{
  display:flex;
  align-items:center;
  gap:5px;
  flex:none;
}

.text-size-input{
  width:95px;
  flex:none;
}

.text-color-input{
  width:42px;
  height:42px;
  border:0;
  padding:3px;
  border-radius:13px;
  background:#e9edf2;
  flex:none;
}

.text-size-label{
  font-size:11px;
  color:#707986;
  white-space:nowrap;
}

/* =========================
   NOTE BOARD
========================= */

.note-board-wrap{
  flex:1;
  position:relative;
  overflow:hidden;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;

  background:
    radial-gradient(
      circle,
      rgba(0,0,0,.07) 1px,
      transparent 1px
    );
  background-size:25px 25px;
}

.note-board{
  position:absolute;
  left:0;
  top:0;
  width:5000px;
  height:3500px;
  background:white;
  transform-origin:0 0;
  box-shadow:0 20px 60px rgba(0,0,0,.08);
}

#drawCanvas{
  position:absolute;
  left:0;
  top:0;
  width:5000px;
  height:3500px;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

#objectLayer{
  position:absolute;
  left:0;
  top:0;
  width:5000px;
  height:3500px;
  pointer-events:none;
}

.note-object{
  position:absolute;
  user-select:none;
  touch-action:none;
  pointer-events:auto;
}

.text-object{
  min-width:70px;
  min-height:35px;
  padding:2px 4px;
  margin:0;
  border:0!important;
  outline:0!important;
  background:transparent!important;
  box-shadow:none!important;
  white-space:pre-wrap;
  overflow:visible;
  word-break:break-word;
  user-select:none;
  -webkit-user-select:none;
  cursor:default;
  line-height:1.25;
}

.text-object.selected{
  border:0!important;
  outline:0!important;
  background:transparent!important;
  box-shadow:none!important;
}

/* テキストを編集中だけ青い枠を表示 */
.text-object.editing{
  border:2px solid #4d84ff!important;
  outline:none!important;
  background:rgba(77,132,255,.06)!important;
  box-shadow:0 0 0 3px rgba(77,132,255,.12)!important;
  border-radius:7px;
  padding:3px 5px;
  user-select:text;
  -webkit-user-select:text;
  cursor:text;
  overflow:visible;
  width:max-content;
  max-width:none;
  height:auto!important;
  min-height:0;
}

.text-object.editing:focus{
  outline:none!important;
}

.sticky-object{
  min-width:150px;
  min-height:110px;
  padding:14px;
  background:#fff3a6;
  border-radius:8px;
  box-shadow:0 7px 18px rgba(0,0,0,.15);
  white-space:pre-wrap;
}

.note-object.selected:not(.text-object){
  outline:2px solid #4d84ff;
}

.note-resize{
  position:absolute;
  right:-7px;
  bottom:-7px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#4d84ff;
}

/* 画像 */

.image-object{
  display:block;
  object-fit:contain;
  background:transparent;
  border-radius:8px;
  box-shadow:0 8px 22px rgba(0,0,0,.12);
  -webkit-user-drag:none;
  user-drag:none;
}

.image-object.selected{
  outline:2px solid #4d84ff;
}

/* 定規 */

.ruler-element{
  position:absolute;
  height:0;
  transform-origin:0 50%;
  border-top:2px solid #333;
  pointer-events:none;
}

.ruler-element::before,
.ruler-element::after{
  content:"";
  position:absolute;
  top:-8px;
  width:2px;
  height:16px;
  background:#333;
}

.ruler-element::before{
  left:0;
}

.ruler-element::after{
  right:0;
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(20,25,35,.22);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal{
  width:min(470px,100%);
  max-height:90vh;
  overflow:auto;
  padding:24px;
  border-radius:27px;
}

.modal-title{
  font-size:24px;
  font-weight:900;
  margin-bottom:17px;
}

.modal-label{
  display:block;
  color:#6e7783;
  font-size:12px;
  margin:10px 0 5px;
}

.modal-input,
.modal-select{
  width:100%;
  padding:13px;
  border:1px solid rgba(0,0,0,.08);
  border-radius:14px;
  background:rgba(255,255,255,.72);
  outline:none;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.modal-button{
  flex:1;
  padding:13px;
  border:0;
  border-radius:15px;
  background:rgba(255,255,255,.7);
}

.modal-button.primary{
  background:#111;
  color:white;
}

.event-list{
  margin-top:20px;
}

.event-list-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border-radius:13px;
  background:rgba(255,255,255,.45);
  margin-top:6px;
}

.event-list-name{
  flex:1;
}

.delete-event{
  border:0;
  border-radius:10px;
  padding:6px 9px;
  background:rgba(255,80,80,.12);
  color:#c33;
}

/* =========================
   SETTINGS
========================= */

.settings{
  max-width:900px;
  margin:auto;
}

.settings-title{
  font-size:34px;
  font-weight:900;
  padding:20px 5px;
}

.settings-card{
  padding:20px;
  border-radius:25px;
  margin-bottom:14px;
}

.settings-card h3{
  margin:0 0 6px;
}

.settings-card p{
  color:#737d89;
  font-size:13px;
}

.settings-button{
  border:0;
  padding:12px 15px;
  border-radius:14px;
  background:rgba(255,255,255,.65);
  margin-right:6px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:-320px;
    top:0;
    bottom:0;
    transition:.25s ease;
  }

  .sidebar.open{
    left:0;
  }

  .menu-button{
    display:block;
  }

  .topbar{
    height:67px;
  }

  .content{
    padding-left:11px;
    padding-right:11px;
  }

  .home-title{
    font-size:30px;
  }

  .day{
    min-height:60px;
  }

  .calendar-card{
    padding:12px;
  }

  .folder-actions{
    display:none;
  }

  .note-toolbar{
    min-height:58px;
    padding:6px;
  }

  .note-tool{
    min-width:40px;
    height:40px;
  }

  .text-size-label{
    display:none;
  }

}

/* ===== TEXT FIX ===== */
.note-text{
  position:absolute;
  box-sizing:border-box;
  width:max-content !important;
  min-width:40px;
  height:auto !important;
  min-height:1.4em;
  max-width:none !important;
  padding:4px 6px;
  border:none;
  outline:none;
  background:transparent;
  box-shadow:none;
  white-space:pre-wrap;
  overflow:visible !important;
  word-break:break-word;
  overflow-wrap:anywhere;
  line-height:1.4;
  user-select:text;
  -webkit-user-select:text;
  z-index:20;
}
.note-text.editing{
  border:2px solid #007aff;
  border-radius:4px;
  background:rgba(255,255,255,.15);
}
.note-text:not(.editing){
  border:none;
  outline:none;
  background:transparent;
  box-shadow:none;
}
.note-text:focus{outline:none;}
.note-text[contenteditable="true"]{
  width:max-content !important;
  min-width:40px;
  height:auto !important;
  min-height:1.4em;
  max-width:none !important;
  overflow:visible !important;
}

</style>
</head>

/* =========================================================
   DATA
========================================================= */

const STORAGE_KEY = "destinationNote_v1";

const defaultData = {

  name:"",
  password:"",

  totalSeconds:0,

  studyLog:{},

  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],

  notes:[],

  events:[],

  settings:{
    dark:false
  }

};


let data=loadData();

let currentView="home";

let currentFolderId="root";

let currentNoteId=null;

let currentCalendar=new Date();

let expandedFolders=new Set(["root"]);


/* =========================================================
   LOAD / SAVE
========================================================= */

function loadData(){

  try{

    const raw=
      localStorage.getItem(STORAGE_KEY);

    if(!raw){

      return structuredClone(
        defaultData
      );

    }

    const parsed=
      JSON.parse(raw);


    if(!parsed.folders){

      parsed.folders=
        structuredClone(
          defaultData.folders
        );

    }


    if(!parsed.notes){

      parsed.notes=[];

    }


    if(!parsed.events){

      parsed.events=[];

    }


    if(!parsed.studyLog){

      parsed.studyLog={};

    }


    return parsed;

  }catch(e){

    console.error(e);

    return structuredClone(
      defaultData
    );

  }

}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

  updateMiniStudy();

}


/* =========================================================
   UTIL
========================================================= */

function uid(prefix="id"){

  return (
    prefix+
    "_"+
    Date.now()+
    "_"+
    Math.random()
      .toString(36)
      .slice(2,9)
  );

}


function escapeHtml(str){

  return String(str??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function todayKey(){

  const d=new Date();

  const y=d.getFullYear();

  const m=
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const day=
    String(
      d.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function formatDateJP(d){

  return (
    `${d.getFullYear()}年`+
    `${d.getMonth()+1}月`+
    `${d.getDate()}日`
  );

}


function formatStudyTime(seconds){

  seconds=
    Math.max(
      0,
      Math.floor(seconds||0)
    );

  const h=
    Math.floor(
      seconds/3600
    );

  const m=
    Math.floor(
      (seconds%3600)/60
    );

  if(h>0){

    return `${h}h ${m}m`;

  }

  return `${m}分`;

}

function getNearestEvent(){

  const today=
    new Date(
      todayKey()+
      "T00:00:00"
    );


  const future=
    data.events
      .map(e=>{

        const d=
          new Date(
            e.date+
            "T00:00:00"
          );

        return {

          ...e,

          dateObj:d,

          days:Math.ceil(
            (d-today)/
            86400000
          ),

          date:
            `${d.getFullYear()}年`+
            `${d.getMonth()+1}月`+
            `${d.getDate()}日`

        };

      })
      .filter(
        e=>e.days>=0
      )
      .sort(
        (a,b)=>
          a.dateObj-b.dateObj
      );


  return future[0] || null;

}


/* =========================================================
   SIDEBAR TREE
========================================================= */

function renderTree(){

  const tree=
    document.getElementById(
      "tree"
    );

  tree.innerHTML="";

  const root=
    data.folders.find(
      f=>f.id==="root"
    );

  if(root){

    renderFolderTree(
      root,
      0,
      tree
    );

  }

}


function renderFolderTree(
  folder,
  depth,
  parentEl
){

  const children=
    data.folders.filter(
      f=>f.parent===folder.id
    );

  const notes=
    data.notes.filter(
      n=>n.folderId===folder.id
    );

  const hasChildren=
    children.length>0 ||
    notes.length>0;

  const row=
    document.createElement(
      "div"
    );

  row.className=
    "tree-row"+
    (
      selectedFolderId===folder.id
      ?
      " selected"
      :
      ""
    );


  row.style.paddingLeft=
    (
      7+
      depth*17
    )+
    "px";


  row.innerHTML=`

    <div class="tree-arrow">

      ${
        hasChildren
        ?
        (
          expandedFolders.has(
            folder.id
          )
          ?
          "⌄"
          :
          "›"
        )
        :
        ""
      }

    </div>

    <div class="tree-icon">
      ${folder.icon || "📁"}
    </div>

    <div class="tree-name">
      ${escapeHtml(
        folder.name
      )}
    </div>

  `;


  row.onclick=(e)=>{

    e.stopPropagation();

    selectedFolderId=
      folder.id;

    currentFolderId=
      folder.id;


    if(hasChildren){

      if(
        expandedFolders.has(
          folder.id
        )
      ){

        expandedFolders.delete(
          folder.id
        );

      }else{

        expandedFolders.add(
          folder.id
        );

      }

    }


    renderTree();

    openFolder(
      folder.id
    );

  };


  row.oncontextmenu=(e)=>{

    e.preventDefault();

    renameFolder(
      folder.id
    );

  };


  parentEl.appendChild(
    row
  );


  if(
    expandedFolders.has(
      folder.id
    )
  ){

    for(
      const child
      of children
    ){

      renderFolderTree(
        child,
        depth+1,
        parentEl
      );

    }


    for(
      const note
      of notes
    ){

      renderNoteTree(
        note,
        depth+1,
        parentEl
      );

    }

  }

}


function renderNoteTree(
  note,
  depth,
  parentEl
){

  const row=
    document.createElement(
      "div"
    );

  row.className=
    "tree-row";

  row.style.paddingLeft=
    (
      7+
      depth*17
    )+
    "px";


  row.innerHTML=`

    <div class="tree-arrow"></div>

    <div class="tree-icon">
      📝
    </div>

    <div class="tree-name">

      ${escapeHtml(
        note.title ||
        note.name ||
        "無題のノート"
      )}

    </div>

  `;


  row.onclick=(e)=>{

    e.stopPropagation();

    openNote(
      note.id
    );

  };


  row.oncontextmenu=(e)=>{

    e.preventDefault();

    renameNote(
      note.id
    );

  };


  parentEl.appendChild(
    row
  );

}


/* =========================================================

========================================================= */

function createFolder(){

  const name=
    prompt(
      "フォルダ名を入力してね",
      "新しいフォルダ"
    );

  if(!name)return;

  const trimmed=
    name.trim();

  if(!trimmed)return;


  const parent=
    currentFolderId ||
    selectedFolderId ||
    "root";


  const folder={

    id:uid("folder"),

    name:trimmed,

    icon:"📁",

    parent,

    created:Date.now()

  };


  data.folders.push(
    folder
  );

  expandedFolders.add(
    parent
  );

  expandedFolders.add(
    folder.id
  );

  saveData();

  renderTree();

  openFolder(
    folder.id
  );

}


function renameFolder(id){

  const folder=
    data.folders.find(
      f=>f.id===id
    );

  if(!folder)return;


  if(id==="root"){

    alert(
      "マイノートは名前変更できません"
    );

    return;

  }


  const name=
    prompt(
      "新しい名前",
      folder.name
    );

  if(!name)return;


  const trimmed=
    name.trim();

  if(!trimmed)return;


  folder.name=
    trimmed;

  saveData();

  renderTree();


  if(
    currentFolderId===id
  ){

    openFolder(id);

  }

}


/* =========================
   DELETE FOLDER
========================= */

function deleteFolder(id){

  if(id==="root"){

    alert(
      "マイノートは削除できません"
    );

    return;

  }


  const folder=
    data.folders.find(
      f=>f.id===id
    );

  if(!folder)return;


  const foldersToDelete=[];


  function collect(folderId){

    foldersToDelete.push(
      folderId
    );


    const children=
      data.folders.filter(
        f=>f.parent===folderId
      );


    for(
      const child
      of children
    ){

      collect(
        child.id
      );

    }

  }


  collect(id);


  const notesToDelete=
    data.notes.filter(
      n=>
        foldersToDelete.includes(
          n.folderId
        )
    );


  const message=
    `「${folder.name}」を削除しますか？\n\n`+
            if(!raw){

      return structuredClone(
        defaultData
      );

    }

    const d=JSON.parse(raw);

    if(!d.folders){

      d.folders=
        structuredClone(
          defaultData.folders
        );

    }

    if(!d.notes){

      d.notes=[];

    }

    if(!d.events){

      d.events=[];

    }

    if(!d.studyLog){

      d.studyLog={};

    }

    if(typeof d.totalSeconds!=="number"){

      d.totalSeconds=0;

    }


    for(const note of d.notes){

      if(!note.id){

        note.id=
          "note_"+
          Date.now()+
          Math.random();

      }

      if(!note.folderId){

        note.folderId="root";

      }

      if(!note.title){

        note.title=
          note.name ||
          "無題のノート";

      }

      if(!Array.isArray(note.pages)){

        note.pages=[
          {
            strokes:[],
            elements:[]
          }
        ];

      }

      if(
        typeof note.pageIndex!=="number" ||
        note.pageIndex<0
      ){

        note.pageIndex=0;

      }


      for(const page of note.pages){

        if(!Array.isArray(page.strokes)){

          page.strokes=[];

        }

        if(!Array.isArray(page.elements)){

          page.elements=[];

        }


        for(const obj of page.elements){

          if(obj.type==="text"){

            if(typeof obj.fontSize!=="number"){

              obj.fontSize=24;

            }

            if(!obj.color){

              obj.color="#111111";

            }

          }

          if(obj.type==="image"){

            if(!obj.width){

              obj.width=500;

            }

            if(!obj.height){

              obj.height=350;

            }

          }

        }

      }


      if(
        note.pageIndex>=note.pages.length
      ){

        note.pageIndex=
          note.pages.length-1;

      }

    }

    return d;

  }catch(e){

    console.error(e);

    return structuredClone(
      defaultData
    );

  }

}

    );

  }

}

}


function todayKey(){

    String(
      d.getDate()

}


function formatTime(sec){

      sec/3600
    );

  const m=

}


function monthKey(date){

}

let trackingStart=

  if(trackingStart===null){

    return;

  }

  const now=Date.now();

  const diff=
    Math.floor(
      (now-trackingStart)/1000
    );

  if(diff<=0){

    return;

  }

  data.totalSeconds+=diff;

  const key=todayKey();

  data.studyLog[key]=
    (data.studyLog[key] || 0)+
    diff;

  trackingStart=now;

  saveData();

  updateMiniStudy();

}

function getRank(seconds){

  const h=
    seconds/3600;

  if(h<10)
    return ["🥉","ブロンズ"];

  if(h<30)
    return ["🥈","シルバー"];

  if(h<60)
    return ["🥇","ゴールド"];

  if(h<100)
    return ["🏆","プラチナ"];

  if(h<200)
    return ["💼","ビジネス"];

  if(h<500)
    return ["⭐","ファースト"];

  return ["🚄","グランクラス"];

}

function renderCalendar(){

  const calendar=
    document.getElementById(
      "calendar"
    );

  const title=
    document.getElementById(
      "calendarTitle"
    );

  if(!calendar || !title)
    return;


  const year=
    currentCalendar.getFullYear();

  const month=
    currentCalendar.getMonth();


  title.textContent=
    `${year}年 ${month+1}月`;


  calendar.innerHTML="";


  const weekdays=[
    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"
  ];


  for(
    const day
    of weekdays
  ){

    const el=
      document.createElement(
        "div"
      );

    el.className="weekday";

    el.textContent=day;

    calendar.appendChild(el);

  }


  const first=
    new Date(
      year,
      month,
      1
    );


  const last=
    new Date(
      year,
      month+1,
      0
    );


  const start=
    first.getDay();


  const prevLast=
    new Date(
      year,
      month,
      0
    ).getDate();


  for(
    let i=start-1;
    i>=0;
    i--
  ){

    const number=
      prevLast-i;

    const d=
      new Date(
        year,
        month-1,
        number
      );

    calendar.appendChild(
      createCalendarDay(
        d,
        true
      )
    );

  }


  for(
    let n=1;
    n<=last.getDate();
    n++
  ){

    const d=
      new Date(
        year,
        month,
        n
      );

    calendar.appendChild(
      createCalendarDay(
        d,
        false
      )
    );

  }


  const cells=
    calendar.children.length-
    7;


  const remaining=
    (
      7-
      (cells%7)
    )%7;


  for(
    let n=1;
    n<=remaining;
    n++
  ){

    const d=
      new Date(
        year,
        month+1,
        n
      );

    calendar.appendChild(
      createCalendarDay(
        d,
        true
      )
    );

  }

}


function createCalendarDay(
  date,
  other
){

  const key=
    [
      date.getFullYear(),
      String(
        date.getMonth()+1
      ).padStart(2,"0"),
      String(
        date.getDate()
      ).padStart(2,"0")
    ].join("-");


  const el=
    document.createElement(
      "div"
    );

  el.className=
    "day"+
    (
      other
      ?
      " other"
      :
      ""
    );


  if(
    key===todayKey()
  ){

    el.classList.add(
      "today"
    );

  }


  const study=
    data.studyLog[key] || 0;


  const events=
    data.events.filter(
      e=>e.date===key
    );


  el.innerHTML=`

    <div class="day-number">
      ${date.getDate()}
    </div>

    ${
      study>0
      ?
      `
      <div class="day-study">
        📚 ${formatTime(study)}
      </div>
      `
      :
      ""
    }

    ${
      events.slice(0,2)
        .map(
          e=>`
          <div class="event">
            ${escapeHtml(e.title)}
          </div>
          `
        )
        .join("")
    }

  `;


  el.onclick=()=>{

    openDayModal(key);

  };


  return el;

}

function deleteNote(id){

  const note=
    data.notes.find(
      n=>n.id===id
    );

  if(!note)return;


  if(
    !confirm(
      `「${note.title}」を削除しますか？`
    )
  ){

    return;

  }


  data.notes=
    data.notes.filter(
      n=>n.id!==id
    );


  if(
    currentNoteId===id
  ){

    closeNote();

  }


  saveData();

  renderTree();


  if(
    currentView==="folder"
  ){

    const folder=
      data.folders.find(
        f=>f.id===currentFolderId
      );

    if(folder){

      renderFolder(
        folder
      );

    }

  }

}

      strokes:[],
      elements:[]

    });

  }


  if(
    note.pageIndex<0 ||
    note.pageIndex>=note.pages.length
  ){

    note.pageIndex=0;

  }


  return note.pages[
    note.pageIndex
  ];

}


function openNote(id){

  const note=
    data.notes.find(
      n=>n.id===id
    );

  if(!note)return;


  currentNoteId=id;

  currentView="note";


  document
    .getElementById(
      "pageTitle"
    )
    .textContent=
      note.title;


  document
    .getElementById(
      "noteScreen"
    )
    .classList.remove(
      "hidden"
    );


  selectedObjectId=null;

  editingTextId=null;


  zoom=1;

  cameraX=50;

  cameraY=50;


  history=[];

  historyIndex=-1;


  renderNote();

  updateHistoryButtons();

  closeSidebarMobile();

}


function closeNote(){

  flushStudyTime();

  currentNoteId=null;

  editingTextId=null;

  selectedObjectId=null;

    .getElementById(
      "noteScreen"
    )
    .classList.add(

    );

}


/* =========================================================
   HISTORY
========================================================= */

function snapshotPage(){

  const page=
    getCurrentPage();

  if(!page){

    return null;

  }


  return JSON.stringify(
    page
  );

}


function restorePage(snapshot){

  const note=
    getCurrentNote();

  if(!note)return;


  note.pages[
    note.pageIndex
  ]=
    JSON.parse(
      snapshot
    );


  renderNote();

  saveData();

}


function pushHistory(){

  const snap=
    snapshotPage();

  if(snap===null)
    return;


  if(
    historyIndex<
    history.length-1
  ){

    history=
      history.slice(
        0,
        historyIndex+1
      );

  }


  history.push(
    snap
  );


  if(history.length>50){

    history.shift();

  }else{

    historyIndex++;

  }


  updateHistoryButtons();

}


function undo(){

  if(
    historyIndex<0
  ){

    return;

  }


  const current=
    snapshotPage();


  if(
    historyIndex===
    history.length-1
  ){

    history.push(
      current
    );

  }


  historyIndex--;


  restorePage(
    history[
      historyIndex
    ]
  );


  updateHistoryButtons();

}


function redo(){

  if(
    historyIndex>=
    history.length-1
  ){

    return;

  }


  historyIndex++;


  restorePage(
    history[
      historyIndex
    ]
  );


  updateHistoryButtons();

}


function updateHistoryButtons(){

  const undoBtn=
    document.getElementById(
      "undoButton"
    );

  const redoBtn=
    document.getElementById(
      "redoButton"
    );


  if(undoBtn){

    undoBtn.disabled=
      historyIndex<0;

  }


  if(redoBtn){

    redoBtn.disabled=
      historyIndex>=
      history.length-1;

  }

}


/* =========================================================
   CAMERA
========================================================= */

function applyCamera(){

  board.style.transform=
    `translate(${cameraX}px,${cameraY}px) scale(${zoom})`;

}


function screenToWorld(
  clientX,
  clientY
){

  const rect=
    boardWrap.getBoundingClientRect();


  return {

    x:
      (
        clientX-
        rect.left-
        cameraX
      )/
      zoom,

    y:
      (
        clientY-
        rect.top-
        cameraY
      )/
      zoom

  };

}


function distance(
  a,
  b
){

  return Math.hypot(
    a.clientX-b.clientX,
    a.clientY-b.clientY
  );

}


function center(
  a,
  b
){

  return {

    x:
      (
        a.clientX+
        b.clientX
      )/2,

    y:
      (
        a.clientY+
        b.clientY
      )/2

  };

}


function zoomAt(
  newZoom,
  screenX,
  screenY
){

  newZoom=
    Math.max(
      .25,
      Math.min(
        4,
        newZoom
      )
    );


  const rect=
    boardWrap.getBoundingClientRect();


  const sx=
    screenX-
    rect.left;

  const sy=
    screenY-
    rect.top;


  const worldX=
    (sx-cameraX)/
    zoom;

  const worldY=
    (sy-cameraY)/
    zoom;


  zoom=newZoom;


  cameraX=
    sx-
    worldX*zoom;

  cameraY=
    sy-
    worldY*zoom;


  applyCamera();

}


/* =========================================================
   NOTE RENDER
========================================================= */

function renderNote(){

  const page=
    getCurrentPage();

  if(!page)return;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.lineCap="round";

  ctx.lineJoin="round";


  for(
    const stroke
    of page.strokes
  ){

    if(
      !stroke.points ||
      stroke.points.length<1
    ){

      continue;

    }


    ctx.beginPath();


    ctx.strokeStyle=
      stroke.color ||
      "#111111";


    ctx.lineWidth=
      stroke.size ||
      5;


    if(stroke.tool==="highlighter"){

      ctx.globalAlpha=.28;

    }else{

      ctx.globalAlpha=1;

    }


    const first=
      stroke.points[0];


    ctx.moveTo(
      first.x,
      first.y
    );


    for(
      let i=1;
      i<stroke.points.length;
      i++
    ){

      const p=
        stroke.points[i];

      ctx.lineTo(
        p.x,
        p.y
      );

    }


    if(
      stroke.points.length===1
    ){

      ctx.lineTo(
        first.x+.1,
        first.y+.1
      );

    }


    ctx.stroke();

  }


  ctx.globalAlpha=1;


  renderObjects();

  applyCamera();

}


function renderObjects(){

  const page=
    getCurrentPage();

  if(!page)return;


  objectLayer.innerHTML="";


  for(
    const obj
    of page.elements
  ){

    const el=
      document.createElement(
        "div"
      );


    el.dataset.id=
      obj.id;


    el.className=
      "note-object";


    el.style.left=
      (obj.x||0)+"px";

    el.style.top=
      (obj.y||0)+"px";


    if(obj.type==="text"){

      el.classList.add(
        "text-object"
      );


      el.textContent=
        obj.text || "";


      el.contentEditable=
        "false";


      el.spellcheck=false;


      el.style.color=
        obj.color ||
        "#111";


      el.style.fontSize=
        (obj.fontSize || 24)+
        "px";


      el.style.width=
        "max-content";


      el.style.maxWidth=
        "none";


      el.style.height=
        "auto";


      el.style.minHeight=
        "0";


      el.style.overflow=
        "visible";


      el.style.whiteSpace=
        "pre-wrap";


      el.style.lineHeight=
        "1.25";


      if(
        editingTextId===
        obj.id
      ){

        el.classList.add(
          "editing"
        );

        el.contentEditable=
          "true";

      }

    }


    else if(
      obj.type==="sticky"
    ){

      el.classList.add(
        "sticky-object"
      );

      el.textContent=
        obj.text ||
        "";

      el.style.color=
        obj.color ||
        "#111";

      el.style.fontSize=
        (obj.fontSize || 20)+
        "px";

      el.style.width=
        (obj.width || 180)+
        "px";

      el.style.height=
        (obj.height || 120)+
        "px";

    }


    else if(
      obj.type==="image"
    ){

      const img=
        document.createElement(
          "img"
        );


      img.className=
        "image-object";


      img.src=
        obj.src;


      img.draggable=false;


      img.style.width=
        (obj.width || 500)+
        "px";


      img.style.height=
        (obj.height || 350)+
        "px";


      el.appendChild(
        img
      );

    }


    if(
      selectedObjectId===
      obj.id
    ){

      el.classList.add(
        "selected"
      );

    }


    el.onpointerdown=e=>{

      e.stopPropagation();


      if(
        obj.type==="text" &&
        editingTextId===obj.id
      ){

        return;

      }


      selectObject(
        el,
        obj
      );

    };


    if(
      obj.type==="text"
    ){

      el.ondblclick=e=>{

        e.preventDefault();

        e.stopPropagation();

        selectObject(
          el,
          obj
        );

        startTextEditing(
          el,
          obj
        );

      };

    }


    objectLayer.appendChild(
      el
    );

  }

}


function selectObject(
  el,
  obj
){

  selectedObjectId=
    obj.id;


  objectLayer
    .querySelectorAll(
      ".selected"
    )
    .forEach(
      x=>
        x.classList.remove(
          "selected"
        )
    );


  el.classList.add(
    "selected"
  );

}


/* =========================================================
   TEXT EDIT
========================================================= */

function startTextEditing(
  el,
  obj
){

  if(
    !obj ||
    obj.type!=="text"
  ){

    return;

  }


  if(
    editingTextId===
    obj.id
  ){

    return;

  }


  pushHistory();


  editingTextId=
    obj.id;


  el.classList.add(
    "editing"
  );


  el.contentEditable=
    "true";


  el.spellcheck=false;


  el.focus();


  try{

    const range=
      document.createRange();


    range.selectNodeContents(
      el
    );


    range.collapse(
      false
    );


    const selection=
      window.getSelection();


    selection.removeAllRanges();

    selection.addRange(
      range
    );

  }catch{}


  const finish=
    save=>{

      if(
        editingTextId!==
        obj.id
      ){

        return;

      }


      if(save){

        const value=
          el.innerText
            .replace(
              /\r/g,
              ""
            );


        obj.text=
          value;


        saveData();

      }


      editingTextId=
        null;


      el.contentEditable=
        "false";


      el.classList.remove(
        "editing"
      );


      el.blur();


      renderObjects();

      updateHistoryButtons();

    };


  el.onblur=
    ()=>finish(true);


  el.onkeydown=
    e=>{

      if(
        e.key==="Escape"
      ){

        e.preventDefault();


        el.textContent=
          obj.text ||
          "";


        finish(false);

      }

    };

}

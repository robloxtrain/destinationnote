<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Destination Note</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
  background:#f5f5f7;
  color:#111;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =========================
   LOGIN
========================= */

#loginScreen{
  position:fixed;
  inset:0;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:24px;

  background:
    radial-gradient(
      circle at 20% 10%,
      #dbeafe,
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 80%,
      #ede9fe,
      transparent 35%
    ),
    #f5f5f7;
}

.loginBox{
  width:min(420px,100%);

  padding:35px;

  border-radius:32px;

  background:rgba(255,255,255,.78);

  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);

  box-shadow:
    0 25px 70px rgba(0,0,0,.12);
}

.logo{
  font-size:34px;
  font-weight:800;
  letter-spacing:-1.5px;
}

.sub{
  margin-top:8px;
  margin-bottom:28px;
  color:#777;
}

.loginInput{
  width:100%;

  padding:15px 17px;

  margin-bottom:12px;

  border:
    1px solid #ddd;

  border-radius:17px;

  background:#fff;

  outline:none;
}

.loginInput:focus{
  border-color:#777;
}

.primary{
  width:100%;

  padding:15px;

  margin-top:8px;

  border-radius:17px;

  background:#111;
  color:white;

  font-weight:700;
}


/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;
}

.topbar{
  height:68px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    rgba(255,255,255,.78);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  border-bottom:
    1px solid rgba(0,0,0,.07);

  z-index:100;
}

.brand{
  font-size:20px;
  font-weight:800;
}

.topRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.clockChip{
  padding:8px 13px;

  border-radius:14px;

  background:#111;
  color:#fff;

  font-size:13px;
  font-weight:700;
}

.iconBtn{
  width:40px;
  height:40px;

  border-radius:14px;

  background:#eee;
}

.main{
  flex:1;
  overflow:auto;

  padding:25px;
}


/* =========================
   HOME
========================= */

.hero{
  width:min(1100px,100%);
  margin:auto;
}

.welcome{
  margin:10px 0 22px;

  font-size:36px;
  font-weight:800;

  letter-spacing:-1.5px;
}

.rankCard{
  padding:25px;

  margin-bottom:24px;

  border-radius:28px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #151515,
      #4b4b4b
    );

  box-shadow:
    0 20px 50px rgba(0,0,0,.18);
}

.rankName{
  font-size:30px;
  font-weight:800;
}

.rankTime{
  margin-top:5px;
  opacity:.8;
}

.progressOuter{
  height:8px;

  margin-top:20px;

  overflow:hidden;

  border-radius:999px;

  background:
    rgba(255,255,255,.18);
}

.progressInner{
  width:0%;
  height:100%;

  border-radius:999px;

  background:#fff;

  transition:.3s;
}

.sectionTitle{
  margin:25px 0 12px;

  font-size:22px;
  font-weight:800;
}

.folderGrid,
.itemGrid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(190px,1fr)
    );

  gap:14px;
}

.folderCard{
  padding:20px;

  border-radius:23px;

  background:
    rgba(255,255,255,.8);

  border:
    1px solid rgba(0,0,0,.06);

  box-shadow:
    0 8px 25px rgba(0,0,0,.05);

  transition:.15s;
}

.folderCard:active{
  transform:scale(.97);
}

.folderIcon{
  font-size:34px;
}

.folderName{
  margin-top:10px;
  font-weight:750;
}

.folderCount{
  margin-top:4px;

  color:#888;
  font-size:13px;
}

.addCard{
  border:2px dashed #ccc;
  background:transparent;
}


/* =========================
   FOLDER
========================= */

.folderHeader{
  width:min(1100px,100%);

  margin:0 auto 22px;

  display:flex;
  align-items:center;

  gap:12px;
}

.backBtn{
  padding:11px 15px;

  border-radius:14px;

  background:#eee;
}

.folderTitle{
  font-size:30px;
  font-weight:800;
}

.noteCard{
  position:relative;

  min-height:150px;

  padding:20px;

  border-radius:24px;

  background:#fff;

  box-shadow:
    0 8px 25px rgba(0,0,0,.06);
}

.noteIcon{
  font-size:32px;
}

.noteTitle{
  margin-top:12px;

  font-size:18px;
  font-weight:750;
}

.noteDate{
  margin-top:8px;

  color:#888;
  font-size:12px;
}

.smallDelete{
  position:absolute;

  top:10px;
  right:10px;

  width:32px;
  height:32px;

  border-radius:10px;

  background:#f2f2f2;
}


/* =========================
   NOTE SCREEN
========================= */

#noteScreen{
  position:fixed;
  inset:0;

  z-index:200;

  display:flex;
  flex-direction:column;

  background:#f1f1f3;
}

.noteTop{
  min-height:60px;
  height:60px;

  flex-shrink:0;

  display:flex;
  align-items:center;

  gap:7px;

  padding:8px;

  background:
    rgba(255,255,255,.86);

  backdrop-filter:blur(25px);

  border-bottom:
    1px solid #ddd;

  z-index:30;
}

.noteTitleInput{
  width:180px;
  max-width:22vw;

  padding:8px;

  border:0;

  outline:none;

  background:transparent;

  font-weight:750;
}

.toolGroup{
  flex:1;

  display:flex;
  align-items:center;

  gap:5px;

  overflow-x:auto;

  scrollbar-width:none;
}

.toolGroup::-webkit-scrollbar{
  display:none;
}

.tool{
  min-width:40px;
  height:40px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:#eee;

  font-size:18px;
}

.tool.active{
  background:#111;
  color:#fff;
}

.colorInput{
  width:40px;
  height:40px;

  flex-shrink:0;

  padding:2px;

  border:0;

  background:transparent;
}

.sizeSelect{
  height:40px;

  flex-shrink:0;

  padding:0 8px;

  border:0;

  border-radius:12px;

  background:#eee;
}

.pageControls{
  display:flex;
  gap:5px;
}

.pageControls button{
  width:38px;
  height:38px;

  border-radius:12px;

  background:#eee;
}


/* =========================
   FREEBOARD
========================= */

.boardViewport{
  position:relative;

  flex:1;

  overflow:hidden;

  touch-action:none;

  background-color:#f8f8fa;

  background-image:
    radial-gradient(
      circle,
      #d3d3d7 1px,
      transparent 1px
    );

  background-size:25px 25px;

  user-select:none;
  -webkit-user-select:none;
}

.boardWorld{
  position:absolute;

  left:0;
  top:0;

  width:10000px;
  height:10000px;

  transform-origin:0 0;

  will-change:transform;
}

.boardCanvas{
  position:absolute;

  left:0;
  top:0;

  width:10000px;
  height:10000px;

  touch-action:none;

  pointer-events:none;
}

.objectLayer{
  position:absolute;

  left:0;
  top:0;

  width:10000px;
  height:10000px;

  pointer-events:none;
}


/* =========================
   OBJECTS
========================= */

.boardObject{
  position:absolute;

  pointer-events:auto;

  user-select:none;
  -webkit-user-select:none;

  touch-action:none;
}

.textObject{
  min-width:60px;
  min-height:30px;

  padding:5px;

  line-height:1.35;

  white-space:pre-wrap;

  cursor:move;

  resize:both;

  overflow:auto;

  border:1px solid transparent;
}

.textObject:active{
  border-color:
    rgba(0,122,255,.4);
}

.stickyObject{
  width:220px;
  min-height:170px;

  padding:18px;

  background:#fff39b;

  box-shadow:
    0 8px 20px rgba(0,0,0,.15);

  line-height:1.45;

  white-space:pre-wrap;

  cursor:move;

  resize:both;

  overflow:auto;
}

.imageObject{
  width:100%;
  height:100%;

  object-fit:contain;

  pointer-events:none;
}

.shapeObject{
  pointer-events:none;
}


/* =========================
   BOARD UI
========================= */

.zoomControls{
  position:absolute;

  right:15px;
  bottom:15px;

  z-index:10;

  display:flex;
  gap:7px;
}

.zoomControls button{
  width:46px;
  height:46px;

  border-radius:16px;

  background:
    rgba(255,255,255,.88);

  backdrop-filter:blur(15px);

  box-shadow:
    0 5px 20px rgba(0,0,0,.12);

  font-size:20px;
}

.pageLabel{
  position:absolute;

  left:50%;
  bottom:16px;

  transform:
    translateX(-50%);

  padding:9px 15px;

  border-radius:15px;

  background:
    rgba(255,255,255,.88);

  backdrop-filter:blur(15px);

  font-size:13px;

  z-index:10;
}


/* =========================
   SETTINGS
========================= */

.settingsBox{
  width:min(700px,100%);
  margin:auto;
}

.settingCard{
  padding:20px;

  margin-bottom:12px;

  border-radius:22px;

  background:#fff;
}

.settingTitle{
  margin-bottom:10px;

  font-weight:800;
}

.settingButton{
  padding:12px 16px;

  margin:4px 0;

  border-radius:13px;

  background:#eee;
}


/* =========================
   DARK MODE
========================= */

body.dark{
  background:#111;
  color:#eee;
}

body.dark .topbar,
body.dark .noteTop{
  color:#fff;

  background:
    rgba(30,30,30,.88);

  border-color:#333;
}

body.dark .folderCard,
body.dark .noteCard,
body.dark .settingCard{
  color:#fff;
  background:#1e1e1e;
}

body.dark .iconBtn,
body.dark .backBtn,
body.dark .tool,
body.dark .sizeSelect,
body.dark .pageControls button{
  color:#fff;
  background:#2b2b2b;
}

body.dark .boardViewport{
  background-color:#171717;

  background-image:
    radial-gradient(
      circle,
      #444 1px,
      transparent 1px
    );
}

body.dark .zoomControls button,
body.dark .pageLabel{
  color:#fff;
  background:rgba(35,35,35,.9);
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .main{
    padding:16px;
  }

  .welcome{
    font-size:29px;
  }

  .rankName{
    font-size:25px;
  }

  .noteTitleInput{
    width:120px;
    max-width:120px;
  }

  .noteTop{
    gap:4px;
  }

  .tool{
    min-width:38px;
  }

  .pageControls{
    display:none;
  }

  .clockChip{
    font-size:11px;
    padding:7px 9px;
  }

}


/* =========================
   SAFETY
========================= */

canvas{
  -webkit-touch-callout:none;
}

</style>
</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

  <div class="loginBox">

    <div class="logo">
      Destination Note
    </div>

    <div class="sub">
      自分だけの勉強ノート
    </div>

    <input
      id="loginName"
      class="loginInput"
      placeholder="名前"
      autocomplete="username">

    <input
      id="loginPassword"
      class="loginInput"
      type="password"
      placeholder="パスワード"
      autocomplete="current-password">

    <button
      class="primary"
      onclick="login()">

      はじめる

    </button>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div
  id="app"
  class="hidden">

  <header class="topbar">

    <div class="brand">
      Destination Note
    </div>

    <div class="topRight">

      <div
        id="clockChip"
        class="clockChip">

        00:00:00

      </div>

      <button
        class="iconBtn"
        onclick="showSettings()">

        ⚙️

      </button>

    </div>

  </header>


  <main
    id="main"
    class="main">
  </main>

</div>


<!-- =========================
     NOTE
========================= -->

<div
  id="noteScreen"
  class="hidden">


  <div class="noteTop">

    <button
      class="iconBtn"
      onclick="closeNote()">

      ‹

    </button>


    <input
      id="noteTitleInput"
      class="noteTitleInput"
      onchange="saveNoteTitle()">


    <div class="toolGroup">


      <!-- Pencil -->

      <button
        class="tool active"
        data-tool="pencil"
        onclick="setTool('pencil')">

        ✏️

      </button>


      <!-- Highlighter -->

      <button
        class="tool"
        data-tool="highlighter"
        onclick="setTool('highlighter')">

        🖍️

      </button>


      <!-- Eraser -->

      <button
        class="tool"
        data-tool="eraser"
        onclick="setTool('eraser')">

        🧽

      </button>


      <!-- Object eraser -->

      <button
        class="tool"
        data-tool="objectEraser"
        onclick="setTool('objectEraser')">

        🗑️

      </button>


      <!-- Hand -->

      <button
        class="tool"
        data-tool="hand"
        onclick="setTool('hand')">

        ✋

      </button>


      <!-- Text -->

      <button
        class="tool"
        data-tool="text"
        onclick="setTool('text')">

        T

      </button>


      <!-- Sticky -->

      <button
        class="tool"
        data-tool="sticky"
        onclick="setTool('sticky')">

        🟨

      </button>


      <!-- Rectangle -->

      <button
        class="tool"
        data-tool="rect"
        onclick="setTool('rect')">

        ▭

      </button>


      <!-- Circle -->

      <button
        class="tool"
        data-tool="circle"
        onclick="setTool('circle')">

        ○

      </button>


      <!-- Arrow -->

      <button
        class="tool"
        data-tool="arrow"
        onclick="setTool('arrow')">

        ➜

      </button>


      <!-- Image -->

      <button
        class="tool"
        data-tool="image"
        onclick="chooseImage()">

        🖼️

      </button>


      <!-- Full erase -->

      <button
        class="tool"
        onclick="fullErase()">

        💥

      </button>


      <!-- Color -->

      <input
        id="colorInput"
        class="colorInput"
        type="color"
        value="#111111"
        onchange="currentColor=this.value">


      <!-- Pen size -->

      <select
        id="sizeSelect"
        class="sizeSelect"
        onchange="currentSize=Number(this.value)">

        <option value="2">
          線 2
        </option>

        <option value="4" selected>
          線 4
        </option>

        <option value="8">
          線 8
        </option>

        <option value="14">
          線 14
        </option>

        <option value="20">
          線 20
        </option>

      </select>


      <!-- Text size -->

      <select
        id="fontSizeSelect"
        class="sizeSelect"
        onchange="currentFontSize=Number(this.value)">

        <option value="12">
          文字 12
        </option>

        <option value="16">
          文字 16
        </option>

        <option value="20" selected>
          文字 20
        </option>

        <option value="28">
          文字 28
        </option>

        <option value="36">
          文字 36
        </option>

        <option value="48">
          文字 48
        </option>

        <option value="64">
          文字 64
        </option>

      </select>


      <input
        id="imageInput"
        type="file"
        accept="image/*"
        style="display:none"
        onchange="insertImage(event)">

    </div>


    <div class="pageControls">

      <button onclick="previousPage()">
        ‹
      </button>

      <button onclick="nextPage()">
        ›
      </button>

      <button onclick="addPage()">
        ＋
      </button>

    </div>

  </div>


  <div
    id="boardViewport"
    class="boardViewport">


    <div
      id="boardWorld"
      class="boardWorld">


      <canvas
        id="boardCanvas"
        class="boardCanvas"
        width="10000"
        height="10000">
      </canvas>


      <div
        id="objectLayer"
        class="objectLayer">
      </div>


    </div>


    <div class="zoomControls">

      <button onclick="zoomOut()">
        −
      </button>

      <button onclick="resetView()">
        ⌂
      </button>

      <button onclick="zoomIn()">
        ＋
      </button>

    </div>


    <div
      id="pageLabel"
      class="pageLabel">

      1 / 1

    </div>


  </div>

</div>


<script>


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
  "destinationNote_v1";


let data = {

  name:"",

  password:"",

  totalSeconds:0,

  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],

  notes:[],

  settings:{
    dark:false
  }

};


let currentFolderId =
  "root";

let currentNoteId =
  null;

let currentPageIndex =
  0;


/* =========================================================
   TOOLS
========================================================= */

let currentTool =
  "pencil";

let currentColor =
  "#111111";

let currentSize =
  4;

let currentFontSize =
  20;


/* =========================================================
   BOARD
========================================================= */

let zoom = 1;

let panX = 0;

let panY = 0;


/* =========================================================
   DRAW STATE
========================================================= */

let isDrawing =
  false;

let drawingPointerId =
  null;

let lastDrawPoint =
  null;


/* =========================================================
   PINCH
========================================================= */

const activePointers =
  new Map();

let pinchData =
  null;


/* =========================================================
   STUDY CLOCK
========================================================= */

let sessionStartedAt =
  null;

let clockInterval =
  null;


/* =========================================================
   SAVE
========================================================= */

let saveTimer =
  null;


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
  document.getElementById(
    "boardCanvas"
  );

const ctx =
  canvas.getContext("2d");

const viewport =
  document.getElementById(
    "boardViewport"
  );

const world =
  document.getElementById(
    "boardWorld"
  );

const objectLayer =
  document.getElementById(
    "objectLayer"
  );


/* =========================================================
   LOAD
========================================================= */

function loadData(){

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(!raw){
    return;
  }


  try{

    const saved =
      JSON.parse(raw);


    data = {

      ...data,

      ...saved

    };


    if(!Array.isArray(data.folders)){
      data.folders=[];
    }


    if(!Array.isArray(data.notes)){
      data.notes=[];
    }


    /*
      旧データ互換
    */

    data.notes.forEach(
      note=>{

        if(!note.pages){

          note.pages=[{

            image:
              note.image || null,

            elements:
              note.elements || [],

            strokes:
              note.strokes || []

          }];

        }


        note.pages.forEach(
          page=>{

            if(
              !Array.isArray(
                page.elements
              )
            ){
              page.elements=[];
            }

            if(
              !Array.isArray(
                page.strokes
              )
            ){
              page.strokes=[];
            }

          }
        );

      }
    );


  }catch(error){

    console.error(
      "データ読み込みエラー",
      error
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

function saveData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(error){

    console.error(
      "保存エラー",
      error
    );

    alert(
      "保存できませんでした。画像を大量に貼っている場合は、画像を減らしてみてね。"
    );

  }

}


function autoSave(){

  clearTimeout(
    saveTimer
  );

  saveTimer =
    setTimeout(
      saveData,
      300
    );

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  const name =
    document
      .getElementById(
        "loginName"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  if(!name || !password){

    alert(
      "名前とパスワードを入力してね"
    );

    return;

  }


  /*
    初回
  */

  if(!data.name){

    data.name =
      name;

    data.password =
      password;

    saveData();

  }


  /*
    ログイン確認
  */

  else if(

    data.name !== name ||
    data.password !== password

  ){

    alert(
      "名前またはパスワードが違います"
    );

    return;

  }


  document
    .getElementById(
      "loginScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "app"
    )
    .classList.remove(
      "hidden"
    );


  applyDark();

  startStudyClock();

  showHome();

}


/* =========================================================
   STUDY CLOCK
========================================================= */

function getTotalStudySeconds(){

  if(sessionStartedAt){

    return (
      data.totalSeconds +
      Math.floor(
        (Date.now() -
          sessionStartedAt) /
        1000
      )
    );

  }

  return data.totalSeconds;

}


function formatTime(seconds){

  seconds =
    Math.max(
      0,
      Math.floor(seconds)
    );


  const h =
    Math.floor(
      seconds / 3600
    );

  const m =
    Math.floor(
      (seconds % 3600) / 60
    );

  const s =
    seconds % 60;


  return [

    String(h)
      .padStart(2,"0"),

    String(m)
      .padStart(2,"0"),

    String(s)
      .padStart(2,"0")

  ].join(":");

}


function startStudyClock(){

  if(sessionStartedAt){
    return;
  }


  sessionStartedAt =
    Date.now();


  updateClock();


  clearInterval(
    clockInterval
  );


  clockInterval =
    setInterval(
      updateClock,
      1000
    );

}


function stopStudyClock(){

  if(!sessionStartedAt){
    return;
  }


  data.totalSeconds =
    getTotalStudySeconds();


  sessionStartedAt =
    null;


  saveData();

}


function updateClock(){

  const total =
    getTotalStudySeconds();


  const chip =
    document.getElementById(
      "clockChip"
    );


  if(chip){

    chip.textContent =
      formatTime(total);

  }


  updateRankCard();

}


document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      stopStudyClock();

    }else{

      if(data.name){

        startStudyClock();

      }

    }

  }
);


window.addEventListener(
  "pagehide",
  ()=>{
    stopStudyClock();
  }
);


/* =========================================================
   RANK
========================================================= */

function getRank(seconds){

  const hours =
    seconds / 3600;


  if(hours < 10){

    return {
      name:"ブロンズ",
      min:0,
      max:10
    };

  }


  if(hours < 30){

    return {
      name:"シルバー",
      min:10,
      max:30
    };

  }


  if(hours < 60){

    return {
      name:"ゴールド",
      min:30,
      max:60
    };

  }


  if(hours < 100){

    return {
      name:"プラチナ",
      min:60,
      max:100
    };

  }


  if(hours < 200){

    return {
      name:"ビジネス",
      min:100,
      max:200
    };

  }


  if(hours < 500){

    return {
      name:"ファースト",
      min:200,
      max:500
    };

  }


  return {

    name:"グランクラス",

    min:500,

    max:Infinity

  };

}


function updateRankCard(){

  const card =
    document.getElementById(
      "rankCard"
    );


  if(!card){
    return;
  }


  const total =
    getTotalStudySeconds();


  const rank =
    getRank(total);


  const hours =
    total / 3600;


  let progress=100;


  if(rank.max !== Infinity){

    progress =
      (
        (hours-rank.min) /
        (rank.max-rank.min)
      ) * 100;

  }


  progress =
    Math.max(
      0,
      Math.min(
        100,
        progress
      )
    );


  const name =
    document.getElementById(
      "rankName"
    );


  const time =
    document.getElementById(
      "rankTime"
    );


  const bar =
    document.getElementById(
      "rankProgress"
    );


  if(name){

    name.textContent =
      rank.name;

  }


  if(time){

    time.textContent =
      "学習時間 " +
      formatTime(total);

  }


  if(bar){

    bar.style.width =
      progress + "%";

  }

}

/* =========================================================

========================================================= */

function updateTransform(){

  world.style.transform =
    `

        ${panX}px,
        ${panY}px,
        0
      )
      scale(${zoom})
    `;

/* =========================================================
   SCREEN → WORLD
========================================================= */

function screenToWorld(
  clientX,
  clientY
){

  const rect =
    viewport.getBoundingClientRect();


  return {

    x:
      (
        clientX -
        rect.left -
        panX
      ) / zoom,

    y:
      (
        clientY -
        rect.top -
        panY
      ) / zoom

  };

}


/* =========================================================
   DRAW BOARD
========================================================= */

function drawBoard(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const page =
    getCurrentPage();


  if(!page){
    return;
  }


  /*
    旧バージョンの画像
  */

  if(page.image){

    const img =
      new Image();


    img.onload =
      ()=>{

        ctx.drawImage(
          img,
          4400,
          4150,
          1200,
          1700
        );


        drawStrokes(
          page
        );

      };


    img.src =
      page.image;

  }else{

    drawStrokes(
      page
    );

  }


  renderObjects(
    page
  );

}


/* =========================================================
   DRAW STROKES
========================================================= */

function drawStrokes(page){

  if(
    !Array.isArray(
      page.strokes
    )
  ){
    return;
  }


  page.strokes.forEach(
    stroke=>{

      if(
        !stroke.points ||
        stroke.points.length < 2
      ){

        return;

      }


      ctx.save();


      ctx.lineCap =
        "round";

      ctx.lineJoin =
        "round";


      ctx.strokeStyle =
        stroke.color ||
        "#111";


      ctx.lineWidth =
        stroke.size ||
        4;


      if(
        stroke.tool ===
        "highlighter"
      ){

        ctx.globalAlpha =
          .30;

      }else{

        ctx.globalAlpha =
          1;

      }


      ctx.beginPath();


      /*
        なめらかに描画
      */

      ctx.moveTo(
        stroke.points[0].x,
        stroke.points[0].y
      );


      for(
        let i=1;
        i<stroke.points.length;
        i++
      ){

        const p =
          stroke.points[i];


        ctx.lineTo(
          p.x,
          p.y
        );

      }


      ctx.stroke();

      ctx.restore();

    }
  );

}


/* =========================================================
   TOOL
========================================================= */

function setTool(tool){

  currentTool =
    tool;


  document
    .querySelectorAll(

        button.classList.toggle(
          "active",
          button.dataset.tool ===

}


/* =========================================================
   POINTER DOWN
========================================================= */

viewport.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();


    activePointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );


    /*
      2本指
    */

    if(
      activePointers.size >= 2
    ){

      isDrawing=false;


      const pts =
        [
          ...activePointers.values()
        ];


      const dx =
        pts[0].x -
        pts[1].x;


      const dy =
        pts[0].y -
        pts[1].y;


      pinchData={

        distance:
          Math.hypot(
            dx,
            dy
          ),

        zoom:zoom,

        center:{
          x:
            (
              pts[0].x +
              pts[1].x
            ) / 2,

          y:
            (
              pts[0].y +
              pts[1].y
            ) / 2

        }

      };


      return;

    }


    /*
      手のひら
    */

    if(
      currentTool ===
      "hand"
    ){

      isDrawing=true;

      drawingPointerId =
        e.pointerId;


      lastDrawPoint={

        x:e.clientX,

        y:e.clientY

      };


      viewport.setPointerCapture(
        e.pointerId
      );


      return;

    }


    const p =
      screenToWorld(
        e.clientX,
        e.clientY
      );


    /*
      テキスト
    */

    if(
      currentTool ===
      "text"
    ){

      createObjectAt(
        "text",
        p.x,
        p.y
      );

      return;

    }


    /*
      付箋
    */

    if(
      currentTool ===
      "sticky"
    ){

      createObjectAt(
        "sticky",
        p.x,
        p.y
      );

      return;

    }


    /*
      オブジェクト消去
    */

    if(
      currentTool ===
      "objectEraser"
    ){

      eraseObjectAt(
        p.x,
        p.y
      );

      return;

    }


    /*
      画像
    */

    if(
      currentTool ===
      "image"
    ){

      imagePlacePoint =
        p;

      chooseImage();

      return;

    }


    /*
      図形
    */

    if(

      currentTool === "rect" ||

      currentTool === "circle" ||

      currentTool === "arrow"

    ){

      isDrawing=true;

      drawingPointerId =
        e.pointerId;

      lastDrawPoint =
        p;


      viewport.setPointerCapture(
        e.pointerId
      );


      return;

    }


    /*
      鉛筆・蛍光ペン・消しゴム
    */

    if(

      currentTool === "pencil" ||

      currentTool === "highlighter" ||

      currentTool === "eraser"

    ){

      isDrawing=true;

      drawingPointerId =
        e.pointerId;

      lastDrawPoint =
        p;


      viewport.setPointerCapture(
        e.pointerId
      );


      /*
        消しゴム
      */

      if(
        currentTool ===
        "eraser"
      ){

        eraseStrokeAt(
          p.x,
          p.y
        );

        return;

      }


      /*
        新しい線
      */

      const page =
        getCurrentPage();


      if(!page){
        return;
      }


      page.strokes.push({

        id:
          "stroke_" +
          Date.now() +
          "_" +
          Math.random(),

        tool:
          currentTool,

        color:
          currentColor,

        size:
          currentSize,

        points:[
          p
        ]

      });


      drawBoard();

    }

  }
);


/* =========================================================
   POINTER MOVE
========================================================= */

viewport.addEventListener(
  "pointermove",
  e=>{

    e.preventDefault();


    /*
      ポインター更新
    */

    if(
      activePointers.has(
        e.pointerId
      )
    ){

      activePointers.set(
        e.pointerId,
        {
          x:e.clientX,
          y:e.clientY
        }
      );

    }


    /*
      ピンチ
    */

    if(

      activePointers.size >= 2 &&
      pinchData

    ){

      const pts =
        [
          ...activePointers.values()
        ];


      const dx =
        pts[0].x -
        pts[1].x;


      const dy =
        pts[0].y -
        pts[1].y;


      const distance =
        Math.hypot(
          dx,
          dy
        );


      const factor =
        distance /
        pinchData.distance;


      const newZoom =
        Math.max(
          .25,
          Math.min(
            4,
            pinchData.zoom *
            factor
          )
        );


      const rect =
        viewport.getBoundingClientRect();


      const centerX =
        (
          pts[0].x +
          pts[1].x
        ) / 2 -
        rect.left;


      const centerY =
        (
          pts[0].y +
          pts[1].y
        ) / 2 -
        rect.top;


      const worldX =
        (
          centerX -
          panX
        ) / zoom;


      const worldY =
        (
          centerY -
          panY
        ) / zoom;


      zoom =
        newZoom;


      panX =
        centerX -
        worldX * zoom;


      panY =
        centerY -
        worldY * zoom;


      updateTransform();


      return;

    }


    /*
      通常描画
    */

    if(

      !isDrawing ||

      e.pointerId !==
      drawingPointerId

    ){

      return;

    }


    /*
      手のひら
    */

    if(
      currentTool ===
      "hand"
    ){

      const dx =
        e.clientX -
        lastDrawPoint.x;


      const dy =
        e.clientY -
        lastDrawPoint.y;


      panX += dx;

      panY += dy;


      lastDrawPoint={

        x:e.clientX,

        y:e.clientY

      };


      updateTransform();


      return;

    }


    const p =
      screenToWorld(
        e.clientX,
        e.clientY
      );


    /*
      消しゴム
    */

    if(
      currentTool ===
      "eraser"
    ){

      eraseStrokeAt(
        p.x,
        p.y
      );

      return;

    }


    /*
      図形
    */

    if(

      currentTool === "rect" ||

      currentTool === "circle" ||

      currentTool === "arrow"

    ){

      drawBoard();


      drawPreviewShape(
        lastDrawPoint,
        p
      );


      return;

    }


    /*
      手書き
    */

    const page =
      getCurrentPage();


    if(!page){
      return;
    }


    const stroke =
      page.strokes[
        page.strokes.length - 1
      ];


    if(!stroke){
      return;
    }


    const last =
      stroke.points[
        stroke.points.length - 1
      ];


    const distance =
      Math.hypot(
        p.x-last.x,
        p.y-last.y
      );


    /*
      細かく点を追加
    */

    if(distance >= .5){

      stroke.points.push(
        p
      );

      drawBoard();

    }

  }
);


/* =========================================================
   POINTER UP
========================================================= */

viewport.addEventListener(
  "pointerup",
  e=>{

    e.preventDefault();


    activePointers.delete(
      e.pointerId
    );


    if(
      e.pointerId !==
      drawingPointerId
    ){

      if(
        activePointers.size < 2
      ){

        pinchData=null;

      }

      return;

    }


    /*
      図形確定
    */

    if(

      isDrawing &&

      (
        currentTool === "rect" ||
        currentTool === "circle" ||
        currentTool === "arrow"
      )

    ){

      const p =
        screenToWorld(
          e.clientX,
          e.clientY
        );


      createShape(
        currentTool,
        lastDrawPoint,
        p
      );

    }


    isDrawing=false;

    drawingPointerId=null;

    lastDrawPoint=null;


    if(
      activePointers.size < 2
    ){

      pinchData=null;

    }


    autoSave();

  }
);


/* =========================================================
   POINTER CANCEL
========================================================= */

viewport.addEventListener(
  "pointercancel",
  e=>{

    activePointers.delete(
      e.pointerId
    );


    isDrawing=false;

    drawingPointerId=null;

    lastDrawPoint=null;

    pinchData=null;

  }
);


/* =========================================================
   ERASE STROKE
========================================================= */

function eraseStrokeAt(
  x,
  y
){

  const page =
    getCurrentPage();


  if(!page){
    return;
  }


  /*
    消しゴム範囲
  */

  const radius =
    Math.max(
      12,
      currentSize * 3
    );


  const newStrokes=[];


  page.strokes.forEach(
    stroke=>{

      /*
        線を細かいセグメントに分解して
        消しゴムに当たった部分を削除
      */

      let segment=[];


      function flush(){

        if(
          segment.length >= 2
        ){

          newStrokes.push({

            ...stroke,

            id:
              "stroke_" +
              Date.now() +
              "_" +
              Math.random(),

            points:
              segment

          });

        }

        segment=[];

      }


      stroke.points.forEach(
        point=>{

          const hit =
            Math.hypot(
              point.x-x,
              point.y-y
            ) < radius;


          if(hit){

            flush();

          }else{

            segment.push(
              point
            );

          }

        }
      );


      flush();

    }
  );


  page.strokes =
    newStrokes;


  drawBoard();

  autoSave();

}


/* =========================================================
   OBJECT ERASER
========================================================= */

function eraseObjectAt(
  x,
  y
){

  const page =
    getCurrentPage();


  if(!page){
    return;
  }


  let found=-1;


  for(
    let i=
      page.elements.length-1;

    i>=0;

    i--
  ){

    const obj =
      page.elements[i];


    const width =
      obj.width ||
      200;


    const height =
      obj.height ||
      100;


    if(

      x >= obj.x &&

      x <= obj.x + width &&

      y >= obj.y &&

      y <= obj.y + height

    ){

      found=i;

      break;

    }

  }


  if(found >= 0){

    page.elements.splice(
      found,
      1
    );


    drawBoard();

    autoSave();

  }

}


/* =========================================================
   FULL ERASE
========================================================= */

function fullErase(){

/* =========================================================
   CREATE TEXT / STICKY
========================================================= */

function createObjectAt(
  type,
  x,
  y
){

  const page =
    getCurrentPage();


  if(!page){
    return;
  }


  const text =
    prompt(
      type === "text"
        ? "文字を入力"
        : "付箋の内容を入力"
    );


  if(
    text === null ||
    text === ""
  ){

    return;

  }


  const obj={

    id:
      "obj_" +
      Date.now() +
      "_" +
      Math.random(),

    type:type,

    x:x,

    y:y,

    width:
      type === "sticky"
        ? 220
        : 300,

    height:
      type === "sticky"
        ? 170
        : 80,

    text:text,

    color:
      currentColor,

    fontSize:
      currentFontSize

  };


  page.elements.push(
    obj
  );


  renderObjects(
    page
  );


  autoSave();

}


/* =========================================================
   SHAPES
========================================================= */

function createShape(
  type,
  a,
  b
){

  const page =
    getCurrentPage();


  if(!page){
    return;
  }


  const x =
    Math.min(
      a.x,
      b.x
    );


  const y =
    Math.min(
      a.y,
      b.y
    );


  const width =
    Math.max(
      10,
      Math.abs(
        b.x-a.x
      )
    );


  const height =
    Math.max(
      10,
      Math.abs(
        b.y-a.y
      )
    );


  page.elements.push({

    id:
      "shape_" +
      Date.now() +
      "_" +
      Math.random(),

    type:type,

    x:x,

    y:y,

    width:width,

    height:height,

    x2:b.x,

    y2:b.y,

    color:
      currentColor,

    size:
      currentSize

  });


  drawBoard();

  autoSave();

}


/* =========================================================
   PREVIEW SHAPE
========================================================= */

function drawPreviewShape(
  a,
  b
){

  if(!a || !b){
    return;
  }


  ctx.save();


  ctx.strokeStyle =
    currentColor;


  ctx.lineWidth =
    currentSize;


  ctx.setLineDash(
    [8,8]
  );


  ctx.beginPath();


  if(
    currentTool ===
    "rect"
  ){

    ctx.rect(
      a.x,
      a.y,
      b.x-a.x,
      b.y-a.y
    );

  }


  if(
    currentTool ===
    "circle"
  ){

    const cx =
      (a.x+b.x)/2;

    const cy =
      (a.y+b.y)/2;

    const rx =
      Math.abs(
        b.x-a.x
      )/2;

    const ry =
      Math.abs(
        b.y-a.y
      )/2;


    ctx.ellipse(
      cx,
      cy,
      rx,
      ry,
      0,
      0,
      Math.PI*2
    );

  }


  if(
    currentTool ===
    "arrow"
  ){

    ctx.moveTo(
      a.x,
      a.y
    );

    ctx.lineTo(
      b.x,
      b.y
    );

  }


  ctx.stroke();

  ctx.restore();

}


/* =========================================================
   RENDER OBJECTS
========================================================= */

function renderObjects(
  page
){

  objectLayer.innerHTML="";


  page.elements.forEach(
    obj=>{

      const el =
        document.createElement(
          "div"
        );


      el.className =
        "boardObject";


      el.style.left =
        obj.x + "px";


      el.style.top =
        obj.y + "px";


      el.style.width =
        (
          obj.width ||
          200
        ) + "px";


      el.style.height =
        (
          obj.height ||
          100
        ) + "px";


      /*
        TEXT
      */

      if(
        obj.type ===
        "text"
      ){

        el.classList.add(
          "textObject"
        );


        el.textContent =
          obj.text;


        el.style.color =
          obj.color ||
          "#111";


        el.style.fontSize =
          (
            obj.fontSize ||
            20
          ) + "px";

      }


      /*
        STICKY
      */

      if(
        obj.type ===
        "sticky"
      ){

        el.classList.add(
          "stickyObject"
        );


        el.textContent =
          obj.text;


        el.style.fontSize =
          (
            obj.fontSize ||
            20
          ) + "px";

      }


      /*
        IMAGE
      */

      if(
        obj.type ===
        "image"
      ){

        const img =
          document.createElement(
            "img"
          );


        img.className =
          "imageObject";


        img.src =
          obj.src;


        el.appendChild(
          img
        );

      }


      /*
        SHAPES
      */

      if(

        obj.type === "rect" ||

        obj.type === "circle" ||

        obj.type === "arrow"

      ){

        el.classList.add(
          "shapeObject"
        );


        const c =
          document.createElement(
            "canvas"
          );


        c.width =
          obj.width + 20;


        c.height =
          obj.height + 20;


        const cctx =
          c.getContext(
            "2d"
          );


        cctx.strokeStyle =
          obj.color ||
          "#111";


        cctx.lineWidth =
          obj.size ||
          4;


        cctx.lineCap =
          "round";


        if(
          obj.type ===
          "rect"
        ){

          cctx.strokeRect(
            5,
            5,
            obj.width,
            obj.height
          );

        }


        if(
          obj.type ===
          "circle"
        ){

          cctx.beginPath();


          cctx.ellipse(
            obj.width/2+5,
            obj.height/2+5,
            obj.width/2,
            obj.height/2,
            0,
            0,
            Math.PI*2
          );


          cctx.stroke();

        }


        if(
          obj.type ===
          "arrow"
        ){

          const ex =
            obj.x2 -
            obj.x +
            5;


          const ey =
            obj.y2 -
            obj.y +
            5;


          cctx.beginPath();


          cctx.moveTo(
            5,
            5
          );


          cctx.lineTo(
            ex,
            ey
          );


          cctx.stroke();


          const angle =
            Math.atan2(
              ey-5,
              ex-5
            );


          const size=15;


          cctx.beginPath();


          cctx.moveTo(
            ex,
            ey
          );


          cctx.lineTo(
            ex -
              size *
              Math.cos(
                angle-.5
              ),

            ey -
              size *
              Math.sin(
                angle-.5
              )
          );


          cctx.moveTo(
            ex,
            ey
          );


          cctx.lineTo(
            ex -
              size *
              Math.cos(
                angle+.5
              ),

            ey -
              size *
              Math.sin(
                angle+.5
              )
          );


          cctx.stroke();

        }


        el.appendChild(
          c
        );

      }


      objectLayer.appendChild(
        el
      );


      makeObjectDraggable(
        el,
        obj
      );

    }
  );

}


/* =========================================================
   OBJECT DRAG / RESIZE
========================================================= */

function makeObjectDraggable(
  el,
  obj
){

  let moving=false;

  let resizing=false;

  let startX=0;

  let startY=0;

  let originalX=0;

  let originalY=0;

  let originalWidth=0;

  let originalHeight=0;


  /*
    移動
  */

  el.addEventListener(
    "pointerdown",
    e=>{

      if(
        currentTool !==
        "hand"
      ){

        return;

      }


      e.stopPropagation();

      e.preventDefault();


      moving=true;


      startX =
        e.clientX;

      startY =
        e.clientY;


      originalX =
        obj.x;

      originalY =
        obj.y;


      el.setPointerCapture(
        e.pointerId
      );

    }
  );


  el.addEventListener(
    "pointermove",
    e=>{

      if(!moving){
        return;
      }


      obj.x =
        originalX +
        (
          e.clientX -
          startX
        ) / zoom;


      obj.y =
        originalY +
        (
          e.clientY -
          startY
        ) / zoom;


      el.style.left =
        obj.x + "px";


      el.style.top =
        obj.y + "px";

    }
  );


  el.addEventListener(
    "pointerup",
    e=>{

      moving=false;

      autoSave();

    }
  );


  /*
    サイズ変更
  */

  el.addEventListener(
    "pointerdown",
    e=>{

      if(
        currentTool !==
        "hand"
      ){

        return;

      }


      /*
        右下付近ならリサイズ
      */

      const rect =
        el.getBoundingClientRect();


      const distanceRight =
        rect.right -
        e.clientX;


      const distanceBottom =
        rect.bottom -
        e.clientY;


      if(
        distanceRight < 25 &&
        distanceBottom < 25
      ){

        moving=false;

        resizing=true;


        startX =
          e.clientX;

        startY =
          e.clientY;


        originalWidth =
          obj.width ||
          rect.width / zoom;


        originalHeight =
          obj.height ||
          rect.height / zoom;


        e.stopPropagation();

      }

    }
  );


  el.addEventListener(
    "pointermove",
    e=>{

      if(!resizing){
        return;
      }


      const newWidth =
        Math.max(
          50,
          originalWidth +
          (
            e.clientX -
            startX
          ) / zoom
        );


      const newHeight =
        Math.max(
          35,
          originalHeight +
          (
            e.clientY -
            startY
          ) / zoom
        );


      obj.width =
        newWidth;


      obj.height =
        newHeight;


      el.style.width =
        newWidth + "px";


      el.style.height =
        newHeight + "px";

    }
  );


  el.addEventListener(
    "pointerup",
    e=>{

      if(resizing){

        resizing=false;

        autoSave();

      }

    }
  );

}


/* =========================================================
   IMAGE
========================================================= */

let imagePlacePoint={
  x:5000,
  y:5000
};


function chooseImage(){

  document
    .getElementById(
      "imageInput"
    )
    .click();

}


function insertImage(
  event
){

  const file =
    event.target.files[0];


  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    e=>{

      const page =
        getCurrentPage();


      if(!page){
        return;
      }


      page.elements.push({

        id:
          "img_" +
          Date.now() +
          "_" +
          Math.random(),

        type:"image",

        x:
          imagePlacePoint.x,

        y:
          imagePlacePoint.y,

        width:350,

        height:250,

        src:
          e.target.result

      });


      renderObjects(
        page
      );


      autoSave();

    };


  reader.readAsDataURL(
    file
  );


  event.target.value="";
}


/* =========================================================
   ZOOM
========================================================= */

function zoomIn(){

  zoom =
    Math.min(
      4,
      zoom * 1.2
    );


  updateTransform();

}


function zoomOut(){

  zoom =
    Math.max(
      .25,
      zoom / 1.2
    );


  updateTransform();

}


function resetView(){

  zoom=1;


  panX =
    viewport.clientWidth/2 -
    5000;


  panY =
    viewport.clientHeight/2 -
    5000;


  updateTransform();

}


/* =========================================================
   PAGE
========================================================= */

function updatePageLabel(){

  const note =
    getCurrentNote();


  if(!note){
    return;
  }


  document
    .getElementById(
      "pageLabel"
    )
    .textContent =
      (
        currentPageIndex + 1
      ) +
      " / " +
      note.pages.length;

}


function previousPage(){

  const note =
    getCurrentNote();


  if(!note){
    return;
  }


  if(
    currentPageIndex > 0
  ){

    saveCurrentNote();


    currentPageIndex--;


    drawBoard();

    updatePageLabel();

  }

}


function nextPage(){

  const note =
    getCurrentNote();


  if(!note){
    return;
  }


  if(
    currentPageIndex <
    note.pages.length-1
  ){

    saveCurrentNote();


    currentPageIndex++;


    drawBoard();

    updatePageLabel();

  }

}


function addPage(){

  const note =
    getCurrentNote();


  if(!note){
    return;
  }


  note.pages.push({

    image:null,

    elements:[],

    strokes:[]

  });


  currentPageIndex =
    note.pages.length-1;


  drawBoard();

  updatePageLabel();

  autoSave();

}

   SAVE CURRENT NOTE
========================================================= */

function saveCurrentNote(){

  const note =
    getCurrentNote();


  if(!note){
    return;

  note.updated =

  saveData();

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
  str
){

  return String(str)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    const noteScreen =
      document.getElementById(
        "noteScreen"
      );


    if(
      noteScreen.classList.contains(
        "hidden"
      )
    ){

      return;

    }


    if(
      e.key === "p"
    ){

      setTool(
        "pencil"
      );

    }


    if(
      e.key === "h"
    ){

      setTool(
        "highlighter"
      );

    }


    if(
      e.key === "e"
    ){

      setTool(
        "eraser"
      );

    }


    if(
      e.key === "v"
    ){

      setTool(
        "hand"
      );

    }


    if(
      e.key === "t"
    ){

      setTool(
        "text"
      );

    }

  }
);


/* =========================================================
   WHEEL
========================================================= */

viewport.addEventListener(
  "wheel",
  e=>{

    /*
      Ctrl / Command + ホイール
      → ズーム
    */

    if(
      e.ctrlKey ||
      e.metaKey
    ){

      e.preventDefault();


      const before =
        screenToWorld(
          e.clientX,
          e.clientY
        );


      const factor =
        e.deltaY < 0
          ? 1.1
          : .9;


      zoom =
        Math.max(
          .25,
          Math.min(
            4,
            zoom * factor
          )
        );


      const rect =
        viewport.getBoundingClientRect();


      panX =
        e.clientX -
        rect.left -
        before.x * zoom;


      panY =
        e.clientY -
        rect.top -
        before.y * zoom;


      updateTransform();


      return;

    }


    /*
      手のひらツールなら
      マウス・トラックパッド移動
    */

    if(
      currentTool ===
      "hand"
    ){

      e.preventDefault();


      panX -=
        e.deltaX;


      panY -=
        e.deltaY;


      updateTransform();

    }

  },
  {
    passive:false
  }
);

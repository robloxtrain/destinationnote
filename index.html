<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no"
>

<title>Destination Note</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body{

  color:#111;

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(120,180,255,.38),
      transparent 32%
    ),

    radial-gradient(
      circle at 90% 10%,
      rgba(210,130,255,.32),
      transparent 35%
    ),

    linear-gradient(
      135deg,
      #eaf2ff,
      #f9f8ff 48%,
      #eeeaff
    );
}

body.dark{

  color:#fff;

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(60,130,255,.25),
      transparent 32%
    ),

    radial-gradient(
      circle at 90% 10%,
      rgba(170,80,255,.22),
      transparent 35%
    ),

    linear-gradient(
      135deg,
      #070910,
      #111522 50%,
      #080a12
    );
}


/* =========================================
   LIQUID GLASS
========================================= */

.glass{

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.65),
      rgba(255,255,255,.24)
    );

  border:
    1px solid
    rgba(255,255,255,.62);

  box-shadow:

    0 15px 45px
    rgba(0,0,0,.09),

    inset 0 1px 0
    rgba(255,255,255,.85),

    inset 0 -1px 0
    rgba(255,255,255,.18);

  backdrop-filter:
    blur(35px)
    saturate(190%);

  -webkit-backdrop-filter:
    blur(35px)
    saturate(190%);
}

.dark .glass{

  background:
    linear-gradient(
      135deg,
      rgba(38,43,58,.66),
      rgba(20,24,36,.42)
    );

  border-color:
    rgba(255,255,255,.13);

  box-shadow:

    0 20px 55px
    rgba(0,0,0,.35),

    inset 0 1px 0
    rgba(255,255,255,.12);
}


/* =========================================
   LOGIN
========================================= */

#loginScreen{

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.loginCard{

  width:min(430px,100%);

  padding:35px;

  border-radius:35px;

  position:relative;

  overflow:hidden;
}

.loginCard:before{

  content:"";

  position:absolute;

  width:300px;
  height:300px;

  right:-130px;
  top:-170px;

  border-radius:50%;

  background:
    rgba(255,255,255,.55);

  filter:blur(35px);
}

.logo{

  font-size:38px;

  font-weight:850;

  letter-spacing:-2px;
}

.subtitle{

  margin-top:5px;
  margin-bottom:25px;

  opacity:.55;
}

.input{

  width:100%;

  margin:6px 0;

  padding:15px 17px;

  border-radius:18px;

  border:
    1px solid
    rgba(255,255,255,.5);

  outline:none;

  background:
    rgba(255,255,255,.35);

  color:inherit;

  font-size:16px;

  backdrop-filter:blur(20px);

  -webkit-backdrop-filter:blur(20px);
}

.dark .input{

  background:
    rgba(255,255,255,.08);

  border-color:
    rgba(255,255,255,.12);
}

.primary{

  width:100%;

  margin-top:12px;

  padding:15px;

  border-radius:18px;

  color:white;

  font-weight:750;

  background:
    linear-gradient(
      135deg,
      #438bff,
      #8060ff
    );

  box-shadow:
    0 10px 25px
    rgba(70,130,255,.28);
}


/* =========================================
   APP
========================================= */

#app{

  display:none;

  width:100%;
  height:100%;
}

.appShell{

  width:100%;
  height:100%;

  display:flex;

  gap:12px;

  padding:12px;
}


/* =========================================
   SIDEBAR
========================================= */

.sidebar{

  width:300px;

  min-width:300px;

  height:100%;

  border-radius:30px;

  padding:12px;

  display:flex;

  flex-direction:column;

  overflow:hidden;
}

.sidebarTop{

  display:flex;

  align-items:center;

  gap:10px;

  padding:8px;
}

.appIcon{

  width:45px;
  height:45px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:16px;

  font-size:23px;

  background:
    rgba(255,255,255,.45);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.8);
}

.sidebarTitle{

  font-weight:800;
  font-size:17px;
}

.sidebarSub{

  font-size:11px;
  opacity:.5;
}


/* TREE */

.tree{

  flex:1;

  overflow:auto;

  padding:8px 3px;

  scrollbar-width:none;
}

.tree::-webkit-scrollbar{
  display:none;
}

.treeRow{

  display:flex;

  align-items:center;

  min-height:43px;

  margin:2px 0;

  padding:5px 7px;

  border-radius:15px;

  cursor:pointer;

  user-select:none;

  transition:
    background .18s,
    transform .12s;
}

.treeRow:hover{

  background:
    rgba(255,255,255,.38);
}

.dark .treeRow:hover{

  background:
    rgba(255,255,255,.08);
}

.treeRow:active{

  transform:
    scale(.98);
}

.treeRow.selected{

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.7),
      rgba(255,255,255,.28)
    );

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.75),

    0 6px 20px
    rgba(0,0,0,.06);
}

.dark .treeRow.selected{

  background:
    rgba(255,255,255,.12);
}

.arrow{

  width:25px;

  height:30px;

  flex-shrink:0;

  display:flex;

  align-items:center;
  justify-content:center;

  opacity:.65;
}

.arrow span{

  transition:
    transform .2s;
}

.arrow.open span{

  transform:
    rotate(90deg);
}

.treeIcon{

  width:30px;

  text-align:center;

  flex-shrink:0;
}

.treeName{

  flex:1;

  min-width:0;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  font-size:14px;
}

.sidebarBottom{

  display:flex;

  gap:7px;

  padding-top:7px;
}

.smallButton{

  flex:1;

  min-height:43px;

  border-radius:16px;

  background:
    rgba(255,255,255,.38);

  border:
    1px solid
    rgba(255,255,255,.42);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);
}

.dark .smallButton{

  background:
    rgba(255,255,255,.07);

  border-color:
    rgba(255,255,255,.1);
}


/* =========================================
   MAIN
========================================= */

.main{

  flex:1;

  min-width:0;

  height:100%;

  border-radius:30px;

  overflow:hidden;

  position:relative;
}


/* =========================================
   HOME
========================================= */

.home{

  width:100%;
  height:100%;

  overflow:auto;

  padding:35px;
}

.hero{

  padding:30px;

  border-radius:30px;

  margin-bottom:20px;
}

.hero h1{

  margin:0;

  font-size:38px;

  letter-spacing:-1.5px;
}

.hero p{

  opacity:.55;
}

.rankCard{

  display:flex;

  align-items:center;

  gap:18px;

  padding:22px;

  border-radius:25px;

  margin-bottom:25px;
}

.rankIcon{

  width:64px;
  height:64px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:21px;

  font-size:29px;

  background:
    rgba(255,255,255,.45);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.8);
}

.rankName{

  font-size:20px;

  font-weight:800;
}

.studyTime{

  margin-top:4px;

  font-size:13px;

  opacity:.5;
}

.sectionTitle{

  margin:25px 0 12px;

  font-size:19px;

  font-weight:800;
}

.folderGrid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(210px,1fr)
    );

  gap:13px;
}

.folderCard{

  padding:22px;

  border-radius:25px;

  cursor:pointer;

  transition:
    transform .18s,
    box-shadow .18s;
}

.folderCard:hover{

  transform:
    translateY(-3px);
}

.folderCard:active{

  transform:
    scale(.98);
}

.folderEmoji{

  font-size:30px;
}

.folderName{

  margin-top:10px;

  font-weight:750;
}

.folderCount{

  margin-top:4px;

  font-size:12px;

  opacity:.5;
}


/* =========================================
   FOLDER
========================================= */

.folderView{

  width:100%;
  height:100%;

  overflow:auto;

  padding:30px;
}

.viewHeader{

  display:flex;

  align-items:center;

  gap:12px;

  margin-bottom:20px;
}

.viewHeader h2{

  margin:0;

  font-size:30px;
}

.backButton{

  width:43px;
  height:43px;

  border-radius:16px;

  background:
    rgba(255,255,255,.4);
}


/* =========================================
   NOTE EDITOR
========================================= */

.noteView{

  width:100%;
  height:100%;

  display:flex;

  flex-direction:column;
}

.noteHeader{

  min-height:70px;

  display:flex;

  align-items:center;

  gap:8px;

  padding:10px 14px;

  position:relative;

  z-index:20;
}

.noteTitle{

  flex:1;

  min-width:0;

  font-weight:800;

  font-size:18px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.toolBar{

  display:flex;

  align-items:center;

  gap:5px;

  padding:6px;

  border-radius:21px;

  background:
    rgba(255,255,255,.43);

  border:
    1px solid
    rgba(255,255,255,.58);

  backdrop-filter:
    blur(28px)
    saturate(190%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(190%);

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.08),

    inset 0 1px 0
    rgba(255,255,255,.8);

  overflow-x:auto;

  scrollbar-width:none;
}

.toolBar::-webkit-scrollbar{
  display:none;
}

.tool{

  width:40px;
  height:40px;

  flex-shrink:0;

  border-radius:14px;

  background:
    rgba(255,255,255,.3);

  transition:.15s;
}

.tool:active{

  transform:
    scale(.9);
}

.tool.active{

  color:white;

  background:
    linear-gradient(
      135deg,
      #518cff,
      #805fff
    );

  box-shadow:
    0 6px 16px
    rgba(80,120,255,.28);
}

.colorInput{

  width:40px;
  height:40px;

  padding:4px;

  border:0;

  background:transparent;
}

.sizeBox{

  display:flex;

  align-items:center;

  padding:0 7px;
}

#sizeRange{

  width:90px;
}

.zoomBox{

  display:flex;

  gap:4px;
}

.pageBox{

  display:flex;

  align-items:center;

  gap:5px;

  white-space:nowrap;

  font-size:12px;
}


/* =========================================
   BOARD
========================================= */

.boardViewport{

  flex:1;

  position:relative;

  overflow:hidden;

  touch-action:none;

  background:
    radial-gradient(
      circle at 30% 20%,
      rgba(90,140,255,.06),
      transparent 30%
    );
}

.boardWorld{

  position:absolute;

  left:0;
  top:0;

  width:12000px;
  height:8500px;

  transform-origin:0 0;

  background:
    linear-gradient(
      rgba(100,130,170,.08) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(100,130,170,.08) 1px,
      transparent 1px
    );

  background-size:
    50px 50px;
}

.page{

  position:absolute;

  left:500px;
  top:350px;

  width:10000px;
  height:7000px;

  overflow:hidden;

  border-radius:24px;

  background:
    rgba(255,255,255,.9);

  box-shadow:

    0 25px 80px
    rgba(0,0,0,.15),

    inset 0 0 0 1px
    rgba(0,0,0,.04);
}

.dark .page{

  background:
    rgba(27,30,38,.95);

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.45);
}

#drawSvg{

  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  overflow:visible;

  pointer-events:none;
}

.objectLayer{

  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  pointer-events:none;
}


/* =========================================
   OBJECT
========================================= */

.noteObject{

  position:absolute;

  min-width:80px;
  min-height:40px;

  pointer-events:auto;

  user-select:none;

  touch-action:none;
}

.noteText{

  padding:5px;

  white-space:pre-wrap;

  word-break:break-word;

  cursor:text;
}

.sticky{

  padding:18px;

  border-radius:9px;

  background:
    linear-gradient(
      135deg,
      rgba(255,245,140,.97),
      rgba(255,225,80,.86)
    );

  color:#222;

  box-shadow:

    0 15px 35px
    rgba(0,0,0,.14),

    inset 0 1px 0
    rgba(255,255,255,.7);
}

.resizeHandle{

  position:absolute;

  right:-7px;
  bottom:-7px;

  width:14px;
  height:14px;

  border-radius:50%;

  background:white;

  border:
    2px solid
    #648dff;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.2);
}

.selectedObject{

  outline:
    2px solid
    rgba(90,130,255,.65);

  outline-offset:3px;
}


/* =========================================
   SETTINGS
========================================= */

.settings{

  width:100%;
  height:100%;

  overflow:auto;

  padding:30px;
}

.settingCard{

  padding:22px;

  border-radius:25px;

  margin-bottom:15px;
}

.settingTitle{

  margin-bottom:12px;

  font-weight:800;
}


/* =========================================
   MOBILE
========================================= */

.mobileMenu{

  display:none;

  position:absolute;

  left:12px;
  top:12px;

  z-index:100;

  width:45px;
  height:45px;

  border-radius:16px;

  background:
    rgba(255,255,255,.58);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);
}

@media(max-width:800px){

  .appShell{
    padding:7px;
  }

  .sidebar{

    position:absolute;

    z-index:90;

    left:7px;
    top:7px;
    bottom:7px;

    height:auto;

    transform:
      translateX(-110%);

    transition:.25s;
  }

  .sidebar.show{

    transform:
      translateX(0);
  }

  .mobileMenu{
    display:block;
  }

  .home,
  .folderView,
  .settings{

    padding:
      22px 15px;
  }

  .hero h1{

    font-size:30px;
  }

  .noteHeader{

    padding-left:58px;
  }

  .noteTitle{

    display:none;
  }

  .toolBar{

    width:100%;
  }
}


/* =========================================
   TOAST
========================================= */

.toast{

  position:fixed;

  left:50%;
  bottom:25px;

  transform:
    translate(-50%,20px);

  padding:
    12px 18px;

  border-radius:18px;

  background:
    rgba(25,30,40,.78);

  color:white;

  opacity:0;

  pointer-events:none;

  z-index:9999;

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  transition:.25s;
}

.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);
}

</style>
</head>


<body>


<!-- =========================================
     LOGIN
========================================= -->

<div id="loginScreen">

  <div class="loginCard glass">

    <div class="logo">
      Destination Note
    </div>

    <div class="subtitle">
      あなたの勉強を、ひとつの場所へ。
    </div>

    <input
      id="loginName"
      class="input"
      placeholder="名前"
      autocomplete="off"
    >

    <input
      id="loginPassword"
      class="input"
      type="password"
      placeholder="パスワード"
    >

    <button
      id="loginButton"
      class="primary"
    >
      はじめる
    </button>

    <div
      style="
        margin-top:14px;
        text-align:center;
        font-size:11px;
        opacity:.45;
      "
    >
      この端末のブラウザに保存されます
    </div>

  </div>

</div>


<!-- =========================================
     APP
========================================= -->

<div id="app">

  <div class="appShell">


    <!-- SIDEBAR -->

    <aside
      id="sidebar"
      class="sidebar glass"
    >

      <div class="sidebarTop">

        <div class="appIcon">
          📚
        </div>

        <div>

          <div class="sidebarTitle">
            Destination Note
          </div>

          <div
            id="userNameDisplay"
            class="sidebarSub"
          ></div>

        </div>

      </div>


      <div
        id="tree"
        class="tree"
      ></div>


      <div class="sidebarBottom">

        <button
          class="smallButton"
          onclick="createFolder()"
        >
          ＋ タブ
        </button>

        <button
          class="smallButton"
          onclick="createNote()"
        >
          ＋ ノート
        </button>

        <button
          class="smallButton"
          onclick="showSettings()"
        >
          ⚙️
        </button>

      </div>

    </aside>


    <!-- MAIN -->

    <main class="main glass">

      <button
        class="mobileMenu"
        onclick="toggleSidebar()"
      >
        ☰
      </button>


      <section
        id="homeScreen"
        class="home"
      ></section>


      <section
        id="folderScreen"
        class="folderView"
        style="display:none"
      ></section>


      <section
        id="noteScreen"
        class="noteView"
        style="display:none"
      ></section>


      <section
        id="settingsScreen"
        class="settings"
        style="display:none"
      ></section>

    </main>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>


/* =========================================
   DATA
========================================= */

const STORAGE_KEY =
  "destinationNote_v1";

const WORLD_W = 12000;
const WORLD_H = 8500;

let data = {

  name:"",
  password:"",

  totalSeconds:0,

  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],

  notes:[],

  settings:{
    dark:false
  }

};


let selectedFolderId =
  "root";

let currentFolderId =
  "root";

let currentNoteId =
  null;

let expandedFolders =
  new Set(["root"]);


let currentTool =
  "pencil";

let currentColor =
  "#222222";

let currentSize =
  5;


let zoom =
  1;

let cameraX =
  -500;

let cameraY =
  -350;


let drawing =
  false;

let currentStroke =
  null;

let pointers =
  new Map();

let renderFrame =
  null;

let selectedObjectId =
  null;

let trackingStart =
  null;


/* =========================================
   UTILITY
========================================= */

function uid(){

  return (
    Date.now().toString(36)
    +
    Math.random()
      .toString(36)
      .slice(2,9)
  );

}


function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      2200
    );

}


/* =========================================
   SAVE / LOAD
========================================= */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function load(){

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(!raw)
    return;

  try{

    const saved =
      JSON.parse(raw);

    data = {
      ...data,
      ...saved
    };

    if(
      !Array.isArray(
        data.folders
      )
    ){

      data.folders=[];

    }

    if(
      !Array.isArray(
        data.notes
      )
    ){

      data.notes=[];

    }

    if(!data.settings){

      data.settings={
        dark:false
      };

    }

    if(
      !data.folders.some(
        f=>f.id==="root"
      )
    ){

      data.folders.unshift({

        id:"root",

        name:"マイノート",

        icon:"📚",

        parent:null,

        created:Date.now()

      });

    }

    migrateNotes();

  }catch(error){

    console.error(error);

  }

}


/* =========================================
   MIGRATION
========================================= */

function migrateNotes(){

  data.notes.forEach(
    (note,index)=>{

      /*
        undefined対策
      */

      if(
        !note.name ||
        note.name==="undefined" ||
        note.name==="null"
      ){

        note.name =
          note.title ||
          note.noteName ||
          `無題のノート${index+1}`;

      }


      /*
        フォルダが無い場合
      */

      if(!note.folderId){

        note.folderId =
          "root";

      }


      /*
        存在しないフォルダを
        指していた場合
      */

      const folderExists =
        data.folders.some(
          f=>f.id===note.folderId
        );

      if(!folderExists){

        note.folderId =
          "root";

      }


      /*
        pages
      */

      if(
        !Array.isArray(
          note.pages
        )
      ){

        note.pages=[
          {

            strokes:
              Array.isArray(
                note.strokes
              )
                ? note.strokes
                : [],

            elements:
              Array.isArray(
                note.elements
              )
                ? note.elements
                : []

          }
        ];

      }


      if(note.pages.length===0){

        note.pages.push({

          strokes:[],

          elements:[]

        });

      }


      note.pages.forEach(
        page=>{

          if(
            !Array.isArray(
              page.strokes
            )
          ){

            page.strokes=[];

          }

          if(
            !Array.isArray(
              page.elements
            )
          ){

            page.elements=[];

          }

        }
      );


      if(
        typeof note.currentPage !==
        "number"
      ){

        note.currentPage=0;

      }


      if(
        note.currentPage<0
      ){

        note.currentPage=0;

      }


      if(
        note.currentPage >=
        note.pages.length
      ){

        note.currentPage =
          note.pages.length-1;

      }

    }
  );


  /*
    壊れた親フォルダを修正
  */

  data.folders.forEach(
    folder=>{

      if(folder.id==="root")
        return;

      const parentExists =
        data.folders.some(
          f=>f.id===folder.parent
        );

      if(!parentExists){

        folder.parent =
          "root";

      }

    }
  );


  save();

}

/* =========================================
   STUDY TIME
========================================= */

function startTracking(){

  trackingStart =
    Date.now();

}


function flushStudyTime(){

  if(trackingStart===null)
    return;


  const now =
    Date.now();


  const seconds =
    Math.floor(
      (
        now -
        trackingStart
      ) / 1000
    );


  if(seconds>0){

    data.totalSeconds +=
      seconds;

    trackingStart =
      now;

    save();

  }


  updateStudyDisplay();

}


document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState===
      "visible"
    ){

      trackingStart =
        Date.now();

    }else{

      flushStudyTime();

      trackingStart =
        null;

    }

  }
);


setInterval(
  ()=>{

    if(
      document.visibilityState===
      "visible"
    ){

      flushStudyTime();

    }

  },
  1000
);


function formatTime(seconds){

  seconds =
    Math.floor(seconds);

  const h =
    Math.floor(
      seconds/3600
    );

  const m =
    Math.floor(
      (seconds%3600)/60
    );

  const s =
    seconds%60;

  return (
    h+"時間 "
    +m+"分 "
    +s+"秒"
  );

}


function updateStudyDisplay(){

  const el =
    document.getElementById(
      "studyDisplay"
    );

  if(el){

    el.textContent =
      formatTime(
        data.totalSeconds
      );

  }

}


function getRank(seconds){

  const hours =
    seconds/3600;


  if(hours<10)
    return {
      name:"ブロンズ",
      icon:"🥉"
    };


  if(hours<30)
    return {
      name:"シルバー",
      icon:"🥈"
    };


  if(hours<60)
    return {
      name:"ゴールド",
      icon:"🥇"
    };


  if(hours<100)
    return {
      name:"プラチナ",
      icon:"💎"
    };


  if(hours<200)
    return {
      name:"ビジネス",
      icon:"💼"
    };


  if(hours<500)
    return {
      name:"ファースト",
      icon:"✈️"
    };


  return {
    name:"グランクラス",
    icon:"🚄"
  };

}

========================================= */

function renderTree(){

  const tree =
    document.getElementById(
      "tree"
    );

  tree.innerHTML="";


  const root =
    data.folders.find(
      folder=>
        folder.id==="root"
    );


  if(root){

    renderFolderTree(
      root,
      0,
      tree
    );

  }

}


function renderFolderTree(
  folder,
  depth,
  parentEl
){

  const children =
    childrenOf(
      folder.id
    );

  const notes =
    notesOf(
      folder.id
    );


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "treeRow";


  if(
    selectedFolderId===
    folder.id &&
    currentNoteId===null
  ){

    row.classList.add(
      "selected"
    );

  }


  row.style.paddingLeft =
    (
      7 +
      depth*18
    )+"px";


  /*
    矢印
  */

  const arrow =
    document.createElement(
      "div"
    );

  arrow.className =
    "arrow";


  if(children.length){

    if(
      expandedFolders.has(
        folder.id
      )
    ){

      arrow.classList.add(
        "open"
      );

    }

    arrow.innerHTML =
      "<span>›</span>";

  }else{

    arrow.innerHTML =
      "<span style='opacity:0'>›</span>";

  }


  /*
    アイコン
  */

  const icon =
    document.createElement(
      "div"
    );

  icon.className =
    "treeIcon";

  icon.textContent =
    folder.icon ||
    "📁";


  /*
    名前
  */

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "treeName";

  name.textContent =
    folder.name ||
    "無題のタブ";


  row.append(
    arrow,
    icon,
    name
  );


  /*
    ★重要★

    行全体をクリック

    三角だけじゃない
  */

  row.addEventListener(
    "click",
    e=>{

      e.stopPropagation();


      selectedFolderId =
        folder.id;

      currentFolderId =
        folder.id;

      currentNoteId =
        null;


      if(children.length){

        if(
          expandedFolders.has(
            folder.id
          )
        ){

          expandedFolders.delete(
            folder.id
          );

        }else{

          expandedFolders.add(
            folder.id
          );

        }

      }


      renderTree();

      openFolder(
        folder.id
      );

    }
  );


  row.addEventListener(
    "contextmenu",
    e=>{

      e.preventDefault();

      renameFolder(
        folder.id
      );

    }
  );


  parentEl.appendChild(
    row
  );


  /*
    中身
  */

  if(
    expandedFolders.has(
      folder.id
    )
  ){

    children.forEach(
      child=>{

        renderFolderTree(
          child,
          depth+1,
          parentEl
        );

      }
    );


    notes.forEach(
      note=>{

        renderNoteTree(
          note,
          depth+1,
          parentEl
        );

      }
    );

  }

}

/* =========================================
   CREATE FOLDER
========================================= */

function createFolder(){

  /*
    現在開いているフォルダを優先
  */

  const parentId =
    currentFolderId ||
    selectedFolderId ||
    "root";


  const name =
    prompt(
      "タブ名を入力"
    );


  if(!name)
    return;


  const folder={

    id:uid(),

    name:name.trim(),

    icon:"📁",

    parent:parentId,

    created:Date.now()

  };


  data.folders.push(
    folder
  );


  /*
    親を展開
  */

  expandedFolders.add(
    parentId
  );

  expandedFolders.add(
    folder.id
  );


  /*
    作ったタブを選択
  */

  selectedFolderId =
    folder.id;

  currentFolderId =
    folder.id;

  currentNoteId =
    null;


  save();

  renderTree();

  openFolder(
    folder.id
  );

}


/* =========================================
   CREATE NOTE
========================================= */

function createNote(){

  /*
    ★ここが今回の重要修正★

    現在開いている内側フォルダを
    必ず親にする
  */

  let folderId =
    currentFolderId ||
    selectedFolderId ||
    "root";


  /*
    親フォルダが存在するか確認
  */

  const folder =
    data.folders.find(
      f=>f.id===folderId
    );


  if(!folder){

    folderId="root";

  }


  const name =
    prompt(
      "ノート名を入力"
    );


  if(!name)
    return;


  const note={

    id:uid(),

    name:name.trim(),

    folderId:folderId,

    created:Date.now(),

    currentPage:0,

    pages:[

      {

        strokes:[],

        elements:[]

      }

    ]

  };


  data.notes.push(
    note
  );


  /*
    親フォルダを開いた状態にする
  */

  expandedFolders.add(
    folderId
  );


  selectedFolderId =
    folderId;

  currentFolderId =
    folderId;


  save();

  renderTree();

  openNote(
    note.id
  );

}

  const note =

  if(!note)

  if(

  if(

    note.pages.length
  ){

    note.currentPage =
      note.pages.length-1;

  }


  return note.pages[
    note.currentPage
  ];

}

            onclick="changePage(-1)"
          >
            ‹
          </button>

          <span id="pageNumber">
            1 / 1
          </span>

          <button
            class="tool"
            onclick="changePage(1)"
          >
            ›
          </button>

        </div>


        <button
          class="tool"
          onclick="clearPage()"
        >
          🗑
        </button>

      </div>

    </div>


    <div
      id="boardViewport"
      class="boardViewport"
    >

      <div
        id="boardWorld"
        class="boardWorld"
      >

        <div
          id="page"
          class="page"
        >

          <svg
            id="drawSvg"
            viewBox="
              0 0
              ${WORLD_W}
              ${WORLD_H}
            "
            preserveAspectRatio="none"
          ></svg>


          <div
            id="objectLayer"
            class="objectLayer"
          ></div>

        </div>

      </div>

    </div>

  `;


  setupBoard();

  renderPage();

  updateToolButtons();

}


/* =========================================
   TOOL
========================================= */

function setTool(tool){

  currentTool =
    tool;

  updateToolButtons();

}


function updateToolButtons(){

  document
    .querySelectorAll(
      "[id^='tool-']"
    )
    .forEach(
      button=>
        button.classList.remove(
          "active"
        )
    );


  const button =
    document.getElementById(
      "tool-"+currentTool
    );


  if(button){

    button.classList.add(
      "active"
    );

  }

}


function changeColor(color){

  currentColor =
    color;

}


function changeSize(size){

  currentSize =
    Number(size);


  /*
    選択中の文字サイズも変更
  */

  if(selectedObjectId){

    const page =
      getCurrentPage();

    if(!page)
      return;


    const obj =
      page.elements.find(
        e=>
          e.id===
          selectedObjectId
      );


    if(
      obj &&
      (
        obj.type==="text" ||
        obj.type==="sticky"
      )
    ){

      obj.fontSize =
        currentSize*3+10;

      renderPage();

      save();

    }

  }

}


/* =========================================
   CAMERA
========================================= */

function applyCamera(){

  const world =
    document.getElementById(
      "boardWorld"
    );

  if(!world)
    return;


  world.style.transform =
    `
      translate(
        ${cameraX}px,
        ${cameraY}px
      )
      scale(${zoom})
    `;

}


function changeZoom(amount){

  zoom =
    Math.min(
      3,
      Math.max(
        .25,
        zoom+amount
      )
    );

  applyCamera();

}


function resetZoom(){

  zoom=1;

  cameraX=-500;

  cameraY=-350;

  applyCamera();

}


/* =========================================
   COORDINATE
========================================= */

function screenToPage(
  clientX,
  clientY
){

  const viewport =
    document.getElementById(
      "boardViewport"
    );


  const rect =
    viewport.getBoundingClientRect();


  /*
    画面
    ↓
    World
    ↓
    Page
  */

  const worldX =
    (
      clientX -
      rect.left -
      cameraX
    ) / zoom;


  const worldY =
    (
      clientY -
      rect.top -
      cameraY
    ) / zoom;


  return {

    x:
      worldX-500,

    y:
      worldY-350

  };

}


/* =========================================
   BOARD
========================================= */

function setupBoard(){

  const viewport =
    document.getElementById(
      "boardViewport"
    );

  if(!viewport)
    return;


  viewport.addEventListener(
    "pointerdown",
    pointerDown
  );

  viewport.addEventListener(
    "pointermove",
    pointerMove
  );

  viewport.addEventListener(
    "pointerup",
    pointerUp
  );

  viewport.addEventListener(
    "pointercancel",
    pointerUp
  );


  applyCamera();

}


/* =========================================
   POINTER DOWN
========================================= */

function pointerDown(e){

  e.preventDefault();


  const viewport =
    e.currentTarget;


  viewport.setPointerCapture(
    e.pointerId
  );


  pointers.set(
    e.pointerId,
    {
      x:e.clientX,
      y:e.clientY
    }
  );


  /*
    2本指
  */

  if(
    pointers.size>=2
  ){

    drawing=false;

    return;

  }


  const point =
    screenToPage(
      e.clientX,
      e.clientY
    );


  /*
    手
  */

  if(
    currentTool==="hand"
  ){

    drawing=true;

    currentStroke={

      hand:true,

      lastX:
        e.clientX,

      lastY:
        e.clientY

    };

    return;

  }


  /*
    テキスト
  */

  if(
    currentTool==="text"
  ){

    createTextAt(
      point
    );

    return;

  }


  /*
    付箋
  */

  if(
    currentTool==="sticky"
  ){

    createStickyAt(
      point
    );

    return;

  }


  /*
    オブジェクト消しゴム
  */

  if(
    currentTool==="object"
  ){

    eraseObjectAt(
      point
    );

    return;

  }


  /*
    ピクセル消しゴム
  */

  if(
    currentTool==="pixel"
  ){

    drawing=true;

    eraseAt(
      point
    );

    return;

  }


  /*
    鉛筆 / 蛍光ペン
  */

  drawing=true;


  currentStroke={

    id:uid(),

    color:
      currentColor,

    width:
      currentTool===
      "highlighter"
        ? currentSize*3.5
        : currentSize,

    opacity:
      currentTool===
      "highlighter"
        ? .28
        : 1,

    points:[
      point
    ]

  };


  getCurrentPage()
    .strokes
    .push(
      currentStroke
    );


  renderStroke(
    currentStroke
  );

}


/* =========================================
   POINTER MOVE
========================================= */

function pointerMove(e){

  pointers.set(
    e.pointerId,
    {
      x:e.clientX,
      y:e.clientY
    }
  );


  /*
    2本指ズーム
  */

  if(
    pointers.size>=2
  ){

    const values =
      [...pointers.values()];


    const a =
      values[0];

    const b =
      values[1];


    const dx =
      a.x-b.x;

    const dy =
      a.y-b.y;


    const dist =
      Math.sqrt(
        dx*dx+
        dy*dy
      );


    if(
      pointerMove.lastDistance
    ){

      const delta =
        dist -
        pointerMove.lastDistance;


      zoom =
        Math.min(
          3,
          Math.max(
            .25,
            zoom+
            delta*.002
          )
        );


      applyCamera();

    }


    pointerMove.lastDistance =
      dist;


    return;

  }


  pointerMove.lastDistance =
    null;


  if(!drawing)
    return;


  /*
    手
  */

  if(
    currentTool==="hand"
  ){

    const dx =
      e.clientX -
      currentStroke.lastX;

    const dy =
      e.clientY -
      currentStroke.lastY;


    cameraX +=
      dx;

    cameraY +=
      dy;


    currentStroke.lastX =
      e.clientX;

    currentStroke.lastY =
      e.clientY;


    applyCamera();

    return;

  }


  const point =
    screenToPage(
      e.clientX,
      e.clientY
    );


  /*
    消しゴム
  */

  if(
    currentTool==="pixel"
  ){

    eraseAt(
      point
    );

    return;

  }


  /*
    描画
  */

  if(!currentStroke)
    return;


  const last =
    currentStroke.points[
      currentStroke.points.length-1
    ];


  /*
    小さすぎる移動は無視
    → なめらか
  */

  if(
    distance(
      last,
      point
    ) < .8
  ){

    return;

  }


  currentStroke.points.push(
    point
  );


  queueRender(
    currentStroke
  );

}


/* =========================================
   POINTER UP
========================================= */

function pointerUp(e){

  pointers.delete(
    e.pointerId
  );

  pointerMove.lastDistance =
    null;


  if(
    pointers.size>0
  )
    return;


  drawing=false;

  currentStroke=null;

  save();

}


/* =========================================
   DRAWING
========================================= */

function queueRender(stroke){

  if(renderFrame)
    return;


  renderFrame =
    requestAnimationFrame(
      ()=>{

        renderFrame=null;

        renderStroke(
          stroke
        );

      }
    );

}


function pointsToPath(points){

  if(!points.length)
    return "";


  if(points.length===1){

    const p =
      points[0];

    return `
      M ${p.x}
      ${p.y}

      L ${p.x+.1}
      ${p.y+.1}
    `;

  }


  let path =
    `M ${points[0].x} ${points[0].y}`;


  /*
    Quadratic curveで
    なめらかにする
  */

  for(
    let i=1;
    i<points.length;
    i++
  ){

    const prev =
      points[i-1];

    const current =
      points[i];


    const midX =
      (
        prev.x+
        current.x
      )/2;


    const midY =
      (
        prev.y+
        current.y
      )/2;


    path +=
      `
      Q
      ${prev.x}
      ${prev.y}
      ${midX}
      ${midY}
      `;

  }


  const last =
    points[
      points.length-1
    ];


  path +=
    `
    L
    ${last.x}
    ${last.y}
    `;


  return path;

}


function renderStroke(stroke){

  const svg =
    document.getElementById(
      "drawSvg"
    );


  if(!svg)
    return;


  let path =
    svg.querySelector(
      `[data-stroke-id="${stroke.id}"]`
    );


  if(!path){

    path =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );


    path.dataset.strokeId =
      stroke.id;


    svg.appendChild(
      path
    );

  }


  path.setAttribute(
    "d",
    pointsToPath(
      stroke.points
    )
  );


  path.setAttribute(
    "fill",
    "none"
  );


  path.setAttribute(
    "stroke",
    stroke.color
  );


  path.setAttribute(
    "stroke-width",
    stroke.width
  );


  path.setAttribute(
    "stroke-linecap",
    "round"
  );


  path.setAttribute(
    "stroke-linejoin",
    "round"
  );


  path.setAttribute(
    "opacity",
    stroke.opacity ??
    1
  );

}


/* =========================================
   DISTANCE
========================================= */

function distance(a,b){

  const dx =
    a.x-b.x;

  const dy =
    a.y-b.y;

  return Math.sqrt(
    dx*dx+
    dy*dy
  );

}


/* =========================================
   PIXEL ERASER
========================================= */

function eraseAt(point){

  const page =
    getCurrentPage();

  if(!page)
    return;


  const radius =
    Math.max(
      8,
      currentSize*2
    );


  const result=[];


  page.strokes.forEach(
    stroke=>{

      let segment=[];


      stroke.points.forEach(
        p=>{

          if(
            distance(
              p,
              point
            )<=radius
          ){

            if(
              segment.length>=2
            ){

              result.push({

                ...stroke,

                id:uid(),

                points:
                  segment

              });

            }


            segment=[];

          }else{

            segment.push(
              p
            );

          }

        }
      );


      if(
        segment.length>=2
      ){

        result.push({

          ...stroke,

          id:uid(),

          points:
            segment

        });

      }

    }
  );


  page.strokes =
    result;


  renderPage();

}


/* =========================================
   OBJECT ERASER
========================================= */

function eraseObjectAt(point){

  const page =
    getCurrentPage();

  if(!page)
    return;


  for(
    let i=
      page.elements.length-1;
    i>=0;
    i--
  ){

    const obj =
      page.elements[i];


    if(
      point.x>=obj.x &&
      point.x<=
        obj.x+obj.width &&

      point.y>=obj.y &&
      point.y<=
        obj.y+obj.height
    ){

      page.elements.splice(
        i,
        1
      );


      selectedObjectId =
        null;


      renderPage();

      save();

      return;

    }

  }

}


/* =========================================
   TEXT
========================================= */

function createTextAt(point){

  const text =
    prompt(
      "文字を入力"
    );


  if(!text)
    return;


  const page =
    getCurrentPage();


  const obj={

    id:uid(),

    type:"text",

    x:point.x,

    y:point.y,

    width:500,

    height:130,

    text:text,

    color:
      currentColor,

    fontSize:
      currentSize*3+10

  };


  page.elements.push(
    obj
  );


  selectedObjectId =
    obj.id;


  renderPage();

  save();

}


/* =========================================
   STICKY
========================================= */

function createStickyAt(point){

  const text =
    prompt(
      "付箋の内容"
    );


  if(!text)
    return;


  const page =
    getCurrentPage();


  const obj={

    type:"sticky",

    x:point.x,

    y:point.y,

  };

  );

/* =========================================
   IMAGE
========================================= */

function addImage(){

  const input =
    document.createElement(
      "input"
    );


  input.type="file";

  input.accept=
    "image/*";


  input.onchange =
    ()=>{

      const file =
        input.files[0];

      if(!file)
        return;


      const reader =
        new FileReader();


      reader.onload =
        ()=>{

          const page =
            getCurrentPage();


          const obj={

            id:uid(),

            type:"image",

            x:1000,

            y:800,

            width:600,

            height:450,

            src:
              reader.result

          };


          page.elements.push(
            obj
          );


          renderPage();

          save();

        };


      reader.readAsDataURL(
        file
      );

    };


  input.click();

}


/* =========================================
   RENDER PAGE
========================================= */

function renderPage(){

  const page =
    getCurrentPage();


  if(!page)
    return;


  const svg =
    document.getElementById(
      "drawSvg"
    );

  const layer =
    document.getElementById(
      "objectLayer"
    );


  if(!svg || !layer)
    return;


  svg.innerHTML =
    "";

  layer.innerHTML =
    "";


  page.strokes.forEach(
    stroke=>
      renderStroke(
        stroke
      )
  );


  page.elements.forEach(
    obj=>
      renderObject(
        obj
      )
  );


  const note =
    getCurrentNote();


  const pageNumber =
    document.getElementById(
      "pageNumber"
    );


  if(
    pageNumber &&
    note
  ){

    pageNumber.textContent =
      (
        note.currentPage+1
      )
      +
      " / "
      +
      note.pages.length;

  }


  applyCamera();

}


/* =========================================
   OBJECT RENDER
========================================= */

function renderObject(obj){

  const layer =
    document.getElementById(
      "objectLayer"
    );


  if(!layer)
    return;


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "noteObject";


  if(
    selectedObjectId===
    obj.id
  ){

    el.classList.add(
      "selectedObject"
    );

  }


  el.style.left =
    obj.x+"px";

  el.style.top =
    obj.y+"px";

  el.style.width =
    obj.width+"px";

  el.style.height =
    obj.height+"px";


  /*
    TEXT
  */

  if(
    obj.type==="text"
  ){

    const text =
      document.createElement(
        "div"
      );


    text.className =
      "noteText";


    text.textContent =
      obj.text;


    text.style.color =
      obj.color;


    text.style.fontSize =
      obj.fontSize+"px";


    el.appendChild(
      text
    );

  }


  /*
    STICKY
  */

  if(
    obj.type==="sticky"
  ){

    el.classList.add(
      "sticky"
    );


    el.style.fontSize =
      obj.fontSize+"px";


    el.textContent =
      obj.text;

  }


  /*
    IMAGE
  */

  if(
    obj.type==="image"
  ){

    const img =
      document.createElement(
        "img"
      );


    img.src =
      obj.src;


    img.style.width =
      "100%";

    img.style.height =
      "100%";

    img.style.objectFit =
      "contain";


    el.appendChild(
      img
    );

  }


  /*
    選択
  */

  el.addEventListener(
    "pointerdown",
    e=>{

      e.stopPropagation();

      selectedObjectId =
        obj.id;


      if(
        currentTool==="object"
      ){

        eraseObjectAt({
          x:obj.x,
          y:obj.y
        });

        return;

      }


      renderPage();

    }
  );


  /*
    リサイズ
  */

  const handle =
    document.createElement(
      "div"
    );


  handle.className =
    "resizeHandle";


  handle.addEventListener(
    "pointerdown",
    e=>{

      e.stopPropagation();

      e.preventDefault();


      const startX =
        e.clientX;

      const startY =
        e.clientY;


      const startW =
        obj.width;

      const startH =
        obj.height;


      function move(ev){

        obj.width =
          Math.max(
            80,
            startW+
            (
              ev.clientX-
              startX
            )/zoom
          );


        obj.height =
          Math.max(
            40,
            startH+
            (
              ev.clientY-
              startY
            )/zoom
          );


        renderPage();

      }


      function up(){

        window.removeEventListener(
          "pointermove",
          move
        );

        window.removeEventListener(
          "pointerup",
          up
        );


        save();

      }


      window.addEventListener(
        "pointermove",
        move
      );


      window.addEventListener(
        "pointerup",
        up
      );

    }
  );


  el.appendChild(
    handle
  );


  layer.appendChild(
    el
  );


  makeObjectDraggable(
    el,
    obj
  );

}


/* =========================================
   DRAG OBJECT
========================================= */

function makeObjectDraggable(
  el,
  obj
){

  let startX=0;

  let startY=0;

  let originalX=0;

  let originalY=0;


  el.addEventListener(
    "pointerdown",
    e=>{

      if(
        currentTool!=="hand"
      )
        return;


      if(
        e.target.classList.contains(
          "resizeHandle"
        )
      )
        return;


      e.stopPropagation();


      startX =
        e.clientX;

      startY =
        e.clientY;


      originalX =
        obj.x;

      originalY =
        obj.y;


      function move(ev){

        obj.x =
          originalX+
          (
            ev.clientX-
            startX
          )/zoom;


        obj.y =
          originalY+
          (
            ev.clientY-
            startY
          )/zoom;


        renderPage();

      }


      function up(){

        window.removeEventListener(
          "pointermove",
          move
        );

        window.removeEventListener(
          "pointerup",
          up
        );


        save();

      }


      window.addEventListener(
        "pointermove",
        move
      );


      window.addEventListener(
        "pointerup",
        up
      );

    }
  );

}


/* =========================================
   PAGE
========================================= */

function addPage(){

  const note =
    getCurrentNote();


  note.pages.push({

    strokes:[],

    elements:[]

  });


  note.currentPage =
    note.pages.length-1;


  selectedObjectId =
    null;


  save();

  renderPage();

}


function changePage(delta){

  const note =
    getCurrentNote();


  const next =
    note.currentPage+
    delta;


  if(
    next<0 ||
    next>=note.pages.length
  )
    return;


  note.currentPage =
    next;


  selectedObjectId =
    null;


  renderPage();

  save();

}


function clearPage(){

  if(
    !confirm(
      "このページをすべて消去する？"
    )
  )
    return;


  const page =
    getCurrentPage();


  page.strokes=[];

  page.elements=[];


  selectedObjectId =
    null;


  renderPage();

  save();

}

/* =========================================
   IMPORT
========================================= */

function importData(){

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "file";

  input.accept =
    ".json,application/json";


  input.onchange =
    ()=>{

      const file =
        input.files[0];


      if(!file)
        return;


      const reader =
        new FileReader();


      reader.onload =
        ()=>{

          try{

            const imported =
              JSON.parse(
                reader.result
              );


            if(
              !imported ||
              !Array.isArray(
                imported.folders
              ) ||
              !Array.isArray(
                imported.notes
              )
            ){

              throw new Error();

            }


            data =
              imported;


            migrateNotes();

            applyTheme();

            renderTree();

            showHome();


            showToast(
              "データを読み込みました"
            );


          }catch{

            showToast(
              "読み込みに失敗しました"
            );

          }

        };


      reader.readAsText(
        file
      );

    };


  input.click();

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

  flushStudyTime();


  if(
    !confirm(
      "ログアウトしますか？"
    )
  )
    return;


  document
    .getElementById(
      "app"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "loginScreen"
    )
    .style.display =
    "flex";


  trackingStart =
    null;

}


/* =========================================
   MOBILE
========================================= */

function toggleSidebar(){

  document
    .getElementById(
      "sidebar"
    )
    .classList.toggle(
      "show"
    );

}


/* =========================================
   AUTOSAVE
========================================= */

setInterval(
  ()=>{

    if(data.name){

      save();

    }

  },
  5000
);

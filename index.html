<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Destination Note</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body{
  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(120,170,255,.32),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(190,120,255,.28),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #eef5ff,
      #f7f7fb 45%,
      #edf1ff
    );
  color:#111;
}

body.dark{
  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(70,130,255,.22),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(150,80,255,.20),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #070a12,
      #10131d 50%,
      #080b13
    );
  color:white;
}

/* =========================
   LIQUID GLASS
========================= */

.glass{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.58),
      rgba(255,255,255,.22)
    );
  border:1px solid rgba(255,255,255,.58);
  box-shadow:
    0 12px 40px rgba(0,0,0,.10),
    inset 0 1px 0 rgba(255,255,255,.75),
    inset 0 -1px 0 rgba(255,255,255,.18);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
}

.dark .glass{
  background:
    linear-gradient(
      135deg,
      rgba(35,40,55,.62),
      rgba(20,24,36,.38)
    );
  border-color:rgba(255,255,255,.13);
  box-shadow:
    0 15px 45px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -1px 0 rgba(255,255,255,.03);
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginCard{
  width:min(430px,100%);
  padding:34px;
  border-radius:34px;
  position:relative;
  overflow:hidden;
}

.loginCard::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  top:-150px;
  right:-100px;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  filter:blur(35px);
}

.logo{
  font-size:38px;
  font-weight:800;
  letter-spacing:-1.5px;
  margin-bottom:5px;
}

.subtitle{
  opacity:.6;
  margin-bottom:28px;
}

input,
textarea,
select{
  font:inherit;
}

.input{
  width:100%;
  padding:15px 17px;
  margin:6px 0;
  border:1px solid rgba(255,255,255,.5);
  border-radius:18px;
  outline:none;
  background:rgba(255,255,255,.34);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  color:inherit;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55);
}

.dark .input{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.12);
}

button{
  border:0;
  font:inherit;
  cursor:pointer;
  color:inherit;
}

.primary{
  width:100%;
  padding:15px;
  margin-top:12px;
  border-radius:18px;
  font-weight:700;
  color:white;
  background:
    linear-gradient(
      135deg,
      #4c8dff,
      #7b61ff
    );
  box-shadow:
    0 10px 25px rgba(76,141,255,.28),
    inset 0 1px 0 rgba(255,255,255,.5);
}

.primary:active{
  transform:scale(.98);
}

/* =========================
   APP
========================= */

#app{
  display:none;
  width:100%;
  height:100%;
}

.appShell{
  width:100%;
  height:100%;
  display:flex;
  gap:12px;
  padding:12px;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:290px;
  min-width:290px;
  height:100%;
  border-radius:28px;
  padding:12px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.sidebarTop{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
}

.appIcon{
  width:44px;
  height:44px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.8),
      rgba(255,255,255,.28)
    );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    0 8px 20px rgba(0,0,0,.08);
}

.sidebarTitle{
  font-weight:800;
  font-size:17px;
}

.sidebarSub{
  font-size:11px;
  opacity:.5;
}

.tree{
  flex:1;
  overflow:auto;
  padding:7px 3px;
  scrollbar-width:none;
}

.tree::-webkit-scrollbar{
  display:none;
}

.treeRow{
  display:flex;
  align-items:center;
  min-height:42px;
  margin:2px 0;
  padding:5px 7px;
  border-radius:14px;
  cursor:pointer;
  user-select:none;
  transition:
    background .18s ease,
    transform .15s ease;
}

.treeRow:hover{
  background:rgba(255,255,255,.35);
}

.dark .treeRow:hover{
  background:rgba(255,255,255,.07);
}

.treeRow:active{
  transform:scale(.98);
}

.treeRow.selected{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.66),
      rgba(255,255,255,.25)
    );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.65),
    0 5px 18px rgba(0,0,0,.06);
}

.dark .treeRow.selected{
  background:rgba(255,255,255,.11);
}

.arrow{
  width:24px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:.65;
  flex-shrink:0;
}

.arrow span{
  transition:transform .2s ease;
}

.arrow.open span{
  transform:rotate(90deg);
}

.treeIcon{
  width:28px;
  text-align:center;
  flex-shrink:0;
}

.treeName{
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:14px;
}

.sidebarBottom{
  display:flex;
  gap:7px;
  padding:7px 2px 2px;
}

.smallButton{
  flex:1;
  min-height:42px;
  border-radius:15px;
  background:rgba(255,255,255,.35);
  border:1px solid rgba(255,255,255,.4);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.dark .smallButton{
  background:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.1);
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-width:0;
  height:100%;
  border-radius:30px;
  position:relative;
  overflow:hidden;
}

/* =========================
   HOME
========================= */

.home{
  width:100%;
  height:100%;
  overflow:auto;
  padding:35px;
}

.hero{
  padding:30px;
  border-radius:30px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}

.hero::after{
  content:"";
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  right:-160px;
  top:-200px;
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.55),
      transparent 65%
    );
  filter:blur(12px);
}

.hero h1{
  margin:0;
  font-size:38px;
  letter-spacing:-1.5px;
}

.hero p{
  opacity:.55;
}

.rankCard{
  display:flex;
  align-items:center;
  gap:18px;
  padding:22px;
  border-radius:25px;
  margin-bottom:20px;
}

.rankIcon{
  width:64px;
  height:64px;
  border-radius:21px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  background:rgba(255,255,255,.42);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.75);
}

.rankName{
  font-size:20px;
  font-weight:800;
}

.studyTime{
  opacity:.55;
  font-size:13px;
}

.sectionTitle{
  font-size:19px;
  font-weight:800;
  margin:25px 0 12px;
}

.folderGrid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(210px,1fr));
  gap:13px;
}

.folderCard{
  padding:22px;
  border-radius:24px;
  cursor:pointer;
  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.folderCard:hover{
  transform:translateY(-3px);
}

.folderCard:active{
  transform:scale(.98);
}

.folderEmoji{
  font-size:30px;
}

.folderName{
  margin-top:10px;
  font-weight:700;
}

.folderCount{
  margin-top:4px;
  font-size:12px;
  opacity:.5;
}

/* =========================
   FOLDER
========================= */

.folderView{
  width:100%;
  height:100%;
  overflow:auto;
  padding:30px;
}

.viewHeader{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.viewHeader h2{
  margin:0;
  font-size:30px;
}

.backButton{
  width:42px;
  height:42px;
  border-radius:15px;
  background:rgba(255,255,255,.35);
}

/* =========================
   NOTE EDITOR
========================= */

.noteView{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

.noteHeader{
  min-height:68px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  position:relative;
  z-index:20;
}

.noteTitle{
  font-weight:800;
  font-size:18px;
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.toolBar{
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px;
  border-radius:20px;
  background:
    rgba(255,255,255,.43);
  border:1px solid rgba(255,255,255,.55);
  backdrop-filter:blur(25px) saturate(180%);
  -webkit-backdrop-filter:blur(25px) saturate(180%);
  box-shadow:
    0 10px 30px rgba(0,0,0,.08),
    inset 0 1px 0 rgba(255,255,255,.8);
  overflow-x:auto;
  scrollbar-width:none;
}

.toolBar::-webkit-scrollbar{
  display:none;
}

.tool{
  width:40px;
  height:40px;
  border-radius:14px;
  flex-shrink:0;
  background:rgba(255,255,255,.28);
  transition:.15s ease;
}

.tool:hover{
  background:rgba(255,255,255,.55);
}

.tool.active{
  background:
    linear-gradient(
      135deg,
      rgba(100,145,255,.75),
      rgba(150,100,255,.7)
    );
  color:white;
  box-shadow:
    0 5px 15px rgba(80,120,255,.25);
}

.tool:active{
  transform:scale(.9);
}

.colorInput{
  width:40px;
  height:40px;
  border:0;
  padding:4px;
  background:transparent;
}

.sizeBox{
  display:flex;
  align-items:center;
  gap:5px;
  padding:0 8px;
}

#sizeRange{
  width:85px;
}

.zoomBox{
  display:flex;
  gap:4px;
  padding:0 5px;
}

.pageBox{
  display:flex;
  align-items:center;
  gap:5px;
  padding:0 5px;
  white-space:nowrap;
  font-size:12px;
}

/* =========================
   BOARD
========================= */

.boardViewport{
  flex:1;
  position:relative;
  overflow:hidden;
  touch-action:none;
  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(100,150,255,.06),
      transparent 25%
    ),
    rgba(255,255,255,.08);
}

.dark .boardViewport{
  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(100,130,255,.06),
      transparent 25%
    ),
    rgba(0,0,0,.08);
}

.boardWorld{
  position:absolute;
  left:0;
  top:0;
  width:10000px;
  height:7000px;
  transform-origin:0 0;
  background:
    linear-gradient(
      rgba(120,140,180,.08) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(120,140,180,.08) 1px,
      transparent 1px
    );
  background-size:50px 50px;
}

.page{
  position:absolute;
  left:500px;
  top:350px;
  width:8500px;
  height:6000px;
  background:
    rgba(255,255,255,.86);
  border-radius:22px;
  box-shadow:
    0 20px 70px rgba(0,0,0,.14),
    inset 0 0 0 1px rgba(0,0,0,.04);
  overflow:hidden;
}

.dark .page{
  background:rgba(25,28,36,.94);
  box-shadow:
    0 20px 70px rgba(0,0,0,.4);
}

#drawSvg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}

.objectLayer{
  position:absolute;
  inset:0;
}

/* =========================
   NOTE OBJECTS
========================= */

.noteObject{
  position:absolute;
  min-width:80px;
  min-height:40px;
  user-select:none;
  touch-action:none;
}

.noteText{
  white-space:pre-wrap;
  outline:none;
  cursor:text;
  padding:5px;
}

.sticky{
  padding:18px;
  border-radius:8px;
  background:
    linear-gradient(
      135deg,
      rgba(255,244,140,.95),
      rgba(255,226,90,.84)
    );
  color:#222;
  box-shadow:
    0 12px 30px rgba(0,0,0,.13),
    inset 0 1px 0 rgba(255,255,255,.55);
}

.resizeHandle{
  position:absolute;
  width:13px;
  height:13px;
  right:-7px;
  bottom:-7px;
  border-radius:50%;
  background:white;
  border:2px solid #668cff;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.selectedObject{
  outline:2px solid rgba(90,130,255,.65);
  outline-offset:3px;
}

/* =========================
   SETTINGS
========================= */

.settings{
  padding:30px;
  overflow:auto;
  width:100%;
  height:100%;
}

.settingCard{
  padding:22px;
  border-radius:25px;
  margin-bottom:15px;
}

.settingTitle{
  font-weight:800;
  margin-bottom:12px;
}

/* =========================
   MOBILE
========================= */

.mobileMenu{
  display:none;
  position:absolute;
  z-index:100;
  left:12px;
  top:12px;
  width:45px;
  height:45px;
  border-radius:16px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

@media(max-width:800px){

  .appShell{
    padding:7px;
  }

  .sidebar{
    position:absolute;
    z-index:90;
    left:7px;
    top:7px;
    bottom:7px;
    height:auto;
    transform:translateX(-110%);
    transition:.25s ease;
  }

  .sidebar.show{
    transform:translateX(0);
  }

  .mobileMenu{
    display:block;
  }

  .main{
    border-radius:24px;
  }

  .home,
  .folderView,
  .settings{
    padding:22px 15px;
  }

  .hero h1{
    font-size:30px;
  }

  .noteHeader{
    padding-left:58px;
    min-height:60px;
  }

  .noteTitle{
    display:none;
  }

  .toolBar{
    width:100%;
  }
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:
    translateX(-50%)
    translateY(20px);
  padding:12px 18px;
  border-radius:18px;
  opacity:0;
  pointer-events:none;
  z-index:9999;
  background:
    rgba(30,35,45,.78);
  color:white;
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  transition:.25s ease;
}

.toast.show{
  opacity:1;
  transform:
    translateX(-50%)
    translateY(0);
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

  <div class="loginCard glass">

    <div class="logo">
      Destination Note
    </div>

    <div class="subtitle">
      あなたの勉強を、ひとつの場所へ。
    </div>

    <input
      id="loginName"
      class="input"
      placeholder="名前"
      autocomplete="off"
    >

    <input
      id="loginPassword"
      class="input"
      type="password"
      placeholder="パスワード"
    >

    <button
      id="loginButton"
      class="primary"
    >
      はじめる
    </button>

    <div style="
      margin-top:14px;
      text-align:center;
      font-size:11px;
      opacity:.45;
    ">
      この端末のブラウザにデータを保存します
    </div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

  <div class="appShell">

    <aside class="sidebar glass" id="sidebar">

      <div class="sidebarTop">

        <div class="appIcon">
          📚
        </div>

        <div>
          <div class="sidebarTitle">
            Destination Note
          </div>

          <div
            class="sidebarSub"
            id="userNameDisplay"
          >
          </div>
        </div>

      </div>

      <div
        class="tree"
        id="tree"
      ></div>

      <div class="sidebarBottom">

        <button
          class="smallButton"
          onclick="createFolder()"
        >
          ＋ タブ
        </button>

        <button
          class="smallButton"
          onclick="createNote()"
        >
          ＋ ノート
        </button>

        <button
          class="smallButton"
          onclick="showSettings()"
        >
          ⚙️
        </button>

      </div>

    </aside>


    <main class="main glass">

      <button
        class="mobileMenu"
        onclick="toggleSidebar()"
      >
        ☰
      </button>

      <!-- HOME -->
      <section
        id="homeScreen"
        class="home"
      ></section>


      <!-- FOLDER -->
      <section
        id="folderScreen"
        class="folderView"
        style="display:none"
      ></section>


      <!-- NOTE -->
      <section
        id="noteScreen"
        class="noteView"
        style="display:none"
      ></section>


      <!-- SETTINGS -->
      <section
        id="settingsScreen"
        class="settings"
        style="display:none"
      ></section>

    </main>

  </div>

</div>

<div
  id="toast"
  class="toast"
></div>


<script>
/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
  "destinationNote_v1";

const WORLD_W = 10000;
const WORLD_H = 7000;

let data = {
  name:"",
  password:"",
  totalSeconds:0,

  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],

  notes:[],

  settings:{
    dark:false
  }
};

let selectedFolderId = "root";
let currentFolderId = "root";
let currentNoteId = null;

let expandedFolders =
  new Set(["root"]);

let currentTool = "pencil";
let currentColor = "#222222";
let currentSize = 5;

let zoom = 1;

let cameraX = -500;
let cameraY = -350;

let drawing = false;
let currentStroke = null;
let pointers = new Map();

let renderFrame = null;

let selectedObjectId = null;

let trackingStart = null;


/* =====================================================
   BASIC
===================================================== */

function uid(){

  return (
    Date.now().toString(36)
    +
    Math.random()
      .toString(36)
      .slice(2,8)
  );
}


function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}


function load(){

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(!raw) return;

  try{

    const saved =
      JSON.parse(raw);

    data = {
      ...data,
      ...saved
    };

    if(!Array.isArray(data.folders)){
      data.folders = [];
    }

    if(!Array.isArray(data.notes)){
      data.notes = [];
    }

    if(!data.settings){
      data.settings = {
        dark:false
      };
    }

    if(
      !data.folders.some(
        f=>f.id==="root"
      )
    ){

      data.folders.unshift({
        id:"root",
        name:"マイノート",
        icon:"📚",
        parent:null,
        created:Date.now()
      });

    }

    migrateNotes();

  }catch(e){

    console.error(e);

  }
}


function migrateNotes(){

  data.notes.forEach(note=>{

    if(!note.pages){

      note.pages = [
        {
          strokes:
            note.strokes || [],

          elements:
            note.elements || []
        }
      ];

    }

    if(!Array.isArray(note.pages)){
      note.pages = [];
    }

    note.pages.forEach(page=>{

      if(!page.strokes)
        page.strokes = [];

      if(!page.elements)
        page.elements = [];

    });

    if(!note.folderId)
      note.folderId = "root";

    if(!note.currentPage)
      note.currentPage = 0;

  });

  save();

}


/* =====================================================
   RANK
===================================================== */

function getRank(seconds){

  const hours =
    seconds / 3600;

  if(hours < 10)
    return {
      name:"ブロンズ",
      icon:"🥉"
    };

  if(hours < 30)
    return {
      name:"シルバー",
      icon:"🥈"
    };

  if(hours < 60)
    return {
      name:"ゴールド",
      icon:"🥇"
    };

  if(hours < 100)
    return {
      name:"プラチナ",
      icon:"💎"
    };

  if(hours < 200)
    return {
      name:"ビジネス",
      icon:"💼"
    };

  if(hours < 500)
    return {
      name:"ファースト",
      icon:"✈️"
    };

  return {
    name:"グランクラス",
    icon:"🚄"
  };

}


function formatTime(seconds){

  seconds =
    Math.max(
      0,
      Math.floor(seconds)
    );

  const h =
    Math.floor(
      seconds / 3600
    );

  const m =
    Math.floor(
      (seconds % 3600) / 60
    );

  const s =
    seconds % 60;

  return (
    h + "時間 "
    + m + "分 "
    + s + "秒"
  );

}


/* =====================================================
   STUDY TIMER
===================================================== */

function startTracking(){

  if(trackingStart===null)
    trackingStart = Date.now();

}


function flushStudyTime(){

  if(trackingStart===null)
    return;

  const now =
    Date.now();

  const diff =
    Math.floor(
      (now - trackingStart) / 1000
    );

  if(diff > 0){

    data.totalSeconds += diff;

    trackingStart =
      now;

    save();

  }

  updateStudyDisplay();

}


document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState ===
      "visible"
    ){

      trackingStart =
        Date.now();

    }else{

      flushStudyTime();

      trackingStart =
        null;

    }

  }
);

setInterval(
  ()=>{

    if(
      document.visibilityState ===
      "visible"
    ){

      flushStudyTime();

    }

  },
  1000
);

/* =====================================================
   TREE
===================================================== */

function childrenOf(id){

  return data.folders.filter(
    f=>f.parent===id
  );

}


function notesOf(id){

  return data.notes.filter(
    n=>n.folderId===id
  );

}


function renderTree(){

  const tree =
    document.getElementById(
      "tree"
    );

  tree.innerHTML = "";

  const root =
    data.folders.find(
      f=>f.id==="root"
    );

  if(root){

    renderFolderTree(
      root,
      0,
      tree
    );

  }

}


function renderFolderTree(
  folder,
  depth,
  parentEl
){

  const children =
    childrenOf(folder.id);

  const notes =
    notesOf(folder.id);

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "treeRow"
    +
    (
      selectedFolderId===
      folder.id
        ? " selected"
        : ""
    );

  row.style.paddingLeft =
    (7 + depth*18) + "px";


  /* -------------------------
     Arrow
  ------------------------- */

  const arrow =
    document.createElement(
      "div"
    );

  arrow.className =
    "arrow"
    +
    (
      expandedFolders.has(
        folder.id
      )
        ? " open"
        : ""
    );

  if(children.length){

    arrow.innerHTML =
      "<span>›</span>";

  }else{

    arrow.innerHTML =
      "<span style='opacity:0'>›</span>";

  }


  /* -------------------------
     Icon
  ------------------------- */

  const icon =
    document.createElement(
      "div"
    );

  icon.className =
    "treeIcon";

  icon.textContent =
    folder.icon || "📁";


  /* -------------------------
     Name
  ------------------------- */

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "treeName";

  name.textContent =
    folder.name;


  row.append(
    arrow,
    icon,
    name
  );


  /*
    ★ここ重要★

    三角だけではなく

    ・三角
    ・アイコン
    ・文字
    ・行の空いている部分

    全部クリック可能
  */

  row.addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      selectedFolderId =
        folder.id;

      currentFolderId =
        folder.id;

      if(children.length){

        if(
          expandedFolders.has(
            folder.id
          )
        ){

          expandedFolders.delete(
            folder.id
          );

        }else{

          expandedFolders.add(
            folder.id
          );

        }

      }

      renderTree();

      openFolder(
        folder.id
      );

    }
  );


  row.addEventListener(
    "contextmenu",
    e=>{

      e.preventDefault();

      renameFolder(
        folder.id
      );

    }
  );


  parentEl.appendChild(row);


  if(
    expandedFolders.has(
      folder.id
    )
  ){

    children.forEach(
      child=>{

        renderFolderTree(
          child,
          depth+1,
          parentEl
        );

      }
    );

    notes.forEach(
      note=>{

        renderNoteTree(
          note,
          depth+1,
          parentEl
        );

      }
    );

  }

}


function renderNoteTree(
  note,
  depth,
  parentEl
){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "treeRow"
    +
    (
      currentNoteId===
      note.id
        ? " selected"
        : ""
    );

  row.style.paddingLeft =
    (7 + depth*18) + "px";


  const arrow =
    document.createElement(
      "div"
    );

  arrow.className =
    "arrow";

  arrow.innerHTML =
    "<span style='opacity:0'>›</span>";


  const icon =
    document.createElement(
      "div"
    );

  icon.className =
    "treeIcon";

  icon.textContent =
    "📝";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "treeName";

  name.textContent =
    note.name;


  row.append(
    arrow,
    icon,
    name
  );


  /*
    ノートも文字部分を含め
    行全体をクリック可能
  */

  row.addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      openNote(
        note.id
      );

    }
  );


  row.addEventListener(
    "contextmenu",
    e=>{

      e.preventDefault();

      renameNote(
        note.id
      );

    }
  );


  parentEl.appendChild(row);

}

function setTool(tool){

  currentTool =

  updateToolButtons();

}


function updateToolButtons(){

  document
    .querySelectorAll(
      ".tool[id^='tool-']"
    )
    .forEach(
      button=>{

        button.classList.remove(
          "active"
        );

      }
    );


  const button =
    document.getElementById(
      "tool-"+currentTool
    );

  if(button)
    button.classList.add(
      "active"
    );


  const viewport =
    document.getElementById(
      "boardViewport"
    );

  if(!viewport)
    return;


  if(
    currentTool==="hand"
  ){

    viewport.style.cursor =
      "grab";

  }else if(
    currentTool==="text" ||
    currentTool==="sticky"
  ){

    viewport.style.cursor =
      "text";

  }else{

    viewport.style.cursor =
      "crosshair";

  }

}

  currentColor =
    color;

}


function changeSize(size){

  currentSize =
    Number(size);

  if(
    selectedObjectId
  ){

    const page =
      getCurrentPage();

    const obj =
      page.elements.find(
        e=>e.id===
        selectedObjectId
      );

    if(
      obj &&
      (
        obj.type==="text" ||
        obj.type==="sticky"
      )
    ){

      obj.fontSize =
        Number(size) * 3 + 10;

      renderPage();

      save();

    }

  }

}


/* =====================================================
   ZOOM
===================================================== */

function changeZoom(amount){

  zoom =
    Math.min(
      3,
      Math.max(
        .25,
        zoom + amount
      )
    );

  applyCamera();

}


function resetZoom(){

  zoom=1;

  cameraX=-500;

  cameraY=-350;

  applyCamera();

}


function applyCamera(){

  const world =
    document.getElementById(
      "boardWorld"
    );

  if(!world)
    return;

  world.style.transform =
    `translate(${cameraX}px,${cameraY}px) scale(${zoom})`;

}


/* =====================================================
   BOARD SETUP
===================================================== */

function setupBoard(){

  const viewport =
    document.getElementById(
      "boardViewport"
    );

  if(!viewport)
    return;


  viewport.addEventListener(
    "pointerdown",
    pointerDown
  );

  viewport.addEventListener(
    "pointermove",
    pointerMove
  );

  viewport.addEventListener(
    "pointerup",
    pointerUp
  );

  viewport.addEventListener(
    "pointercancel",
    pointerUp
  );

  viewport.addEventListener(
    "pointerleave",
    pointerUp
  );


  applyCamera();

}


function screenToWorld(
  clientX,
  clientY
){

  const viewport =
    document.getElementById(
      "boardViewport"
    );

  const rect =
    viewport.getBoundingClientRect();

  const x =
    (
      clientX -
      rect.left -
      cameraX
    ) / zoom;

  const y =
    (
      clientY -
      rect.top -
      cameraY
    ) / zoom;

  return {
    x,
    y
  };

}


/* =====================================================
   POINTER
===================================================== */

function pointerDown(e){

  e.preventDefault();

  const viewport =
    e.currentTarget;

  viewport.setPointerCapture(
    e.pointerId
  );

  pointers.set(
    e.pointerId,
    {
      x:e.clientX,
      y:e.clientY
    }
  );


  if(
    pointers.size>=2
  ){

    drawing=false;

    return;

  }


  const point =
    screenToWorld(
      e.clientX,
      e.clientY
    );


  if(
    currentTool==="hand"
  ){

    drawing=true;

    currentStroke={
      hand:true,
      lastX:e.clientX,
      lastY:e.clientY
    };

    return;

  }


  if(
    currentTool==="text"
  ){

    createTextAt(
      point
    );

    return;

  }


  if(
    currentTool==="sticky"
  ){

    createStickyAt(
      point
    );

    return;

  }


  if(
    currentTool==="object"
  ){

    eraseObjectAt(
      point
    );

    return;

  }


  if(
    currentTool==="pixel"
  ){

    eraseAt(
      point
    );

    drawing=true;

    return;

  }


  drawing=true;

  currentStroke={
    id:uid(),
    color:currentColor,
    width:
      currentTool==="highlighter"
        ? currentSize*3.5
        : currentSize,
    opacity:
      currentTool==="highlighter"
        ? .27
        : 1,
    points:[
      point
    ]
  };

  getCurrentPage()
    .strokes
    .push(
      currentStroke
    );

  renderStroke(
    currentStroke
  );

}


function pointerMove(e){

  pointers.set(
    e.pointerId,
    {
      x:e.clientX,
      y:e.clientY
    }
  );


  if(
    pointers.size>=2
  ){

    const values =
      [...pointers.values()];

    const a =
      values[0];

    const b =
      values[1];

    const dx =
      a.x-b.x;

    const dy =
      a.y-b.y;

    const distance =
      Math.sqrt(
        dx*dx+dy*dy
      );

    if(!pointerMove.lastDistance){

      pointerMove.lastDistance =
        distance;

    }else{

      const diff =
        distance -
        pointerMove.lastDistance;

      zoom =
        Math.min(
          3,
          Math.max(
            .25,
            zoom + diff*.002
          )
        );

      pointerMove.lastDistance =
        distance;

      applyCamera();

    }

    return;

  }


  pointerMove.lastDistance =
    null;


  if(!drawing)
    return;


  if(
    currentTool==="hand"
  ){

    const dx =
      e.clientX -
      currentStroke.lastX;

    const dy =
      e.clientY -
      currentStroke.lastY;

    cameraX += dx;

    cameraY += dy;

    currentStroke.lastX =
      e.clientX;

    currentStroke.lastY =
      e.clientY;

    applyCamera();

    return;

  }


  const point =
    screenToWorld(
      e.clientX,
      e.clientY
    );


  if(
    currentTool==="pixel"
  ){

    eraseAt(
      point
    );

    return;

  }


  if(
    !currentStroke
  )
    return;


  currentStroke.points.push(
    point
  );

  queueRender(
    currentStroke
  );

}


function pointerUp(e){

  pointers.delete(
    e.pointerId
  );

  pointerMove.lastDistance =
    null;

  if(
    e.pointerType==="touch" &&
    pointers.size>0
  )
    return;


  drawing=false;

  currentStroke=null;

  save();

}


/* =====================================================
   SMOOTH DRAWING
===================================================== */

function queueRender(stroke){

  if(renderFrame)
    return;

  renderFrame =
    requestAnimationFrame(
      ()=>{

        renderFrame=null;

        renderStroke(
          stroke
        );

      }
    );

}


function pointsToPath(points){

  if(!points.length)
    return "";

  if(points.length===1){

    const p =
      points[0];

    return `
      M ${p.x} ${p.y}
      L ${p.x+.1} ${p.y+.1}
    `;

  }

  let path =
    `M ${points[0].x} ${points[0].y}`;

  for(
    let i=1;
    i<points.length;
    i++
  ){

    const p =
      points[i];

    const prev =
      points[i-1];

    const midX =
      (prev.x+p.x)/2;

    const midY =
      (prev.y+p.y)/2;

    path +=
      ` Q ${prev.x} ${prev.y} ${midX} ${midY}`;

  }

  const last =
    points[
      points.length-1
    ];

  path +=
    ` L ${last.x} ${last.y}`;

  return path;

}


function renderStroke(stroke){

  const svg =
    document.getElementById(
      "drawSvg"
    );

  if(!svg)
    return;


  let path =
    svg.querySelector(
      `[data-stroke-id="${stroke.id}"]`
    );


  if(!path){

    path =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

    path.dataset.strokeId =
      stroke.id;

    svg.appendChild(
      path
    );

  }


  path.setAttribute(
    "d",
    pointsToPath(
      stroke.points
    )
  );

  path.setAttribute(
    "fill",
    "none"
  );

  path.setAttribute(
    "stroke",
    stroke.color
  );

  path.setAttribute(
    "stroke-width",
    stroke.width
  );

  path.setAttribute(
    "stroke-linecap",
    "round"
  );

  path.setAttribute(
    "stroke-linejoin",
    "round"
  );

  path.setAttribute(
    "opacity",
    stroke.opacity ?? 1
  );

}


/* =====================================================
   PIXEL ERASER
===================================================== */

function distance(
  a,
  b
){

  const dx =
    a.x-b.x;

  const dy =
    a.y-b.y;

  return Math.sqrt(
    dx*dx+dy*dy
  );

}


function eraseAt(point){

  const page =
    getCurrentPage();

  if(!page)
    return;

  const radius =
    Math.max(
      8,
      currentSize*2.2
    );

  const result=[];


  page.strokes.forEach(
    stroke=>{

      let segment=[];

      for(
        let i=0;
        i<stroke.points.length;
        i++
      ){

        const p =
          stroke.points[i];

        if(
          distance(
            p,
            point
          ) <= radius
        ){

          if(
            segment.length>=2
          ){

            result.push({

              ...stroke,

              id:uid(),

              points:
                segment

            });

          }

          segment=[];

        }else{

          segment.push(
            p
          );

        }

      }


      if(
        segment.length>=2
      ){

        result.push({

          ...stroke,

          id:uid(),

          points:
            segment

        });

      }

    }
  );


  page.strokes =
    result;

  renderPage();

}


/* =====================================================
   OBJECT ERASER
===================================================== */

function eraseObjectAt(point){

  const page =
    getCurrentPage();

  if(!page)
    return;


  let hit =
    null;


  for(
    let i=page.elements.length-1;
    i>=0;
    i--
  ){

    const obj =
      page.elements[i];

    if(
      point.x >= obj.x &&
      point.x <=
        obj.x+obj.width &&
      point.y >= obj.y &&
      point.y <=
        obj.y+obj.height
    ){

      hit =
        obj;

      break;

    }

  }


  if(hit){

    page.elements =
      page.elements.filter(
        e=>e.id!==hit.id
      );

    selectedObjectId =
      null;

    renderPage();

    save();

  }

}

/* =====================================================
   IMAGE
===================================================== */

function addImage(){

  const input =
    document.createElement(
      "input"
    );

  input.type="file";

  input.accept=
    "image/*";


  input.onchange =
    ()=>{

      const file =
        input.files[0];

      if(!file)
        return;


      const reader =
        new FileReader();


      reader.onload =
        ()=>{

          const page =
            getCurrentPage();

          const obj={

            id:uid(),

            type:"image",

            x:800,

            y:600,

            width:500,

            height:400,

            src:
              reader.result

          };


          page.elements.push(
            obj
          );

          renderPage();

          save();

        };


      reader.readAsDataURL(
        file
      );

    };


  input.click();

}


/* =====================================================
   RENDER PAGE
===================================================== */

function renderPage(){

  const page =
    getCurrentPage();

  if(!page)
    return;


  const svg =
    document.getElementById(
      "drawSvg"
    );

  const layer =
    document.getElementById(
      "objectLayer"
    );


  if(!svg || !layer)
    return;


  svg.innerHTML =
    "";

  layer.innerHTML =
    "";


  page.strokes.forEach(
    stroke=>{

      renderStroke(
        stroke
      );

    }
  );


  page.elements.forEach(
    obj=>{

      renderObject(
        obj
      );

    }
  );


  const pageNumber =
    document.getElementById(
      "pageNumber"
    );

  if(pageNumber){

    pageNumber.textContent =
      (
        getCurrentNote()
          .currentPage+1
      )
      +
      " / "
      +
      getCurrentNote()
        .pages.length;

  }

  applyCamera();

}


/* =====================================================
   OBJECT RENDER
===================================================== */

function renderObject(obj){

  const layer =
    document.getElementById(
      "objectLayer"
    );

  if(!layer)
    return;


  const el =
    document.createElement(
      "div"
    );

  el.className =
    "noteObject";


  if(
    selectedObjectId===
    obj.id
  ){

    el.classList.add(
      "selectedObject"
    );

  }


  el.style.left =
    obj.x+"px";

  el.style.top =
    obj.y+"px";

  el.style.width =
    obj.width+"px";

  el.style.height =
    obj.height+"px";


  if(
    obj.type==="text"
  ){

    const text =
      document.createElement(
        "div"
      );

    text.className =
      "noteText";

    text.textContent =
      obj.text;

    text.style.color =
      obj.color;

    text.style.fontSize =
      obj.fontSize+"px";

    el.appendChild(
      text
    );

  }


  if(
    obj.type==="sticky"
  ){

    el.classList.add(
      "sticky"
    );

    el.style.fontSize =
      obj.fontSize+"px";

    el.textContent =
      obj.text;

  }


  if(
    obj.type==="image"
  ){

    const image =
      document.createElement(
        "img"
      );

    image.src =
      obj.src;

    image.style.width =
      "100%";

    image.style.height =
      "100%";

    image.style.objectFit =
      "contain";

    el.appendChild(
      image
    );

  }


  el.addEventListener(
    "pointerdown",
    e=>{

      e.stopPropagation();

      selectedObjectId =
        obj.id;

      if(
        currentTool==="object"
      ){

        eraseObjectAt({
          x:obj.x,
          y:obj.y
        });

        return;

      }

      renderPage();

    }
  );


  const handle =
    document.createElement(
      "div"
    );

  handle.className =
    "resizeHandle";


  handle.addEventListener(
    "pointerdown",
    e=>{

      e.stopPropagation();

      e.preventDefault();

      const startX =
        e.clientX;

      const startY =
        e.clientY;

      const startW =
        obj.width;

      const startH =
        obj.height;


      const move =
        ev=>{

          obj.width =
            Math.max(
              80,
              startW +
              (
                ev.clientX -
                startX
              ) / zoom
            );

          obj.height =
            Math.max(
              40,
              startH +
              (
                ev.clientY -
                startY
              ) / zoom
            );

          renderPage();

        };


      const up =
        ()=>{

          window.removeEventListener(
            "pointermove",
            move
          );

          window.removeEventListener(
            "pointerup",
            up
          );

          save();

        };


      window.addEventListener(
        "pointermove",
        move
      );

      window.addEventListener(
        "pointerup",
        up
      );

    }
  );


  el.appendChild(
    handle
  );


  layer.appendChild(
    el
  );


  makeObjectDraggable(
    el,
    obj
  );

}


function makeObjectDraggable(
  el,
  obj
){

  let startX=0;
  let startY=0;
  let ox=0;
  let oy=0;


  el.addEventListener(
    "pointerdown",
    e=>{

      if(
        currentTool!=="hand"
      )
        return;

      if(
        e.target.classList.contains(
          "resizeHandle"
        )
      )
        return;


      e.stopPropagation();

      startX =
        e.clientX;

      startY =
        e.clientY;

      ox =
        obj.x;

      oy =
        obj.y;


      const move =
        ev=>{

          obj.x =
            ox +
            (
              ev.clientX-startX
            )/zoom;

          obj.y =
            oy +
            (
              ev.clientY-startY
            )/zoom;

          renderPage();

        };


      const up =
        ()=>{

          window.removeEventListener(
            "pointermove",
            move
          );

          window.removeEventListener(
            "pointerup",
            up
          );

          save();

        };


      window.addEventListener(
        "pointermove",
        move
      );

      window.addEventListener(
        "pointerup",
        up
      );

    }
  );

}


/* =====================================================
   PAGES
===================================================== */

function addPage(){

  const note =
    getCurrentNote();

  note.pages.push({

    strokes:[],

    elements:[]

  });

  note.currentPage =
    note.pages.length-1;

  save();

  renderPage();

}


function changePage(delta){

  const note =
    getCurrentNote();

  const next =
    note.currentPage+
    delta;


  if(
    next<0 ||
    next>=note.pages.length
  )
    return;


  note.currentPage =
    next;

  selectedObjectId =
    null;

  renderPage();

  save();

}


function clearPage(){

  if(
    !confirm(
      "このページをすべて消去する？"
    )
  )
    return;


  const page =
    getCurrentPage();

  page.strokes=[];

  page.elements=[];

  selectedObjectId =
    null;

  renderPage();

  save();

}

/* =====================================================
   EXPORT
===================================================== */

function exportData(){

  flushStudyTime();

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    "destination-note-backup.json";

  a.click();

  URL.revokeObjectURL(
    url
  );

}


function importData(){

  const input =
    document.createElement(
      "input"
    );

  input.type =
    "file";

  input.accept =
    ".json,application/json";


  input.onchange =
    ()=>{

      const file =
        input.files[0];

      if(!file)
        return;


      const reader =
        new FileReader();


      reader.onload =
        ()=>{

          try{

            const imported =
              JSON.parse(
                reader.result
              );

            if(
              !imported ||
              !Array.isArray(
                imported.folders
              ) ||
              !Array.isArray(
                imported.notes
              )
            ){

              throw new Error(
                "invalid"
              );

            }


            data =
              imported;

            migrateNotes();

            applyTheme();

            renderTree();

            showHome();

            showToast(
              "データを読み込みました"
            );

          }catch{

            showToast(
              "読み込みに失敗しました"
            );

          }

        };


      reader.readAsText(
        file
      );

    };


  input.click();

}


/* =====================================================
   MOBILE SIDEBAR
===================================================== */

function toggleSidebar(){

  document
    .getElementById(
      "sidebar"
    )
    .classList.toggle(
      "show"
    );

}


/* =====================================================
   UTILITY
===================================================== */

function escapeHTML(str){

  return String(str)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      2200
    );

}


/* =====================================================
   AUTOSAVE
===================================================== */

setInterval(
  ()=>{
    if(data.name)
      save();
  },
  5000
);

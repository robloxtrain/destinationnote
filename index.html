<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Destination Note</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,
    "SF Pro Display","Helvetica Neue",Arial,sans-serif;
  background:#f5f5f7;
  color:#111;
}

button,input{
  font:inherit;
}

button{
  border:0;
}

.hidden{
  display:none!important;
}

/* =========================================
   LOGIN
========================================= */

#loginScreen{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  background:
    radial-gradient(circle at 15% 20%,#dfe9ff,transparent 35%),
    radial-gradient(circle at 85% 80%,#eadfff,transparent 35%),
    #f5f5f7;
}

.login-card{
  width:min(430px,100%);
  padding:35px;
  border-radius:30px;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  box-shadow:0 25px 80px rgba(0,0,0,.13);
}

.login-logo{
  font-size:44px;
}

.login-card h1{
  margin:5px 0;
  font-size:31px;
}

.login-card p{
  color:#777;
}

.login-card input{
  width:100%;
  margin:6px 0;
  padding:15px;
  border:1px solid rgba(0,0,0,.08);
  border-radius:15px;
  outline:none;
  background:white;
}

.primary{
  width:100%;
  margin-top:12px;
  padding:15px;
  border-radius:16px;
  background:#111;
  color:white;
  font-weight:700;
}

/* =========================================
   APP
========================================= */

#app{
  width:100%;
  height:100%;
}

/* =========================================
   HOME
========================================= */

.screen{
  width:100%;
  height:100%;
  overflow:auto;
}

.topbar{
  height:68px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 15px;

  position:sticky;
  top:0;
  z-index:100;

  background:rgba(245,245,247,.82);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  border-bottom:1px solid rgba(0,0,0,.07);
}

.topbar-title{
  flex:1;
  font-size:21px;
  font-weight:800;
}

.icon-btn{
  width:43px;
  height:43px;
  border-radius:14px;
  background:rgba(0,0,0,.06);
  display:grid;
  place-items:center;
  font-size:20px;
}

.clock{
  padding:9px 12px;
  border-radius:13px;
  background:white;
  font-size:13px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}

.home{
  max-width:1100px;
  margin:auto;
  padding:24px;
}

.hero{
  padding:28px;
  border-radius:30px;
  color:white;
  background:linear-gradient(135deg,#111,#3a3a3a);
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.hero small{
  opacity:.6;
}

.hero h2{
  margin:5px 0 15px;
  font-size:31px;
}

.study-time{
  font-size:30px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

.rank{
  display:inline-block;
  margin-top:15px;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.14);
}

.section{
  margin-top:25px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(
    auto-fill,
    minmax(210px,1fr)
  );
  gap:14px;
}

.card{
  padding:20px;
  border-radius:22px;
  background:white;
  box-shadow:0 7px 25px rgba(0,0,0,.07);
  cursor:pointer;
}

.card:active{
  transform:scale(.98);
}

.card-icon{
  font-size:34px;
}

.card-title{
  margin-top:9px;
  font-weight:750;
}

.card-sub{
  margin-top:4px;
  color:#888;
  font-size:13px;
}

/* =========================================
   SIDEBAR
========================================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:285px;
  z-index:2000;

  display:flex;
  flex-direction:column;

  background:rgba(248,248,250,.92);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);

  border-right:1px solid rgba(0,0,0,.08);

  transition:
    transform .25s ease,
    width .25s ease;
}

.sidebar-head{
  height:70px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;

  border-bottom:1px solid rgba(0,0,0,.07);
}

.sidebar-logo{
  font-size:22px;
  font-weight:800;
  flex:1;
}

.sidebar-body{
  flex:1;
  overflow:auto;
  padding:10px;
}

.sidebar-actions{
  padding:10px;
  border-top:1px solid rgba(0,0,0,.07);
  display:flex;
  gap:7px;
}

.sidebar-action{
  flex:1;
  padding:11px 8px;
  border-radius:13px;
  background:#111;
  color:white;
  font-weight:700;
  font-size:13px;
}

.tree-row{
  display:flex;
  align-items:center;
  min-height:43px;
  border-radius:12px;
  margin:2px 0;
  cursor:pointer;
}

.tree-row:hover{
  background:rgba(0,0,0,.05);
}

.tree-row.selected{
  background:rgba(0,122,255,.13);
  color:#007aff;
}

.tree-arrow{
  width:28px;
  text-align:center;
  font-size:13px;
  color:#777;
}

.tree-icon{
  width:29px;
  font-size:18px;
}

.tree-name{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:14px;
}

.tree-note{
  font-size:17px;
}

.tree-indent{
  width:18px;
  flex:none;
}

.sidebar-overlay{
  display:none;
}

/* =========================================
   MAIN WITH SIDEBAR
========================================= */

.with-sidebar{
  margin-left:285px;
  width:calc(100% - 285px);
  height:100%;
}

/* =========================================
   FOLDER
========================================= */

.folder-page{
  max-width:1100px;
  margin:auto;
  padding:24px;
}

.breadcrumb{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  color:#777;
  margin-bottom:17px;
}

.breadcrumb button{
  background:none;
  color:#555;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.action{
  padding:12px 15px;
  border-radius:14px;
  background:#111;
  color:#fff;
  font-weight:700;
}

.action.light{
  background:white;
  color:#111;
}

/* =========================================
   NOTE EDITOR
========================================= */

#noteScreen{
  overflow:hidden;
  background:#e7e7eb;
}

.note-editor{
  width:100%;
  height:100%;
  position:relative;
}

.note-topbar{
  height:64px;
  display:flex;
  align-items:center;
  gap:7px;

  padding:8px 10px;

  background:rgba(245,245,247,.92);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  border-bottom:1px solid rgba(0,0,0,.08);

  position:absolute;
  left:0;
  right:0;
  top:0;
  z-index:1500;
}

.note-title{
  width:170px;
  flex:none;
  border:0;
  outline:none;
  background:transparent;
  font-size:17px;
  font-weight:750;
}

.tool-scroll{
  display:flex;
  align-items:center;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:4px;
}

.tool-scroll::-webkit-scrollbar{
  display:none;
}

.tool{
  flex:none;
  min-width:43px;
  height:43px;
  padding:0 11px;
  border-radius:13px;
  background:white;
  font-size:18px;
}

.tool.active{
  background:#111;
  color:white;
}

.color-input{
  flex:none;
  width:43px;
  height:43px;
  border:0;
  padding:0;
  background:transparent;
}

.size-wrap{
  flex:none;
  display:flex;
  align-items:center;
  gap:5px;
  padding:7px 9px;
  border-radius:13px;
  background:white;
  white-space:nowrap;
}

#sizeRange{
  width:90px;
}

#sizeValue{
  width:30px;
  text-align:center;
  font-size:12px;
  font-weight:700;
}

.board-viewport{
  position:absolute;
  left:0;
  right:0;
  top:64px;
  bottom:0;

  overflow:hidden;

  touch-action:none;
  user-select:none;

  background:#dcdce1;
}

.board-world{
  position:absolute;

  left:0;
  top:0;

  width:10000px;
  height:7000px;

  transform-origin:0 0;

  will-change:transform;

  background-color:#fff;

  background-image:
    radial-gradient(
      circle,
      rgba(0,0,0,.085) 1px,
      transparent 1px
    );

  background-size:28px 28px;
}

#drawSvg{
  position:absolute;
  left:0;
  top:0;

  width:10000px;
  height:7000px;

  overflow:visible;

  pointer-events:none;
}

#objectLayer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.board-object{
  position:absolute;

  pointer-events:auto;

  user-select:none;
  touch-action:none;

  cursor:grab;
}

.board-object.selected{
  outline:2px solid #007aff;
  outline-offset:5px;
}

.text-object{
  min-width:80px;
  min-height:40px;

  padding:6px;

  white-space:pre-wrap;
  word-break:break-word;
}

.sticky-object{
  width:260px;
  height:180px;

  padding:18px;

  border-radius:6px;

  background:#fff29b;

  box-shadow:
    0 9px 28px rgba(0,0,0,.16);

  white-space:pre-wrap;
  word-break:break-word;
}

.image-object{
  object-fit:contain;
  border-radius:8px;
  box-shadow:0 9px 30px rgba(0,0,0,.16);
}

.resize-handle{
  position:absolute;

  width:18px;
  height:18px;

  right:-9px;
  bottom:-9px;

  border-radius:50%;

  background:#007aff;
  border:3px solid white;

  cursor:nwse-resize;
}

.delete-object{
  position:absolute;

  width:25px;
  height:25px;

  right:-12px;
  top:-12px;

  border-radius:50%;

  background:#ff3b30;
  color:white;

  display:none;
}

.selected .delete-object{
  display:block;
}

.zoom-controls{
  position:absolute;
  right:14px;
  bottom:82px;
  z-index:1000;

  display:flex;
  flex-direction:column;
  gap:7px;
}

.zoom-controls button{
  width:45px;
  height:45px;

  border-radius:14px;

  background:rgba(255,255,255,.9);

  box-shadow:0 6px 25px rgba(0,0,0,.12);

  font-size:20px;
}

.page-controls{
  position:absolute;

  left:50%;
  bottom:14px;

  transform:translateX(-50%);

  z-index:1000;

  display:flex;
  align-items:center;
  gap:7px;

  padding:7px;

  border-radius:17px;

  background:rgba(255,255,255,.9);

  backdrop-filter:blur(20px);

  box-shadow:0 7px 30px rgba(0,0,0,.13);
}

.page-controls button{
  width:38px;
  height:38px;
  border-radius:11px;
  background:#eeeef1;
}

.page-number{
  min-width:70px;
  text-align:center;
  font-size:13px;
  font-weight:700;
}

/* =========================================
   SETTINGS
========================================= */

.settings{
  max-width:800px;
  padding:25px;
  margin:auto;
}

.setting-card{
  padding:20px;
  margin-bottom:14px;

  border-radius:22px;

  background:white;

  box-shadow:0 6px 25px rgba(0,0,0,.05);
}

.setting-card h3{
  margin-top:0;
}

.danger{
  background:#ff3b30!important;
  color:white!important;
}

/* =========================================
   DARK
========================================= */

body.dark{
  background:#111;
  color:#eee;
}

body.dark .topbar,
body.dark .note-topbar{
  background:rgba(25,25,28,.9);
  color:#eee;
}

body.dark .sidebar{
  background:rgba(25,25,28,.93);
  color:#eee;
}

body.dark .tree-row:hover{
  background:rgba(255,255,255,.06);
}

body.dark .card,
body.dark .setting-card,
body.dark .tool,
body.dark .size-wrap{
  background:#222;
  color:#eee;
}

body.dark .icon-btn{
  background:#222;
  color:white;
}

body.dark .clock{
  background:#222;
  color:white;
}

body.dark .board-viewport{
  background:#333;
}

body.dark .board-world{
  background-color:#181818;
  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.12) 1px,
      transparent 1px
    );
}

body.dark .sidebar-action{
  background:#fff;
  color:#111;
}

body.dark .action.light{
  background:#222;
  color:white;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:800px){

  .sidebar{
    width:285px;
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .sidebar-overlay{
    position:fixed;
    inset:0;
    z-index:1900;

    background:rgba(0,0,0,.3);

    backdrop-filter:blur(3px);
  }

  .sidebar.open + .sidebar-overlay{
    display:block;
  }

  .with-sidebar{
    margin-left:0;
    width:100%;
  }

  .note-title{
    width:120px;
  }

  .clock{
    display:none;
  }

  .home,
  .folder-page{
    padding:15px;
  }

  .hero h2{
    font-size:27px;
  }

}

/* =========================================
   EMPTY
========================================= */

.empty{
  padding:40px;
  text-align:center;
  color:#888;
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen">

  <div class="login-card">

    <div class="login-logo">📚</div>

    <h1>Destination Note</h1>

    <p id="loginDescription">
      自分だけの勉強ノートを作ろう。
    </p>

    <input
      id="loginName"
      type="text"
      placeholder="名前">

    <input
      id="loginPassword"
      type="password"
      placeholder="パスワード">

    <button
      class="primary"
      id="loginButton">
      はじめる
    </button>

    <p style="font-size:12px">
      ※データはこの端末のブラウザに保存されます。
    </p>

  </div>

</section>


<!-- =====================================================
     APP
===================================================== -->

<div id="app" class="hidden">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside
  id="sidebar"
  class="sidebar">

  <div class="sidebar-head">

    <div class="sidebar-logo">
      📚 Destination
    </div>

    <button
      class="icon-btn"
      id="closeSidebar">
      ×
    </button>

  </div>

  <div
    class="sidebar-body"
    id="tree">
  </div>

  <div class="sidebar-actions">

    <button
      class="sidebar-action"
      id="sideNewFolder">
      ＋ タブ
    </button>

    <button
      class="sidebar-action"
      id="sideNewNote">
      ＋ ノート
    </button>

  </div>

</aside>

<div
  class="sidebar-overlay"
  id="sidebarOverlay">
</div>


<!-- =====================================================
     HOME
===================================================== -->

<section
  id="homeScreen"
  class="screen hidden">

  <div class="with-sidebar">

    <header class="topbar">

      <button
        class="icon-btn"
        id="mobileMenu">
        ☰
      </button>

      <div class="topbar-title">
        Destination Note
      </div>

      <div
        class="clock"
        id="homeClock">
        00:00:00
      </div>

      <button
        class="icon-btn"
        id="settingsBtn">
        ⚙️
      </button>

    </header>


    <main class="home">

      <div class="hero">

        <small>WELCOME</small>

        <h2 id="welcomeName">
          こんにちは
        </h2>

        <div
          class="study-time"
          id="studyTime">
          00:00:00
        </div>

        <div>
          サイト滞在中の学習時間
        </div>

        <div
          class="rank"
          id="rankText">
          🥉 ブロンズ
        </div>

      </div>


      <div class="section">

        <div class="section-head">
          <h3>📝 最近のノート</h3>
        </div>

        <div
          class="cards"
          id="recentNotes">
        </div>

      </div>

    </main>

  </div>

</section>


<!-- =====================================================
     FOLDER
===================================================== -->

<section
  id="folderScreen"
  class="screen hidden">

  <div class="with-sidebar">

    <header class="topbar">

      <button
        class="icon-btn"
        id="folderMenu">
        ☰
      </button>

      <button
        class="icon-btn"
        id="folderBack">
        ‹
      </button>

      <div
        class="topbar-title"
        id="folderTitle">
        フォルダ
      </div>

      <div
        class="clock"
        id="folderClock">
        00:00:00
      </div>

    </header>


    <main class="folder-page">

      <div
        class="breadcrumb"
        id="breadcrumb">
      </div>


      <div class="actions">

        <button
          class="action"
          id="newFolderBtn">
          ＋ タブ
        </button>

        <button
          class="action"
          id="newNoteBtn">
          ＋ ノート
        </button>

      </div>


      <div class="section">

        <div
          class="cards"
          id="folderContents">
        </div>

      </div>

    </main>

  </div>

</section>


<!-- =====================================================
     NOTE
===================================================== -->

<section
  id="noteScreen"
  class="screen hidden">

  <div class="note-editor">

    <header class="note-topbar">

      <button
        class="icon-btn"
        id="noteMenu">
        ☰
      </button>

      <button
        class="icon-btn"
        id="noteBack">
        ‹
      </button>

      <input
        id="noteTitle"
        class="note-title"
        value="新しいノート">


      <div class="tool-scroll">

        <button
          class="tool active"
          data-tool="pencil">
          ✏️
        </button>

        <button
          class="tool"
          data-tool="highlighter">
          🖍️
        </button>

        <button
          class="tool"
          data-tool="pixel">
          🧽
        </button>

        <button
          class="tool"
          data-tool="objectEraser">
          🗑️
        </button>

        <button
          class="tool"
          data-tool="hand">
          ✋
        </button>

        <button
          class="tool"
          data-tool="text">
          T
        </button>

        <button
          class="tool"
          data-tool="sticky">
          📌
        </button>

        <button
          class="tool"
          id="imageBtn">
          🖼️
        </button>

        <input
          type="color"
          id="colorPicker"
          class="color-input"
          value="#111111">

        <div class="size-wrap">

          <span>サイズ</span>

          <input
            id="sizeRange"
            type="range"
            min="2"
            max="80"
            value="5">

          <span id="sizeValue">
            5
          </span>

        </div>

        <button
          class="tool"
          id="clearPage">
          🗑
        </button>

      </div>

    </header>


    <input
      id="imageInput"
      type="file"
      accept="image/*"
      class="hidden">


    <div
      class="board-viewport"
      id="boardViewport">

      <div
        class="board-world"
        id="boardWorld">

        <svg
          id="drawSvg"
          viewBox="0 0 10000 7000"
          width="10000"
          height="7000">
        </svg>

        <div
          id="objectLayer">
        </div>

      </div>

    </div>


    <div class="zoom-controls">

      <button id="zoomIn">
        ＋
      </button>

      <button id="zoomReset">
        100%
      </button>

      <button id="zoomOut">
        −
      </button>

    </div>


    <div class="page-controls">

      <button id="prevPage">
        ‹
      </button>

      <div
        class="page-number"
        id="pageNumber">
        1 / 1
      </div>

      <button id="nextPage">
        ›
      </button>

      <button id="addPage">
        ＋
      </button>

    </div>

  </div>

</section>


<!-- =====================================================
     SETTINGS
===================================================== -->

<section
  id="settingsScreen"
  class="screen hidden">

  <div class="with-sidebar">

    <header class="topbar">

      <button
        class="icon-btn"
        id="settingsMenu">
        ☰
      </button>

      <button
        class="icon-btn"
        id="settingsBack">
        ‹
      </button>

      <div class="topbar-title">
        設定
      </div>

    </header>


    <main class="settings">

      <div class="setting-card">

        <h3>
          🌙 外観
        </h3>

        <button
          class="action light"
          id="darkToggle">
          ダークモード切替
        </button>

      </div>


      <div class="setting-card">

        <h3>
          💾 データ
        </h3>

        <button
          class="action light"
          id="exportBtn">
          バックアップを書き出す
        </button>

<script>
"use strict";

/* =========================================================
   BASIC
========================================================= */

const STORAGE_KEY =
  "destinationNote_v1";

const WORLD_W = 10000;
const WORLD_H = 7000;

let data = {
  name:"",
  password:"",
  totalSeconds:0,

  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],

  notes:[],

  settings:{
    dark:false
  }
};

function uid(prefix="id"){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return prefix+"_"+crypto.randomUUID();

  }

  return prefix+"_"+Date.now().toString(36)+
    Math.random().toString(36).slice(2);

}

/* =========================================================
   STORAGE
========================================================= */

function saveData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(e){

    console.error(
      "保存失敗",
      e
    );

  }

}

function loadData(){

  try{

    const raw=
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw) return;

    const parsed=
      JSON.parse(raw);

    data={
      ...data,
      ...parsed,
      settings:{
        ...data.settings,
        ...(parsed.settings||{})
      }
    };

  }catch(e){

    console.error(e);

  }

  normalizeData();

}

function normalizeData(){

  if(!Array.isArray(data.folders)){
    data.folders=[];
  }

  if(!data.folders.some(
    f=>f.id==="root"
  )){

    data.folders.unshift({
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    });

  }

  if(!Array.isArray(data.notes)){
    data.notes=[];
  }

  data.notes.forEach(note=>{

    if(!note.id)
      note.id=uid("note");

    if(!note.folder)
      note.folder="root";

    /*
      古いデータ対応
    */

    if(!Array.isArray(note.pages)){

      note.pages=[{
        strokes:
          Array.isArray(note.strokes)
            ? note.strokes
            : [],

        elements:
          Array.isArray(note.elements)
            ? note.elements
            : [],

        image:
          note.image||null
      }];

    }

    note.pages.forEach(page=>{

      if(!Array.isArray(page.strokes))
        page.strokes=[];

      if(!Array.isArray(page.elements))
        page.elements=[];

      page.strokes=
        page.strokes.map(stroke=>({

          id:
            stroke.id||
            uid("stroke"),

          tool:
            stroke.tool||
            "pencil",

          color:
            stroke.color||
            "#111111",

          size:
            Number(stroke.size)||
            5,

          opacity:
            stroke.opacity===undefined
              ? 1
              : Number(stroke.opacity),

          points:
            Array.isArray(stroke.points)
              ? stroke.points
              : []

        }));

      page.elements=
        page.elements.map(obj=>({

          ...obj,

          id:
            obj.id||
            uid("obj"),

          x:
            Number(
              obj.x ??
              obj.left ??
              500
            ),

          y:
            Number(
              obj.y ??
              obj.top ??
              500
            ),

          width:
            Number(obj.width)||
            300,

          height:
            Number(obj.height)||
            100,

          fontSize:
            Number(
              obj.fontSize||
              obj.size||
              28
            ),

          color:
            obj.color||
            "#111111"

        }));

      /*
        古い画像
      */

      if(
        page.image &&
        !page.elements.some(
          o=>o.type==="image"
        )
      ){

        page.elements.push({

          id:uid("image"),

          type:"image",

          x:1000,
          y:500,

          width:1200,
          height:1600,

          src:page.image

        });

      }

    });

  });

}

/* =========================================================
   TREE STATE
========================================================= */

let expandedFolders=
  new Set(["root"]);

let selectedFolderId=
  "root";

function getFolder(id){

  return data.folders.find(
    f=>f.id===id
  );

}

function getChildren(parent){

  return data.folders.filter(
    f=>f.parent===parent
  );

}

function getNotes(folder){

  return data.notes.filter(
    n=>n.folder===folder
  );

}

/* =========================================================
   TREE RENDER
========================================================= */

function renderTree(){

  const tree=
    document.getElementById(
      "tree"
    );

  tree.innerHTML="";

  const root=
    getFolder("root");

  if(root){

    renderFolderTree(
      root,
      0,
      tree
    );

  }

}

function renderFolderTree(
  folder,
  depth,
  parentEl
){

  const row=
    document.createElement(
      "div"
    );

  row.className=
    "tree-row";

  if(
    selectedFolderId===
    folder.id
  ){

    row.classList.add(
      "selected"
    );

  }

  row.style.paddingLeft=
    (depth*18+4)+"px";

  const children=
    getChildren(
      folder.id
    );

  const notes=
    getNotes(
      folder.id
    );

  const hasChildren=
    children.length>0||
    notes.length>0;

  const arrow=
    document.createElement(
      "div"
    );

  arrow.className=
    "tree-arrow";

  arrow.textContent=
    hasChildren
      ? (
        expandedFolders.has(folder.id)
          ? "▼"
          : "▶"
      )
      : "";

  row.appendChild(arrow);


  const icon=
    document.createElement(
      "div"
    );

  icon.className=
    "tree-icon";

  icon.textContent=
    folder.icon||"📁";

  row.appendChild(icon);


  const name=
    document.createElement(
      "div"
    );

  name.className=
    "tree-name";

  name.textContent=
    folder.name;

  row.appendChild(name);


  row.addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      selectedFolderId=
        folder.id;

      currentFolderId=
        folder.id;

      /*
        矢印部分を押したら
        展開/折りたたみ
      */

      if(
        e.target===arrow &&
        hasChildren
      ){

        if(
          expandedFolders.has(
            folder.id
          )
        ){

          expandedFolders.delete(
            folder.id
          );

        }else{

          expandedFolders.add(
            folder.id
          );

        }

        renderTree();

        return;

      }

      openFolder(
        folder.id
      );

    }
  );

  /*
    長押し/右クリック
    名前変更
  */

  row.addEventListener(
    "contextmenu",
    e=>{

      e.preventDefault();

      renameFolder(
        folder
      );

    }
  );

  parentEl.appendChild(row);


  if(
    expandedFolders.has(
      folder.id
    )
  ){

    children.forEach(
      child=>{

        renderFolderTree(
          child,
          depth+1,
          parentEl
        );

      }
    );

    notes.forEach(
      note=>{

        renderNoteTree(
          note,
          depth+1,
          parentEl
        );

      }
    );

  }

}

function renderNoteTree(
  note,
  depth,
  parentEl
){

  const row=
    document.createElement(
      "div"
    );

  row.className=
    "tree-row";

  if(
    currentNote &&
    currentNote.id===
    note.id
  ){

    row.classList.add(
      "selected"
    );

  }

  row.style.paddingLeft=
    (depth*18+4)+"px";


  const blank=
    document.createElement(
      "div"
    );

  blank.className=
    "tree-arrow";

  row.appendChild(blank);


  const icon=
    document.createElement(
      "div"
    );

  icon.className=
    "tree-icon tree-note";

  icon.textContent="📝";

  row.appendChild(icon);


  const name=
    document.createElement(
      "div"
    );

  name.className=
    "tree-name";

  name.textContent=
    note.title;

  row.appendChild(name);


  row.onclick=()=>{

    openNote(
      note.id
    );

  };


  row.addEventListener(
    "contextmenu",
    e=>{

      e.preventDefault();

      renameNote(
        note
      );

    }
  );

  parentEl.appendChild(row);

}

/* =========================================================
   RENAME
========================================================= */

function renameFolder(folder){

  const name=
    prompt(
      "タブ名を変更",
      folder.name
    );

  if(
    name===null||
    !name.trim()
  ) return;

  folder.name=
    name.trim();

  saveData();

  renderTree();
  renderFolder();
  updateHome();

}

function renameNote(note){

  const name=
    prompt(
      "ノート名を変更",
      note.title
    );

  if(
    name===null||
    !name.trim()
  ) return;

  note.title=
    name.trim();

  note.updated=
    Date.now();

  saveData();

  renderTree();
  updateHome();

}

/* =========================================================
   NEW FOLDER
========================================================= */

function createFolder(){

  saveData();

  renderTree();
  renderFolder();
  updateHome();

}

function createNote(){

  const folder=
    selectedFolderId||
    currentFolderId||
    "root";

  const note={

    id:uid("note"),

    folder:folder,

    title:"新しいノート",

    content:"",

    created:Date.now(),

    updated:Date.now(),

    pages:[
      {
        strokes:[],
        elements:[]
      }
    ]

  };

  data.notes.push(
    note
  );

  expandedFolders.add(

  );

  saveData();

  renderTree();

  );

}

document.getElementById(

document.getElementById(
  "sideNewNote"

document.getElementById(

/* =========================================================
   HOME

function updateHome(){

function renderRecentNotes(){

/* =========================================================
   FOLDER
========================================================= */

let currentFolderId="root";

function openFolder(id){

  const folder=
    getFolder(id);

  if(!folder) return;

  currentFolderId=id;
  selectedFolderId=id;

  renderFolder();

  renderTree();

  showScreen(
    "folderScreen"
  );

  closeSidebar();

}

function renderFolder(){

  const folder=

  if(!folder) return;

  document.getElementById(

        );
      };

      container.appendChild(

    }
  );


  notes.forEach(
    note=>{

      const card=
        document.createElement(
          "div"
        );

      card.className=
        "card";

      card.innerHTML=`
        <div class="card-icon">
          📝
        </div>
        <div class="card-title"></div>
        <div class="card-sub">
          ノート
        </div>
      `;

      card.querySelector(
        ".card-title"
      ).textContent=
        note.title;

      card.onclick=()=>{
        openNote(
          note.id
        );
      };

      container.appendChild(
        card
      );

    }
  );


  if(
    !folders.length &&
    !notes.length
  ){

    container.innerHTML=
      `<div class="empty">

        「＋ タブ」または「＋ ノート」で追加できます。
      </div>`;

  }

function renderBreadcrumb(){

  const el=
    document.getElementById(
      "breadcrumb"
    );

  el.innerHTML="";

  let current=
    getFolder(
      currentFolderId
    );

  const path=[];

  while(current){

    path.unshift(
      current
    );

    current=
      getFolder(
        current.parent
      );

  }

  path.forEach(
    (folder,index)=>{

      const button=
        document.createElement(
          "button"
        );

      button.textContent=
        folder.name;

      button.onclick=()=>{
        openFolder(
          folder.id
        );
      };

      el.appendChild(
        button
      );

      if(
        index<
        path.length-1
      ){

        const span=
          document.createElement(
            "span"
          );

        span.textContent="›";

        el.appendChild(
          span
        );

      }

    }
  );

}

document.getElementById(
  "folderBack"
).onclick=()=>{

/* =========================================================
   STUDY TIME
========================================================= */

let loggedIn=false;
let trackingStart=null;

function startStudyTracking(){

  if(
    loggedIn &&
    document.visibilityState==="visible" &&
    trackingStart===null
  ){

    trackingStart=
      Date.now();

  }

}

function flushStudyTime(){

  if(trackingStart===null)
    return;

  const now=
    Date.now();

  const seconds=
    Math.max(
      0,
      Math.floor(
        (now-trackingStart)/1000
      )
    );

  if(seconds>0){

    data.totalSeconds+=
      seconds;

    saveData();

  }

  trackingStart=
    document.visibilityState==="visible"
      ? now
      : null;

}

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(loggedIn)
      flushStudyTime();
  }
);

function getLiveSeconds(){

  let total=
    data.totalSeconds;

  if(
    loggedIn &&
    trackingStart!==null &&
    document.visibilityState==="visible"
  ){

    total+=
      Math.floor(
        (Date.now()-trackingStart)/1000
      );

  }

  return total;

}

function formatTime(sec){

  sec=Math.max(
    0,
    Math.floor(sec)
  );

  const h=
    Math.floor(sec/3600);

  const m=
    Math.floor(
      (sec%3600)/60
    );

  const s=
    sec%60;

  return [
    String(h).padStart(2,"0"),
    String(m).padStart(2,"0"),
    String(s).padStart(2,"0")
  ].join(":");

}

function getRank(seconds){

  const h=
    seconds/3600;

  if(h<10)
    return "🥉 ブロンズ";

  if(h<30)
    return "🥈 シルバー";

  if(h<60)
    return "🥇 ゴールド";

  if(h<100)
    return "💎 プラチナ";

  if(h<200)
    return "💼 ビジネス";

  if(h<500)
    return "🚄 ファースト";

  return "👑 グランクラス";

}

function updateStudyDisplay(){

  const time=
    formatTime(
      getLiveSeconds()
    );

  [
    "homeClock",
    "folderClock",
    "studyTime"
  ].forEach(
    id=>{

      const el=
        document.getElementById(
          id
        );

      if(el)
        el.textContent=time;

    }
  );

  const rank=
    document.getElementById(
      "rankText"
    );

  if(rank)
    rank.textContent=
      getRank(
        getLiveSeconds()
      );

}

setInterval(
  updateStudyDisplay,
  250
);

   NOTE
========================================================= */

let currentNote=null;
let currentPage=0;

let currentTool=
  "pencil";

let currentColor=
  "#111111";

let currentSize=5;

let selectedObjectId=null;

const viewport=
  document.getElementById(
    "boardViewport"
  );

const world=
  document.getElementById(
    "boardWorld"
  );

const svg=
  document.getElementById(
    "drawSvg"
  );

  document.getElementById(
    "objectLayer"

/* =========================================================
   CAMERA
========================================================= */

let zoom=1;
let panX=0;
let panY=0;

function centerBoard(){

  const rect=
    viewport.getBoundingClientRect();

  zoom=1;

  panX=
    rect.width/2-
    WORLD_W/2;

  panY=
    rect.height/2-
    WORLD_H/2;

  applyCamera();

}

function applyCamera(){

  world.style.transform=
    `translate3d(${panX}px,${panY}px,0) scale(${zoom})`;

}

function clampZoom(z){

  return Math.max(
    .2,
    Math.min(
      4,
      z
    )
  );

}

function screenToWorld(
  clientX,
  clientY
){

  const rect=
    viewport.getBoundingClientRect();

  return {

    x:
      (
        clientX-
        rect.left-
        panX
      )/zoom,

    y:
      (
        clientY-
        rect.top-
        panY
      )/zoom

  };

}

function zoomAt(
  newZoom,
  clientX,
  clientY
){

  const rect=
    viewport.getBoundingClientRect();

  const sx=
    clientX-
    rect.left;

  const sy=
    clientY-
    rect.top;

  const wx=
    (sx-panX)/zoom;

  const wy=
    (sy-panY)/zoom;

  zoom=
    clampZoom(
      newZoom
    );

  panX=
    sx-wx*zoom;

  panY=

}

/* =========================================================
   SVG STROKES
========================================================= */

function pointsToPath(points){

  if(
    !points||
    points.length<2
  ){

    return "";

  }

  let d=
    `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;

  for(
    let i=1;
    i<points.length;
    i++
  ){

    d+=
      ` L ${points[i].x.toFixed(2)} ${points[i].y.toFixed(2)}`;

  }

  return d;

}

let renderQueued=false;

function queueRender(){

  if(renderQueued)
    return;

  renderQueued=true;

  requestAnimationFrame(
    ()=>{
      renderQueued=false;
      renderStrokes();
    }
  );

}

function renderStrokes(){

  if(!currentNote)
    return;

  const page=
    currentNote.pages[
      currentPage
    ];

  svg.replaceChildren();

  const fragment=
    document.createDocumentFragment();

  page.strokes.forEach(
    stroke=>{

      if(
        !stroke.points||
        stroke.points.length<2
      )
        return;

      const path=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );

      path.setAttribute(
        "d",
        pointsToPath(
          stroke.points
        )
      );

      path.setAttribute(
        "fill",
        "none"
      );

      path.setAttribute(
        "stroke",
        stroke.color||
        "#111111"
      );

      let width=
        Number(
          stroke.size
        )||5;

      let opacity=
        stroke.opacity??1;

      if(
        stroke.tool===
        "highlighter"
      ){

        width*=3.5;
        opacity=.27;

      }

      path.setAttribute(
        "stroke-width",
        width
      );

      path.setAttribute(
        "stroke-opacity",
        opacity
      );

      path.setAttribute(
        "stroke-linecap",
        "round"
      );

      path.setAttribute(
        "stroke-linejoin",
        "round"
      );

      fragment.appendChild(
        path
      );

    }
  );

  svg.appendChild(
    fragment
  );

}

/* =========================================================
   POINTER DRAWING
========================================================= */

const pointers=
  new Map();

let drawing=null;
let panGesture=null;
let pinchGesture=null;

function pointerDistance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}

function pointerMid(a,b){

  return {
    x:(a.x+b.x)/2,
    y:(a.y+b.y)/2
  };

}

function pointerList(){

  return [...pointers.values()];

}

viewport.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    pointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

    try{
      viewport.setPointerCapture(
        e.pointerId
      );
    }catch(_){}

    /*
      2本指
    */

    if(pointers.size>=2){

      drawing=null;
      panGesture=null;

      const list=
        pointerList();

      const a=list[0];
      const b=list[1];

      const mid=
        pointerMid(a,b);

      const rect=
        viewport.getBoundingClientRect();

      const mx=
        mid.x-rect.left;

      const my=
        mid.y-rect.top;

      pinchGesture={

        distance:
          pointerDistance(a,b),

        zoom:zoom,

        worldX:
          (mx-panX)/zoom,

        worldY:
          (my-panY)/zoom

      };

      return;

    }

    /*
      オブジェクトなら
      オブジェクト側に任せる
    */

    if(
      e.target.closest &&
      e.target.closest(
        ".board-object"
      )
    ){

      return;

    }

    const point=
      screenToWorld(
        e.clientX,
        e.clientY
      );

    if(
      currentTool==="text"
    ){

      createText(point);

      pointers.delete(
        e.pointerId
      );

      return;

    }

    if(
      currentTool==="sticky"
    ){

      createSticky(point);

      pointers.delete(
        e.pointerId
      );

      return;

    }

    if(
      currentTool==="objectEraser"
    ){

      eraseObjectAt(
        point
      );

      pointers.delete(
        e.pointerId
      );

      return;

    }

    if(
      currentTool==="pixel"
    ){

      eraseAt(point);

      return;

    }

    if(
      currentTool==="pencil"||
      currentTool==="highlighter"
    ){

      startDrawing(
        e.pointerId,
        point
      );

      return;

    }

    if(
      currentTool==="hand"
    ){

      panGesture={

        pointerId:
          e.pointerId,

        startX:
          e.clientX,

        startY:
          e.clientY,

        startPanX:
          panX,

        startPanY:
          panY

      };

    }

  },
  {passive:false}
);

viewport.addEventListener(
  "pointermove",
  e=>{

    if(
      !pointers.has(
        e.pointerId
      )
    )
      return;

    pointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

    /*
      PINCH
    */

    if(
      pinchGesture &&
      pointers.size>=2
    ){

      e.preventDefault();

      const list=
        pointerList();

      const a=list[0];
      const b=list[1];

      const mid=
        pointerMid(a,b);

      const rect=
        viewport.getBoundingClientRect();

      const mx=
        mid.x-rect.left;

      const my=
        mid.y-rect.top;

      const d=
        pointerDistance(a,b);

      zoom=
        clampZoom(
          pinchGesture.zoom*
          d/
          pinchGesture.distance
        );

      panX=
        mx-
        pinchGesture.worldX*
        zoom;

      panY=
        my-
        pinchGesture.worldY*
        zoom;

      applyCamera();

      return;

    }

    /*
      DRAW
    */

    if(
      drawing &&
      drawing.pointerId===
      e.pointerId
    ){

      e.preventDefault();

      const point=
        screenToWorld(
          e.clientX,
          e.clientY
        );

      const points=
        drawing.stroke.points;

      const last=
        points[
          points.length-1
        ];

      const dx=
        point.x-last.x;

      const dy=
        point.y-last.y;

      const distance=
        Math.hypot(
          dx,
          dy
        );

      /*
        点が近すぎる場合は
       追加しない
      */

      if(distance>=1.2){

        /*
          長距離移動時は
          中間点を追加して滑らかに
        */

        if(distance>20){

          const steps=
            Math.ceil(
              distance/8
            );

          for(
            let i=1;
            i<steps;
            i++
          ){

            const t=
              i/steps;

            points.push({

              x:
                last.x+
                dx*t,

              y:
                last.y+
                dy*t

            });

          }

        }

        points.push(
          point
        );

        queueRender();

      }

      return;

    }

    /*
      PIXEL ERASER
    */

    if(
      currentTool==="pixel" &&
      pointers.size===1
    ){

      e.preventDefault();

      eraseAt(
        screenToWorld(
          e.clientX,
          e.clientY
        )
      );

      return;

    }

    /*
      HAND PAN
    */

    if(
      panGesture &&
      panGesture.pointerId===
      e.pointerId
    ){

      e.preventDefault();

      panX=
        panGesture.startPanX+
        (
          e.clientX-
          panGesture.startX
        );

      panY=
        panGesture.startPanY+
        (
          e.clientY-
          panGesture.startY
        );

      applyCamera();

    }

  },
  {passive:false}
);

function endPointer(e){

  pointers.delete(
    e.pointerId
  );

  if(
    drawing &&
    drawing.pointerId===
    e.pointerId
  ){

    finishDrawing();

  }

  if(
    panGesture &&
    panGesture.pointerId===
    e.pointerId
  ){

    panGesture=null;

  }

  if(pointers.size<2){

    pinchGesture=null;

  }

}

viewport.addEventListener(
  "pointerup",
  endPointer
);

viewport.addEventListener(
  "pointercancel",
  endPointer
);

/* =========================================================
   DRAW START / FINISH
========================================================= */

function startDrawing(
  pointerId,
  point
){

  const page=
    currentNote.pages[
      currentPage
    ];

  const stroke={

    id:
      uid("stroke"),

    tool:
      currentTool,

    color:
      currentColor,

    size:
      currentSize,

    opacity:
      currentTool===
      "highlighter"
        ? .27
        : 1,

    points:[
      point
    ]

  };

  page.strokes.push(
    stroke
  );

  drawing={
    pointerId,
    stroke
  };

  queueRender();

}

function finishDrawing(){

  if(!drawing)
    return;

  const points=
    drawing.stroke.points;

  if(points.length===1){

    points.push({
      x:points[0].x+.01,
      y:points[0].y+.01
    });

  }

  drawing=null;

  if(currentNote){

    currentNote.updated=
      Date.now();

    scheduleSave();

  }

}

/* =========================================================
   PIXEL ERASER
========================================================= */

function pointDistance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}

function eraseAt(point){

  if(!currentNote)
    return;

  const page=
    currentNote.pages[
      currentPage
    ];

  const radius=
    Math.max(
      8,
      currentSize*1.8
    );

  const newStrokes=[];
  let changed=false;

  page.strokes.forEach(
    stroke=>{

      const points=
        stroke.points||
        [];

      if(points.length<2)
        return;

      let part=[];
      let hit=false;

      points.forEach(
        point=>{

          if(
            pointDistance(
              point,
              point
            )<=radius
          ){

            /*
              ↓
              ここではなく
              eraser pointを使う
            */

          }

        }
      );

      /*
        正しい消去処理
      */

      part=[];

      for(
        let i=0;
        i<points.length;
        i++
      ){

        const p=
          points[i];

        if(
          pointDistance(
            p,
            arguments[0]
          )<=radius
        ){

          hit=true;

          if(part.length>=2){

            newStrokes.push({

              ...stroke,

              id:
                uid("stroke"),

              points:[
                ...part
              ]

            });

          }

          part=[];

        }else{

          part.push(p);

        }

      }

      if(part.length>=2){

        newStrokes.push({

          ...stroke,

          id:
            hit
              ? uid("stroke")
              : stroke.id,

          points:[
            ...part
          ]

        });

      }

      if(!hit){

        /*
          上で既にコピーされているので
          特に何もしない
        */

      }else{

        changed=true;

      }

    }
  );

  if(changed){

    page.strokes=
      newStrokes;

    queueRender();

    currentNote.updated=
      Date.now();

    scheduleSave();

  }

}

/* =========================================================
   OBJECT ERASER
========================================================= */

function eraseObjectAt(point){

  if(!currentNote)
    return;

  const page=
    currentNote.pages[
      currentPage
    ];

  let target=null;

  for(
    let i=page.elements.length-1;
    i>=0;
    i--
  ){

    const obj=
      page.elements[i];

    if(
      point.x>=obj.x &&
      point.x<=obj.x+obj.width &&
      point.y>=obj.y &&
      point.y<=obj.y+obj.height
    ){

      target=obj;
      break;

    }

  }

  if(target){

    page.elements=
      page.elements.filter(
        o=>
          o.id!==target.id
      );

    selectedObjectId=null;

    renderObjects();

    saveData();

  }

}

    y:

      500,

      100,

    text:
      text,

      )

  };

  currentNote
    .pages[currentPage]
    .elements
    .push(obj);

  saveData();

}

/* =========================================================
   OBJECT RENDER
========================================================= */

function renderObjects(){

  if(!currentNote)
    return;

  const page=
    currentNote.pages[
      currentPage
    ];

  objectLayer.innerHTML="";

  page.elements.forEach(
    obj=>{

      let el;

      if(
        obj.type==="image"
      ){

        el=
          document.createElement(
            "img"
          );

        el.src=
          obj.src;

        el.className=
          "board-object image-object";

      }else{

        el=
          document.createElement(
            "div"
          );

        el.className=
          "board-object "+
          (
            obj.type==="sticky"
              ? "sticky-object"
              : "text-object"
          );

        el.textContent=
          obj.text||"";

      }

      el.style.left=
        obj.x+"px";

      el.style.top=
        obj.y+"px";

      el.style.width=
        obj.width+"px";

      el.style.height=
        obj.height+"px";

      if(
        obj.type==="text"||
        obj.type==="sticky"
      ){

        el.style.fontSize=
          obj.fontSize+"px";

        el.style.color=
          obj.color||
          "#111111";

      }

      if(
        selectedObjectId===
        obj.id
      ){

        el.classList.add(
          "selected"
        );

      }

      /*
        DELETE
      */

      const deleteButton=
        document.createElement(
          "button"
        );

      deleteButton.className=
        "delete-object";

      deleteButton.textContent=
        "×";

      deleteButton.onpointerdown=
        e=>{

          e.preventDefault();
          e.stopPropagation();

          page.elements=
            page.elements.filter(
              o=>
                o.id!==obj.id
            );

          selectedObjectId=null;

          renderObjects();

          saveData();

        };

      el.appendChild(
        deleteButton
      );

      /*
        RESIZE
      */

      const resize=
        document.createElement(
          "div"
        );

      resize.className=
        "resize-handle";

      resize.onpointerdown=
        e=>{

          e.preventDefault();
          e.stopPropagation();

          beginResize(
            e,
            obj
          );

        };

      el.appendChild(
        resize
      );


      /*
        DRAG
      */

      el.onpointerdown=
        e=>{

          if(
            e.target===
            resize||
            e.target===
            deleteButton
          )
            return;

          e.preventDefault();
          e.stopPropagation();

          selectedObjectId=
            obj.id;

          beginObjectDrag(
            e,
            obj
          );

        };


      /*
        DOUBLE CLICK EDIT
      */

      el.ondblclick=
        e=>{

          e.preventDefault();
          e.stopPropagation();

          if(
            obj.type==="text"||
            obj.type==="sticky"
          ){

            const newText=
              prompt(
                "文字を編集",
                obj.text
              );

            if(
              newText!==null
            ){

              obj.text=
                newText;

              renderObjects();

              saveData();

            }

          }

        };

      objectLayer.appendChild(
        el
      );

    }
  );

}

/* =========================================================
   DRAG OBJECT
========================================================= */

function beginObjectDrag(
  e,
  obj
){

  const p=
    screenToWorld(
      e.clientX,
      e.clientY
    );

  const dx=
    p.x-obj.x;

  const dy=
    p.y-obj.y;

  const move=
    e2=>{

      const point=
        screenToWorld(
          e2.clientX,
          e2.clientY
        );

      obj.x=
        point.x-dx;

      obj.y=
        point.y-dy;

      renderObjects();

    };

  const up=
    ()=>{

      window.removeEventListener(
        "pointermove",
        move
      );

      saveData();

    };

  window.addEventListener(
    "pointermove",
    move,
    {passive:false}
  );

  window.addEventListener(
    "pointerup",
    up,
    {once:true}
  );

}

/* =========================================================
   RESIZE OBJECT
========================================================= */

function beginResize(
  e,
  obj
){

  const start=
    screenToWorld(
      e.clientX,
      e.clientY
    );

  const original={
    width:obj.width,
    height:obj.height
  };

  const move=
    e2=>{

      const p=
        screenToWorld(
          e2.clientX,
          e2.clientY
        );

      obj.width=
        Math.max(
          80,
          original.width+
          p.x-start.x
        );

      obj.height=
        Math.max(
          45,
          original.height+
          p.y-start.y
        );

      renderObjects();

    };

  const up=
    ()=>{

      window.removeEventListener(
        "pointermove",
        move
      );

      saveData();

    };

  window.addEventListener(
    "pointermove",
    move,
    {passive:false}
  );

  window.addEventListener(
    "pointerup",
    up,
    {once:true}
  );

}

/* =========================================================
   PAGE
========================================================= */

function renderPage(){

  if(!currentNote)
    return;

  if(
    !currentNote.pages[
      currentPage
    ]
  ){

    currentNote.pages.push({
      strokes:[],
      elements:[]
    });

  }

  renderStrokes();
  renderObjects();

  document.getElementById(
    "pageNumber"
  ).textContent=
    `${currentPage+1} / ${currentNote.pages.length}`;

}

document.getElementById(
  "prevPage"
).onclick=()=>{

  if(currentPage<=0)
    return;

  currentPage--;

  selectedObjectId=null;

  renderPage();

};

document.getElementById(
  "nextPage"
).onclick=()=>{

  if(
    currentPage>=
    currentNote.pages.length-1
  )
    return;

  currentPage++;

  selectedObjectId=null;

  renderPage();

};

document.getElementById(
  "addPage"
).onclick=()=>{

  currentNote.pages.push({

    strokes:[],
    elements:[]

  });

  currentPage=
    currentNote.pages.length-1;

  selectedObjectId=null;

  renderPage();

  saveData();

};

/* =========================================================
   TITLE
========================================================= */

document.getElementById(
  "noteTitle"
).oninput=
  e=>{

    if(!currentNote)
      return;

    currentNote.title=
      e.target.value||
      "新しいノート";

    currentNote.updated=
      Date.now();

    scheduleSave();

    renderTree();

  };

/* =========================================================
   CLEAR
========================================================= */

document.getElementById(
  "clearPage"
).onclick=()=>{

  if(
    !confirm(
      "このページを全部消しますか？"
    )
  )
    return;

  currentNote.pages[
    currentPage
  ]={
    strokes:[],
    elements:[]
  };

  selectedObjectId=null;

  renderPage();

  saveData();

};

/* =========================================================
   AUTOSAVE
========================================================= */

let saveTimer=null;

function scheduleSave(){

  clearTimeout(
    saveTimer
  );

  saveTimer=
    setTimeout(
      ()=>{
        saveData();
      },
      300
    );

}

/* =========================================================
   SETTINGS
========================================================= */

document.getElementById(
  "settingsBtn"
).onclick=()=>{

  showScreen(
    "settingsScreen"
  );

};

document.getElementById(
  "settingsBack"
).onclick=()=>{

  showScreen(
    "homeScreen"
  );

};

document.getElementById(
  "darkToggle"
).onclick=()=>{

  data.settings.dark=
    !data.settings.dark;

  applyDark();

  saveData();

};

function applyDark(){

  document.body.classList.toggle(
    "dark",
    !!data.settings.dark
  );

}

/* =========================================================
   EXPORT
========================================================= */

document.getElementById(
  "exportBtn"
).onclick=()=>{

  flushStudyTime();

  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );

  const url=
    URL.createObjectURL(
      blob
    );

  const a=
    document.createElement(
      "a"
    );

  a.href=url;

  a.download=
    "DestinationNote-backup.json";

  a.click();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );

};

/* =========================================================
   IMPORT
========================================================= */

document.getElementById(
  "importBtn"
).onclick=()=>{

  document.getElementById(
    "importInput"
  ).click();

};

document.getElementById(
  "importInput"
).onchange=
  e=>{

    const file=
      e.target.files[0];

    if(!file)
      return;

    const reader=
      new FileReader();

    reader.onload=
      ()=>{

        try{

          const imported=
            JSON.parse(
              reader.result
            );

          if(
            !imported||
            !Array.isArray(
              imported.folders
            )||
            !Array.isArray(
              imported.notes
            )
          ){

            throw new Error();

          }

          if(
            !confirm(
              "現在のデータをバックアップで置き換えますか？"
            )
          )
            return;

          data=imported;

          normalizeData();

          saveData();

          alert(
            "読み込み完了！"
          );

          location.reload();

        }catch(err){

          alert(
            "バックアップを読み込めませんでした。"
          );

        }

      };

    reader.readAsText(
      file
    );

    e.target.value="";

  };

/* =========================================================
   LOGOUT
========================================================= */

document.getElementById(
  "logoutBtn"
).onclick=()=>{

  flushStudyTime();

  loggedIn=false;

  trackingStart=null;

  app.classList.add(
    "hidden"
  );

  loginScreen.classList.remove(
    "hidden"
  );

  loginName.value="";
  loginPassword.value="";

  updateLogin();

};

/* =========================================================
   RESET
========================================================= */

document.getElementById(
  "resetBtn"
).onclick=()=>{

  if(
    !confirm(
      "本当にすべて削除しますか？\nこの操作は元に戻せません。"
    )
  )
    return;

  localStorage.removeItem(
    STORAGE_KEY
  );

  location.reload();

};

/* =========================================================
   INIT
========================================================= */

loadData();

applyDark();

updateLogin();

</script>

</body>
</html>

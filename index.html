<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Destination Note</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,
    "SF Pro Display","Helvetica Neue",Arial,sans-serif;
  background:#f5f5f7;
  color:#111;
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 20% 10%,#dbeafe,transparent 35%),
    radial-gradient(circle at 90% 80%,#ede9fe,transparent 35%),
    #f5f5f7;
}

.loginBox{
  width:min(420px,100%);
  padding:35px;
  border-radius:32px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  box-shadow:0 25px 70px rgba(0,0,0,.12);
}

.logo{
  font-size:34px;
  font-weight:800;
  letter-spacing:-1.5px;
  margin-bottom:8px;
}

.sub{
  color:#777;
  margin-bottom:28px;
}

.loginInput{
  width:100%;
  padding:15px 17px;
  border-radius:17px;
  border:1px solid #ddd;
  background:#fff;
  outline:none;
  margin-bottom:12px;
}

.loginInput:focus{
  border-color:#777;
}

.primary{
  width:100%;
  padding:15px;
  border-radius:17px;
  background:#111;
  color:#fff;
  font-weight:700;
  margin-top:8px;
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:68px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border-bottom:1px solid rgba(0,0,0,.07);
  z-index:100;
}

.brand{
  font-weight:800;
  font-size:20px;
}

.topRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.clockChip{
  padding:8px 13px;
  border-radius:14px;
  background:#111;
  color:white;
  font-size:13px;
  font-weight:700;
}

.iconBtn{
  width:40px;
  height:40px;
  border-radius:14px;
  background:#eee;
}

.main{
  flex:1;
  overflow:auto;
  padding:25px;
}

/* =========================
   HOME
========================= */

.hero{
  max-width:1100px;
  margin:auto;
}

.welcome{
  font-size:36px;
  font-weight:800;
  letter-spacing:-1.5px;
  margin:10px 0 22px;
}

.rankCard{
  border-radius:28px;
  padding:25px;
  color:white;
  background:
    linear-gradient(135deg,#151515,#4b4b4b);
  box-shadow:0 20px 50px rgba(0,0,0,.18);
  margin-bottom:24px;
}

.rankName{
  font-size:30px;
  font-weight:800;
}

.rankTime{
  opacity:.8;
  margin-top:5px;
}

.progressOuter{
  height:8px;
  background:rgba(255,255,255,.18);
  border-radius:999px;
  margin-top:20px;
  overflow:hidden;
}

.progressInner{
  height:100%;
  width:0%;
  background:white;
  border-radius:999px;
  transition:.3s;
}

.sectionTitle{
  font-size:22px;
  font-weight:800;
  margin:25px 0 12px;
}

.folderGrid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(190px,1fr));
  gap:14px;
}

.folderCard{
  padding:20px;
  border-radius:23px;
  background:rgba(255,255,255,.8);
  border:1px solid rgba(0,0,0,.06);
  box-shadow:0 8px 25px rgba(0,0,0,.05);
  transition:.15s;
}

.folderCard:active{
  transform:scale(.97);
}

.folderIcon{
  font-size:34px;
}

.folderName{
  font-weight:750;
  margin-top:10px;
}

.folderCount{
  font-size:13px;
  color:#888;
  margin-top:4px;
}

.addCard{
  border:2px dashed #ccc;
  background:transparent;
}

/* =========================
   FOLDER
========================= */

.folderHeader{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.backBtn{
  padding:11px 15px;
  border-radius:14px;
  background:#eee;
}

.folderTitle{
  font-size:30px;
  font-weight:800;
}

.itemGrid{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(210px,1fr));
  gap:14px;
}

.noteCard{
  min-height:150px;
  padding:20px;
  border-radius:24px;
  background:#fff;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
  position:relative;
}

.noteIcon{
  font-size:32px;
}

.noteTitle{
  font-size:18px;
  font-weight:750;
  margin-top:12px;
}

.noteDate{
  color:#888;
  font-size:12px;
  margin-top:8px;
}

.smallDelete{
  position:absolute;
  top:10px;
  right:10px;
  width:32px;
  height:32px;
  border-radius:10px;
  background:#f2f2f2;
}

/* =========================
   NOTE EDITOR
========================= */

#noteScreen{
  position:fixed;
  inset:0;
  background:#f1f1f3;
  z-index:200;
  display:flex;
  flex-direction:column;
}

.noteTop{
  height:60px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(25px);
  border-bottom:1px solid #ddd;
  z-index:20;
}

.noteTitleInput{
  width:180px;
  max-width:25vw;
  border:0;
  background:transparent;
  font-weight:750;
  outline:none;
  padding:8px;
}

.toolGroup{
  display:flex;
  align-items:center;
  gap:5px;
  overflow-x:auto;
  flex:1;
}

.tool{
  min-width:40px;
  height:40px;
  border-radius:12px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.tool.active{
  background:#111;
  color:white;
}

.colorInput{
  width:40px;
  height:40px;
  border:0;
  padding:2px;
  background:none;
}

.sizeSelect{
  height:40px;
  border-radius:12px;
  border:0;
  background:#eee;
  padding:0 8px;
}

.pageControls{
  display:flex;
  gap:5px;
}

.pageControls button{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#eee;
}

.boardViewport{
  flex:1;
  position:relative;
  overflow:hidden;
  touch-action:none;
  background:
    radial-gradient(circle,#d3d3d7 1px,transparent 1px);
  background-size:25px 25px;
}

.boardWorld{
  position:absolute;
  left:0;
  top:0;
  width:10000px;
  height:10000px;
  transform-origin:0 0;
}

.boardCanvas{
  position:absolute;
  left:0;
  top:0;
  width:10000px;
  height:10000px;
}

.objectLayer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.boardObject{
  position:absolute;
  pointer-events:auto;
  user-select:none;
}

.textObject{
  min-width:60px;
  min-height:30px;
  padding:4px;
  font-size:22px;
  white-space:pre-wrap;
}

.stickyObject{
  width:180px;
  min-height:150px;
  padding:18px;
  background:#fff39b;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
  font-size:17px;
  white-space:pre-wrap;
}

.imageObject{
  max-width:400px;
  max-height:400px;
  object-fit:contain;
}

.shapeObject{
  position:absolute;
  pointer-events:none;
}

.zoomControls{
  position:absolute;
  right:15px;
  bottom:15px;
  z-index:10;
  display:flex;
  gap:7px;
}

.zoomControls button{
  width:46px;
  height:46px;
  border-radius:16px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(15px);
  box-shadow:0 5px 20px rgba(0,0,0,.12);
  font-size:20px;
}

.pageLabel{
  position:absolute;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:15px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(15px);
  font-size:13px;
  z-index:10;
}

.colorPanel{
  position:absolute;
  bottom:75px;
  right:15px;
  background:white;
  border-radius:20px;
  padding:15px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
  z-index:30;
}

.colorPanel input{
  width:120px;
  height:50px;
}

/* =========================
   SETTINGS
========================= */

.settingsBox{
  max-width:700px;
  margin:auto;
}

.settingCard{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:12px;
}

.settingTitle{
  font-weight:800;
  margin-bottom:10px;
}

.settingButton{
  padding:12px 16px;
  border-radius:13px;
  background:#eee;
  margin:4px 0;
}

/* =========================
   DARK
========================= */

body.dark{
  background:#111;
  color:#eee;
}

body.dark .topbar,
body.dark .noteTop{
  background:rgba(30,30,30,.85);
  color:white;
  border-color:#333;
}

body.dark .folderCard,
body.dark .noteCard,
body.dark .settingCard{
  background:#1e1e1e;
  color:white;
}

body.dark .iconBtn,
body.dark .backBtn,
body.dark .tool,
body.dark .sizeSelect,
body.dark .pageControls button{
  background:#2b2b2b;
  color:white;
}

body.dark .boardViewport{
  background-color:#171717;
  background-image:
    radial-gradient(circle,#444 1px,transparent 1px);
}

body.dark .colorPanel{
  background:#222;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .main{
    padding:16px;
  }

  .welcome{
    font-size:29px;
  }

  .rankName{
    font-size:25px;
  }

  .noteTitleInput{
    max-width:120px;
  }

  .noteTop{
    gap:4px;
  }

  .tool{
    min-width:38px;
  }

  .pageControls{
    display:none;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="loginBox">

    <div class="logo">
      Destination Note
    </div>

    <div class="sub">
      自分だけの勉強ノート
    </div>

    <input
      id="loginName"
      class="loginInput"
      placeholder="名前">

    <input
      id="loginPassword"
      class="loginInput"
      type="password"
      placeholder="パスワード">

    <button
      class="primary"
      onclick="login()">
      はじめる
    </button>

  </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

  <header class="topbar">

    <div class="brand">
      Destination Note
    </div>

    <div class="topRight">

      <div
        id="clockChip"
        class="clockChip">
        00:00:00
      </div>

      <button
        class="iconBtn"
        onclick="showSettings()">
        ⚙️
      </button>

    </div>

  </header>

  <main
    id="main"
    class="main">
  </main>

</div>


<!-- NOTE -->

<div
  id="noteScreen"
  class="hidden">

  <div class="noteTop">

    <button
      class="iconBtn"
      onclick="closeNote()">
      ‹
    </button>

    <input
      id="noteTitleInput"
      class="noteTitleInput"
      onchange="saveNoteTitle()">

    <div class="toolGroup">

      <button
        class="tool active"
        data-tool="pencil"
        onclick="setTool('pencil')">
        ✏️
      </button>

      <button
        class="tool"
        data-tool="highlighter"
        onclick="setTool('highlighter')">
        🖍️
      </button>

      <button
        class="tool"
        data-tool="eraser"
        onclick="setTool('eraser')">
        🧽
      </button>

      <button
        class="tool"
        data-tool="objectEraser"
        onclick="setTool('objectEraser')">
        🗑️
      </button>

      <button
        class="tool"
        data-tool="hand"
        onclick="setTool('hand')">
        ✋
      </button>

      <button
        class="tool"
        data-tool="text"
        onclick="setTool('text')">
        T
      </button>

      <button
        class="tool"
        data-tool="sticky"
        onclick="setTool('sticky')">
        🟨
      </button>

      <button
        class="tool"
        data-tool="rect"
        onclick="setTool('rect')">
        ▭
      </button>

      <button
        class="tool"
        data-tool="circle"
        onclick="setTool('circle')">
        ○
      </button>

      <button
        class="tool"
        data-tool="arrow"
        onclick="setTool('arrow')">
        ➜
      </button>

      <button
        class="tool"
        data-tool="image"
        onclick="chooseImage()">
        🖼️
      </button>

      <button
        class="tool"
        onclick="fullErase()">
        💥
      </button>

      <input
        id="colorInput"
        class="colorInput"
        type="color"
        value="#111111"
        onchange="currentColor=this.value">

      <select
        id="sizeSelect"
        class="sizeSelect"
        onchange="currentSize=Number(this.value)">

        <option value="2">細</option>
        <option value="4" selected>普通</option>
        <option value="8">太</option>
        <option value="14">極太</option>

      </select>

      <input
        id="imageInput"
        type="file"
        accept="image/*"
        style="display:none"
        onchange="insertImage(event)">

    </div>

    <div class="pageControls">

      <button onclick="previousPage()">
        ‹
      </button>

      <button onclick="nextPage()">
        ›
      </button>

      <button onclick="addPage()">
        ＋
      </button>

    </div>

  </div>


  <div
    id="boardViewport"
    class="boardViewport">

    <div
      id="boardWorld"
      class="boardWorld">

      <canvas
        id="boardCanvas"
        class="boardCanvas"
        width="10000"
        height="10000">
      </canvas>

      <div
        id="objectLayer"
        class="objectLayer">
      </div>

    </div>


    <div class="zoomControls">

      <button onclick="zoomOut()">
        −
      </button>

      <button onclick="resetView()">
        ⌂
      </button>

      <button onclick="zoomIn()">
        ＋
      </button>

    </div>

    <div
      id="pageLabel"
      class="pageLabel">
      1 / 1
    </div>

  </div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

const STORAGE_KEY = "destinationNote_v1";

let data = {
  name:"",
  password:"",
  totalSeconds:0,

  folders:[
    {
      id:"root",
      name:"マイノート",
      icon:"📚",
      parent:null,
      created:Date.now()
    }
  ],

  notes:[],

  settings:{
    dark:false
  }
};

let currentFolderId = "root";
let currentNoteId = null;

let currentPageIndex = 0;

let currentTool = "pencil";

let currentColor = "#111111";

let currentSize = 4;

let zoom = 1;

let panX = 0;
let panY = 0;

let drawing = false;

let activePointer = null;

let lastPoint = null;

let sessionStartedAt = null;

let clockInterval = null;

let saveTimer = null;

let pinchData = null;


/* =========================================================
   LOAD
========================================================= */

function loadData(){

  const raw = localStorage.getItem(STORAGE_KEY);

  if(!raw) return;

  try{

    const saved = JSON.parse(raw);

    data = {
      ...data,
      ...saved
    };

    if(!Array.isArray(data.folders)){
      data.folders = [];
    }

    if(!Array.isArray(data.notes)){
      data.notes = [];
    }

    /*
      旧バージョンとの互換
    */

    data.notes.forEach(note=>{

      if(!note.pages){

        note.pages = [
          {
            image:note.image || null,
            elements:note.elements || [],
            strokes:note.strokes || []
          }
        ];

      }

      note.pages.forEach(page=>{

        if(!Array.isArray(page.elements)){
          page.elements = [];
        }

        if(!Array.isArray(page.strokes)){
          page.strokes = [];
        }

      });

    });

  }catch(e){

    console.error(e);

  }

}


/* =========================================================
   SAVE
========================================================= */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}

function autoSave(){

  clearTimeout(saveTimer);

  saveTimer = setTimeout(
    saveData,
    400
  );

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  const name =
    document.getElementById("loginName").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!name || !password){

    alert("名前とパスワードを入力してね");

    return;

  }

  if(!data.name){

    data.name = name;
    data.password = password;

    saveData();

  }else{

    if(
      data.name !== name ||
      data.password !== password
    ){

      alert("名前またはパスワードが違います");

      return;

    }

  }

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  applyDark();

  startStudyClock();

  showHome();

}


/* =========================================================
   STUDY CLOCK
========================================================= */

function getTotalStudySeconds(){

  if(sessionStartedAt){

    return data.totalSeconds +
      Math.floor(
        (Date.now()-sessionStartedAt)/1000
      );

  }

  return data.totalSeconds;

}


function formatTime(sec){

  sec = Math.max(
    0,
    Math.floor(sec)
  );

  const h =
    Math.floor(sec/3600);

  const m =
    Math.floor((sec%3600)/60);

  const s =
    sec%60;

  return [
    String(h).padStart(2,"0"),
    String(m).padStart(2,"0"),
    String(s).padStart(2,"0")
  ].join(":");

}


function startStudyClock(){

  if(sessionStartedAt) return;

  sessionStartedAt = Date.now();

  updateClock();

  clearInterval(clockInterval);

  clockInterval =
    setInterval(
      updateClock,
      1000
    );

}


function stopStudyClock(){

  if(!sessionStartedAt) return;

  data.totalSeconds =
    getTotalStudySeconds();

  sessionStartedAt = null;

  saveData();

}


function updateClock(){

  const total =
    getTotalStudySeconds();

  const clock =
    document.getElementById("clockChip");

  if(clock){

    clock.textContent =
      formatTime(total);

  }

  updateRankCard();

}


document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      stopStudyClock();

    }else{

      startStudyClock();

    }

  }
);


window.addEventListener(
  "pagehide",
  ()=>{
    stopStudyClock();
  }
);


/* =========================================================
   RANK
========================================================= */

function getRank(seconds){

  const hours =
    seconds/3600;

  if(hours < 10)
    return {
      name:"ブロンズ",
      min:0,
      max:10
    };

  if(hours < 30)
    return {
      name:"シルバー",
      min:10,
      max:30
    };

  if(hours < 60)
    return {
      name:"ゴールド",
      min:30,
      max:60
    };

  if(hours < 100)
    return {
      name:"プラチナ",
      min:60,
      max:100
    };

  if(hours < 200)
    return {
      name:"ビジネス",
      min:100,
      max:200
    };

  if(hours < 500)
    return {
      name:"ファースト",
      min:200,
      max:500
    };

  return {
    name:"グランクラス",
    min:500,
    max:Infinity
  };

}


function updateRankCard(){

  const el =
    document.getElementById("rankCard");

  if(!el) return;

  const total =
    getTotalStudySeconds();

  const rank =
    getRank(total);

  const hours =
    total/3600;

  let progress = 100;

  if(rank.max !== Infinity){

    progress =
      ((hours-rank.min) /
      (rank.max-rank.min))*100;

  }

  progress =
    Math.max(
      0,
      Math.min(100,progress)
    );

  const nameEl =
    document.getElementById("rankName");

  const timeEl =
    document.getElementById("rankTime");

  const bar =
    document.getElementById("rankProgress");

  if(nameEl)
    nameEl.textContent =
      rank.name;

  if(timeEl)
    timeEl.textContent =
      "学習時間 " +
      formatTime(total);

  if(bar)
    bar.style.width =
      progress+"%";

}


/* =========================================================
   HOME
========================================================= */

function showHome(){

  currentFolderId = "root";

  const main =
    document.getElementById("main");

  main.innerHTML = `

    <div class="hero">

      <div class="welcome">
        ${escapeHTML(data.name)}さん
      </div>

      <div class="rankCard" id="rankCard">

        <div
          id="rankName"
          class="rankName">
          ブロンズ
        </div>

        <div
          id="rankTime"
          class="rankTime">
          学習時間 00:00:00
        </div>

        <div class="progressOuter">
          <div
            id="rankProgress"
            class="progressInner">
          </div>
        </div>

      </div>

      <div class="sectionTitle">
        ノート
      </div>

/* =========================================================
   BOARD
========================================================= */

const canvas =
  document.getElementById("boardCanvas");

const ctx =
  canvas.getContext("2d");

const viewport =
  document.getElementById("boardViewport");

const world =
  document.getElementById("boardWorld");

const objectLayer =
  document.getElementById("objectLayer");


function getCurrentNote(){

  return data.notes.find(
    n=>n.id===currentNoteId
  );

}


function getCurrentPage(){

  const note =
    getCurrentNote();

  if(!note) return null;

  return note.pages[currentPageIndex];

}


function setupBoard(){

  drawBoard();

  updateTransform();

  updatePageLabel();

}


function updateTransform(){

  world.style.transform =
    `translate3d(${panX}px,${panY}px,0) scale(${zoom})`;

}


function screenToWorld(clientX,clientY){

  const rect =
    viewport.getBoundingClientRect();

  return {

    x:
      (clientX-rect.left-panX)/zoom,

    y:
      (clientY-rect.top-panY)/zoom

  };

}


/* =========================================================
   DRAW
========================================================= */

function drawBoard(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const page =
    getCurrentPage();

  if(!page) return;


  /*
    旧画像
  */

  if(page.image){

    const img =
      new Image();

    img.onload =
      ()=>{

        ctx.drawImage(
          img,
          4400,
          4150,
          1200,
          1700
        );

        drawStrokes(page);

      };

    img.src =
      page.image;

  }else{

    drawStrokes(page);

  }

  renderObjects(page);

}


function drawStrokes(page){

  page.strokes.forEach(
    stroke=>{

      if(!stroke.points ||
         stroke.points.length<2)
        return;

      ctx.save();

      ctx.lineCap =
        "round";

      ctx.lineJoin =
        "round";

      ctx.strokeStyle =
        stroke.color || "#111";

      ctx.lineWidth =
        stroke.size || 4;

      if(stroke.tool==="highlighter"){

        ctx.globalAlpha=.3;

      }else{

        ctx.globalAlpha=1;

      }

      ctx.beginPath();

      stroke.points.forEach(
        (p,i)=>{

          if(i===0)
            ctx.moveTo(p.x,p.y);
          else
            ctx.lineTo(p.x,p.y);

        }
      );

      ctx.stroke();

      ctx.restore();

    }
  );

}


/* =========================================================
   POINTER DRAWING
========================================================= */

viewport.addEventListener(
  "pointerdown",
  startPointer
);

viewport.addEventListener(
  "pointermove",
  movePointer
);

viewport.addEventListener(
  "pointerup",
  endPointer
);

viewport.addEventListener(
  "pointercancel",
  endPointer
);


function startPointer(e){

  viewport.setPointerCapture(
    e.pointerId
  );

  activePointer = e.pointerId;


  /*
    2本指
  */

  if(e.pointerType==="touch"){

    if(!pinchData){

      const touches =
        [...activePointers.values()];

    }

  }


  const p =
    screenToWorld(
      e.clientX,
      e.clientY
    );


  if(currentTool==="hand"){

    drawing=true;

    lastPoint={
      x:e.clientX,
      y:e.clientY
    };

    return;

  }


  if(
    currentTool==="text" ||
    currentTool==="sticky"
  ){

    createObjectAt(
      currentTool,
      p.x,
      p.y
    );

    return;

  }


  if(
    currentTool==="objectEraser"
  ){

    eraseObjectAt(
      p.x,
      p.y
    );

    return;

  }


  if(currentTool==="eraser"){

    eraseStrokeAt(
      p.x,
      p.y
    );

    drawing=true;

    return;

  }


  if(
    currentTool==="rect" ||
    currentTool==="circle" ||
    currentTool==="arrow"
  ){

    drawing=true;

    lastPoint={
      x:p.x,
      y:p.y
    };

    return;

  }


  if(currentTool==="image"){

    imagePlacePoint=p;

    chooseImage();

    return;

  }


  drawing=true;

  lastPoint=p;

  const page =
    getCurrentPage();

  page.strokes.push({

    tool:currentTool,

    color:currentColor,

    size:currentSize,

    points:[p]

  });

  autoSave();

}


function movePointer(e){

  if(!drawing) return;

  if(
    activePointer!==null &&
    e.pointerId!==activePointer
  )
    return;


  if(currentTool==="hand"){

    const dx =
      e.clientX-lastPoint.x;

    const dy =
      e.clientY-lastPoint.y;

    panX += dx;
    panY += dy;

    lastPoint={
      x:e.clientX,
      y:e.clientY
    };

    updateTransform();

    return;

  }


  const p =
    screenToWorld(
      e.clientX,
      e.clientY
    );


  if(currentTool==="eraser"){

    eraseStrokeAt(
      p.x,
      p.y
    );

    return;

  }


  if(
    currentTool==="rect" ||
    currentTool==="circle" ||
    currentTool==="arrow"
  ){

    drawBoard();

    drawPreviewShape(
      lastPoint,
      p
    );

    return;

  }


  const page =
    getCurrentPage();

  const stroke =
    page.strokes[
      page.strokes.length-1
    ];

  if(!stroke) return;

  stroke.points.push(p);

  drawBoard();

}


function endPointer(e){

  if(
    activePointer!==null &&
    e.pointerId!==activePointer
  )
    return;

  if(
    currentTool==="rect" ||
    currentTool==="circle" ||
    currentTool==="arrow"
  ){

    const p =
      screenToWorld(
        e.clientX,
        e.clientY
      );

    createShape(
      currentTool,
      lastPoint,
      p
    );

  }

  drawing=false;

  activePointer=null;

  lastPoint=null;

  autoSave();

}


/* =========================================================
   MULTI TOUCH / PINCH
========================================================= */

const activePointers =
  new Map();

viewport.addEventListener(
  "pointerdown",
  e=>{
    activePointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

    if(activePointers.size===2){

      const pts =
        [...activePointers.values()];

      const dx =
        pts[0].x-pts[1].x;

      const dy =
        pts[0].y-pts[1].y;

      pinchData={

        distance:
          Math.hypot(dx,dy),

        zoom:zoom,

        center:{
          x:(pts[0].x+pts[1].x)/2,
          y:(pts[0].y+pts[1].y)/2
        }

      };

      drawing=false;

    }

  }
);

viewport.addEventListener(
  "pointermove",
  e=>{

    if(!activePointers.has(e.pointerId))
      return;

    activePointers.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

    if(activePointers.size!==2 ||
       !pinchData)
      return;

    const pts =
      [...activePointers.values()];

    const dx =
      pts[0].x-pts[1].x;

    const dy =
      pts[0].y-pts[1].y;

    const distance =
      Math.hypot(dx,dy);

    const factor =
      distance /
      pinchData.distance;

    const newZoom =
      Math.max(
        .25,
        Math.min(
          4,
          pinchData.zoom*factor
        )
      );

    const center={
      x:(pts[0].x+pts[1].x)/2,
      y:(pts[0].y+pts[1].y)/2
    };

    const worldPoint =
      screenToWorld(
        pinchData.center.x,
        pinchData.center.y
      );

    zoom=newZoom;

    panX =
      pinchData.center.x -
      worldPoint.x*zoom;

    panY =
      pinchData.center.y -
      worldPoint.y*zoom;

    updateTransform();

  }
);

viewport.addEventListener(
  "pointerup",
  e=>{

    activePointers.delete(
      e.pointerId
    );

    if(activePointers.size<2){

      pinchData=null;

    }

  }
);

viewport.addEventListener(
  "pointercancel",
  e=>{

    activePointers.delete(
      e.pointerId
    );

    if(activePointers.size<2)
      pinchData=null;

  }
);

   TOOL
========================================================= */

function setTool(tool){

  currentTool=tool;

  document
    .querySelectorAll(".tool")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.tool===tool
      );

/* =========================================================
   ERASER
========================================================= */

function eraseStrokeAt(x,y){

  const page =
    getCurrentPage();

  if(!page) return;

  const radius =
    Math.max(
      12,
      currentSize*3
    );

  page.strokes =
    page.strokes.filter(
      stroke=>{

        return !stroke.points.some(
          p=>{
            return Math.hypot(
              p.x-x,
              p.y-y
            ) < radius;
          }
        );

      }
    );

  drawBoard();

  autoSave();

}


function eraseObjectAt(x,y){

  const page =
    getCurrentPage();

  if(!page) return;

  let index=-1;

  for(
    let i=page.elements.length-1;
    i>=0;
    i--
  ){

    const obj =
      page.elements[i];

    const width =
      obj.width || 200;

    const height =
      obj.height || 100;

    if(
      x>=obj.x &&
      x<=obj.x+width &&
      y>=obj.y &&
      y<=obj.y+height
    ){

      index=i;

      break;

    }

  }

  if(index>=0){

    page.elements.splice(
      index,
      1
    );

    drawBoard();

    autoSave();

  }

}


function fullErase(){

  if(!confirm(
    "このページを全部消す？"
  ))
    return;

  const page =
    getCurrentPage();

  page.strokes=[];
  page.elements=[];
  page.image=null;

  drawBoard();

  autoSave();

}


/* =========================================================
   OBJECTS
========================================================= */

function createObjectAt(
  type,
  x,
  y
){

  const page =
    getCurrentPage();

  if(!page) return;

  const text =
    prompt(
      type==="text"
        ? "文字を入力"
        : "付箋の内容を入力"
    );

  if(text===null) return;

  page.elements.push({

    id:
      "obj_"+Date.now()+"_"+Math.random(),

    type:type,

    x:x,

    y:y,

    width:
      type==="sticky"
        ? 180
        : 300,

    height:
      type==="sticky"
        ? 150
        : 80,

    text:text,

    color:currentColor

  });

  renderObjects(page);

  autoSave();

}


function createShape(
  type,
  a,
  b
){

  const page =
    getCurrentPage();

  if(!page) return;

  const x =
    Math.min(a.x,b.x);

  const y =
    Math.min(a.y,b.y);

  const width =
    Math.abs(b.x-a.x);

  const height =
    Math.abs(b.y-a.y);

  page.elements.push({

    id:
      "shape_"+Date.now()+"_"+Math.random(),

    type:type,

    x:x,

    y:y,

    width:Math.max(width,10),

    height:Math.max(height,10),

    x2:b.x,

    y2:b.y,

    color:currentColor,

    size:currentSize

  });

  drawBoard();

  autoSave();

}


function drawPreviewShape(a,b){

  ctx.save();

  ctx.strokeStyle =
    currentColor;

  ctx.lineWidth =
    currentSize;

  ctx.setLineDash([8,8]);

  ctx.beginPath();

  if(currentTool==="rect"){

    ctx.rect(
      a.x,
      a.y,
      b.x-a.x,
      b.y-a.y
    );

  }

  if(currentTool==="circle"){

    const cx =
      (a.x+b.x)/2;

    const cy =
      (a.y+b.y)/2;

    const rx =
      Math.abs(b.x-a.x)/2;

    const ry =
      Math.abs(b.y-a.y)/2;

    ctx.ellipse(
      cx,
      cy,
      rx,
      ry,
      0,
      0,
      Math.PI*2
    );

  }

  if(currentTool==="arrow"){

    ctx.moveTo(a.x,a.y);

    ctx.lineTo(b.x,b.y);

  }

  ctx.stroke();

  ctx.restore();

}


/* =========================================================
   RENDER OBJECTS
========================================================= */

function renderObjects(page){

  objectLayer.innerHTML="";

  page.elements.forEach(
    obj=>{

      const el =
        document.createElement("div");

      el.className =
        "boardObject";

      el.style.left =
        obj.x+"px";

      el.style.top =
        obj.y+"px";

      el.style.width =
        (obj.width||200)+"px";

      el.style.height =
        (obj.height||100)+"px";


      if(obj.type==="text"){

        el.classList.add(
          "textObject"
        );

        el.textContent =
          obj.text;

        el.style.color =
          obj.color ||
          "#111";

      }


      if(obj.type==="sticky"){

        el.classList.add(
          "stickyObject"
        );

        el.textContent =
          obj.text;

      }


      if(obj.type==="image"){

        const img =
          document.createElement("img");

        img.className =
          "imageObject";

        img.src =
          obj.src;

        img.style.width =
          "100%";

        img.style.height =
          "100%";

        el.appendChild(img);

      }


      if(
        obj.type==="rect" ||
        obj.type==="circle" ||
        obj.type==="arrow"
      ){

        el.classList.add(
          "shapeObject"
        );

        const c =
          document.createElement("canvas");

        c.width =
          obj.width+20;

        c.height =
          obj.height+20;

        const cctx =
          c.getContext("2d");

        cctx.strokeStyle =
          obj.color;

        cctx.lineWidth =
          obj.size || 4;

        cctx.lineCap =
          "round";

        if(obj.type==="rect"){

          cctx.strokeRect(
            5,
            5,
            obj.width,
            obj.height
          );

        }

        if(obj.type==="circle"){

          cctx.beginPath();

          cctx.ellipse(
            obj.width/2+5,
            obj.height/2+5,
            obj.width/2,
            obj.height/2,
            0,
            0,
            Math.PI*2
          );

          cctx.stroke();

        }

        if(obj.type==="arrow"){

          cctx.beginPath();

          cctx.moveTo(
            5,
            5
          );

          cctx.lineTo(
            obj.x2-obj.x+5,
            obj.y2-obj.y+5
          );

          cctx.stroke();

          const angle =
            Math.atan2(
              obj.y2-obj.y,
              obj.x2-obj.x
            );

          const size=15;

          const ex =
            obj.x2-obj.x+5;

          const ey =
            obj.y2-obj.y+5;

          cctx.beginPath();

          cctx.moveTo(
            ex,
            ey
          );

          cctx.lineTo(
            ex-size*Math.cos(angle-.5),
            ey-size*Math.sin(angle-.5)
          );

          cctx.moveTo(
            ex,
            ey
          );

          cctx.lineTo(
            ex-size*Math.cos(angle+.5),
            ey-size*Math.sin(angle+.5)
          );

          cctx.stroke();

        }

        el.appendChild(c);

      }


      objectLayer.appendChild(el);

      makeObjectDraggable(
        el,
        obj
      );

    }
  );

}


/* =========================================================
   OBJECT DRAG
========================================================= */

function makeObjectDraggable(
  el,
  obj
){

  let startX=0;
  let startY=0;
  let originalX=0;
  let originalY=0;
  let moving=false;

  el.addEventListener(
    "pointerdown",
    e=>{

      if(
        currentTool!=="hand"
      )
        return;

      e.stopPropagation();

      moving=true;

      startX=e.clientX;
      startY=e.clientY;

      originalX=obj.x;
      originalY=obj.y;

      el.setPointerCapture(
        e.pointerId
      );

    }
  );

  el.addEventListener(
    "pointermove",
    e=>{

      if(!moving) return;

      obj.x =
        originalX +
        (e.clientX-startX)/zoom;

      obj.y =
        originalY +
        (e.clientY-startY)/zoom;

      el.style.left =
        obj.x+"px";

      el.style.top =
        obj.y+"px";

    }
  );

  el.addEventListener(
    "pointerup",
    e=>{

      moving=false;

      autoSave();

    }
  );

}


/* =========================================================
   IMAGE
========================================================= */

let imagePlacePoint={
  x:5000,
  y:5000
};

function chooseImage(){

  document
    .getElementById("imageInput")
    .click();

}


function insertImage(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload =
    e=>{

      const page =
        getCurrentPage();

      page.elements.push({

        id:
          "img_"+Date.now()+"_"+Math.random(),

        type:"image",

        x:imagePlacePoint.x,

        y:imagePlacePoint.y,

        width:350,

        height:250,

        src:e.target.result

      });

      renderObjects(page);

      autoSave();

    };

  reader.readAsDataURL(file);

  event.target.value="";

}


/* =========================================================
   ZOOM
========================================================= */

function zoomIn(){

  zoom =
    Math.min(
      4,
      zoom*1.2
    );

  updateTransform();

}


function zoomOut(){

  zoom =
    Math.max(
      .25,
      zoom/1.2
    );

  updateTransform();

}


function resetView(){

  zoom=1;

  panX =
    viewport.clientWidth/2 -
    5000;

  panY =
    viewport.clientHeight/2 -
    5000;

  updateTransform();

}


/* =========================================================
   PAGE
========================================================= */

function updatePageLabel(){

  const note =
    getCurrentNote();

  if(!note) return;

  document
    .getElementById("pageLabel")
    .textContent =
      `${currentPageIndex+1} / ${note.pages.length}`;

}


function previousPage(){

  const note =
    getCurrentNote();

  if(!note) return;

  if(
    currentPageIndex>0
  ){

    saveCurrentNote();

    currentPageIndex--;

    drawBoard();

    updatePageLabel();

  }

}


function nextPage(){

  const note =
    getCurrentNote();

  if(!note) return;

  if(
    currentPageIndex<
    note.pages.length-1
  ){

    saveCurrentNote();

    currentPageIndex++;

    drawBoard();

    updatePageLabel();

  }

}


function addPage(){

  const note =
    getCurrentNote();

  if(!note) return;

  note.pages.push({

    image:null,

    elements:[],

    strokes:[]

  });

  currentPageIndex =
    note.pages.length-1;

  drawBoard();

  updatePageLabel();

  autoSave();

}


/* =========================================================
   SAVE NOTE
========================================================= */

function saveCurrentNote(){

  const note =
    getCurrentNote();

  if(!note) return;

  note.updated =
    Date.now();

  saveData();

}

/* =========================================================
   EXPORT
========================================================= */

function exportData(){

  stopStudyClock();

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;

  a.download=
    "destination-note-backup.json";

  a.click();

  URL.revokeObjectURL(url);

  startStudyClock();

}


function logout(){

  stopStudyClock();

  location.reload();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      document
        .getElementById("noteScreen")
        .classList.contains("hidden")
    )
      return;


    /*
      スペース + ドラッグ
      → 手のひら
    */

    if(e.code==="Space"){

      e.preventDefault();

    }


    /*
      キーショートカット
    */

    if(e.key==="p")
      setTool("pencil");

    if(e.key==="h")
      setTool("highlighter");

    if(e.key==="e")
      setTool("eraser");

    if(e.key==="v")
      setTool("hand");

    if(e.key==="t")
      setTool("text");

  }
);


/* =========================================================
   WHEEL ZOOM
========================================================= */

viewport.addEventListener(
  "wheel",
  e=>{

    if(e.ctrlKey || e.metaKey){

      e.preventDefault();

      const before =
        screenToWorld(
          e.clientX,
          e.clientY
        );

      const factor =
        e.deltaY<0
          ? 1.1
          : .9;

      zoom =
        Math.max(
          .25,
          Math.min(
            4,
            zoom*factor
          )
        );

      const rect =
        viewport.getBoundingClientRect();

      panX =
        e.clientX-rect.left -
        before.x*zoom;

      panY =
        e.clientY-rect.top -
        before.y*zoom;

      updateTransform();

    }else if(currentTool==="hand"){

      e.preventDefault();

      panX -= e.deltaX;

      panY -= e.deltaY;

      updateTransform();

    }

  },
  {
    passive:false
  }
);

</script>
